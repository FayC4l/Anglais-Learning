<script>window.__CONTENT__=[{"id":1,"cefr":"A1","title":"Premiers pas","titleEn":"First Steps","intro":"Tu pars de zéro ? Parfait ! Tu vas apprendre à saluer, te présenter, compter jusqu'à vingt, parler de ton matériel d'école et présenter ta famille.","boss":{"name":"Mister Hello","taunt":"Hello, hello ! Tu crois pouvoir me battre avec trois mots d'anglais ? Montre-moi ce que tu sais… si tu sais quelque chose !","defeat":"Goodbye… Je veux dire : au revoir, champion. Nice to meet you, quand même !"},"units":[{"id":"1.1","title":"Salut !","titleEn":"Hello, Friend!","goal":"Saluer, te présenter et dire les mots de politesse en anglais.","lesson":[{"type":"p","text":"Bienvenue dans ta première mission ! Pour commencer, il te faut des mots magiques : [[hello]] (bonjour, allô), [[hi]] (salut) et [[goodbye]] (au revoir). Avec ça, tu peux déjà entrer et sortir de n'importe quelle conversation."},{"type":"rule","title":"Se présenter","text":"Pour dire ton nom, tu as deux façons : [[My name is Emma.]] (mon nom est Emma) ou [[I am Emma.]] (je suis Emma). En version rapide, [[I am]] devient [[I'm]] : [[I'm Emma.]] Pour demander le nom de quelqu'un : [[What's your name?]] (Comment tu t'appelles ?)."},{"type":"table","head":["Français","English"],"rows":[["je","[[I]]"],["je suis","[[I am]] / [[I'm]]"],["tu es","[[you are]]"],["mon, ma","[[my]]"],["ton, ta","[[your]]"],["Comment vas-tu ?","[[How are you?]]"],["Je vais bien, merci.","[[I'm fine, thank you.]]"]]},{"type":"examples","items":[{"en":"Hi! My name is Noah.","fr":"Salut ! Je m'appelle Noah."},{"en":"What's your name?","fr":"Comment tu t'appelles ?"},{"en":"Nice to meet you!","fr":"Enchanté !"},{"en":"How are you?","fr":"Comment vas-tu ?"},{"en":"I'm fine, thank you. And you?","fr":"Je vais bien, merci. Et toi ?"},{"en":"Thank you! — You're welcome!","fr":"Merci ! — De rien !"}]},{"type":"rule","title":"Les mots de politesse","text":"[[please]] = s'il te plaît, [[thank you]] = merci, [[sorry]] = désolé ou pardon, [[you're welcome]] = de rien. Et pour répondre : [[yes]] (oui) ou [[no]] (non). Un [[no, thank you]] poli, ça marche toujours !"},{"type":"tip","text":"Pièges de francophone : on ne dit **jamais** [[I call me]] pour « je m'appelle » : on dit [[My name is…]]. Et « je vais bien », ce n'est pas [[I go well]], c'est [[I'm fine]] ! Autre secret : le mot [[I]] (je) s'écrit **toujours** avec une majuscule, même au milieu d'une phrase."},{"type":"dialogue","title":"Premier jour d'école","lines":[{"who":"Emma","en":"Hi! What's your name?","fr":"Salut ! Comment tu t'appelles ?"},{"who":"Amir","en":"My name is Amir. And you?","fr":"Je m'appelle Amir. Et toi ?"},{"who":"Emma","en":"I'm Emma. Nice to meet you!","fr":"Moi, c'est Emma. Enchantée !"},{"who":"Amir","en":"Nice to meet you! How are you?","fr":"Enchanté ! Comment vas-tu ?"},{"who":"Emma","en":"I'm fine, thank you. And you?","fr":"Je vais bien, merci. Et toi ?"},{"who":"Amir","en":"I'm fine. Goodbye, Emma!","fr":"Je vais bien. Au revoir, Emma !"}]},{"type":"fun","text":"Le sais-tu ? Au Canada, il y a deux langues officielles : l'anglais et le français. À Ottawa, tu entends les deux partout. Bientôt, tu vas comprendre les deux !"}],"vocab":[{"en":"hello","fr":"bonjour, allô","alt":["hi"],"ex":"Hello, Maya!"},{"en":"hi","fr":"salut","alt":["hello"],"ex":"Hi, I'm Lucas."},{"en":"goodbye","fr":"au revoir","alt":["bye"],"ex":"Goodbye, my friend!"},{"en":"good morning","fr":"bonjour (le matin)","alt":[],"ex":"Good morning, Léa!"},{"en":"good night","fr":"bonne nuit","alt":[],"ex":"Good night, Noah!"},{"en":"please","fr":"s'il te plaît","alt":[],"ex":"Yes, please!"},{"en":"thank you","fr":"merci","alt":["thanks"],"ex":"Thank you, Ethan!"},{"en":"you're welcome","fr":"de rien","alt":["no problem"],"ex":"Thank you! You're welcome!"},{"en":"sorry","fr":"désolé, pardon","alt":[],"ex":"Sorry, what's your name?"},{"en":"yes","fr":"oui","alt":[],"ex":"Yes, I'm Zoé."},{"en":"no","fr":"non","alt":[],"ex":"No, thank you."},{"en":"friend","fr":"ami, amie","alt":[],"ex":"Maya is my friend."},{"en":"my name is","fr":"je m'appelle","alt":[],"ex":"My name is Félix."},{"en":"nice to meet you","fr":"enchanté","alt":[],"ex":"Hi, Mei! Nice to meet you!"},{"en":"how are you","fr":"comment vas-tu ?","alt":[],"ex":"Hi, Sofia! How are you?"},{"en":"I'm fine","fr":"je vais bien","alt":["I'm good","I'm okay"],"ex":"I'm fine, thank you."}],"sentences":[{"en":"Hello! My name is Emma.","fr":"Bonjour ! Je m'appelle Emma.","trap":["am"],"alt":[]},{"en":"What's your name?","fr":"Comment tu t'appelles ?","trap":["you"],"alt":[]},{"en":"I'm Noah. Nice to meet you!","fr":"Moi, c'est Noah. Enchanté !","trap":["am"],"alt":[]},{"en":"How are you?","fr":"Comment vas-tu ?","trap":["is"],"alt":[]},{"en":"I'm fine, thank you.","fr":"Je vais bien, merci.","trap":["go"],"alt":[]},{"en":"Goodbye, my friend!","fr":"Au revoir, mon ami !","trap":["I"],"alt":[]},{"en":"No, thank you.","fr":"Non, merci.","trap":["please"],"alt":[]},{"en":"Good morning, Léa!","fr":"Bonjour, Léa ! (le matin)","trap":["my"],"alt":[]},{"en":"Maya is my friend.","fr":"Maya est mon amie.","trap":["am"],"alt":[]},{"en":"Sorry, what's your name?","fr":"Pardon, comment tu t'appelles ?","trap":["you"],"alt":[]},{"en":"Hi, I'm Zoé. And you?","fr":"Salut, moi c'est Zoé. Et toi ?","trap":["my"],"alt":[]},{"en":"Yes, please! Thank you!","fr":"Oui, s'il te plaît ! Merci !","trap":["no"],"alt":[]}],"grammar":[{"type":"mcq","q":"Comment dit-on « Je m'appelle Noah » ?","choices":["I call me Noah.","My name is Noah.","Me name Noah."],"answer":1,"explain":"En anglais, on dit « mon nom est… » : My name is Noah. « I call me » n'existe pas."},{"type":"mcq","q":"How ___ you?","choices":["is","am","are"],"answer":2,"explain":"Avec you, on utilise are : How are you?"},{"type":"mcq","q":"Comment dit-on « Je vais bien » ?","choices":["I'm fine.","I go well.","I'm go fine."],"answer":0,"explain":"« Je vais bien » se dit I'm fine. On ne traduit pas « vais » mot à mot !"},{"type":"mcq","q":"Tu rencontres quelqu'un pour la première fois. Tu dis :","choices":["Good night!","You're welcome!","Nice to meet you!"],"answer":2,"explain":"Nice to meet you = enchanté. On le dit quand on rencontre quelqu'un."},{"type":"mcq","q":"___ am Ethan.","choices":["My","I","Your"],"answer":1,"explain":"Je suis = I am. My veut dire « mon, ma »."},{"type":"mcq","q":"Ton ami te dit « Thank you! ». Tu réponds :","choices":["You're welcome!","Please!","Sorry!"],"answer":0,"explain":"Après un merci, on répond You're welcome (de rien)."},{"type":"mcq","q":"En anglais, le mot « I » (je) s'écrit toujours…","choices":["en minuscule","avec un point","en majuscule"],"answer":2,"explain":"I s'écrit toujours avec une majuscule, même au milieu d'une phrase."},{"type":"fill","q":"My ___ is Priya.","hint":"nom","answer":["name"],"explain":"My name is… = je m'appelle (mon nom est…)."},{"type":"fill","q":"I ___ Liam.","hint":"suis","answer":["am"],"explain":"Je suis = I am. On peut aussi dire I'm Liam."},{"type":"fill","q":"What's ___ name?","hint":"ton","answer":["your"],"explain":"Ton, ta = your. What's your name? = Comment tu t'appelles ?"},{"type":"fill","q":"Nice to ___ you!","hint":"rencontrer","answer":["meet"],"explain":"Nice to meet you = enchanté (content de te rencontrer)."},{"type":"fill","q":"I'm fine, ___ you.","hint":"merci","answer":["thank"],"explain":"Merci = thank you, en deux mots."},{"type":"fill","q":"___ name is Malik.","hint":"mon","answer":["My"],"explain":"Mon, ma = my. My name is Malik."},{"type":"error","q":"How is you?","wrong":1,"fix":["are"],"explain":"Avec you, c'est toujours are : How are you?"},{"type":"error","q":"Hello! My name are Ethan.","wrong":3,"fix":["is"],"explain":"My name is… : un seul nom, donc is."},{"type":"error","q":"What is you name?","wrong":2,"fix":["your"],"explain":"You = tu ; your = ton, ta. Ici il faut your : What is your name?"},{"type":"error","q":"Hi! I is Maya.","wrong":2,"fix":["am"],"explain":"Avec I, c'est toujours am : I am Maya."},{"type":"error","q":"I'm fine, thank your.","wrong":3,"fix":["you"],"explain":"Merci = thank you, avec you, pas your."}],"pron":{"focus":"Le « h » qu'on entend","ipa":"/h/","explain":"En français, le « h » ne se prononce jamais (« un hôtel »), mais en anglais, il s'entend presque toujours ! C'est un petit souffle chaud, comme quand tu réchauffes tes mains en plein hiver à Ottawa : « hhha ». Mets ta main devant ta bouche : sur [[hello]] et sur [[hockey]], tu dois sentir de l'air chaud. Attention, le piège marche dans les deux sens : sans souffle, [[hand]] (main) devient [[and]] (et), mais avec un souffle en trop, [[eat]] (manger) devient [[heat]] (chaleur) !","words":[{"en":"hello","fr":"bonjour, salut","hint":"« hè-LÔ » : souffle le « h », accent sur la fin"},{"en":"hi","fr":"salut","hint":"« haï » : un petit souffle, puis « aï »"},{"en":"how","fr":"comment","hint":"« haou » : souffle d'abord, comme dans [[How are you?]]"},{"en":"happy","fr":"content, heureux","hint":"« HA-pi » : souffle sur « HA », accent au début"},{"en":"hockey","fr":"hockey","hint":"« HO-ki » : en français on dit « ockey », en anglais on souffle !"},{"en":"he","fr":"il","hint":"« hii » : souffle, puis un « i » bien long"},{"en":"house","fr":"maison","hint":"« haouss » : souffle, puis « aou » et un « s » bien sifflé"},{"en":"hand","fr":"main","hint":"« hannd » : sans le souffle, ça devient [[and]] (et) !"}],"pairs":[["hand","and"],["heat","eat"],["hat","at"],["hold","old"],["hear","ear"],["hi","I"]],"practice":["Hi, Emma! Hello, Amir! How are you?","Henry has a hat, and Ana has an apple."]},"mission":{"type":"ecrit","prompt":"Ta classe échange des messages avec une classe de Toronto. Écris ton premier message à ta correspondante, Maya : salue-la, présente-toi, dis que tu es content(e) de la connaître et demande-lui comment elle va.","model":"Hi, Maya! My name is Félix. Nice to meet you! How are you?","checklist":["J'ai commencé par [[Hi]] ou [[Hello]], suivi du prénom","Je me suis présenté(e) avec [[My name is]] ou [[I'm]] + mon prénom","J'ai écrit [[Nice to meet you!]]","J'ai posé la question [[How are you?]] avec un point d'interrogation","J'ai relu mon message à voix haute en soufflant le « h » de [[Hi]] et de [[How]]"]}},{"id":"1.2","title":"Les nombres","titleEn":"Count to Twenty","goal":"Compter de zéro à vingt et dire ton âge sans tomber dans le piège.","lesson":[{"type":"p","text":"Les nombres, tu en as besoin partout : pour ton âge, ton numéro de casier, le score au hockey… On compte de **zéro à vingt**. Écoute bien chaque nombre !"},{"type":"table","head":["Nombre","English","Nombre","English"],"rows":[["0","[[zero]]","11","[[eleven]]"],["1","[[one]]","12","[[twelve]]"],["2","[[two]]","13","[[thirteen]]"],["3","[[three]]","14","[[fourteen]]"],["4","[[four]]","15","[[fifteen]]"],["5","[[five]]","16","[[sixteen]]"],["6","[[six]]","17","[[seventeen]]"],["7","[[seven]]","18","[[eighteen]]"],["8","[[eight]]","19","[[nineteen]]"],["9","[[nine]]","20","[[twenty]]"],["10","[[ten]]","",""]]},{"type":"rule","title":"Dire son âge","text":"Pour demander l'âge : [[How old are you?]] (Quel âge as-tu ?). Pour répondre, on utilise **être** (to be), pas avoir : [[I am ten.]] ou [[I'm ten years old.]] Attention : si tu dis [[years]], tu dois ajouter [[old]] à la fin. Pour une autre personne : [[Emma is eleven.]]"},{"type":"rule","title":"Combien ?","text":"[[How many?]] = combien ? [[How many friends?]] = Combien d'amis ? Et pour ce que tu possèdes, là, on utilise bien **have** : [[I have two friends.]] (J'ai deux amis.)"},{"type":"examples","items":[{"en":"How old are you?","fr":"Quel âge as-tu ?"},{"en":"I'm twelve years old.","fr":"J'ai douze ans."},{"en":"Noah is eight.","fr":"Noah a huit ans."},{"en":"Are you thirteen?","fr":"As-tu treize ans ?"},{"en":"How many friends? Three!","fr":"Combien d'amis ? Trois !"}]},{"type":"tip","text":"LE piège numéro un des francophones : on ne dit **jamais** [[I have ten years]]. En anglais, on **est** son âge : [[I am ten]] ou [[I am ten years old]]. Retiens : avoir un âge = **to be**, avoir des amis = **to have**."},{"type":"dialogue","title":"Au parc","lines":[{"who":"Chloé","en":"Hi! I'm Chloé. How old are you?","fr":"Salut ! Moi, c'est Chloé. Quel âge as-tu ?"},{"who":"Samuel","en":"I'm eleven. And you?","fr":"J'ai onze ans. Et toi ?"},{"who":"Chloé","en":"I'm twelve years old.","fr":"J'ai douze ans."},{"who":"Samuel","en":"Is Félix twelve?","fr":"Félix a douze ans ?"},{"who":"Chloé","en":"No, Félix is thirteen.","fr":"Non, Félix a treize ans."},{"who":"Samuel","en":"Wow! How many friends are here?","fr":"Wow ! Combien d'amis sont ici ?"},{"who":"Chloé","en":"Five! One, two, three, four, five!","fr":"Cinq ! Un, deux, trois, quatre, cinq !"}]},{"type":"fun","text":"Le sais-tu ? En anglais, les nombres de 13 à 19 finissent tous par [[-teen]]. C'est pour ça qu'on appelle les ados des [[teenagers]] : ce sont les « -teen » !"}],"vocab":[{"en":"one","fr":"un (1)","alt":[],"ex":"I have one friend."},{"en":"two","fr":"deux (2)","alt":[],"ex":"I have two friends."},{"en":"three","fr":"trois (3)","alt":[],"ex":"Three, two, one!"},{"en":"four","fr":"quatre (4)","alt":[],"ex":"Liam is four."},{"en":"five","fr":"cinq (5)","alt":[],"ex":"I have five friends."},{"en":"six","fr":"six (6)","alt":[],"ex":"Mei is six years old."},{"en":"seven","fr":"sept (7)","alt":[],"ex":"Seven, eight, nine, ten!"},{"en":"eight","fr":"huit (8)","alt":[],"ex":"Noah is eight."},{"en":"nine","fr":"neuf (9)","alt":[],"ex":"Are you nine?"},{"en":"ten","fr":"dix (10)","alt":[],"ex":"I'm ten years old."},{"en":"eleven","fr":"onze (11)","alt":[],"ex":"Emma is eleven."},{"en":"twelve","fr":"douze (12)","alt":[],"ex":"I'm twelve."},{"en":"fifteen","fr":"quinze (15)","alt":[],"ex":"Sofia is fifteen."},{"en":"twenty","fr":"vingt (20)","alt":[],"ex":"Count to twenty!"},{"en":"how old","fr":"quel âge","alt":[],"ex":"How old are you?"},{"en":"how many","fr":"combien (de)","alt":[],"ex":"How many friends?"}],"sentences":[{" ,"explain":"Pour l'âge, on utilise to be : Emma is ten."},{"type":"fill","q":"I ___ twelve years old.","hint":"être","answer":["am"],"explain":"J'ai douze ans = I am twelve years old. Jamais have pour l'âge !"},{"type":"fill","q":"How ___ are you?","hint":"quel âge","answer":["old"],"explain":"How old are you? = Quel âge as-tu ?"},{"type":"fill","q":"She is fourteen years ___.","hint":"âgée","answer":["old"],"explain":"Si tu dis years, ajoute old à la fin : fourteen years old."},{"type":"fill","q":"How ___ friends?","hint":"combien","answer":["many"],"explain":"Combien d'amis ? = How many friends?"},{"type":"fill","q":"Liam is ___ years old.","hint":"treize","answer":["thirteen"],"explain":"13 = thirteen. Les nombres de 13 à 19 finissent par -teen."},{"type":"fill","q":"Noah ___ eight.","hint":"to be","answer":["is"],"explain":"Noah a huit ans = Noah is eight."},{"type":"error","q":"I have ten years old.","wrong":1,"fix":["am"],"explain":"Pour l'âge, on utilise be : I am ten years old."},{"type":"error","q":"How old is you?","wrong":2,"fix":["are"],"explain":"Avec you, c'est are : How old are you?"},{"type":"error","q":"Maya has nine years old.","wrong":1,"fix":["is"],"explain":"Pour l'âge : Maya is nine years old, jamais has."},{"type":"error","q":"I am twelve year old.","wrong":3,"fix":["years"],"explain":"Plus d'un an, donc years avec un s : twelve years old."},{"type":"error","q":"Félix are ten.","wrong":1,"fix":["is"],"explain":"Pour une seule personne (il, elle), on dit is : Félix is ten."}],"pron":{"focus":"Le « th » de three","ipa":"/θ/","explain":"Le « th » de [[three]] n'existe pas en français, alors on le remplace souvent par un « t » ou un « s »… et ton ami entend [[tree]] (un arbre) au lieu de [[three]] (trois) ! Pour le réussir, glisse le bout de ta langue entre tes dents du haut et du bas (juste un peu, pas besoin de tirer la langue !), puis souffle doucement. Ta gorge ne vibre pas : c'est le bruit d'un serpent qui zozote. Entraîne-toi devant un miroir : si tu vois le bout de ta langue, c'est gagné !","words":[{"en":"three","fr":"trois","hint":"« thrii » : langue entre les dents, souffle, puis « rii » (pas « trii » !)"},{"en":"thirteen","fr":"treize","hint":"« theur-TIIN » : « th » soufflé au début, accent sur la fin"},{"en":"thank you","fr":"merci","hint":"« THANNK-you » : langue entre les dents pour le « th », pas « tannk-you »"},{"en":"think","fr":"penser, croire","hint":"« thinnk » : souffle sur le « th », puis un « i » court"},{"en":"birthday","fr":"anniversaire","hint":"« BEURTH-déï » : n'oublie pas le « th » caché au milieu !"},{"en":"math","fr":"mathématiques","hint":"« math » : comme « les maths », mais finis en soufflant, langue entre les dents"},{"en":"mouth","fr":"bouche","hint":"« maouth » : finis avec la langue entre les dents (pas « maouss » !)"},{"en":"both","fr":"les deux","hint":"« bôth » : finis en soufflant (pas « bôte » !)"}],"pairs":[["three","tree"],["thank","tank"],["think","sink"],["thin","tin"],["math","mat"],["path","pass"]],"practice":["I think three is my lucky number.","Happy birthday! Are you thirteen today?"]},"mission":{"type":"oral","prompt":"Au parc, ta nouvelle voisine Mei, qui parle seulement anglais, te demande : [[How old are you?]] Salue-la, réponds avec une phrase complète, puis pose-lui la même question.","model":"Hi, Mei! I'm thirteen years old. How old are you?","checklist":["J'ai dit [[I'm]] + mon âge, jamais [[I have]] + mon âge","J'ai dit [[I'm ten]] ou [[I'm ten years old]], mais jamais « I'm ten years » tout court","J'ai posé la question [[How old are you?]]","Si mon âge contient un « th » ([[three]], [[thirteen]]), j'ai bien mis ma langue entre mes dents"]}},{"id":"1.3","title":"Couleurs et école","titleEn":"Red Pen, Blue Bag","goal":"Nommer les couleurs et ton matériel scolaire, avec a, an et l'adjectif bien placé.","lesson":[{"type":"p","text":"Ouvre ton sac d'école ! Aujourd'hui tu apprends ton matériel : [[pen]] (stylo), [[pencil]] (crayon), [[book]] (livre), [[eraser]] (gomme à effacer)… et les couleurs : [[red]], [[blue]], [[green]], [[yellow]]…"},{"type":"rule","title":"a ou an ?","text":"« Un, une » se dit [[a]] devant un son de consonne : [[a pen]], [[a book]]. Devant un son de voyelle (a, e, i, o, u), on dit [[an]] : [[an eraser]], [[an orange pen]]. Ça sert à mieux prononcer. Et « le, la, les » se dit simplement [[the]] : [[the chair]]."},{"type":"rule","title":"La couleur AVANT le mot","text":"En français, on dit « un stylo rouge ». En anglais, c'est à l'envers : la couleur passe **avant** : [[a red pen]]. Et la couleur ne prend **jamais** de s : [[two red pens]], jamais « reds »."},{"type":"table","head":["Français","English"],"rows":[["C'est un stylo rouge.","[[It's a red pen.]]"],["C'est une gomme à effacer orange.","[[It's an orange eraser.]]"],["J'ai deux livres verts.","[[I have two green books.]]"],["Mes stylos sont rouges.","[[My pens are red.]]"],["De quelle couleur est ton sac ?","[[What colour is your bag?]]"]]},{"type":"examples","items":[{"en":"It's a blue bag.","fr":"C'est un sac bleu."},{"en":"It's an orange eraser.","fr":"C'est une gomme à effacer orange."},{"en":"I have three yellow pencils.","fr":"J'ai trois crayons jaunes."},{"en":"The desk is white.","fr":"Le pupitre est blanc."},{"en":"Is it a green book?","fr":"Est-ce que c'est un livre vert ?"}]},{"type":"tip","text":"Double piège ! 1) La couleur avant : [[a pink ruler]], pas « a ruler pink ». 2) Pas de s sur la couleur : [[two black chairs]], pas « blacks ». Mais le **nom** prend bien un s au pluriel : [[one pen]], [[two pens]]."},{"type":"dialogue","title":"Où est mon crayon ?","lines":[{"who":"Jaden","en":"Sorry, Olivia! Is it your pencil?","fr":"Pardon, Olivia ! C'est ton crayon ?"},{"who":"Olivia","en":"No. My pencil is yellow.","fr":"Non. Mon crayon est jaune."},{"who":"Jaden","en":"Is it a yellow pen?","fr":"C'est un stylo jaune ?"},{"who":"Olivia","en":"No, it's a yellow pencil!","fr":"Non, c'est un crayon jaune !"},{"who":"Jaden", sister is eight.","fr":"Mon frère a dix ans et ma sœur en a huit.","trap":["has"],"alt":[]},{"en":"Mom, this is Priya.","fr":"Maman, voici Priya.","trap":["she"],"alt":[]}],"grammar":[{"type":"mcq","q":"Comment dit-on « Voici mon papa » ?","choices":["Here my dad.","This my dad is.","This is my dad."],"answer":2,"explain":"Voici… = This is… : This is my dad."},{"type":"mcq","q":"Léa is my sister. ___ is nine.","choices":["He","She","I"],"answer":1,"explain":"Léa est une fille, donc she."},{"type":"mcq","q":"Noah is my cousin. ___ is twelve.","choices":["He","She","You"],"answer":0,"explain":"Noah est un garçon, donc he."},{"type":"mcq","q":"Comment dit-on « ton frère » ?","choices":["my brother","you brother","your brother"],"answer":2,"explain":"Ton = your. You veut dire « tu »."},{"type":"mcq","q":"Comment dit-on « J'ai deux sœurs » ?","choices":["I have two sisters.","I am two sisters.","I have two sister."],"answer":0,"explain":"Pour ce qu'on a : I have. Et deux sœurs prend un s : sisters."},{"type":"mcq","q":"Le papa de ton papa, c'est ton…","choices":["uncle","grandpa","cousin"],"answer":1,"explain":"Le père de ton père, c'est ton grand-papa : grandpa."},{"type":"mcq","q":"La sœur de ta maman, c'est ta…","choices":["aunt","uncle","daughter"],"answer":0,"explain":"La sœur de ta mère, c'est ta tante : aunt."},{"type":"fill","q":"This is ___ mom.","hint":"ma","answer":["my"],"explain":"Ma, mon, mes = my."},{"type":"fill","q":"Is this ___ bag?","hint":"ton","answer":["your"],"explain":"Ton, ta, tes = your."},{"type":"fill","q":"I ___ two cousins.","hint":"avoir","answer":["have"],"explain":"J'ai (pour ce qu'on a) = I have."},{"type":"fill","q":"Ana is my aunt. ___ is twenty.","hint":"elle","answer":["She"],"explain":"Ana est une femme : she."},{"type":"fill","q":"This is my ___. He is ten.","hint":"frère","answer":["brother"],"explain":"Frère = brother, et he confirme que c'est un garçon."},{"type":"fill","q":"Lucas is my son and Mei is my ___.","hint":"fille (mon enfant)","answer":["daughter"],"explain":"Fils = son, fille (enfant) = daughter."},{"type":"error","q":"This is my sister. He is eleven.","wrong":4,"fix":["She"],"explain":"Une sœur est une fille : she, pas he."},{"type":"error","q":"I am two brothers.","wrong":1,"fix":["have"],"explain":"J'ai deux frères = I have two brothers. On n'est pas ses frères !"},{"type":"error","q":"Is this you dad?","wrong":2,"fix":["your"],"explain":"Ton papa = your dad. You veut dire « tu »."},{"type":"error","q":"Mom and Dad are my parent.","wrong":5,"fix":["parents"],"explain":"Deux personnes, donc un s : my parents."},{"type":"error","q":"I have three cousin.","wrong":3,"fix":["cousins"],"explain":"Plusieurs cousins, donc un s : three cousins."}],"pron":{"focus":"Le « th » de mother","ipa":"/ð/","explain":"Le « th » de [[mother]] et de [[this]] est le cousin du « th » de [[three]] : même position, le bout de la langue entre les dents, mais cette fois ta voix vibre. Pose ta main sur ta gorge : sur [[three]], rien ne bouge ; sur [[this]], ça vibre comme un téléphone ! Le piège le plus courant ici, c'est de dire « dis » et « moder » avec un « d » (ou « zis » avec un « z ») : on entend alors [[day]] (jour) au lieu de [[they]] (ils). Bonne nouvelle : tu vas dire [[the]], [[this]] et [[that]] des milliers de fois, alors tu vas devenir un pro très vite !","words":[{"en":"mother","fr":"mère","hint":"« MEU-theur » : « th » qui vibre, langue entre les dents"},{"en":"father","fr":"père","hint":"« FÂ-theur » : « â » bien ouvert, puis « th » qui vibre"},{"en":"brother","fr":"frère","hint":"« BREU-theur » : pas « bro-deur » !"},{"en":"this","fr":"ce, cette, ceci","hint":"« thiss » : « i » court, et ta gorge vibre"},{"en":"that","fr":"ce… là, cela","hint":"« thatt » : bouche bien ouverte sur le « a »"},{"en":"the","fr":"le, la, les","hint":"« theu » : tout petit et rapide (« thi » devant une voyelle : [[the apple]])"},{"en":"they","fr":"ils, elles","hint":"« théï » : « th » qui vibre, puis « é » qui glisse vers « i »"},{"en":"there","fr":"là, là-bas","hint":"« thèr » : « th » qui vibre, et un « r » anglais à la fin"}],"pairs":[["they","day"],["then","den"],["there","dare"],["though","dough"],["breathe","breeze"]],"practice":["This is my mother, and that is my father.","The other brother is over there."]},"mission":{"type":"oral","prompt":"Tu montres une photo de ta famille à ta nouvelle amie Olivia, qui parle seulement anglais. Présente-lui trois personnes de la photo et dis l'âge de l'une d'entre elles.","model":"This is my mom, and this is my dad. This is my sister, Léa. She's eight.","checklist":["J'ai présenté chaque personne avec [[This is my]]","J'ai dit [[this]] avec la langue entre les dents et la gorge qui vibre (pas « dis »)","J'ai utilisé [[he]] pour un garçon ou un homme, et [[she]] pour une fille ou une femme","J'ai dit l'âge avec [[He's]] ou [[She's]] + le nombre (jamais [[has]])"]}}]},{"id":2,"cefr":"A1","title":"Mon monde","titleEn":"My World","intro":"Dis comment tu te sens, parle des animaux et de ton corps, décris les gens, et donne la date et l'heure comme un pro.","boss":{"name":"Le Roi To-Be","taunt":"I am the King ! You are… petit ! Je règne sur am, is et are, et personne ne m'a jamais détrôné. Essaie donc !","defeat":"I am… not the King anymore ? Bravo, tu connais to be mieux que moi !"},"units":[{"id":"2.1","title":"Le verbe to be","titleEn":"I Am Hungry!","goal":"Dire comment tu te sens avec to be, à la forme positive, négative et en question.","lesson":[{"type":"p","text":"Le verbe [[to be]] (être), c'est le roi de l'anglais. Tu le connais déjà un peu : [[I am]], [[you are]], [[she is]]. Aujourd'hui, tu le maîtrises en entier, avec [[we]] (nous) et [[they]] (ils, elles)."},{"type":"table","head":["Sujet","Positif","Négatif","Question"],"rows":[["I","[[I am]] / [[I'm]]","[[I'm not]]","[[Am I…?]]"],["you","[[you are]] / [[you're]]","[[you aren't]]","[[Are you…?]]"],["he / she / it","[[he is]] / [[he's]]","[[he isn't]]","[[Is he…?]]"],["we","[[we are]] / [[we're]]","[[we aren't]]","[[Are we…?]]"],["they","[[they are]] / [[they're]]","[[they aren't]]","[[Are they…?]]"]]},{"type":"rule","title":"Négation et question","text":"Pour dire non, ajoute [[not]] après to be : [[She is not sad]] → [[She isn't sad]]. Attention : avec I, c'est toujours [[I'm not]]. Pour poser une question, inverse : [[You are tired]] → [[Are you tired?]] Réponse courte : [[Yes, I am.]] / [[No, I'm not.]] / [[Yes, she is.]] / [[No, he isn't.]]"},{"type":"rule","title":"Avoir faim = BE hungry","text":"En anglais, on **est** affamé, on **est** assoiffé : [[I'm hungry]] (j'ai faim), [[I'm thirsty]] (j'ai soif), [[I'm cold]] (j'ai froid), [[I'm hot]] (j'ai chaud), [[I'm scared]] (j'ai peur)."},{"type":"examples","items":[{"en":"Mom, I'm hungry!","fr":"Maman, j'ai faim !"},{"en":"We are cold and tired.","fr":"Nous avons froid et nous sommes fatigués."},{"en":"Are you thirsty? — Yes, I am.","fr":"As-tu soif ? — Oui."},{"en":"Is he sick? — No, he isn't.","fr":"Est-il malade ? — Non."},{"en":"They aren't late.","fr":"Ils ne sont pas en retard."}]},{"type":"tip","text":"Trois pièges de francophone ! 1) [[I have hungry]], [[I have cold]] : NON ! C'est [[I'm hungry]], [[I'm cold]]. 2) Pas de contraction à la fin d'une réponse courte : [[Yes, I am.]], jamais « Yes, I'm. » 3) [[I amn't]] n'existe pas : on dit [[I'm not]]."},{"type":"dialogue","title":"Après la pratique de soccer","lines":[{"who":"Mom","en":"Hi, Ethan! Are you tired?","fr":"Salut, Ethan ! Es-tu fatigué ?"},{"who":"Ethan","en":"Yes, I am. And I'm hungry!","fr":"Oui. Et j'ai faim !"},{"who":"Mom","en":"Is Malik hungry too?","fr":"Est-ce que Malik a faim aussi ?"},{"who":"Ethan","en":"No, he isn't. He's thirsty.","fr":"Non. Il a soif."},{"who":"Mom","en":"Are you cold?","fr":"Avez-vous froid ?"},{"who":"Ethan","en":"No, we aren't cold. We're hot!","fr":"Non, on n'a pas froid. On a chaud !"}]},{"type":"fun","text":"Le sais-tu ? [[to be]] est le verbe le plus utilisé de la langue anglaise. Tu viens d'apprendre le champion !"}],"vocab":[{"en":"happy","fr":"content, heureux","alt":["glad"],"ex":"We are happy!"},{"en":"sad","fr":"triste","alt":[],"ex":"She isn't sad."},{"en":"tired","fr":"fatigué","alt":[],"ex":"Are you tired?"},{"en":"hungry","fr":"affamé (avoir faim)","alt":[],"ex":"I'm so hungry!"},{"en":"thirsty","fr":"assoiffé (avoir soif)","alt":[],"ex":"Are you thirsty?"},{"en":"cold","fr":"froid (avoir froid)","alt":[],"ex":"I'm cold."},{"en":"hot","fr":"chaud (avoir chaud)","alt":[],"ex":"We're hot!"},{"en":"angry","fr":"fâché, en colère","alt":["mad"],"ex":"Is your brother angry?"},{"en":"scared","fr":"effrayé (avoir peur)","alt":["afraid"],"ex":"I'm not scared!"},{"en":"bored","fr":"qui s'ennuie (s'ennuyer)","alt":[],"ex":"My sister is bored."},{"en":"sick","fr":"malade","alt":["ill"],"ex":"Is he sick?"},{"en":"ready","fr":"prêt","alt":[],"ex":"We are ready!"},{"en":"late","fr":"en retard","alt":[],"ex":"They aren't late."},{"en":"early","fr":"en avance, tôt","alt":[],"ex":"You're early, Liam!"},{"en":"we","fr":"nous","alt":[],"ex":"We are cold."},{"en":"they","fr":"ils, elles","alt":[],"ex":"They are tired."}],"sentences":[{"en":"Mom, I'm hungry!","fr":"Maman, j'ai faim !","trap":["have"],"alt":[]},{"en":"We are cold and tired.","fr":"Nous avons froid et nous sommes fatigués.","trap":["have"],"alt":[]},{"en":"She isn't sad.","fr":"Elle n'est pas triste.","trap":["aren't"],"alt":[]},{"en":"Are you thirsty?","fr":"As-tu soif ?","trap":["Have"],"alt":[]},{"en":"No, he isn't sick.","fr":"Non, il n'est pas malade.","trap":["aren't"],"alt":[]},{"en":"They aren't late.","fr":"Ils ne sont pas en retard.","trap":["isn't"],"alt":[]},{"en":"I'm not scared!","fr":"Je n'ai pas peur !","trap":["have"],"alt":[]},{"en":"Is your brother angry?","fr":"Ton frère est-il fâché ?","trap":["Are"],"alt":[]},{"en":"We are ready!","fr":"Nous sommes prêts !","trap":["is"],"alt":[]},{"en":"My sister is bored.","fr":"Ma sœur s'ennuie.","trap":["has"],"alt":[]},{"en":"You're early, Liam!","fr":"Tu es en avance, Liam !","trap":["is"],"alt":[]},{"en":"Are they happy?","fr":"Sont-ils contents ?","trap":["Is"],"alt":[]}],"grammar":[{"type":"mcq","q":"Comment dit-on « J'ai faim » ?","choices":["I have hungry.","I'm hungry.","I have hunger."],"answer":1,"explain":"Avoir faim = be hungry : I'm hungry."},{"type":"mcq","q":"They ___ tired.","choices":["is","am","are"],"answer":2,"explain":"Avec they, c'est are."},{"type":"mcq","q":"Are you ready? — Yes, ___","choices":["I'm.","I am.","I are."],"answer":1,"explain":"Pas de contraction à la fin d'une réponse courte : Yes, I am."},{"type":"mcq","q":"___ she sick?","choices":["Is","Are","Am"],"answer":0,"explain":"Avec she, c'est is. En question, is passe devant : Is she sick?"},{"type":"mcq","q":"Comment dit-on « Nous n'avons pas froid » ?","choices":["We haven't cold.","We isn't cold.","We aren't cold."],"answer":2,"explain":"Avoir froid = be cold. Avec we : we aren't."},{"type":"mcq","q":"Is he hot? — No, he ___","choices":["aren't.","isn't.","not."],"answer":1,"explain":"Avec he : is not = isn't. No, he isn't."},{"type":"mcq","q":"Comment dit-on « As-tu peur ? » ?","choices":["Have you scared?","Is you scared?","Are you scared?"],"answer":2,"explain":"Avoir peur = be scared. Question avec you : Are you scared?"},{"type":"fill","q":"We ___ late!","hint":"to be","answer":["are"],"explain":"Avec we, c'est are : We are late!"},{"type":"fill","q":"I ___ thirsty.","hint":"to be","answer":["am"],"explain":"J'ai soif = I am thirsty."},{"type":"fill","q":"She ___ angry.","hint":"to be, négatif","answer":["isn't"],"explain":"Avec she : is not = isn't."},{"type":"fill","q":"They ___ ready.","hint":"to be, négatif","answer":["aren't"],"explain":"Avec they : are not = aren't."},{"type":"fill","q":"I'm ___ hungry.","hint":"pas","answer":["not"],"explain":"Avec I : I'm not. « I amn't » n'existe pas."},{"type":"fill","q":"___ you cold?","hint":"to be","answer":["Are"],"explain":"Question avec you : Are you cold? (As-tu froid ?)"},{"type":"error","q":"Mom, I have cold!","wrong":2,"fix":["am"],"explain":"J'ai froid = I am cold. On est froid en anglais !"},{"type":"error","q":"We is ready.","wrong":1,"fix":["are"],"explain":"Avec we, c'est are."},{"type":"error","q":"Emma and Zoé is late.","wrong":3,"fix":["are"],"explain":"Emma et Zoé, c'est deux personnes (they) : are."},{"type":"error","q":"He aren't scared.","wrong":1,"fix":["isn't"],"explain":"Avec he, la négation est isn't."},{"type":"error","q":"Is they bored?","wrong":0,"fix":["Are"],"explain":"Avec they, c'est are : Are they bored?"}],"pron":{"focus":"Le « r » anglais","ipa":"/r/","explain":"Le « r » anglais n'est **ni roulé** (comme en espagnol) **ni raclé dans la gorge** (comme en français) : c'est un son tout doux qui se fait dans la bouche. Recule un peu le bout de ta langue et lève-le vers le haut, **sans toucher le palais**, puis arrondis un peu les lèvres, comme un petit chien qui grogne gentiment : « rrr ». Ta gorge reste tranquille : si tu entends un « r » de gorge dans [[red]], c'est l'accent français qui revient ! Et si le bout de ta langue touche le palais, [[right]] (droite) devient [[light]] (lumière). Au Canada, on entend aussi le « r » à la fin des mots : [[are]], [[tired]], [[bored]].","words":[{"en":"red","fr":"rouge","hint":"« rèd » : langue reculée qui ne touche rien, lèvres un peu arrondies, rien dans la gorge"},{"en":"are","fr":"es, sommes, êtes, sont (to be)","hint":"« âr » : un « â » bien ouvert, puis le « r » anglais qu'on entend à la fin"},{"en":"ready","fr":"prêt, prête","hint":"« RÈ-di » : accent au début, « r » doux, pas dans la gorge"},{"en":"sorry","fr":"désolé, désolée","hint":"« SÔ-ri » : au Canada, le « o » ressemble à celui de « sort » ; accent au début"},{"en":"very","fr":"très","hint":"« VÈ-ri » : le « r » est tout doux, la langue ne touche rien"},{"en":"hungry","fr":"affamé (avoir faim)","hint":"« HEUN-gri » : souffle le « h », puis « gri » avec un « r » anglais"},{"en":"angry","fr":"fâché, en colère","hint":"« ANG-gri » : accent au début, et un « r » doux après le « g »"},{"en":"tired","fr":"fatigué, fatiguée","hint":"« TAÏ-eurd » : on entend bien le « r » avant le « d » final"},{"en":"bored","fr":"qui s'ennuie (je m'ennuie = I'm bored)","hint":"« bôrd » : un seul son, et le « r » s'entend avant le « d »"},{"en":"scared","fr":"effrayé (avoir peur)","hint":"« skèrd » : « è » puis le « r » anglais, en une seule syllabe"}],"pairs":[["right","light"],["read","lead"],["rock","lock"],["fry","fly"],["grass","glass"],["berry","belly"]],"practice":["Are you ready? Sorry, I'm very tired.","Ryan is really angry, and Rita is very hungry."]},"mission":{"type":"oral","prompt":"C'est le début de ta pratique de soccer. Ton coach anglophone te demande : [[Are you ready?]] Réponds-lui poliment que non, tu n'es pas prêt(e), et explique comment tu te sens (au moins deux sentiments).","model":"Sorry, I'm not ready. I'm very tired, and I'm thirsty.","checklist":["J'ai dit [[I'm not]] pour la négation (jamais « I no ready »)","J'ai dit [[I'm thirsty]] ou [[I'm hungry]], jamais « I have thirst » ou « I have hunger »","J'ai prononcé le « r » de [[sorry]], [[ready]] et [[tired]] avec la langue, pas avec la gorge","J'ai relié deux sentiments avec [[and]]"]}},{"id":"2.2","title":"Animaux et pluriel","titleEn":"Two Foxes, Three Mice","goal":"Nommer les animaux et mettre les mots au pluriel, même les irréguliers.","lesson":[{"type":"p","text":"Bienvenue dans la forêt canadienne ! Tu vas croiser des [[beavers]] (castors), des [[moose]] (orignaux) et des [[foxes]] (renards). Pour dire « je vois », c'est [[I see]] : [[I see a bear!]]"},{"type":"rule","title":"Le pluriel normal","text":"La plupart du temps, on ajoute **-s** : [[dog]] → [[dogs]], [[cat]] → [[cats]]. Après s, x, ch ou sh, on ajoute **-es** : [[fox]] → [[foxes]]. Consonne + y devient **-ies** : [[baby]] → [[babies]], [[family]] → [[families]]. Certains mots en f deviennent **-ves** : [[wolf]] → [[wolves]]."},{"type":"table","head":["Un","Plusieurs","Le truc"],"rows":[["[[a mouse]]","[[mice]]","change complètement"],["[[a child]]","[[children]]","enfants"],["[[a man]]","[[men]]","hommes"],["[[a woman]]","[[women]]","femmes"],["[[a sheep]]","[[sheep]]","ne change pas"],["[[a fish]]","[[fish]]","ne change pas"],["[[a moose]]","[[moose]]","ne change pas"]]},{"type":"examples","items":[{"en":"I have two dogs.","fr":"J'ai deux chiens."},{"en":"The foxes are hungry.","fr":"Les renards ont faim."},{"en":"The wolves are angry.","fr":"Les loups sont fâchés."},{"en":"I see two moose!","fr":"Je vois deux orignaux !"},{"en":"The children are happy.","fr":"Les enfants sont contents."}]},{"type":"tip","text":"Les francophones ajoutent des s partout ! Mais on ne dit **jamais** « mouses », « childs », « sheeps » ou « mans ». On dit [[mice]], [[children]], [[sheep]], [[men]]. Et au pluriel, le verbe change aussi : [[The dog is]] → [[The dogs are]]."},{"type":"dialogue","title":"Au parc de la Gatineau","lines":[{"who":"Maya","en":"Look! I see a beaver!","fr":"Regarde ! Je vois un castor !"},{"who":"Liam","en":"Two beavers! And three ducks!","fr":"Deux castors ! Et trois canards !"},{"who":"Maya","en":"Are the ducks cold?","fr":"Les canards ont-ils froid ?"},{"who":"Liam","en":"No, they aren't. They're happy.","fr":"Non. Ils sont contents."},{"who":"Maya","en":"Wow! I see two moose!","fr":"Wow ! Je vois deux orignaux !"},{"who":"Liam","en":"Moose? I'm scared!","fr":"Des orignaux ? J'ai peur !"}]},{"type":"fun","text":"Le sais-tu ? Le castor est un emblème officiel du Canada. Tu le vois même sur la pièce de cinq cents !"}],"vocab":[{"en":"dog","fr":"chien","alt":[],"ex":"I have two dogs."},{"en":"cat","fr":"chat","alt":[],"ex":"My cat is white."},{"en":"bird","fr":"oiseau","alt":[],"ex":"The birds are happy."},{"en":"horse","fr":"cheval","alt":[],"ex":"I see three horses."},{"en":"cow","fr":"vache","alt":[],"ex":"The cows are hungry."},{"en":"rabbit","fr":"lapin","alt":["bunny"],"ex":"My rabbits are white."},{"en":"duck","fr":"canard","alt":[],"ex":"Are the ducks cold?"},{"en":"bear","fr":"ours","alt":[],"ex":"I see a bear!"},{"en":"wolf","fr":"loup","alt":[],"ex":"The wolves are angry."},{"en":"fox","fr":"renard","alt":[],"ex":"The foxes are hungry."},{"en":"mouse","fr":"souris","alt":[],"ex":"I see two mice."},{"en":"sheep","fr":"mouton","alt":[],"ex":"Ten sheep are tired."},{"en":"fish","fr":"poisson","alt":[],"ex":"I have three fish."},{"en":"beaver","fr":"castor","alt":[],"ex":"Is the beaver sad?"},{"en":"moose","fr":"orignal","alt":[],"ex":"I see two moose!"},{"en":"child","fr":"enfant","alt":["kid"],"ex":"The children are happy."}],"sentences":[{"en":"I have two dogs.","fr":"J'ai deux chiens.","trap":["dog","am"],"alt":[]},{"en":"The foxes are hungry.","fr":"Les renards ont faim.","trap":["foxs","have"],"alt":[]},{"en":"The wolves are angry.","fr":"Les loups sont fâchés.","trap":["wolfs"],"alt":[]},{"en":"Two mice are hungry.","fr":"Deux souris ont faim.","trap":["mouses"],"alt":[]},{"en":"I have three fish.","fr":"J'ai trois poissons.","trap":["fishs"],"alt":[]},{"en":"The children are happy.","fr":"Les enfants sont contents.","trap":["childs","is"],"alt":[]},{"en":"Ten sheep are tired.","fr":"Dix moutons sont fatigués.","trap":["sheeps"],"alt":[]},{"en":"Is the beaver sad?","fr":"Le castor est-il triste ?","trap":["Are"],"alt":[]},{"en":"I see two moose!","fr":"Je vois deux orignaux !","trap":["mooses"],"alt":[]},{"en":"My rabbits are white.","fr":"Mes lapins sont blancs.","trap":["whites"],"alt":[]},{"en":"The women are late.","fr":"Les femmes sont en retard.","trap":["womans","is"],"alt":[]},{"en":"Are the babies cold?","fr":"Les bébés ont-ils froid ?","trap":["babys","Is"],"alt":[]}],"grammar":[{"type":"mcq","q":"one mouse, two ___","choices":["mouses","mice","mices"],"answer":1,"explain":"Mouse est irrégulier : one mouse, two mice."},{"type":"mcq","q":"one child, three ___","choices":["childs","childrens","children"],"answer":2,"explain":"Child est irrégulier : children (déjà pluriel, sans s)."},{"type":"mcq","q":"one wolf, two ___","choices":["wolves","wolfs","wolfes"],"answer":0,"explain":"Wolf → wolves : le f devient -ves."},{"type":"mcq","q":"one baby, two ___","choices":["babys","babyes","babies"],"answer":2,"explain":"Consonne + y → -ies : babies."},{"type":"mcq","q":"one sheep, five ___","choices":["sheep","sheeps","sheepes"],"answer":0,"explain":"Sheep ne change pas au pluriel : five sheep."},{"type":"mcq","q":"The bears ___ hungry.","choices":["is","are","am"],"answer":1,"explain":"Bears est au pluriel (they), donc are."},{"type":"fill","q":"one fox, two ___","hint":"fox","answer":["foxes"],"explain":"Après x, on ajoute -es : foxes."},{"type":"fill","q":"one woman, two ___","hint":"woman","answer":["women"],"explain":"Woman → women : le a devient e."},{"type":"fill","q":"one family, two ___","hint":"family","answer":["families"],"explain":"Consonne + y → -ies : families."},{"type":"fill","q":"one man, three ___","hint":"man","answer":["men"],"explain":"Man → men. Jamais « mans »."},{"type":"fill","q":"one fish, four ___","hint":"poisson, au pluriel","answer":["fish"],"explain":"Fish ne change pas : four fish."},{"type":"fill","q":"one moose, two ___","hint":"orignal, au pluriel","answer":["moose"],"explain":"Moose ne change pas au pluriel : two moose."},{"type":"error","q":"I have two rabbit.","wrong":3,"fix":["rabbits"],"explain":"Deux lapins : on ajoute -s, rabbits."},{"type":"error","q":"The childs are happy.","wrong":1,"fix":["children"],"explain":"Child → children, jamais « childs »."},{"type":"error","q":"Three wolfs are hungry.","wrong":1,"fix":["wolves"],"explain":"Wolf → wolves."},{"type":"error","q":"I see two mouses.","wrong":3,"fix":["mice"],"explain":"Mouse → mice."},{"type":"error","q":"The ducks is cold.","wrong":2,"fix":["are"],"explain":"Plusieurs canards (they) : are."},{"type":"error","q":"Ten sheeps are tired.","wrong":1,"fix":["sheep"],"explain":"Sheep ne prend jamais de s."}],"pron":{"focus":"Le pluriel qui s'entend","ipa":"/s/ – /z/ – /ɪz/","explain":"En français, le « s » du pluriel est muet (« des chats »), mais en anglais, il faut **l'entendre** ! Il a trois sons. Après un son sec comme « t », « k », « p » ou « f », c'est un « s » sifflé : [[cats]], [[ducks]]. Après les autres sons, c'est un « z » qui bourdonne : [[dogs]], [[cows]], [[birds]] (mets ta main sur ta gorge : ça vibre !). Après un son qui siffle déjà (« s », « x », « ch », « sh »), on ajoute une syllabe « iz » : [[horse]] a une syllabe, mais [[horses]] en a deux !","words":[{"en":"cats","fr":"chats","hint":"« katss » : « s » sifflé, car « t » est un son sec"},{"en":"ducks","fr":"canards","hint":"« deukss » : « s » sifflé après le « k »"},{"en":"rabbits","fr":"lapins","hint":"« RA-bitss » : accent au début, « s » sifflé à la fin"},{"en":"dogs","fr":"chiens","hint":"« dogz » : finis par un « z » qui bourdonne, pas par un « s »"},{"en":"birds","fr":"oiseaux","hint":"« beurdz » : « dz » à la fin, comme le bruit d'une abeille"},{"en":"cows","fr":"vaches","hint":"« kaouz » : « aou » qui glisse, puis un « z »"},{"en":"horses","fr":"chevaux","hint":"« HÔR-siz » : deux syllabes ! Le « iz » s'ajoute après le « s » de [[horse]]"},{"en":"foxes","fr":"renards","hint":"« FOK-siz » : deux syllabes, on ajoute « iz » après le « x »"},{"en":"wolves","fr":"loups","hint":"« woulvz » : le « f » de [[wolf]] devient « v », puis un « z »"}],"pairs":[["dog","dogs"],["cat","cats"],["duck","ducks"],["horse","horses"],["fox","foxes"],["wolf","wolves"]],"practice":["Two cats, three dogs and four horses.","The foxes and the wolves are in the woods."]},"mission":{"type":"ecrit","prompt":"Tu visites une ferme près d'Ottawa avec ta classe. Écris un petit message à ta cousine Zoé, qui vit à Vancouver, pour lui dire où tu es et quels animaux tu vois (au moins trois sortes, avec leur nombre).","model":"Hi, Zoé! I'm at a farm near Ottawa. I see three horses, two cows and six ducks!","checklist":["J'ai mis le nombre AVANT l'animal ([[three horses]])","J'ai ajouté un « s » ou « es » au pluriel ([[horses]], [[foxes]]), et j'ai pensé aux pluriels spéciaux ([[sheep]], [[mice]])","Je n'ai pas mis de « s » quand il y a un seul animal ([[a cow]], [[one cow]])","J'ai relu à voix haute en faisant entendre la fin de chaque pluriel : « s », « z » ou « iz »"]}},{"id":"2.3","title":"Le corps et les descriptions","titleEn":"Long Hair, Big Feet","goal":"Nommer les parties du corps et décrire quelqu'un avec have et has.","lesson":[{"type":"p","text":"Pour décrire une personne, il te faut son corps : [[head]] (tête), [[eyes]] (yeux), [[nose]] (nez), [[mouth]] (bouche), [[hair]] (cheveux)… et des adjectifs comme [[tall]] (grand), [[long]], [[curly]] (frisé)."},{"type":"table","head":["Sujet","avoir","Exemple"],"rows":[["I / you / we / they","[[have]]","[[I have brown eyes.]]"],["he / she / it","[[has]]","[[She has blue eyes.]]"]]},{"type":"rule","title":"Décrire en anglais","text":"« Elle a les yeux bleus » se dit [[She has blue eyes.]] Trois secrets : 1) **pas de the** ; 2) l'adjectif **avant** le nom ; 3) **pas de s** sur l'adjectif. Si tu as deux adjectifs, la taille passe avant la couleur : [[long brown hair]]."},{"type":"rule","title":"Pluriels du corps","text":"[[foot]] → [[feet]] (pieds) et [[tooth]] → [[teeth]] (dents) sont irréguliers. Et [[hair]] (les cheveux) reste **sans s** : [[She has long hair.]]"},{"type":"examples","items":[{"en":"She has blue eyes.","fr":"Elle a les yeux bleus."},{"en":"I have long brown hair.","fr":"J'ai de longs cheveux bruns."},{"en":"He has big feet.","fr":"Il a de grands pieds."},{"en":"My brother is tall.","fr":"Mon frère est grand."},{"en":"Maya has short curly hair.","fr":"Maya a les cheveux courts et frisés."}]},{"type":"tip","text":"Piège ! On ne dit pas « She has the eyes blue » ni « long hairs ». On dit [[She has blue eyes]] et [[long hair]]. Et avec he, she, it : [[has]], jamais « have ». Pour une personne, « grand » = [[tall]] et « petit » = [[short]]. Pour une chose : [[big]] et [[small]]."},{"type":"dialogue","title":"Qui est-ce ?","lines":[{"who":"Priya","en":"Is he your brother?","fr":"C'est ton frère ?"},{"who":"Samuel","en":"No. My brother is tall.","fr":"Non. Mon frère est grand."},{"who":"Priya","en":"And curly hair?","fr":"Et les cheveux frisés ?"},{"who":"Samuel","en":"Yes, he has short curly hair and brown eyes.","fr":"Oui, il a les cheveux courts et frisés et les yeux bruns."},{"who":"Priya","en":"And big feet?","fr":"Et de grands pieds ?"},{"who":"Samuel","en":"Yes! He has very big feet!","fr":"Oui ! Il a de très grands pieds !"}]}],"vocab":[{"en":"head","fr":"tête","alt":[],"ex":"My head is big."},{"en":"eye","fr":"œil (les yeux)","alt":[],"ex":"She has blue eyes."},{"en":"nose","fr":"nez","alt":[],"ex":"Grandpa has a long nose."},{"en":"mouth","fr":"bouche","alt":[],"ex":"Your mouth is big!"},{"en":"hair","fr":"cheveux","alt":[],"ex":"I have long hair."},{"en":"hand","fr":"main","alt":[],"ex":"We have two hands."},{"en":"leg","fr":"jambe","alt":[],"ex":"My legs are tired."},{"en":"foot","fr":"pied","alt":[],"ex":"He has big feet."},{"en":"tooth","fr":"dent","alt":[],"ex":"My teeth are white."},{"en":"tall","fr":"grand (une personne)","alt":[],"ex":"My brother is tall."},{"en":"short","fr":"court ; petit (une personne)","alt":[],"ex":"She has short hair."},{"en":"long","fr":"long","alt":[],"ex":"I have long hair."},{"en":"curly","fr":"frisé, bouclé","alt":[],"ex":"Is your hair curly?"},{"en":"brown","fr":"brun","alt":[],"ex":"He has brown eyes."},{"en":"big","fr":"gros, grand (une chose)","alt":["large"],"ex":"He has big feet."},{"en":"small","fr":"petit (une chose)","alt":["little"],"ex":"The dog has a small nose."}],"sentences":[{"en":"She has blue eyes.","fr":"Elle a les yeux bleus.","trap":["the","blues"],"alt":[]},{"en":"I have long brown hair.","fr":"J'ai de longs cheveux bruns.","trap":["hairs","the"],"alt":[]},{"en":"My brother is tall.","fr":"Mon frère est grand.","trap":["has"],"alt":[]},{"en":"He has big feet.","fr":"Il a de grands pieds.","trap":["foots","have"],"alt":[]},{"en":"Maya has short curly hair.","fr":"Maya a les cheveux courts et frisés.","trap":["hairs","have"],"alt":[]},{"en":"The dog has a small nose.","fr":"Le chien a un petit nez.","trap":["have"],"alt":[]},{"en":"My teeth are white.","fr":"Mes dents sont blanches.","trap":["tooths","whites"],"alt":[]},{"en":"We have two hands.","fr":"Nous avons deux mains.","trap":["has"],"alt":[]},{"en":"Your mouth is big!","fr":"Ta bouche est grande !","trap":["has"],"alt":[]},{"en":"Grandpa has a long nose.","fr":"Grand-papa a un long nez.","trap":["have"],"alt":[]},{"en":"My legs are tired.","fr":"Mes jambes sont fatiguées.","trap":["is"],"alt":[]},{"en":"Is your hair curly?","fr":"Tes cheveux sont-ils frisés ?","trap":["Are","hairs"],"alt":[]}],"grammar":[{"type":"mcq","q":"Comment dit-on « Elle a les yeux verts » ?","choices":["She has the eyes green.","She has green eyes.","She have green eyes."],"answer":1,"explain":"Pas de the, adjectif avant le nom, et has avec she : She has green eyes."},{"type":"mcq","q":"He ___ short hair.","choices":["have","is","has"],"answer":2,"explain":"Avec he, avoir = has."},{"type":"mcq","q":"I ___ brown eyes.","choices":["have","has","am"],"answer":0,"explain":"Avec I, avoir = have."},{"type":"mcq","q":"Comment dit-on « des cheveux longs » ?","choices":["long hairs","hair long","long hair"],"answer":2,"explain":"Hair (les cheveux) n'a pas de s, et l'adjectif va avant : long hair."},{"type":"mcq","q":"one foot, two ___","choices":["foots","feet","feets"],"answer":1,"explain":"Foot → feet, pluriel irrégulier."},{"type":"mcq","q":"My sister and I ___ curly hair.","choices":["have","has","are"],"answer":0,"explain":"Ma sœur et moi = we, donc have."},{"type":"mcq","q":"one tooth, ten ___","choices":["tooths","teeths","teeth"],"answer":2,"explain":"Tooth → teeth, comme foot → feet."},{"type":"fill","q":"She ___ a small nose.","hint":"have","answer":["has"],"explain":"Avec she, have devient has."},{"type":"fill","q":"They ___ big hands.","hint":"avoir","answer":["have"],"explain":"Avec they, avoir = have."},{"type":"fill","q":"Emma has long ___.","hint":"cheveux","answer":["hair"],"explain":"Les cheveux = hair, sans s."},{"type":"fill","q":"I have two ___.","hint":"pied","answer":["feet"],"explain":"Foot → feet au pluriel."},{"type":"fill","q":"My ___ are white.","hint":"dent","answer":["teeth"],"explain":"Tooth → teeth au pluriel."},{"type":"fill","q":"Noah isn't short. He's ___.","hint":"grand (de taille)","answer":["tall"],"explain":"Pour une personne, grand = tall."},{"type":"error","q":"She has blues eyes.","wrong":2,"fix":["blue"],"explain":"Pas de s sur les adjectifs : blue eyes."},{"type":"error","q":"He have curly hair.","wrong":1,"fix":["has"],"explain":"Avec he : has."},{"type":"error","q":"I have long hairs.","wrong":3,"fix":["hair"],"explain":"Les cheveux = hair, toujours sans s."},{"type":"error","q":"My foots are cold.","wrong":1,"fix":["feet"],"explain":"Foot → feet."},{"type":"error","q":"The baby has two tooths.","wrong":4,"fix":["teeth"],"explain":"Tooth → teeth."}],"pron":{"focus":"Les voyelles qui glissent","ipa":"/eɪ/ – /aɪ/ – /oʊ/","explain":"En français, une voyelle reste toujours pareille du début à la fin : « é », c'est « é ». En anglais, beaucoup de voyelles **glissent** vers une autre, comme une glissade sur la neige ! Le « é » de [[face]] glisse vers « i » (« féïss »), le « a » de [[eyes]] glisse vers « i » (« aïz ») et le « o » de [[nose]] glisse vers « ou » (« nôouz »). Si tu ne glisses pas, ton ami entend [[pen]] (stylo) au lieu de [[pain]] (douleur), ou [[not]] au lieu de [[note]]. Truc : exagère la glissade au début ; ta bouche doit bouger pendant la voyelle !","words":[{"en":"face","fr":"visage","hint":"« féïss » : le « é » glisse vers « i », puis un « s » sifflé"},{"en":"eight","fr":"huit","hint":"« éït » : comme « é » + « i » collés, et le « gh » est muet"},{"en":"grey","fr":"gris","hint":"« gréï » : le « é » glisse vers « i » à la fin"},{"en":"eyes","fr":"yeux","hint":"« aïz » : « a » qui glisse vers « i », puis un « z »"},{"en":"my","fr":"mon, ma, mes","hint":"« maï » : jamais « mi » ! Le « a » glisse vers « i »"},{"en":"smile","fr":"sourire","hint":"« smaïl » : « aï » qui glisse, et un « l » à la fin"},{"en":"nose","fr":"nez","hint":"« nôouz » : le « ô » glisse vers « ou », lèvres qui se ferment un peu, puis un « z »"},{"en":"toes","fr":"orteils","hint":"« tôouz » : le « ô » glisse vers « ou », puis un « z »"},{"en":"cold","fr":"froid, froide ; un rhume","hint":"« kôould » : « ô » qui glisse vers « ou », puis « ld »"}],"pairs":[["wait","wet"],["pain","pen"],["kite","kit"],["fine","fin"],["note","not"],["hope","hop"]],"practice":["My nose is cold, and my toes are cold too!","Kate has grey eyes and a big smile."]},"mission":{"type":"oral","prompt":"Tu cherches ton amie Maya dans la foule au Festival des tulipes, et un bénévole anglophone veut t'aider. Décris-la en deux ou trois phrases : sa taille, ses cheveux et ses yeux.","model":"My friend Maya is tall. She has long black hair and big brown eyes.","checklist":["J'ai dit [[She has]] (avec un « s »), pas [[She have]]","J'ai mis l'adjectif AVANT le nom ([[brown eyes]]), sans « s » sur l'adjectif","Je n'ai pas mis [[the]] devant les cheveux ou les yeux ([[She has blue eyes]])","J'ai fait glisser les voyelles de [[eyes]] (« aïz ») et de [[my]] (« maï »)"]}},{"id":"2.4","title":"Jours, mois, heure","titleEn":"What Time Is It?","goal":"Dire les jours, les mois, les saisons et l'heure, avec on, in et at.","lesson":[{"type":"p","text":"Ton agenda en anglais ! Les jours de la semaine, les mois, les saisons et l'heure. Pour demander l'heure : [[What time is it?]]"},{"type":"table","head":["Jour","Day","Mois","Month"],"rows":[["lundi","[[Monday]]","janvier","[[January]]"],["mardi","[[Tuesday]]","février","[[February]]"],["mercredi","[[Wednesday]]","mars","[[March]]"],["jeudi","[[Thursday]]","avril","[[April]]"],["vendredi","[[Friday]]","mai","[[May]]"],["samedi","[[Saturday]]","juin","[[June]]"],["dimanche","[[Sunday]]","juillet","[[July]]"],["","","août","[[August]]"],["","","septembre","[[September]]"],["","","octobre","[[October]]"],["","","novembre","[[November]]"],["","","décembre","[[December]]"]]},{"type":"rule","title":"Toujours une majuscule !","text":"En anglais, les jours et les mois prennent **toujours** une majuscule : [[Monday]], [[July]]. Les saisons, non : [[winter]] (hiver), [[spring]] (printemps), [[summer]] (été), [[fall]] (automne). La [[weekend]], c'est la fin de semaine. [[today]] = aujourd'hui, [[birthday]] = anniversaire."},{"type":"rule","title":"Dire l'heure","text":"Heure pile : [[It's three o'clock.]] Et demie : [[It's half past seven.]] Et quart : [[It's quarter past ten.]] Moins le quart : [[It's a quarter to nine.]] (Avec ou sans [[a]], c'est correct.) Jamais « three hours » !"},{"type":"table","head":["Préposition","Avec…","Exemple"],"rows":[["[[on]]","les jours, the weekend","[[on Monday]], [[on the weekend]]"],["[[in]]","les mois, les saisons, the morning","[[in May]], [[in winter]], [[in the morning]]"],["[[at]]","l'heure, night","[[at three o'clock]], [[at night]]"]]},{"type":"examples","items":[{"en":"My birthday is in May.","fr":"Mon anniversaire est en mai."},{"en":"See you on Friday!","fr":"À vendredi !"},{"en":"It's cold in winter.","fr":"Il fait froid en hiver."},{"en":"I'm not hungry at night.","fr":"Je n'ai pas faim la nuit."},{"en":"It's half past seven in the morning.","fr":"Il est sept heures et demie du matin."}]},{"type":"tip","text":"Pièges ! 1) Majuscule aux jours et aux mois : [[Monday]], pas « monday ». 2) « En juillet » = [[in July]], mais « lundi » = [[on Monday]]. 3) « à trois heures » = [[at three o'clock]]. 4) « Il est trois heures » = [[It's three o'clock]], jamais « three hours »."},{"type":"dialogue","title":"Un rendez-vous","lines":[{"who":"Olivia","en":"Hi, Félix! What time is it?","fr":"Salut, Félix ! Quelle heure est-il ?"},{"who":"Félix","en":"It's a quarter to four.","fr":"Il est quatre heures moins le quart."},{"who":"Olivia","en":"Oh no! I'm late! My hockey practice is at four o'clock.","fr":"Oh non ! Je suis en retard ! Ma pratique de hockey est à quatre heures."},{"who":"Félix","en":"Is your practice on Tuesday?","fr":"Ta pratique, c'est le mardi ?"},{"who":"Olivia","en":"Yes, on Tuesday and on Saturday. See you on Friday!","fr":"Oui, le mardi et le samedi. À vendredi !"},{"who":"Félix","en":"Goodbye, Olivia!","fr":"Au revoir, Olivia !"}]},{"type":"fun","text":"Le sais-tu ? Le canal Rideau, à Ottawa, devient une immense patinoire en hiver. Tu peux y patiner en [[January]] et en [[February]] !"}],"vocab":[{"en":"Monday","fr":"lundi","alt":[],"ex":"See you on Monday!"},{"en":"Tuesday","fr":"mardi","alt":[],"ex":"My practice is on Tuesday."},{"en":"Wednesday","fr":"mercredi","alt":[],"ex":"Today is Wednesday."},{"en":"Thursday","fr":"jeudi","alt":[],"ex":"I'm tired on Thursday."},{"en":"Friday","fr":"vendredi","alt":[],"ex":"See you on Friday!"},{"en":"Saturday","fr":"samedi","alt":[],"ex":"The day after Friday is Saturday."},{"en":"Sunday","fr":"dimanche","alt":[],"ex":"I see my grandma on Sunday."},{"en":"winter","fr":"hiver","alt":[],"ex":"It's cold in winter."},{"en":"spring","fr":"printemps","alt":[],"ex":"My birthday is in spring."},{"en":"summer","fr":"été","alt":[],"ex":"Is it hot in summer?"},{"en":"fall","fr":"automne","alt":["autumn"],"ex":"My birthday is in the fall."},{"en":"o'clock","fr":"heure(s) pile","alt":[],"ex":"It's three o'clock."},{"en":"half past","fr":"et demie (pour l'heure)","alt":[],"ex":"It's half past seven."},{"en":"quarter","fr":"quart","alt":[],"ex":"It's quarter past ten."},{"en":"month","fr":"mois","alt":[],"ex":"January is a cold month."},{"en":"weekend","fr":"fin de semaine","alt":[],"ex":"See you on the weekend!"}],"sentences":[{"en":"My birthday is in May.","fr":"Mon anniversaire est en mai.","trap":["on"],"alt":[]},{"en":"It's three o'clock.","fr":"Il est trois heures.","trap":["hours"],"alt":[]},{"en":"I see my grandma on Sunday.","fr":"Je vois ma grand-maman dimanche.","trap":["in"],"alt":["On Sunday, I see my grandma."]},{"en":"It's cold in winter.","fr":"Il fait froid en hiver.","trap":["on"],"alt":["In winter, it's cold."]},{"en":"What time is it?","fr":"Quelle heure est-il ?","trap":["hour"],"alt":[]},{"en":"It's half past seven.","fr":"Il est sept heures et demie.","trap":["and"],"alt":[]},{"en":"It's a quarter to nine.","fr":"Il est neuf heures moins le quart.","trap":["less"],"alt":[]},{"en":"Is it hot in summer?","fr":"Fait-il chaud en été ?","trap":["at"],"alt":[]},{"en":"Today is Wednesday.","fr":"Aujourd'hui, c'est mercredi.","trap":["on"],"alt":["Wednesday is today."]},{"en":"See you on Friday!","fr":"À vendredi !","trap":["in"],"alt":[]},{"en":"It's quarter past ten.","fr":"Il est dix heures et quart.","trap":["and"],"alt":[]},{"en":"I'm not hungry at night.","fr":"Je n'ai pas faim la nuit.","trap":["in","have"],"alt":["At night, I'm not hungry."]}],"grammar":[{"type":"mcq","q":"My birthday is ___ June.","choices":["on","in","at"],"answer":1,"explain":"Avec un mois, on utilise in : in June."},{"type":"mcq","q":"See you ___ Monday!","choices":["in","at","on"],"answer":2,"explain":"Avec un jour, on utilise on : on Monday."},{"type":"mcq","q":"I see my friends ___ four o'clock.","choices":["at","on","in"],"answer":0,"explain":"Avec une heure précise, on utilise at."},{"type":"mcq","q":"En anglais, les jours et les mois s'écrivent avec…","choices":["une minuscule","une majuscule","un tiret"],"answer":1,"explain":"Toujours une majuscule : Monday, July."},{"type":"mcq","q":"Comment dit-on « six heures et demie » ?","choices":["half past six","six and half","half past seven"],"answer":0,"explain":"Et demie = half past : half past six."},{"type":"mcq","q":"Comment dit-on « neuf heures moins le quart » ?","choices":["quarter past nine","a quarter to nine","a quarter to eight"],"answer":1,"explain":"Moins le quart = a quarter to : a quarter to nine."},{"type":"mcq","q":"It's cold ___ winter.","choices":["on","at","in"],"answer":2,"explain":"Avec une saison, on utilise in : in winter."},{"type":"fill","q":"It's four ___.","hint":"heures pile","answer":["o'clock"],"explain":"Heure pile = o'clock : It's four o'clock."},{"type":"fill","q":"My birthday is ___ March.","hint":"en","answer":["in"],"explain":"Avec un mois : in March."},{"type":"fill","q":"See you ___ the weekend!","hint":"préposition, au Canada","answer":["on"],"explain":"Au Canada, on dit on the weekend."},{"type":"fill","q":"It's half ___ two.","hint":"et demie","answer":["past"],"explain":"Deux heures et demie = half past two."},{"type":"fill","q":"It's a quarter ___ six.","hint":"moins le quart","answer":["to"],"explain":"Moins le quart = a quarter to : a quarter to six."},{"type":"fill","q":"The weekend is Saturday and ___.","hint":"dimanche","answer":["Sunday"],"explain":"Dimanche = Sunday, avec une majuscule."},{"type":"error","q":"My birthday is on July.","wrong":3,"fix":["in"],"explain":"Avec un mois : in July."},{"type":"error","q":"It's five hours.","wrong":2,"fix":["o'clock"],"explain":"Il est cinq heures = It's five o'clock."},{"type":"error","q":"See you in Tuesday!","wrong":2,"fix":["on"],"explain":"Avec un jour : on Tuesday."},{"type":"error","q":"It's cold at winter.","wrong":2,"fix":["in"],"explain":"Avec une saison : in winter."},{"type":"error","q":"It's half past seven at the morning.","wrong":4,"fix":["in"],"explain":"Le matin = in the morning."}],"pron":{"focus":"L'accent tonique des mots","ipa":"","explain":"En français, toutes les syllabes ont presque la même force, avec un petit accent à la fin. En anglais, chaque mot a **une syllabe championne** : plus forte, plus longue et plus haute que les autres, qui deviennent toutes petites. Dans les indices, cette syllabe est écrite en MAJUSCULES : [[September]] se dit « sèp-TÈM-beur », pas « sèp-tam-BRE ». Si tu mets la force au mauvais endroit, on a du mal à te comprendre, même si tous les sons sont bons ! Truc : tape dans tes mains sur la syllabe championne en disant le mot.","words":[{"en":"January","fr":"janvier","hint":"« DJA-niou-è-ri » : accent au début, et un « dj » comme dans « jean »"},{"en":"February","fr":"février","hint":"« FÈB-rou-è-ri » : accent au début (on entend souvent aussi « FÈB-iou-è-ri »)"},{"en":"Wednesday","fr":"mercredi","hint":"« WÈNZ-déï » : seulement deux syllabes ! Le premier « d » et le deuxième « e » sont muets"},{"en":"Saturday","fr":"samedi","hint":"« SA-teur-déï » : accent au début, le reste est tout petit"},{"en":"September","fr":"septembre","hint":"« sèp-TÈM-beur » : accent au milieu"},{"en":"October","fr":"octobre","hint":"« ok-TÔ-beur » : accent au milieu, « ô » qui glisse un peu"},{"en":"December","fr":"décembre","hint":"« di-SÈM-beur » : accent au milieu, le début est tout petit"},{"en":"afternoon","fr":"après-midi","hint":"« af-teur-NOUNE » : accent à la fin, avec un « ou » long"},{"en":"tomorrow","fr":"demain","hint":"« teu-MÔ-rôou » : accent au milieu, le début est tout petit"},{"en":"o'clock","fr":"heure(s) pile (three o'clock = trois heures)","hint":"« eu-KLOK » : le « o » du début devient un petit « eu », accent sur « KLOK »"}],"pairs":[],"practice":["My birthday is in September.","See you on Saturday afternoon at three o'clock!","Is it Wednesday tomorrow?"]},"mission":{"type":"ecrit","prompt":"Tu organises ta fête d'anniversaire. Écris une petite invitation à ton ami Liam : dis-lui le mois de ton anniversaire, puis le jour et l'heure de la fête.","model":"Hi, Liam! My birthday is in October. My party is on Saturday at two o'clock.","checklist":["J'ai mis une majuscule aux jours et aux mois ([[Saturday]], [[October]])","J'ai utilisé [[in]] + mois, [[on]] + jour et [[at]] + heure","J'ai écrit l'heure en mots avec [[o'clock]] ([[two o'clock]])","J'ai relu à voix haute en tapant des mains sur la syllabe forte : « ok-TÔ-beur », « SA-teur-déï »"]}}]},{"id":3,"cefr":"A2","title":"Au quotidien","titleEn":"Everyday Life","intro":"Raconte ta journée, pose des questions, commande à manger et décris ta maison. Bienvenue dans la vraie vie en anglais !","boss":{"name":"Docteur Routine","taunt":"Moi, je me lève à six heures, je déjeune à six heures dix et je gagne à six heures quinze. Tu oublies toujours le -s, non ?","defeat":"Quoi ?! Tu as cassé ma routine… Je retourne me coucher !"},"units":[{"id":"3.1","title":"Ma routine","titleEn":"Rise and Shine","goal":"Raconter sa journée au présent simple et dire à quelle fréquence on fait les choses.","lesson":[{"type":"p","text":"Chaque jour, tu fais à peu près les mêmes choses : c'est ta **routine**. Pour en parler, l'anglais utilise le **présent simple** : [[I wake up at seven o'clock.]] = Je me réveille à sept heures."},{"type":"rule","title":"Le -s de he / she / it","text":"Avec **he, she, it** (ou un prénom, ou [[my dad]]), le verbe prend un **-s** : [[I get up]] → [[she gets up]]. Avec **I, you, we, they**, pas de -s : [[My parents get up at six.]]"},{"type":"table","head":["Verbe","he / she / it","Pourquoi ?"],"rows":[["play","[[plays]]","+ s"],["eat","[[eats]]","+ s"],["watch","[[watches]]","-ch → + es"],["brush","[[brushes]]","-sh → + es"],["go","[[goes]]","-o → + es"],["do","[[does]]","-o → + es"],["study","[[studies]]","consonne + y → -ies"],["have","[[has]]","irrégulier !"]]},{"type":"rule","title":"Les adverbes de fréquence","text":"[[always]] (toujours) > [[usually]] (d'habitude) > [[often]] (souvent) > [[sometimes]] (parfois) > [[never]] (jamais). Ils se placent **avant le verbe** : [[I always get up at seven.]] Mais **après be** : [[She is never late.]]"},{"type":"p","text":"Petits mots utiles : [[every day]] (chaque jour), [[every morning]] (chaque matin), [[after]] (après), [[before]] (avant), [[in the evening]] (le soir). Et pour « son / sa / ses » : [[his]] pour un garçon, [[her]] pour une fille : [[He brushes his teeth.]] [[She does her homework.]]"},{"type":"examples","items":[{"en":"I wake up at seven o'clock.","fr":"Je me réveille à sept heures."},{"en":"Zoé never has breakfast.","fr":"Zoé ne déjeune jamais (ne prend jamais de petit-déjeuner)."},{"en":"My dad watches TV in the evening.","fr":"Mon père regarde la télé le soir."},{"en":"We usually have lunch at school.","fr":"D'habitude, nous dînons à l'école."},{"en":"Liam is always hungry.","fr":"Liam a toujours faim."}]},{"type":"tip","text":"Piège de francophone : en français, le -s de « il se lève » ne s'entend pas, alors on l'oublie en anglais ! Dis-le bien fort : [[He gets up.]] Et au Canada, attention aux repas : [[breakfast]] = déjeuner (petit-déjeuner), [[lunch]] = dîner, [[dinner]] = souper."},{"type":"dialogue","title":"Le matin chez Lucas","lines":[{"who":"Maman","en":"Lucas, wake up! It's seven o'clock!","fr":"Lucas, réveille-toi ! Il est sept heures !"},{"who":"Lucas","en":"Five minutes, please! I'm tired.","fr":"Cinq minutes, s'il te plaît ! Je suis fatigué."},{"who":"Maman","en":"Your sister always gets up at half past six.","fr":"Ta sœur se lève toujours à six heures et demie."},{"who":"Lucas","en":"Zoé is never tired!","fr":"Zoé n'est jamais fatiguée !"},{"who":"Maman","en":"And she always has breakfast. Come on!","fr":"Et elle déjeune toujours. Allez !"},{"who":"Lucas","en":"OK, OK. I'm up!","fr":"D'accord, d'accord. Je suis debout !"}]}],"vocab":[{"en":"wake up","fr":"se réveiller","alt":[],"ex":"I wake up at seven o'clock."},{"en":"get up","fr":"se lever","alt":[],"ex":"She gets up at half past six."},{"en":"have breakfast","fr":"déjeuner (prendre le petit-déjeuner)","alt":["eat breakfast"],"ex":"We have breakfast in the kitchen."},{"en":"take a shower","fr":"prendre une douche","alt":["have a shower"],"ex":"My brother takes a shower every morning."},{"en":"brush my teeth","fr":"me brosser les dents","alt":[],"ex":"I brush my teeth after breakfast."},{"en":"get dressed","fr":"s'habiller","alt":[],"ex":"Emma gets dressed before breakfast."},{"en":"go to school","fr":"aller à l'école","alt":[],"ex":"We go to school at eight o'clock."},{"en":"have lunch","fr":"dîner (repas du midi)","alt":["eat lunch"],"ex":"Noah has lunch at school."},{"en":"do homework","fr":"faire ses devoirs","alt":["do my homework"],"ex":"I do homework after school."},{"en":"have dinner","fr":"souper (repas du soir)","alt":["eat dinner","have supper","eat supper"],"ex":"We have dinner at six o'clock."},{"en":"go to bed","fr":"se coucher","alt":[],"ex":"My sister goes to bed at nine o'clock."},{"en":"always","fr":"toujours","alt":[],"ex":"Liam is always hungry."},{"en":"usually","fr":"d'habitude (habituellement)","alt":["normally"],"ex":"I usually get up at seven."},{"en":"often","fr":"souvent","alt":[],"ex":"Maya often watches TV in the evening."},{"en":"sometimes","fr":"parfois (quelquefois)","alt":[],"ex":"I sometimes have lunch with my grandma."},{"en":"never","fr":"jamais","alt":[],"ex":"My dad is never late."}],"sentences":[{"en":"I wake up at seven o'clock.","fr":"Je me réveille à sept heures.","trap":["wakes","in"],"alt":[]},{"en":"Emma gets up at half past six.","fr":"Emma se lève à six heures et demie.","trap":["get","on"],"alt":[]},{"en":"Noah never has breakfast.","fr":"Noah ne déjeune jamais (ne prend jamais de petit-déjeuner).","trap":["have","not"],"alt":[]},{"en":"They often do homework after school.","fr":"Ils font souvent leurs devoirs après l'école.","trap":["does","make"],"alt":[]},{"en":"My dad watches TV in the evening.","fr":"Mon père regarde la télé le soir.","trap":["watchs","watch"],"alt":["In the evening my dad watches TV."]},{"en":"Is she always late?","fr":"Est-elle toujours en retard ?","trap":["Does","be"],"alt":[]},{"en":"I am never hungry in the morning.","fr":"Je n'ai jamais faim le matin.","trap":["have","don't"],"alt":["In the morning I am never hungry."]},{"en":"She goes to bed at nine o'clock.","fr":"Elle se couche à neuf heures.","trap":["go","gos"],"alt":[]},{"en":"My sister takes a shower every morning.","fr":"Ma sœur prend une douche chaque matin.","trap":["take","do"],"alt":["Every morning my sister takes a shower."]},{"en":"Léa does her homework before dinner.","fr":"Léa fait ses devoirs avant le souper.","trap":["do","make"],"alt":[]},{"en":"He gets dressed after breakfast.","fr":"Il s'habille après le déjeuner (petit-déjeuner).","trap":["get","has"],"alt":[]},{"en":"We always have lunch at school.","fr":"Nous dînons toujours à l'école.","trap":["has","eats"],"alt":[]}],"grammar":[{"type":"mcq","q":"Zoé ___ to school at eight o'clock.","choices":["goes","go","gos"],"answer":0,"explain":"Zoé = she, donc -s. Et go se termine par -o : on ajoute -es → goes."},{"type":"mcq","q":"Où placer always dans « He is late » ?","choices":["He always is late.","He is always late.","Always he is late."],"answer":1,"explain":"Avec le verbe be, l'adverbe de fréquence se place après : he is always late."},{"type":"mcq","q":"My parents ___ up at six o'clock.","choices":["gets","getting","get"],"answer":2,"explain":"My parents = they : pas de -s au verbe."},{"type":"mcq","q":"Comment écrit-on study avec she ?","choices":["studys","studyes","studies"],"answer":2,"explain":"Consonne + y : le y devient -ies → she studies."},{"type":"mcq","q":"Liam ___ his teeth after breakfast.","choices":["brushes","brush","brushs"],"answer":0,"explain":"Liam = he. Brush finit par -sh, donc on ajoute -es : brushes."},{"type":"mcq","q":"Comment dit-on « Je ne déjeune jamais » ?","choices":["I don't never have breakfast.","I never have breakfast.","I have never breakfast.","I never has breakfast."],"answer":1,"explain":"Never se place avant le verbe, sans don't (never est déjà négatif). Avec I : have, pas has."},{"type":"fill","q":"She ___ to bed at nine o'clock.","hint":"go","answer":["goes"],"explain":"Avec she, go devient goes."},{"type":"fill","q":"Malik ___ his homework after dinner.","hint":"do","answer":["does"],"explain":"Malik = he : do devient does."},{"type":"fill","q":"Emma ___ breakfast with her grandma.","hint":"have","answer":["has"],"explain":"Have est irrégulier : avec he / she, c'est has."},{"type":"fill","q":"Noah ___ TV every evening.","hint":"watch","answer":["watches"],"explain":"Watch finit par -ch : avec he, on ajoute -es → watches."},{"type":"fill","q":"My sister ___ English at school.","hint":"study","answer":["studies"],"explain":"Consonne + y → -ies : she studies."},{"type":"fill","q":"Priya is ___ late.","hint":"jamais","answer":["never"],"explain":"Jamais = never. Après be, l'adverbe se place juste après : is never late."},{"type":"error","q":"He go to school every day.","wrong":1,"fix":["goes"],"explain":"Avec he, il faut le -s : he goes."},{"type":"error","q":"After dinner, she watchs TV.","wrong":3,"fix":["watches"],"explain":"Watch finit par -ch : on écrit watches, pas watchs."},{"type":"error","q":"Ethan haves breakfast at seven o'clock.","wrong":1,"fix":["has"],"explain":"Haves n'existe pas : avec he, have devient has."},{"type":"error","q":"My cousin Chloé studys English.","wrong":3,"fix":["studies"],"explain":"Consonne + y → -ies : studies."},{"type":"error","q":"My parents gets up at six o'clock.","wrong":2,"fix":["get"],"explain":"My parents = they, donc pas de -s : they get up."}],"reading":{"title":"Lucas's Day","text":"Lucas is twelve years old. On school days, he wakes up at half past six, but he gets up at seven o'clock. He takes a shower and gets dressed. He has breakfast with his sister Zoé. Zoé never eats in the morning because she is never hungry!\n\nThey go to school at eight o'clock. After school, Lucas usually does his homework in his bedroom. He sometimes watches TV after dinner. He always brushes his teeth before bed, and he goes to bed at nine o'clock.","questions":[{"q":"À quelle heure Lucas se lève-t-il ?","choices":["À six heures et demie","À sept heures","À huit heures","À neuf heures"],"answer":1},{"q":"Pourquoi Zoé ne mange-t-elle rien le matin ?","choices":["Elle est en retard","Elle est malade","Elle n'a jamais faim le matin","Elle n'aime pas le déjeuner"],"answer":2},{"q":"Que fait Lucas d'habitude après l'école ?","choices":["Il fait ses devoirs","Il regarde la télé","Il prend une douche","Il se couche"],"answer":0},{"q":"Quand Lucas regarde-t-il parfois la télé ?","choices":["Avant l'école","Au déjeuner (petit-déjeuner)","À neuf heures","Après le souper"],"answer":3}]},"pron":{"focus":"Le « s » de he, she, it","ipa":"/s/ – /z/ – /ɪz/","explain":"Bonne nouvelle : le « s » de [[she plays]] se prononce exactement comme le pluriel de [[dogs]] et [[cats]] ! Après un son sec (« t », « k », « p »), c'est un « s » sifflé : [[gets]], [[eats]]. Après les autres sons, c'est un « z » qui bourdonne : [[plays]], [[goes]]. Après un son qui siffle déjà (« ch », « sh », « s »), on ajoute la syllabe « iz » : [[watch]] devient [[watches]] (« WÂ-tchiz »). Attention à deux tricheurs : [[does]] se dit « deuz » (pas « douz ») et [[says]] se dit « sèz » (pas « séïz ») !","words":[{"en":"gets","fr":"se lève (gets up), obtient","hint":"« guètss » : « s » sifflé après le « t »"},{"en":"eats","fr":"mange","hint":"« iitss » : « ii » long, puis « tss »"},{"en":"plays","fr":"joue","hint":"« pléïz » : « éï » qui glisse, puis un « z »"},{"en":"goes","fr":"va","hint":"« gôouz » : « ôou » qui glisse, puis un « z » (le « e » est muet)"},{"en":"watches","fr":"regarde","hint":"« WÂ-tchiz » : deux syllabes, on ajoute « iz »"},{"en":"brushes","fr":"brosse","hint":"« BREU-chiz » : deux syllabes, « iz » après le « ch »"},{"en":"finishes","fr":"finit, termine","hint":"« FI-ni-chiz » : trois syllabes, accent au début"},{"en":"has","fr":"a (verbe avoir)","hint":"« haz » : souffle le « h », et finis par un « z »"},{"en":"does","fr":"fait","hint":"« deuz » : surtout pas « douz » ! Ça rime avec [[buzz]]"},{"en":"says","fr":"dit","hint":"« sèz » : surtout pas « séïz » ! Un « è » court, puis un « z »"}],"pairs":[["play","plays"],["watch","watches"],["eat","eats"],["go","goes"],["brush","brushes"],["get","gets"]],"practice":["Every morning, Noah gets up, eats breakfast and goes to school.","Maya brushes her teeth and finishes her homework.","He says he does his homework every day."]},"mission":{"type":"ecrit","prompt":"Pour un projet d'échange avec une école de Toronto, écris un court paragraphe sur la routine d'une personne de ta famille : quand elle se lève, ce qu'elle fait le matin et après l'école.","model":"My sister Léa gets up at seven o'clock. She always has breakfast with my dad. Then she brushes her teeth and goes to school. She usually does her homework after school.","checklist":["J'ai mis le « s » ou « es » à chaque verbe après [[he]] ou [[she]] ([[she goes]], [[she watches]])","J'ai écrit [[has]] et [[does]] (pas « haves » ni « dos »)","J'ai placé l'adverbe de fréquence AVANT le verbe ([[She always has]])","J'ai relu à voix haute : « deuz » pour [[does]], « WÂ-tchiz » pour [[watches]]"]}},{"id":"3.2","title":"Questions et négations","titleEn":"Do You Like It?","goal":"Poser des questions et dire non au présent avec do / does et les mots interrogatifs.","lesson":[{"type":"p","text":"Au présent simple, pour dire **non** ou poser une **question**, l'anglais appelle un petit assistant : **do** (ou **does** avec he / she / it)."},{"type":"table","head":["Sujet","Négation","Question"],"rows":[["I / you / we / they","[[I don't like it.]]","[[Do you like it?]]"],["he / she / it","[[She doesn't like it.]]","[[Does she like it?]]"]]},{"type":"rule","title":"Un seul -s, pas deux !","text":"Avec **does** ou **doesn't**, le -s est déjà pris par l'assistant : le verbe reste à la **forme de base**. [[She likes pizza.]] → [[She doesn't like pizza.]] → [[Does she like pizza?]]"},{"type":"rule","title":"Les mots interrogatifs","text":"[[What]] (que, quoi), [[Where]] (où), [[When]] (quand), [[Who]] (qui), [[Why]] (pourquoi), [[How]] (comment), [[Which]] (quel, lequel, parmi un choix). Ordre : mot interrogatif + do / does + sujet + verbe : [[Where do you live?]] [[What does she want?]]"},{"type":"p","text":"Réponses courtes : [[Do you speak English?]] → [[Yes, I do.]] / [[No, I don't.]] On ne répète pas le verbe ! Quand **who** est le sujet (qui fait l'action ?), pas de do : [[Who speaks French?]] Pour répondre à [[Why?]], on dit [[Because…]] (parce que)."},{"type":"examples","items":[{"en":"Do you speak French?","fr":"Parles-tu français ?"},{"en":"My dad doesn't work on Saturday.","fr":"Mon père ne travaille pas le samedi."},{"en":"Where does your aunt live?","fr":"Où habite ta tante ?"},{"en":"I don't know where she lives.","fr":"Je ne sais pas où elle habite."},{"en":"Which colour do you like?","fr":"Quelle couleur aimes-tu ?"}]},{"type":"tip","text":"Pièges classiques : [[She doesn't likes]] ou [[Does he speaks?]] = deux -s ! Un seul suffit, et c'est does qui le garde. On ne dit jamais [[Do she]] : avec she, c'est [[Does she]]. Et « savoir » comme « connaître » se disent [[know]]."},{"type":"dialogue","title":"Le nouveau voisin","lines":[{"who":"Karim","en":"Hi! Do you live here?","fr":"Salut ! Est-ce que tu habites ici ?"},{"who":"Sofia","en":"Yes, I do. I'm Sofia. Do you speak English?","fr":"Oui. Moi c'est Sofia. Parles-tu anglais ?"},{"who":"Karim","en":"Yes, and French. My mom doesn't speak English, but she understands it.","fr":"Oui, et français. Ma mère ne parle pas anglais, mais elle le comprend."},{"who":"Sofia","en":"Where does your dad work?","fr":"Où travaille ton père ?"},{"who":"Karim","en":"He works in Ottawa. Why?","fr":"Il travaille à Ottawa. Pourquoi ?"},{"who":"Sofia","en":"Because my mom works in Ottawa too!","fr":"Parce que ma mère travaille à Ottawa aussi !"}]}],"vocab":[{"en":"like","fr":"aimer (bien)","alt":[],"ex":"I like hockey."},{"en":"love","fr":"adorer (aimer beaucoup)","alt":[],"ex":"My sister loves cats."},{"en":"hate","fr":"détester","alt":[],"ex":"I hate Mondays!"},{"en":"want","fr":"vouloir","alt":[],"ex":"Maya wants a dog."},{"en":"need"
