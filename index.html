"en":"eighteen","fr":"dix-huit","hint":"« éï-TIIN » : un seul « t », net, accent à la fin"},{"en":"eighty","fr":"quatre-vingts","hint":"« ÉÏ-di » : accent au début, le « t » devient un petit « d »"}],"pairs":[["thirteen","thirty"],["fourteen","forty"],["fifteen","fifty"],["sixteen","sixty"],["eighteen","eighty"]],"practice":["This toque is fifteen dollars, not fifty.","The boots are sixty dollars, and the mittens are sixteen."]},"mission":{"type":"oral","prompt":"Tu magasines au centre commercial avec ton argent de poche. Demande à la vendeuse le prix d'une tuque, réagis au prix qu'elle te donne, puis demande le prix d'une paire de bottes que tu vois plus loin.","model":"Excuse me, how much is this toque? Fifteen dollars? That's cheap! How much are those boots, please?","checklist":["J'ai dit [[How much is]] pour une chose et [[How much are]] pour plusieurs","J'ai utilisé [[this]] pour une chose près de moi et [[those]] pour plusieurs choses loin de moi","J'ai mis l'accent au bon endroit dans le prix : « fif-TIIN » ou « FIF-ti »","J'ai dit [[dollars]] avec un « s » quand il y en a plusieurs"]}}]},{"id":5,"cefr":"B1","title":"Hier","titleEn":"Yesterday","intro":"Raconte ce qui s'est passé hier, la semaine dernière ou il y a longtemps. À la fin du niveau, tu racontes une vraie histoire en anglais, avec du suspense !","boss":{"name":"Le Fantôme du Passé","taunt":"Bouhouhou… Hier encore, tu disais « I goed » et « Did you went ? ». Prouve-moi que le passé n'a plus de secrets pour toi !","defeat":"Nooon… Je retourne dans le passé… et cette fois, pour de bon !"},"units":[{"id":"5.1","title":"Was, were et -ed","titleEn":"Back in Time","goal":"Parler du passé avec was / were, les verbes réguliers en -ed et les mots comme yesterday et ago.","lesson":[{"type":"p","text":"Bienvenue dans le passé ! Pour raconter une action **finie** (hier, la fin de semaine dernière…), l'anglais utilise le **passé simple**. Là où le français dit « j'ai joué » ou « je jouais », l'anglais dit souvent juste [[I played]]."},{"type":"table","head":["Sujet","to be au passé","Négatif","Question"],"rows":[["I","[[I was]]","[[I wasn't]]","[[Was I late?]]"],["you","[[you were]]","[[you weren't]]","[[Were you late?]]"],["he / she / it","[[she was]]","[[she wasn't]]","[[Was she late?]]"],["we / they","[[they were]]","[[they weren't]]","[[Were they late?]]"]]},{"type":"rule","title":"Les verbes réguliers : + -ed","text":"On ajoute **-ed** à la base du verbe : [[visit → visited]], [[play → played]]. C'est la **même forme pour tout le monde** : [[I played]], [[she played]], [[they played]]. Jamais de -s au passé !"},{"type":"table","head":["Cas","Ce qu'on fait","Exemples"],"rows":[["le verbe finit par -e","+ d","[[arrive → arrived]], [[decide → decided]]"],["consonne + y","y → ied","[[study → studied]], [[carry → carried]], [[try → tried]]"],["voyelle + y","+ ed (on garde le y)","[[play → played]], [[stay → stayed]]"],["court : consonne + voyelle + consonne","on double la consonne","[[stop → stopped]], [[plan → planned]], [[drop → dropped]]"],["travel (anglais canadien)","on double le l","[[travel → travelled]]"]]},{"type":"rule","title":"Les mots du passé","text":"[[yesterday]] = hier, [[the day before yesterday]] = avant-hier, [[last night]] = hier soir, [[last weekend]] = la fin de semaine dernière. Pour « il y a » + une durée, on met la durée **puis** [[ago]] : [[two days ago]] = il y a deux jours."},{"type":"examples","items":[{"en":"I was born in Gatineau.","fr":"Je suis né à Gatineau."},{"en":"We visited the museum two weeks ago.","fr":"Nous avons visité le musée il y a deux semaines."},{"en":"She studied all weekend.","fr":"Elle a étudié toute la fin de semaine."},{"en":"Were you tired last night?","fr":"Étais-tu fatigué hier soir ?"},{"en":"The bus stopped in front of my house.","fr":"L'autobus s'est arrêté devant ma maison."}]},{"type":"tip","text":"Pièges de francophone : « il y a trois jours » se dit [[three days ago]], **jamais** [[there are three days]]. « Hier soir » = [[last night]], pas [[yesterday night]]. Et « je suis né » = [[I was born]] (avec **was** : c'est du passé !)."},{"type":"dialogue","title":"Lundi matin","lines":[{"who":"Léa","en":"Hi Karim! Where were you yesterday?","fr":"Salut Karim ! Où étais-tu hier ?"},{"who":"Karim","en":"I was at my grandma's house in Gatineau.","fr":"J'étais chez ma grand-mère à Gatineau."},{"who":"Léa","en":"Was it fun?","fr":"C'était amusant ?"},{"who":"Karim","en":"Yes! We played cards and I helped her in the kitchen.","fr":"Oui ! On a joué aux cartes et je l'ai aidée dans la cuisine."},{"who":"Léa","en":"Lucky you! I stayed home and studied all day.","fr":"Chanceux ! Moi, je suis restée à la maison et j'ai étudié toute la journée."},{"who":"Karim","en":"Oh no! Was your test hard?","fr":"Oh non ! Ton examen était difficile ?"},{"who":"Léa","en":"No, it was easy. I finished it ten minutes ago!","fr":"Non, il était facile. Je l'ai fini il y a dix minutes !"}]},{"type":"fun","text":"Le sais-tu ? Le canal Rideau, à Ottawa, a ouvert en 1832. En anglais, on lit les années en deux morceaux : [[eighteen thirty-two]]."}],"vocab":[{"en":"yesterday","fr":"hier","alt":[],"ex":"I was very tired yesterday."},{"en":"last night","fr":"hier soir","alt":[],"ex":"We watched a movie last night."},{"en":"last weekend","fr":"la fin de semaine dernière","alt":[],"ex":"Where were you last weekend?"},{"en":"ago","fr":"il y a (+ une durée, dans le passé)","alt":[],"ex":"We moved here three years ago."},{"en":"the day before yesterday","fr":"avant-hier","alt":[],"ex":"It snowed the day before yesterday."},{"en":"be born","fr":"naître","alt":[],"ex":"I was born in Montreal."},{"en":"arrived","fr":"arrivé (passé de arrive)","alt":[],"ex":"The bus arrived late."},{"en":"studied","fr":"étudié (passé de study)","alt":[],"ex":"She studied for her test."},{"en":"stopped","fr":"arrêté (passé de stop)","alt":[],"ex":"The rain stopped at noon."},{"en":"planned","fr":"planifié (passé de plan)","alt":[],"ex":"We planned a picnic."},{"en":"tried","fr":"essayé (passé de try)","alt":[],"ex":"I tried to call you."},{"en":"visited","fr":"visité (passé de visit)","alt":[],"ex":"We visited our cousins."},{"en":"stayed","fr":"resté (passé de stay)","alt":[],"ex":"I stayed home all day."},{"en":"dropped","fr":"échappé, laissé tomber (passé de drop)","alt":[],"ex":"Oops! I dropped my phone."},{"en":"carried","fr":"porté dans ses bras (passé de carry)","alt":[],"ex":"Dad carried the heavy box."},{"en":"decided","fr":"décidé (passé de decide)","alt":[],"ex":"We decided to stay inside."},{"en":"travelled","fr":"voyagé (passé de travel)","alt":[],"ex":"They travelled to Vancouver."},{"en":"happened","fr":"s'est produit (passé de happen)","alt":[],"ex":"What happened at school?"},{"en":"hurried","fr":"s'est dépêché (passé de hurry)","alt":[],"ex":"We hurried to the bus stop."},{"en":"moved","fr":"déménagé (passé de move)","alt":[],"ex":"My family moved to Ottawa last year."}],"sentences":[{"en":"I was very tired last night.","fr":"J'étais très fatigué hier soir.","trap":["were","am"],"alt":["Last night I was very tired."]},{"en":"We were at the museum yesterday.","fr":"Nous étions au musée hier.","trap":["was","are"],"alt":["Yesterday we were at the museum."]},{"en":"My parents moved to Ottawa ten years ago.","fr":"Mes parents ont déménagé à Ottawa il y a dix ans.","trap":["since","there"],"alt":["Ten years ago my parents moved to Ottawa."]},{"en":"She studied for her math test.","fr":"Elle a étudié pour son examen de maths.","trap":["studyed","did"],"alt":[]},{"en":"The bus stopped in front of the school.","fr":"L'autobus s'est arrêté devant l'école.","trap":["stoped","were"],"alt":[]},{"en":"Were you at home the day before yesterday?","fr":"Étais-tu à la maison avant-hier ?","trap":["Was","Did"],"alt":[]},{"en":"I wasn't born in Canada.","fr":"Je ne suis pas né au Canada.","trap":["didn't","weren't"],"alt":[]},{"en":"We travelled to Vancouver last summer.","fr":"Nous avons voyagé à Vancouver l'été dernier.","trap":["travel","the"],"alt":["Last summer we travelled to Vancouver."]},{"en":"What happened at school yesterday?","fr":"Qu'est-ce qui s'est passé à l'école hier ?","trap":["happenned","was"],"alt":[]},{"en":"They tried to call you last weekend.","fr":"Ils ont essayé de t'appeler la fin de semaine dernière.","trap":["tryed","calls"],"alt":["Last weekend they tried to call you."]},{"en":"Why were you late this morning?","fr":"Pourquoi étais-tu en retard ce matin ?","trap":["was","did"],"alt":[]},{"en":"It was cold, so we stayed inside.","fr":"Il faisait froid, alors nous sommes restés à l'intérieur.","trap":["were","staied"],"alt":[]}],"grammar":[{"type":"mcq","q":"My friends ___ at the park yesterday.","choices":["was","are","were"],"answer":2,"explain":"Avec un sujet pluriel (my friends = they), le passé de to be est were."},{"type":"mcq","q":"Comment dit-on « il y a trois jours » ?","choices":["there are three days","three days ago","ago three days","since three days"],"answer":1,"explain":"« Il y a » + durée dans le passé = durée + ago : three days ago."},{"type":"mcq","q":"___ she at school yesterday?","choices":["Was","Did","Were"],"answer":0,"explain":"Avec she, le passé de to be est was. Pour la question, on met was devant le sujet."},{"type":"mcq","q":"It rained all day, so we ___ at home.","choices":["stay","staied","stayed","stayd"],"answer":2,"explain":"Voyelle + y : on garde le y et on ajoute -ed → stayed."},{"type":"mcq","q":"Quel est le passé de « plan » ?","choices":["planed","planted","plann","planned"],"answer":3,"explain":"Plan est court (consonne-voyelle-consonne) : on double le n → planned."},{"type":"mcq","q":"Comment dit-on « hier soir » ?","choices":["last night","yesterday night","the last night"],"answer":0,"explain":"Hier soir = last night. On ne dit pas yesterday night, et jamais the devant last."},{"type":"fill","q":"Last year, my brother ___ to Toronto.","hint":"move","answer":["moved"],"explain":"Move finit par -e : on ajoute seulement -d → moved."},{"type":"fill","q":"Yesterday, she ___ for three hours.","hint":"study","answer":["studied"],"explain":"Consonne + y : le y devient ied → studied."},{"type":"fill","q":"The rain finally ___ at six o'clock last night.","hint":"stop","answer":["stopped"],"explain":"Stop est court : on double le p → stopped."},{"type":"fill","q":"Noah and Liam ___ late for school yesterday.","hint":"be","answer":["were"],"explain":"Noah and Liam = they, donc were."},{"type":"fill","q":"I ___ at home yesterday. I was at my aunt's house.","hint":"be, négatif","answer":["wasn't"],"explain":"Avec I, le négatif de was est wasn't (was not)."},{"type":"fill","q":"We arrived in Montreal two hours ___.","hint":"il y a","answer":["ago"],"explain":"« Il y a deux heures » = two hours ago : ago vient après la durée."},{"type":"error","q":"Noah and Emma was late for school yesterday.","wrong":3,"fix":["were"],"explain":"Noah and Emma = they, donc were, pas was."},{"type":"error","q":"She studyed all weekend.","wrong":1,"fix":["studied"],"explain":"Consonne + y : study → studied."},{"type":"error","q":"The bus stoped near my house.","wrong":2,"fix":["stopped"],"explain":"On double la consonne : stop → stopped."},{"type":"error","q":"Was Emma and Noah at the park yesterday?","wrong":0,"fix":["Were"],"explain":"Emma and Noah = they, donc la question commence par Were."},{"type":"error","q":"Last summer, we plaied soccer every day.","wrong":3,"fix":["played"],"explain":"Voyelle + y : on garde le y → played."},{"type":"error","q":"Three days ago, Ethan is sick.","wrong":4,"fix":["was"],"explain":"Three days ago = passé, donc was, pas is."}],"reading":{"title":"A Snowy Saturday","text":"Last Saturday, it was very cold in Ottawa. Maya and her brother Ethan wanted to go skating on the Rideau Canal, but there was too much snow. So they stayed home.\n\nIn the morning, Maya studied for her science test. Ethan tried to bake cookies, but he dropped the eggs on the floor! Their dad laughed and helped him clean the kitchen.\n\nIn the afternoon, the snow stopped. The kids hurried outside and played in the park for two hours. They were very happy.\n\nAt six o'clock, their grandma arrived for supper. She was born in Haiti, and she loved the cookies. After supper, Ethan decided to bake again the next day.","questions":[{"q":"Pourquoi Maya et Ethan ne sont-ils pas allés patiner ?","choices":["Il faisait trop chaud.","Il y avait trop de neige.","Ils étaient malades.","Ils n'avaient pas de patins."],"answer":1},{"q":"Qu'est-ce qu'Ethan a échappé par terre ?","choices":["les biscuits","le lait","les œufs","ses patins"],"answer":2},{"q":"Quand la neige s'est-elle arrêtée ?","choices":["l'après-midi","le matin","le soir","pendant la nuit"],"answer":0},{"q":"Combien de temps ont-ils joué au parc ?","choices":["une heure","trois heures","toute la journée","deux heures"],"answer":3},{"q":"Où la grand-mère est-elle née ?","choices":["à Ottawa","en Haïti","à Montréal","en France"],"answer":1}]},"pron":{"focus":"La terminaison -ed","ipa":"/t/ – /d/ – /ɪd/","explain":"Le piège numéro un des francophones, c'est de dire « walk-ède » ou « play-ède » ! En réalité, le **-ed** ajoute rarement une syllabe. Après un son sec (« k », « p », « s », « ch », « sh », « f »), il se dit « t » : [[walked]] = « wâkt », une seule syllabe. Après les autres sons, il se dit « d » : [[played]] = « pléïd ». On ajoute une syllabe « id » **seulement** après un « t » ou un « d » : [[wanted]], [[needed]]. Tu reconnais la logique ? C'est la même que pour le « s » de [[cats]], [[dogs]] et [[horses]] !","words":[{"en":"walked","fr":"a marché (passé de walk)","hint":"« wâkt » : une seule syllabe, le « l » est muet et le -ed se dit « t »"},{"en":"watched","fr":"a regardé (passé de watch)","hint":"« wâtcht » : une seule syllabe, finis par « tcht »"},{"en":"liked","fr":"a aimé (passé de like)","hint":"« laïkt » : une seule syllabe, -ed = « t »"},{"en":"played","fr":"a joué (passé de play)","hint":"« pléïd » : une seule syllabe, -ed = « d »"},{"en":"stayed","fr":"est resté (passé de stay)","hint":"« stéïd » : une seule syllabe, -ed = « d »"},{"en":"arrived","fr":"est arrivé (passé de arrive)","hint":"« eu-RAÏVD » : deux syllabes, pas trois ! Le -ed = « d »"},{"en":"wanted","fr":"a voulu (passé de want)","hint":"« WÂN-tid » : on ajoute « id » parce que [[want]] finit par « t »"},{"en":"needed","fr":"a eu besoin (passé de need)","hint":"« NII-did » : on ajoute « id » parce que [[need]] finit par « d »"},{"en":"visited","fr":"a visité (passé de visit)","hint":"« VI-zi-tid » : accent au début, « id » à la fin"},{"en":"started","fr":"a commencé (passé de start)","hint":"« STÂR-tid » : accent au début, « id » à la fin"}],"pairs":[["play","played"],["walk","walked"],["want","wanted"],["need","needed"],["stay","stayed"],["visit","visited"]],"practice":["Yesterday, I walked to the park and played soccer.","We wanted to stay, but we needed to go home.","She visited Montreal and watched a hockey game."]},"mission":{"type":"oral","prompt":"Lundi matin, ta prof d'anglais demande à chaque élève de raconter sa fin de semaine. Raconte la tienne en quatre à six phrases, avec des verbes réguliers et [[was]] ou [[were]].","model":"Last Saturday, I visited my grandma in Gatineau. The weather was cold, so we stayed inside. We watched a movie and played cards. In the afternoon, my cousins arrived, and we cooked spaghetti together. It was a great day!","checklist":["J'ai mis tous mes verbes au passé, avec [[-ed]] pour les verbes réguliers","J'ai utilisé [[was]] avec I, he, she, it et [[were]] avec we, you, they","J'ai utilisé un mot de temps : [[last Saturday]], [[yesterday]], [[two days ago]]…","J'ai prononcé [[watched]] et [[played]] en une seule syllabe, et seulement [[wanted]] ou [[visited]] avec « id »"]}},{"id":"5.2","title":"Irréguliers (1)","titleEn":"Wild Verbs","goal":"Utiliser au passé les verbes irréguliers les plus fréquents (went, saw, ate, bought…).","lesson":[{"type":"p","text":"Mauvaise nouvelle : les verbes les plus utilisés ne prennent **pas** -ed. Ils sont **irréguliers** : [[go → went]], [[see → saw]]. Bonne nouvelle : comme au régulier, c'est la **même forme pour toutes les personnes**."},{"type":"table","head":["Base","Passé","Français"],"rows":[["go","[[went]]","allé"],["see","[[saw]]","vu"],["have","[[had]]","eu"],["do","[[did]]","fait"],["make","[[made]]","fait, fabriqué"],["take","[[took]]","pris"],["come","[[came]]","venu"],["eat","[[ate]]","mangé"],["drink","[[drank]]","bu"],["buy","[[bought]]","acheté"],["think","[[thought]]","pensé"],["get","[[got]]","reçu, obtenu"],["give","[[gave]]","donné"],["say","[[said]]","dit"],["tell","[[told]]","dit à quelqu'un, raconté"],["find","[[found]]","trouvé"],["know","[[knew]]","su, connu"],["write","[[wrote]]","écrit"]]},{"type":"rule","title":"Une seule forme, pas de -ed","text":"On n'ajoute **jamais** -ed à un verbe irrégulier : [[went]], pas [[goed]] ; [[bought]], pas [[buyed]]. Et pas de -s : [[she went]], [[he ate]]."},{"type":"examples","items":[{"en":"We went to the movies last Friday.","fr":"Nous sommes allés au cinéma vendredi dernier."},{"en":"My mom made pancakes for breakfast.","fr":"Ma mère a fait des crêpes pour le déjeuner (petit-déjeuner)."},{"en":"He told me a funny story.","fr":"Il m'a raconté une histoire drôle."},{"en":"She said hello to everyone.","fr":"Elle a dit bonjour à tout le monde."},{"en":"I thought the test was easy.","fr":"J'ai pensé que l'examen était facile."}]},{"type":"tip","text":"Say ou tell ? Avec **tell**, on dit **à qui** tout de suite : [[He told me a secret.]] Avec **say**, pas de personne juste après : [[He said hello.]] Donc **jamais** [[He said me]] !"},{"type":"tip","text":"Make ou do ? Pour fabriquer ou cuisiner, c'est **make** : [[I made a cake.]] Pour une activité ou des devoirs, c'est **do** : [[I did my homework.]] Et attention : [[thought]] (pensé) n'est pas [[taught]] (enseigné), et [[bought]] (acheté) n'est pas [[brought]] (apporté)."},{"type":"dialogue","title":"La fin de semaine de Félix","lines":[{"who":"Olivia","en":"How was your weekend, Félix?","fr":"Comment s'est passée ta fin de semaine, Félix ?"},{"who":"Félix","en":"Great! We went to Montreal and saw a hockey game.","fr":"Super ! On est allés à Montréal et on a vu un match de hockey."},{"who":"Olivia","en":"Wow! What was the best part?","fr":"Wow ! C'était quoi, le meilleur moment ?"},{"who":"Félix","en":"We ate poutine, and my dad bought me a jersey.","fr":"On a mangé de la poutine, et mon père m'a acheté un chandail."},{"who":"Olivia","en":"Lucky you! I stayed home. I wrote a story and made cookies.","fr":"Chanceux ! Moi, je suis restée à la maison. J'ai écrit une histoire et j'ai fait des biscuits."},{"who":"Félix","en":"Cookies? You told me nothing!","fr":"Des biscuits ? Tu ne m'as rien dit !"},{"who":"Olivia","en":"Don't worry, I saved two for you!","fr":"Ne t'inquiète pas, je t'en ai gardé deux !"}]},{"type":"fun","text":"Le sais-tu ? Parmi les verbes les plus fréquents en anglais, la plupart sont irréguliers : [[be]], [[have]], [[do]], [[say]], [[go]], [[get]], [[make]]… C'est justement parce qu'on les utilise tout le temps qu'ils ont gardé leurs vieilles formes !"}],"vocab":[{"en":"went","fr":"allé (passé de go)","alt":[],"ex":"We went to the park."},{"en":"saw","fr":"vu (passé de see)","alt":[],"ex":"I saw a fox in the garden."},{"en":"had","fr":"eu (passé de have)","alt":[],"ex":"We had a great time."},{"en":"did","fr":"fait (passé de do)","alt":[],"ex":"I did my homework after school."},{"en":"made","fr":"fabriqué, cuisiné (passé de make)","alt":[],"ex":"Dad made pancakes."},{"en":"took","fr":"pris (passé de take)","alt":[],"ex":"She took the bus to school."},{"en":"came","fr":"venu (passé de come)","alt":[],"ex":"My cousins came for supper."},{"en":"ate","fr":"mangé (passé de eat)","alt":[],"ex":"We ate poutine in Montreal."},{"en":"drank","fr":"bu (passé de drink)","alt":[],"ex":"He drank a glass of milk."},{"en":"bought","fr":"acheté (passé de buy)","alt":[],"ex":"Mom bought a new toque."},{"en":"thought","fr":"pensé (passé de think)","alt":[],"ex":"I thought it was a good idea."},{"en":"got","fr":"reçu, obtenu (passé de get)","alt":[],"ex":"I got a text from Emma."},{"en":"gave","fr":"donné (passé de give)","alt":[],"ex":"Grandma gave me a book."},{"en":"said","fr":"dit (passé de say)","alt":[],"ex":"She said goodbye."},{"en":"told","fr":"raconté, dit à quelqu'un (passé de tell)","alt":[],"ex":"He told me a secret."},{"en":"found","fr":"trouvé (passé de find)","alt":[],"ex":"I found my keys under the bed."},{"en":"knew","fr":"su, connu (passé de know)","alt":[],"ex":"She knew the answer."},{"en":"wrote","fr":"écrit (passé de write)","alt":[],"ex":"Malik wrote a poem."}],"sentences":[{"en":"We went to the movies last Friday.","fr":"Nous sommes allés au cinéma vendredi dernier.","trap":["goed","go"],"alt":["Last Friday we went to the movies."]},{"en":"I saw a moose near the lake.","fr":"J'ai vu un orignal près du lac.","trap":["seen","sawed"],"alt":[]},{"en":"She bought a new toque for her brother.","fr":"Elle a acheté une nouvelle tuque pour son frère.","trap":["buyed","buied"],"alt":[]},{"en":"My mom made pancakes for breakfast.","fr":"Ma mère a fait des crêpes pour le déjeuner (petit-déjeuner).","trap":["maked","did"],"alt":[]},{"en":"He told me a funny story.","fr":"Il m'a raconté une histoire drôle.","trap":["said","telled"],"alt":[]},{"en":"I thought the test was easy.","fr":"J'ai pensé que l'examen était facile.","trap":["thinked","taught"],"alt":[]},{"en":"We ate poutine and drank orange juice.","fr":"Nous avons mangé de la poutine et bu du jus d'orange.","trap":["eated","drinked"],"alt":[]},{"en":"Zoé found her phone under the bed.","fr":"Zoé a trouvé son téléphone sous le lit.","trap":["finded","founded"],"alt":[]},{"en":"Our teacher gave us a lot of homework.","fr":"Notre enseignante nous a donné beaucoup de devoirs.","trap":["gived","give"],"alt":[]},{"en":"They knew the answer, but they said nothing.","fr":"Ils connaissaient la réponse, mais ils n'ont rien dit.","trap":["knowed","told"],"alt":[]},{"en":"Malik wrote a letter to his grandpa.","fr":"Malik a écrit une lettre à son grand-père.","trap":["writed","wrotes"],"alt":[]},{"en":"I got a text from Sofia this morning.","fr":"J'ai reçu un texto de Sofia ce matin.","trap":["getted","gotted"],"alt":["This morning I got a text from Sofia."]}],"grammar":[{"type":"mcq","q":"Yesterday, Liam ___ to the dentist.","choices":["goed","gone","went","go"],"answer":2,"explain":"Go est irrégulier : son passé est went."},{"type":"mcq","q":"She ___ me the truth.","choices":["said","told","say"],"answer":1,"explain":"Quand la personne (me) suit le verbe, on utilise tell → told."},{"type":"mcq","q":"Quel est le passé de « buy » ?","choices":["bought","brought","buyed","buy"],"answer":0,"explain":"Buy → bought. Brought est le passé de bring (apporter)."},{"type":"mcq","q":"Quel est le passé de « think » ?","choices":["taught","thinked","thought"],"answer":2,"explain":"Think → thought. Taught est le passé de teach (enseigner)."},{"type":"mcq","q":"Last night, we ___ a great movie on TV.","choices":["saw","see","seen"],"answer":0,"explain":"Last night = passé : see → saw."},{"type":"mcq","q":"Who ___ this cake? It's delicious!","choices":["did","do","made","maked"],"answer":2,"explain":"Pour cuisiner ou fabriquer, on utilise make → made."},{"type":"fill","q":"Yesterday, I ___ two glasses of milk at lunch.","hint":"drink","answer":["drank"],"explain":"Drink → drank au passé."},{"type":"fill","q":"Last summer, we ___ the train to Toronto.","hint":"take","answer":["took"],"explain":"Take → took au passé."},{"type":"fill","q":"Emma ___ her homework before supper yesterday.","hint":"do","answer":["did"],"explain":"Do → did. On fait des devoirs avec do."},{"type":"fill","q":"Grandpa ___ to visit us last Sunday.","hint":"come","answer":["came"],"explain":"Come → came au passé."},{"type":"fill","q":"Two days ago, I ___ a great idea.","hint":"have","answer":["had"],"explain":"Have → had au passé, pour toutes les personnes."},{"type":"fill","q":"Last week, Mei ___ a poem for her mom.","hint":"write","answer":["wrote"],"explain":"Write → wrote au passé."},{"type":"error","q":"We eated pizza last night.","wrong":1,"fix":["ate"],"explain":"Eat est irrégulier : le passé est ate."},{"type":"error","q":"She said me a secret.","wrong":1,"fix":["told"],"explain":"Avec une personne juste après le verbe, c'est tell : She told me a secret."},{"type":"error","q":"I buyed a new bike last spring.","wrong":1,"fix":["bought"],"explain":"Buy → bought, jamais buyed."},{"type":"error","q":"Last weekend, they goed to Montreal.","wrong":3,"fix":["went"],"explain":"Go → went, jamais goed."},{"type":"error","q":"Ana knowed the answer.","wrong":1,"fix":["knew"],"explain":"Know → knew au passé."},{"type":"error","q":"My dad gived me ten dollars yesterday.","wrong":2,"fix":["gave"],"explain":"Give → gave au passé."}],"reading":{"title":"Noah's Big Day","text":"Last Saturday was Noah's birthday. In the morning, his mom made pancakes with maple syrup, and his dad gave him a big box. Inside, Noah found a new hockey stick!\n\nIn the afternoon, Noah and his friends took the bus to the Rideau Canal. They went skating for an hour. After that, they drank hot chocolate and ate cookies.\n\nWhen they came home, Noah saw a card on the table. His grandma wrote it in Vancouver. In the card, she said: \"Happy birthday! I bought you a big surprise.\" Noah thought it was another present. But the surprise was his grandma! She came from Vancouver by plane, and she was in the kitchen with his mom.","questions":[{"q":"Qu'est-ce que Noah a trouvé dans la boîte que son père lui a donnée ?","choices":["un bâton de hockey neuf","des patins","une carte","un livre"],"answer":0},{"q":"Comment Noah et ses amis sont-ils allés au canal ?","choices":["à pied","en voiture","en autobus","à vélo"],"answer":2},{"q":"Qu'ont-ils bu après le patin ?","choices":["du jus","du chocolat chaud","du lait","de l'eau"],"answer":1},{"q":"Qui a écrit la carte ?","choices":["sa mère","son ami","son père","sa grand-mère"],"answer":3},{"q":"Quelle était la vraie surprise ?","choices":["un deuxième cadeau","un gâteau","sa grand-mère était là","un voyage à Vancouver"],"answer":2}]},"pron":{"focus":"Les passés irréguliers qui piègent l'oreille","ipa":"/ɑ/ – /ɛ/ – /eɪ/","explain":"Les verbes irréguliers ne s'écrivent pas comme ils se prononcent, alors ton oreille doit apprendre leur vraie musique. La famille **-ought / -aught** est super simple : le « gh » est muet, et [[bought]], [[brought]], [[thought]] et [[caught]] riment tous avec « hâte » (« bât », « brât », « thât », « kât »). Ne dis surtout pas « bôte » : on entendrait [[boat]] (bateau) ! Autres pièges : [[said]] se dit « sèd » (jamais « séïd »), [[read]] au passé se dit exactement comme [[red]] (rouge), et dans [[knew]], le « k » est muet. Truc : ces mots reviennent tout le temps dans les histoires, alors répète-les comme une petite chanson.","words":[{"en":"said","fr":"a dit (passé de say)","hint":"« sèd » : un « è » court, jamais « séïd »"},{"en":"read","fr":"a lu (passé de read)","hint":"« rèd » : au passé, il se dit exactement comme [[red]] (rouge)"},{"en":"ate","fr":"a mangé (passé de eat)","hint":"« éït » : comme [[eight]] (huit), le « é » glisse vers « i »"},{"en":"saw","fr":"a vu (passé de see)","hint":"« sâ » : un « â » ouvert et c'est tout, le « w » ne s'entend pas"},{"en":"made","fr":"a fait, a fabriqué (passé de make)","hint":"« méïd » : « éï » qui glisse, pas « mad »"},{"en":"bought","fr":"a acheté (passé de buy)","hint":"« bât » : « gh » muet, rime avec [[thought]] ; pas « bôte » !"},{"en":"brought","fr":"a apporté (passé de bring)","hint":"« brât » : « gh » muet, rime avec [[bought]]"},{"en":"thought","fr":"a pensé (passé de think)","hint":"« thât » : « th » soufflé, « gh » muet"},{"en":"caught","fr":"a attrapé (passé de catch)","hint":"« kât » : « gh » muet, rime avec [[bought]]"},{"en":"knew","fr":"savait, connaissait (passé de know)","hint":"« niou » : le « k » est muet, comme dans [[know]]"}],"pairs":[["bought","boat"],["caught","coat"],["said","sad"],["saw","so"],["ate","at"],["made","mad"]],"practice":["I thought you bought a boat!","Yesterday, I read a book, ate a sandwich and saw a movie.","He said he caught the ball, but I knew it wasn't true."]},"mission":{"type":"ecrit","prompt":"Hier, ta classe est allée en sortie dans un musée d'Ottawa. Écris quelques lignes dans ton journal de bord en anglais pour raconter ce que tu as vu, ce que tu as mangé et ce que tu as acheté.","model":"Yesterday, my class went to a museum in Ottawa. We saw a huge dinosaur and took a lot of photos. At lunch, I ate a sandwich in the park. Then I bought a little moose toy at the gift shop. I told my mom everything when I got home!","checklist":["J'ai utilisé au moins quatre verbes irréguliers au passé ([[went]], [[saw]], [[ate]], [[bought]]…)","Je n'ai pas ajouté -ed à un verbe irrégulier (jamais « goed », « buyed » ou « eated »)","J'ai relié mes phrases avec [[then]] ou [[at lunch]]","J'ai relu à voix haute : « bât » pour [[bought]], « éït » pour [[ate]], « sèd » pour [[said]]"]}},{"id":"5.3","title":"Did you… ?","titleEn":"Did You Do It?","goal":"Poser des questions et dire non au passé avec did / didn't + verbe de base.","lesson":[{"type":"p","text":"Pour poser une question ou dire non au passé, l'anglais appelle un assistant : **did**. Et comme **did** porte déjà le passé, le verbe qui suit revient à sa **forme de base**."},{"type":"table","head":["Affirmatif","Négatif","Question","Réponse courte"],"rows":[["[[I saw it.]]","[[I didn't see it.]]","[[Did you see it?]]","[[Yes, I did.]] / [[No, I didn't.]]"],["[[She won.]]","[[She didn't win.]]","[[Did she win?]]","[[Yes, she did.]] / [[No, she didn't.]]"],["[[They left.]]","[[They didn't leave.]]","[[Did they leave?]]","[[Yes, they did.]] / [[No, they didn't.]]"]]},{"type":"rule","title":"Un seul passé par phrase","text":"**did / didn't + verbe de base**. Le passé est déjà dans did, alors pas de deuxième passé : [[Did you go?]] (pas [[Did you went?]]), [[I didn't see]] (pas [[I didn't saw]])."},{"type":"table","head":["Base","Passé","Français"],"rows":[["begin","[[began]]","commencé"],["break","[[broke]]","cassé"],["bring","[[brought]]","apporté"],["catch","[[caught]]","attrapé"],["choose","[[chose]]","choisi"],["fall","[[fell]]","tombé"],["feel","[[felt]]","ressenti"],["fly","[[flew]]","volé, pris l'avion"],["forget","[[forgot]]","oublié"],["leave","[[left]]","parti, quitté"],["lose","[[lost]]","perdu"],["meet","[[met]]","rencontré"],["pay","[[paid]]","payé"],["run","[[ran]]","couru"],["sleep","[[slept]]","dormi"],["speak","[[spoke]]","parlé"],["win","[[won]]","gagné"],["wear","[[wore]]","porté (un vêtement)"]]},{"type":"examples","items":[{"en":"Did you sleep well?","fr":"As-tu bien dormi ?"},{"en":"I didn't bring my lunch.","fr":"Je n'ai pas apporté mon dîner."},{"en":"Where did you meet Sofia?","fr":"Où as-tu rencontré Sofia ?"},{"en":"Why didn't she win?","fr":"Pourquoi n'a-t-elle pas gagné ?"},{"en":"Were you scared? No, I wasn't.","fr":"Avais-tu peur ? Non."}]},{"type":"tip","text":"Les deux pièges du niveau : [[Did you went?]] et [[I didn't saw]] : **faux** ! Après did, toujours la base. Autre piège : avec **to be**, pas de did ! On dit [[Were you tired?]] et [[I wasn't tired]], jamais [[Did you be tired?]]."},{"type":"dialogue","title":"Le party manqué","lines":[{"who":"Emma","en":"Did you go to the party on Saturday?","fr":"Es-tu allé au party samedi ?"},{"who":"Samuel","en":"No, I didn't. I felt sick.","fr":"Non. Je me sentais malade."},{"who":"Emma","en":"Oh no! Did you sleep a lot?","fr":"Oh non ! As-tu beaucoup dormi ?"},{"who":"Samuel","en":"Yes, I slept all afternoon. What did I miss?","fr":"Oui, j'ai dormi tout l'après-midi. Qu'est-ce que j'ai manqué ?"},{"who":"Emma","en":"Malik won the ockey hier soir ?","trap":["saw","Were"],"alt":[]},{"en":"I didn't sleep well last night.","fr":"Je n'ai pas bien dormi hier soir.","trap":["slept","don't"],"alt":["Last night I didn't sleep well."]},{"en":"She didn't win the race, but she ran fast.","fr":"Elle n'a pas gagné la course, mais elle a couru vite.","trap":["won","runned"],"alt":["She ran fast, but she didn't win the race."]},{"en":"Where did you meet your best friend?","fr":"Où as-tu rencontré ton meilleur ami ?","trap":["met","were"],"alt":[]},{"en":"We forgot our lunch at home.","fr":"Nous avons oublié notre dîner à la maison.","trap":["forgetted","did"],"alt":[]},{"en":"Did Félix bring his skates?","fr":"Félix a-t-il apporté ses patins ?","trap":["brought","Was"],"alt":[]},{"en":"My little brother fell and broke his arm.","fr":"Mon petit frère est tombé et s'est cassé le bras.","trap":["falled","breaked"],"alt":[]},{"en":"Why didn't you pay for the tickets?","fr":"Pourquoi n'as-tu pas payé les billets ?","trap":["paid","payed"],"alt":[]},{"en":"The movie began at seven o'clock.","fr":"Le film a commencé à sept heures.","trap":["begun","beginned"],"alt":["At seven o'clock the movie began."]},{"en":"They flew to Vancouver last summer.","fr":"Ils ont pris l'avion pour Vancouver l'été dernier.","trap":["flied","flown"],"alt":["Last summer they flew to Vancouver."]},{"en":"I didn't catch the bus, so I was late.","fr":"Je n'ai pas attrapé l'autobus, alors j'étais en retard.","trap":["caught","catched"],"alt":[]},{"en":"What did she wear to the party?","fr":"Qu'est-ce qu'elle a porté au party ?","trap":["wore","was"],"alt":[]}],"grammar":[{"type":"mcq","q":"Did you ___ my message?","choices":["got","get","gets","getting"],"answer":1,"explain":"Après did, le verbe reste à la base : Did you get…?"},{"type":"mcq","q":"Comment dit-on « Je n'ai pas fait mes devoirs » ?","choices":["I didn't did my homework.","I don't did my homework.","I didn't do my homework.","I not did my homework."],"answer":2,"explain":"Négatif au passé : didn't + base → I didn't do."},{"type":"mcq","q":"Where ___ you go last weekend?","choices":["did","were","do","went"],"answer":0,"explain":"Question au passé avec un verbe d'action : Where did you go?"},{"type":"mcq","q":"Did they ___ the bus this morning?","choices":["caught","catched","catch"],"answer":2,"explain":"Après did : la base catch, pas le passé caught."},{"type":"mcq","q":"Lucas ___ the game. He was so happy!","choices":["win","won","winned"],"answer":1,"explain":"Phrase affirmative au passé : win → won."},{"type":"mcq","q":"___ you tired after the game?","choices":["Did","Were","Was"],"answer":1,"explain":"Avec to be (tired), pas de did : Were you tired?"},{"type":"fill","q":"We ___ the movie. It was so boring!","hint":"like, négatif","answer":["didn't like"],"explain":"Négatif au passé : didn't + base → didn't like."},{"type":"fill","q":"___ you sleep well last night?","hint":"auxiliaire du passé","answer":["Did"],"explain":"Pour une question au passé : Did + sujet + base."},{"type":"fill","q":"Mei didn't ___ her lunch yesterday.","hint":"apporter","answer":["bring"],"explain":"Après didn't, le verbe reste à la base : bring."},{"type":"fill","q":"Last week, Amir ___ his glasses at school.","hint":"lose","answer":["lost"],"explain":"Phrase affirmative au passé : lose → lost."},{"type":"fill","q":"An hour ago, the plane ___ over our house.","hint":"fly","answer":["flew"],"explain":"Fly → flew au passé."},{"type":"fill","q":"I ___ Priya for the first time last Monday.","hint":"meet","answer":["met"],"explain":"Meet → met au passé."},{"type":"error","q":"Did you went to the party last night?","wrong":2,"fix":["go"],"explain":"Après did, la base : Did you go?"},{"type":"error","q":"I did not saw the bus this morning.","wrong":3,"fix":["see"],"explain":"Après did not, la base : I did not see."},{"type":"error","q":"She did not won the race.","wrong":3,"fix":["win"],"explain":"Après did not, la base : win."},{"type":"error","q":"Did he paid for the pizza last night?","wrong":2,"fix":["pay"],"explain":"Après did, la base : pay."},{"type":"error","q":"Where did she bought her shoes last week?","wrong":3,"fix":["buy"],"explain":"Après did, la base : buy."},{"type":"error","q":"Yesterday I falled on the ice.","wrong":2,"fix":["fell"],"explain":"Fall est irrégulier : fell."}],"reading":{"title":"The Lost Skates","text":"Last Friday, Chloé's class went skating on the Rideau Canal. When they arrived, Chloé opened her bag, but her skates weren't there! She felt terrible.\n\n\"Did you forget them at home?\" asked her friend Malik.\n\n\"No, I didn't. I had them on the bus this morning,\" said Chloé.\n\n\"Maybe you left them on the bus,\" said Malik. Chloé ran to the bus stop, but the bus wasn't there. It left five minutes ago.\n\nChloé sat on the snow. She didn't want to cry, but she was very sad. Ten minutes later, the bus came back! The driver found the skates under a seat and brought them to Chloé. She thanked him and skated all afternoon. She didn't fall once!","questions":[{"q":"Où la classe est-elle allée vendredi dernier ?","choices":["au musée","au canal Rideau","au cinéma","au parc"],"answer":1},{"q":"Est-ce que Chloé avait oublié ses patins à la maison ?","choices":["Oui, elle les avait oubliés.","On ne sait pas.","Oui, sa mère les avait.","Non, elle les avait dans l'autobus."],"answer":3},{"q":"Qui a trouvé les patins ?","choices":["le chauffeur d'autobus","Malik","l'enseignante","Chloé"],"answer":0},{"q":"Où étaient les patins ?","choices":["dans son sac","sous un siège","à la maison","sur la glace"],"answer":1},{"q":"Comment s'est passé le patin pour Chloé ?","choices":["Elle est tombée souvent.","Elle n'a pas patiné.","Elle n'est pas tombée une seule fois.","Elle est tombée une fois."],"answer":2}]},"pron":{"focus":"Quand les mots se collent : did you…?","ipa":"","explain":"Quand les anglophones parlent vite, les petits mots se collent et changent de son ! Le « d » de [[did]] et le « y » de [[you]] fusionnent en « dj » : [[did you]] devient « di-djeu ». [[What did you]] devient même « WEU-djeu », et dans [[did he]], le « h » disparaît presque : « di-di ». Tu n'es pas obligé de parler comme ça, mais ton oreille doit le reconnaître, sinon tu vas croire que c'est un mot inconnu. Rappelle-toi : à l'écrit, on garde toujours les mots complets ([[What did you do?]]), et après [[did]], le verbe reste à la forme de base !","words":[{"en":"did you","fr":"est-ce que tu… ? (passé)","hint":"« di-djeu » : le « d » et le « y » se collent en « dj »"},{"en":"did he","fr":"est-ce qu'il… ? (passé)","hint":"« di-di » : le « h » de [[he]] disparaît presque"},{"en":"didn't","fr":"n'a pas, ne… pas (passé)","hint":"« DI-deunt » : accent au début, le « t » final est très léger"},{"en":"didn't you","fr":"n'as-tu pas… ?","hint":"« DI-deun-tcheu » : le « t » et le « y » se collent en « tch »"},{"en":"what did you","fr":"qu'est-ce que tu as… ?","hint":"« WEU-djeu » : trois mots, mais ça sonne comme deux syllabes !"},{"en":"where did you","fr":"où est-ce que tu as… ?","hint":"« WÈR-djeu » : « r » anglais, puis « djeu »"},{"en":"what did you do","fr":"qu'est-ce que tu as fait ?","hint":"« WEU-djeu-DOU ↘ » : la force va sur [[do]], la voix descend"},{"en":"did you like it","fr":"est-ce que tu as aimé ça ?","hint":"« di-djeu-LAÏ-kitt ↗ » : le « k » de [[like]] se colle à [[it]], la voix monte"}],"pairs":[],"practice":["What did you do yesterday?","Did you like the movie?","Where did he go after school?"]},"mission":{"type":"oral","prompt":"Ton ami Karim revient d'une fin de semaine au chalet de son oncle. Pose-lui au moins quatre questions au passé pour savoir ce qu'il a fait.","model":"Hi, Karim! What did you do last weekend? Did you go to your uncle's cottage? Did you swim in the lake? Did you catch any fish? Who did you meet there?","checklist":["J'ai posé mes questions avec [[did]] + verbe de base (jamais « Did you went? »)","J'ai utilisé au moins une question en « wh » ([[What did you…?]], [[Where did you…?]])","J'ai collé [[did you]] en « di-djeu » quand je parlais vite","Ma voix est montée à la fin des questions oui/non et descendue à la fin des questions en « wh »"]}},{"id":"5.4","title":"Raconter une histoire","titleEn":"Story Time","goal":"Raconter une histoire au passé avec le passé continu, when, while et les mots de liaison.","lesson":[{"type":"p","text":"Pour bien raconter, il faut deux temps : le **passé continu** pour le **décor** (ce qui était en train de se passer) et le **passé simple** pour les **actions** (ce qui arrive tout à coup)."},{"type":"table","head":["Sujet","Passé continu","Négatif","Question"],"rows":[["I / he / she / it","[[was reading]]","[[wasn't reading]]","[[Was she reading?]]"],["you / we / they","[[were reading]]","[[weren't reading]]","[[Were they reading?]]"]]},{"type":"rule","title":"When ou while ?","text":"**was / were + verbe en -ing**. L'action longue est au passé continu, l'action courte au passé simple. **while** (pendant que) + action longue : [[While I was cooking, the cat jumped on the table.]] **when** (quand) + action courte : [[I was reading when the lights went out.]]"},{"type":"rule","title":"Pas de -ing avec les verbes d'état","text":"Les verbes qui décrivent un état (**know, like, love, want, need, understand**) ne se mettent pas au passé continu : [[I knew the answer.]], jamais [[I was knowing]]."},{"type":"table","head":["Mot de liaison","Français","Exemple"],"rows":[["[[first]]","d'abord","[[First, we made a fire.]]"],["[[then]]","ensuite, puis","[[Then, we ate.]]"],["[[after that]]","après ça","[[After that, we played cards.]]"],["[[suddenly]]","tout à coup","[[Suddenly, someone knocked at the door.]]"],["[[at that moment]]","à ce moment-là","[[At that moment, the dog barked.]]"],["[[later]]","plus tard","[[Later, we went to bed.]]"],["[[finally]]","finalement","[[Finally, the power came back.]]"]]},{"type":"examples","items":[{"en":"What were you doing at eight o'clock?","fr":"Que faisais-tu à huit heures ?"},{"en":"It was snowing when we left school.","fr":"Il neigeait quand on est sortis de l'école."},{"en":"While Dad was cooking, we were watching TV.","fr":"Pendant que papa cuisinait, nous regardions la télé."},{"en":"Suddenly, the lights went out!","fr":"Tout à coup, les lumières se sont éteintes !"}]},{"type":"tip","text":"L'imparfait français n'est pas toujours un passé continu ! « Quand j'étais petit, j'aimais les dinosaures » = [[When I was little, I liked dinosaurs.]] (verbe d'état). Et n'oublie jamais le **-ing** : [[I was watching]], pas [[I was watch]]."},{"type":"dialogue","title":"La panne","lines":[{"who":"Liam","en":"What were you doing last night? I called you twice.","fr":"Qu'est-ce que tu faisais hier soir ? Je t'ai appelée deux fois."},{"who":"Chloé","en":"Sorry! I was watching a movie with my family.","fr":"Désolée ! Je regardais un film avec ma famille."},{"who":"Liam","en":"Was it good?","fr":"C'était bon ?"},{"who":"Chloé","en":"Yes, but while we were watching it, the power went out!","fr":"Oui, mais pendant qu'on le regardait, il y a eu une panne de courant !"},{"who":"Liam","en":"Really? What did you do?","fr":"Vraiment ? Qu'est-ce que vous avez fait ?"},{"who":"Chloé","en":"First, my dad found a flashlight. Then we played cards.","fr":"D'abord, mon père a trouvé une lampe de poche. Ensuite, on a joué aux cartes."},{"who":"Liam","en":"And the end of the movie?","fr":"Et la fin du film ?"},{"who":"Chloé","en":"Finally, we watched it this morning!","fr":"Finalement, on l'a regardée ce matin !"}]},{"type":"fun","text":"Le sais-tu ? Les contes en anglais commencent souvent par [[Once upon a time]] (il était une fois) et finissent par [[They lived happily ever after]] (ils vécurent heureux pour toujours)."}],"vocab":[{"en":"first","fr":"d'abord","alt":[],"ex":"First, we made a plan."},{"en":"then","fr":"ensuite, puis","alt":[],"ex":"Then, we went home."},{"en":"after that","fr":"après ça","alt":[],"ex":"After that, we played cards."},{"en":"finally","fr":"finalement, enfin","alt":[],"ex":"Finally, the bus arrived."},{"en":"suddenly","fr":"tout à coup, soudain","alt":["all of a sudden"],"ex":"Suddenly, the lights went out."},{"en":"while","fr":"pendant que","alt":[],"ex":"While I was sleeping, it snowed."},{"en":"at that moment","fr":"à ce moment-là","alt":[],"ex":"At that moment, the dog started to bark."},{"en":"later","fr":"plus tard","alt":[],"ex":"Later, we went to bed."},{"en":"storm","fr":"tempête, orage","alt":[],"ex":"There was a big storm last night."},{"en":"power outage","fr":"panne de courant","alt":["blackout","power failure"],"ex":"We had a power outage during the storm."},{"en":"flashlight","fr":"lampe de poche","alt":["torch"],"ex":"Dad found a flashlight in the kitchen."},{"en":"noise","fr":"bruit","alt":[],"ex":"What was that noise?"},{"en":"knock","fr":"frapper (à la porte)","alt":[],"ex":"Someone was knocking at the door."},{"en":"shout","fr":"crier","alt":["yell"],"ex":"My sister shouted when she saw the spider."},{"en":"laugh","fr":"rire","alt":[],"ex":"Everyone was laughing at his joke."},{"en":"neighbour","fr":"voisin, voisine","alt":[],"ex":"Our neighbour has a big dog."},{"en":"dark","fr":"sombre, noir (sans lumière)","alt":[],"ex":"The house was completely dark."},{"en":"shine","fr":"briller","alt":[],"ex":"The sun was shining."},{"en":"fall asleep","fr":"s'endormir","alt":[],"ex":"I fell asleep on the couch."}],"sentences":[{"en":"I was reading when the lights went out.","fr":"Je lisais quand les lumières se sont éteintes.","trap":["were","readed"],"alt":["When the lights went out I was reading."]},{"en":"While my dad was cooking, we were watching TV.","fr":"Pendant que mon père cuisinait, nous regardions la télé.","trap":["are","watch"],"alt":["We were watching TV while my dad was cooking."]},{"en":"Suddenly, someone knocked at the door.","fr":"Tout à coup, quelqu'un a frappé à la porte.","trap":["knocking","knock"],"alt":["Someone suddenly knocked at the door.","Someone knocked at the door suddenly."]},{"en":"What were you doing at eight o'clock last night?","fr":"Que faisais-tu à huit heures hier soir ?","trap":["did","was"],"alt":[]},{"en":"The sun was shining, so we went to the beach.","fr":"Le soleil brillait, alors nous sommes allés à la plage.","trap":["were","shine"],"alt":[]},{"en":"First we made a fire, and then we cooked hot dogs.","fr":"D'abord nous avons fait un feu, puis nous avons fait cuire des hot-dogs.","trap":["maked","cook"],"alt":[]},{"en":"She was walking home when it started to rain.","fr":"Elle rentrait à pied quand il a commencé à pleuvoir.","trap":["were","walk"],"alt":["When it started to rain she was walking home."]},{"en":"I wasn't sleeping when you called me.","fr":"Je ne dormais pas quand tu m'as appelé.","trap":["didn't","slept"],"alt":["When you called me I wasn't sleeping."]},{"en":"After that, we played cards with our neighbours.","fr":"Après ça, nous avons joué aux cartes avec nos voisins.","trap":["were","plays"],"alt":["We played cards with our neighbours after that."]},{"en":"Finally, the power came back.","fr":"Finalement, le courant est revenu.","trap":["come","was"],"alt":["The power finally came back."]},{"en":"Were they laughing when the teacher arrived?","fr":"Est-ce qu'ils riaient quand l'enseignant est arrivé ?","trap":["Did","laughed"],"alt":[]},{"en":"Ethan fell asleep while he was watching a movie.","fr":"Ethan s'est endormi pendant qu'il regardait un film.","trap":["falled","watched"],"alt":["While he was watching a movie, Ethan fell asleep."]}],"grammar":[{"type":"mcq","q":"At seven o'clock last night, I ___ my homework.","choices":["were doing","am doing","was doing","doing"],"answer":2,"explain":"Action en cours à un moment précis du passé : I was doing."},{"type":"mcq","q":"I was taking a shower ___ my friend called.","choices":["while","when","during"],"answer":1,"explain":"L'action courte qui interrompt (called) est introduite par when."},{"type":"mcq","q":"___ I was cooking, the cat jumped on the table.","choices":["During","Then","While","After that"],"answer":2,"explain":"While (pendant que) + action longue au passé continu. During est suivi d'un nom, pas d'une phrase."},{"type":"mcq","q":"They ___ soccer when it started to rain.","choices":["was playing","were playing","are playing"],"answer":1,"explain":"They + were + -ing : they were playing."},{"type":"mcq","q":"Quel mot annonce la FIN d'une histoire ?","choices":["first","then","after that","finally"],"answer":3,"explain":"Finally = finalement : on l'utilise pour la dernière étape."},{"type":"mcq","q":"Quelle phrase est correcte ?","choices":["I knew the answer.","I was knowing the answer.","I was know the answer."],"answer":0,"explain":"Know est un verbe d'état : pas de passé continu. On dit I knew."},{"type":"mcq","q":"What ___ you doing when I called?","choices":["was","did","were"],"answer":2,"explain":"You + were + -ing : What were you doing?"},{"type":"fill","q":"While Ana ___ in her room, her brother was playing video games.","hint":"study, passé continu","answer":["was studying"],"explain":"Ana = she : was + studying."},{"type":"fill","q":"The children ___ in the park when the storm started.","hint":"play, passé continu","answer":["were playing"],"explain":"The children = they : were + playing."},{"type":"fill","q":"I ___ when you called me. I was in the shower!","hint":"sleep, passé continu, négatif","answer":["wasn't sleeping"],"explain":"Négatif du passé continu avec I : wasn't + sleeping."},{"type":"fill","q":"We were walking home ___ we saw a fox.","hint":"quand","answer":["when"],"explain":"When + action courte au passé simple (we saw)."},{"type":"fill","q":"We watched a movie. ___, we went for ice cream.","hint":"après ça","answer":["After that"],"explain":"« Après ça » = after that."},{"type":"fill","q":"The lights went out. ___, someone knocked at the door!","hint":"tout à coup","answer":["Suddenly","All of a sudden"],"explain":"« Tout à coup » = suddenly : parfait pour le suspense !"},{"type":"error","q":"Emma and Zoé was playing hockey at noon.","wrong":3,"fix":["were"],"explain":"Emma and Zoé = they, donc were playing."},{"type":"error","q":"While I was cook, my dog ate my sandwich.","wrong":3,"fix":["cooking"],"explain":"Passé continu = was + verbe en -ing : was cooking."},{"type":"error","q":"While we were walk home, it started to snow.","wrong":3,"fix":["walking"],"explain":"Passé continu = were + verbe en -ing : were walking."},{"type":"error","q":"Finally, the storm stoped and we went outside.","wrong":3,"fix":["stopped"],"explain":"Stop est court : on double le p → stopped."}],"reading":{"title":"The Night of the Storm","text":"Last winter, there was a big storm in Ottawa. At eight o'clock, Amir was doing his homework and his little sister Sofia was watching TV. Their mom was cooking pasta in the kitchen.\n\nSuddenly, the lights went out! The house was completely dark. Sofia shouted, and Amir laughed. First, their mom found a flashlight. Then, she brought some candles to the living room.\n\nWhile they were sitting near the candles, someone knocked at the door. It was Olivia, their neighbour. She didn't have a flashlight, so Amir gave her one.\n\nAfter that, they all played cards and told funny stories. Finally, the power came back at midnight, but Sofia was already sleeping on the couch.","questions":[{"q":"Que faisait Amir quand les lumières se sont éteintes ?","choices":["Il regardait la télé.","Il faisait ses devoirs.","Il cuisinait.","Il dormait."],"answer":1},{"q":"Qu'est-ce que la mère a trouvé en premier ?","choices":["des bougies","des cartes","une lampe de poche","des pâtes"],"answer":2},{"q":"Qui a frappé à la porte ?","choices":["Olivia, la voisine","le père","un ami d'Amir","Sofia"],"answer":0},{"q":"Pourquoi Olivia est-elle venue, probablement ?","choices":["Elle voulait jouer aux cartes.","Elle avait faim.","Elle avait peur de l'orage.","Elle n'avait pas de lampe de poche."],"answer":3},{"q":"Que faisait Sofia quand le courant est revenu ?","choices":["Elle regardait la télé.","Elle jouait aux cartes.","Elle dormait.","Elle criait."],"answer":2}]},"pron":{"focus":"Le schwa, le son le plus paresseux","ipa":"/ə/","explain":"Le son le plus fréquent de l'anglais n'a même pas de lettre à lui : c'est le **schwa**, un petit « eu » tout mou, comme si tu étais très fatigué. Il remplace presque toutes les voyelles des syllabes **sans accent** : [[banana]] se dit « beu-NA-neu », pas « ba-na-na » ! Le piège des francophones, c'est de prononcer chaque voyelle clairement, comme en français. En anglais, seule la syllabe forte est bien claire ; les autres se ratatinent. Truc : dis [[Canada]] en anglais (« KA-neu-deu ») : une syllabe forte, deux syllabes paresseuses, et voilà !","words":[{"en":"about","fr":"à propos de ; environ","hint":"« eu-BAOUT » : le « a » du début devient un petit « eu »"},{"en":"banana","fr":"banane","hint":"« beu-NA-neu » : seul le milieu est fort, le début et la fin font « eu »"},{"en":"Canada","fr":"Canada","hint":"« KA-neu-deu » : accent au début, puis deux « eu » paresseux"},{"en":"seven","fr":"sept","hint":"« SÈ-veun » : la 2e syllabe est toute molle"},{"en":"problem","fr":"problème","hint":"« PRÂ-bleum » : accent au début, « bleum » tout mou"},{"en":"together","fr":"ensemble","hint":"« teu-GUÈ-theur » : le début et la fin font « eu »"},{"en":"suddenly","fr":"soudain, tout à coup","hint":"« SEU-deun-li » : accent au début, le milieu est tout petit"},{"en":"finally","fr":"finalement, enfin","hint":"« FAÏ-neu-li » : accent au début, le « a » devient « eu »"},{"en":"the","fr":"le, la, les","hint":"« theu » : tout petit et rapide devant une consonne"},{"en":"a","fr":"un, une","hint":"« eu » : jamais « é » ni « a » au milieu d'une phrase : [[a banana]] = « eu-beu-NA-neu »"}],"pairs":[],"practice":["Suddenly, a banana fell on the table.","Finally, we arrived in Canada at about seven."]},"mission":{"type":"ecrit","prompt":"Ta classe prépare un recueil d'histoires vraies (ou presque !). Écris une courte histoire sur une aventure d'hiver : dis ce qui se passait au début, puis ce qui est arrivé tout à coup, et comment ça s'est terminé.","model":"Last winter, I was skating on the Rideau Canal with my friend Sofia. The sun was shining, and we were laughing. Suddenly, Sofia fell on the ice! First, I helped her get up. Then we drank hot chocolate together. Finally, we went home, tired but happy.","checklist":["J'ai utilisé [[was]] / [[were]] + verbe en -ing pour décrire la scène ([[we were laughing]])","J'ai utilisé le passé simple pour l'action soudaine ([[Sofia fell]])","J'ai organisé mon histoire avec [[first]], [[then]], [[suddenly]] et [[finally]]","J'ai relu à voix haute avec des schwas bien paresseux : « SEU-deun-li », « FAÏ-neu-li »"]}}]},{"id":6,"cefr":"B1","title":"Expériences et avenir","titleEn":"Experiences & Future","intro":"Parle de tes projets, compare tout ce qui t'entoure et raconte tes expériences. Tu vas enfin dompter le fameux present perfect !","boss":{"name":"Professeur Perfect","taunt":"Have you ever beaten me? Never! J'enseigne le present perfect depuis des siècles, et personne n'a jamais réussi mon examen…","defeat":"Impossible… tu es plus fort que moi. Tu es… presque parfait !"},"units":[{"id":"6.1","title":"Le futur","titleEn":"Tomorrow Lane","goal":"Parler de l'avenir avec will, be going to et le présent continu, et parler de la météo.","lesson":[{"type":"p","text":"En anglais, il n'y a pas un seul futur, mais **trois façons** principales d'en parler. Le choix dépend de **quand** tu as pris ta décision et de **ce que tu sais**."},{"type":"table","head":["Forme","Quand l'utiliser","Exemple"],"rows":[["will + base","décision prise sur le coup, promesse, prédiction (je pense que…)","[[I'll help you!]] [[I think it will rain.]]"],["be going to + base","projet déjà décidé, ou prédiction avec une preuve qu'on voit","[[I'm going to study tonight.]] [[Look! It's going to rain.]]"],["présent continu","rendez-vous ou plan fixé (heure, billet, date)","[[I'm meeting Emma at four.]] [[We're flying to Toronto on Friday.]]"]]},{"type":"rule","title":"Will : la forme","text":"**will + verbe de base**, sans **to** et sans **-s** : [[she will go]], [[they will win]]. Contraction : [[I'll]], [[she'll]]. Négatif : [[won't]] (= will not) : [[I won't forget.]]"},{"type":"rule","title":"When + présent","text":"Après **when** (quand), on parle du futur… avec le **présent** ! [[When I'm older, I'll be a pilot.]] [[I'll call you when I get home.]]"},{"type":"table","head":["Météo","Français","Exemple"],"rows":[["[[sunny]]","ensoleillé","[[It will be sunny.]]"],["[[cloudy]]","nuageux","[[It's cloudy today.]]"],["[[rainy]]","pluvieux","[[a rainy day]]"],["[[windy]]","venteux","[[It's very windy!]]"],["[[foggy]]","brumeux","[[a foggy morning]]"],["[[snowy]]","enneigé","[[a snowy weekend]]"]]},{"type":"examples","items":[{"en":"The phone is ringing! I'll get it.","fr":"Le téléphone sonne ! Je vais répondre."},{"en":"We're going to visit our cousins next summer.","fr":"Nous allons visiter nos cousins l'été prochain."},{"en":"I'm meeting Priya at the library at four o'clock.","fr":"Je retrouve Priya à la bibliothèque à quatre heures."},{"en":"The forecast says it will be windy tomorrow.","fr":"La météo annonce qu'il va venter demain."},{"en":"She won't come to the party.","fr":"Elle ne viendra pas au party."}]},{"type":"tip","text":"Le grand piège : « Quand je serai grand » ne se dit **pas** [[When I will be older]]. On dit [[When I'm older]] ! Et jamais de **to** après will : [[I will call you]], pas [[I will to call you]]."},{"type":"dialogue","title":"Les plans de la fin de semaine","lines":[{"who":"Maya","en":"What are you doing this weekend, Ethan?","fr":"Qu'est-ce que tu fais cette fin de semaine, Ethan ?"},{"who":"Ethan","en":"I'm going to visit my cousins in Toronto. We're leaving on Saturday morning.","fr":"Je vais visiter mes cousins à Toronto. On part samedi matin."},{"who":"Maya","en":"Cool! What's the weather going to be like?","fr":"Cool ! Quel temps va-t-il faire ?"},{"who":"Ethan","en":"The forecast says it will be sunny but windy.","fr":"La météo annonce du soleil, mais du vent."},{"who":"Maya","en":"Lucky you! I think it's going to rain here.","fr":"Chanceux ! Je pense qu'il va pleuvoir ici."},{"who":"Ethan","en":"Don't worry, I'll send you photos of the sun!","fr":"Ne t'inquiète pas, je vais t'envoyer des photos du soleil !"},{"who":"Maya","en":"Ha ha, thanks. When you come back, I'll make you cookies.","fr":"Ha ha, merci. Quand tu reviendras, je te ferai des biscuits."}]},{"type":"fun","text":"Le sais-tu ? Au Canada, la météo se donne en degrés Celsius. [[It's minus twenty degrees!]] veut dire « Il fait moins vingt degrés ! » Aux États-Unis, on utilise plutôt les degrés Fahrenheit."}],"vocab":[{"en":"tomorrow","fr":"demain","alt":[],"ex":"It will be sunny tomorrow."},{"en":"the day after tomorrow","fr":"après-demain","alt":[],"ex":"We're leaving the day after tomorrow."},{"en":"tonight","fr":"ce soir","alt":[],"ex":"What are you doing tonight?"},{"en":"next week","fr":"la semaine prochaine","alt":[],"ex":"I'm going to start piano lessons next week."},{"en":"soon","fr":"bientôt","alt":[],"ex":"Summer will be here soon."},{"en":"probably","fr":"probablement","alt":[],"ex":"It will probably snow tonight."},{"en":"maybe","fr":"peut-être","alt":["perhaps"],"ex":"Maybe we'll go to the beach."},{"en":"weather forecast","fr":"prévisions météo (la météo)","alt":["forecast"],"ex":"The weather forecast says it will rain."},{"en":"sunny","fr":"ensoleillé","alt":[],"ex":"It's going to be sunny all week."},{"en":"cloudy","fr":"nuageux","alt":[],"ex":"The sky is cloudy this morning."},{"en":"rainy","fr":"pluvieux","alt":[],"ex":"I don't like rainy days."},{"en":"windy","fr":"venteux","alt":[],"ex":"It's too windy for a picnic."},{"en":"foggy","fr":"brumeux","alt":[],"ex":"Drive slowly, it's foggy."},{"en":"snowy","fr":"enneigé, de neige","alt":[],"ex":"We love snowy weekends."},{"en":"degree","fr":"degré","alt":[],"ex":"It's minus ten degrees outside."},{"en":"umbrella","fr":"parapluie","alt":[],"ex":"Take an umbrella, it's going to rain."},{"en":"thunderstorm","fr":"orage","alt":[],"ex":"There will be a thunderstorm tonight."},{"en":"plan","fr":"projet, plan (nom)","alt":[],"ex":"What are your plans for the summer?"},{"en":"promise","fr":"promettre","alt":[],"ex":"I promise I'll call you."}],"sentences":[{"en":"It's going to rain this afternoon.","fr":"Il va pleuvoir cet après-midi.","trap":["will","go"],"alt":["This afternoon it's going to rain."]},{"en":"I think it will be sunny tomorrow.","fr":"Je pense qu'il fera soleil demain.","trap":["sun","wills"],"alt":["I think tomorrow it will be sunny.","Tomorrow I think it will be sunny."]},{"en":"We're going to visit our cousins next summer.","fr":"Nous allons visiter nos cousins l'été prochain.","trap":["will","visiting"],"alt":["Next summer we're going to visit our cousins."]},{"en":"I'm meeting Priya at the library at four o'clock.","fr":"Je retrouve Priya à la bibliothèque à quatre heures.","trap":["meet","will"],"alt":["At four o'clock I'm meeting Priya at the library.","I'm meeting Priya at four o'clock at the library."]},{"en":"When I'm older, I'll be a pilot.","fr":"Quand je serai grand, je serai pilote.","trap":["will","going"],"alt":["I'll be a pilot when I'm older."]},{"en":"Don't worry, I'll help you with your homework.","fr":"Ne t'inquiète pas, je vais t'aider avec tes devoirs.","trap":["will","helping"],"alt":["I'll help you with your homework, don't worry."]},{"en":"She won't come to the party tomorrow.","fr":"Elle ne viendra pas au party demain.","trap":["comes","willn't"],"alt":["Tomorrow she won't come to the party."]},{"en":"Are you going to take the bus tonight?","fr":"Vas-tu prendre l'autobus ce soir ?","trap":["taking","goes"],"alt":[]},{"en":"What are you doing this weekend?","fr":"Qu'est-ce que tu fais cette fin de semaine ?","trap":["does","did"],"alt":[]},{"en":"The weather forecast says it will be windy.","fr":"La météo annonce qu'il va venter.","trap":["say","wind"],"alt":[]},{"en":"We're flying to Vancouver on Saturday.","fr":"Nous prenons l'avion pour Vancouver samedi.","trap":["fly","will"],"alt":["On Saturday we're flying to Vancouver."]},{"en":"I promise I won't forget your birthday.","fr":"Je te promets que je n'oublierai pas ton anniversaire.","trap":["forgot","forgetting"],"alt":[]}],"grammar":[{"type":"mcq","q":"Look at those black clouds! It ___ rain.","choices":["is raining to","is going to","will to","goes to"],"answer":1,"explain":"Prédiction avec une preuve qu'on voit (les nuages noirs) : be going to."},{"type":"mcq","q":"When I ___ older, I'll travel around the world.","choices":["will be","would be","am","be"],"answer":2,"explain":"Après when, on utilise le présent pour parler du futur : When I am older."},{"type":"mcq","q":"Le téléphone sonne. Tu décides tout de suite de répondre. Que dis-tu ?","choices":["I'll answer it!","I answer it!","I answered it!"],"answer":0,"explain":"Décision prise sur le coup : will → I'll answer it!"},{"type":"mcq","q":"She ___ to Toronto next week. She bought her ticket yesterday.","choices":["will goes","going","go","is going"],"answer":3,"explain":"Plan fixé (le billet est acheté) : présent continu → she is going."},{"type":"mcq","q":"Laquelle est correcte ?","choices":["I will to call you.","I will calling you.","I will call you.","I will calls you."],"answer":2,"explain":"Will + verbe de base, sans to, sans -ing, sans -s."},{"type":"mcq","q":"___ you come to my party on Saturday?","choices":["Will","Do","Are","Does"],"answer":0,"explain":"Question au futur : Will + sujet + base → Will you come?"},{"type":"fill","q":"Look! That little boy ___ fall!","hint":"be going to","answer":["is going to"],"explain":"On voit que ça va arriver : is going to + base."},{"type":"fill","q":"When I ___ sixteen, I'll learn to drive.","hint":"be","answer":["am"],"explain":"Après when, présent : When I am (I'm) sixteen."},{"type":"fill","q":"I ___ forget. I promise!","hint":"will, négatif","answer":["won't"],"explain":"Le négatif de will est won't (will not)."},{"type":"fill","q":"We ___ our grandparents this Sunday. It's all planned.","hint":"visit, présent continu","answer":["are visiting"],"explain":"Plan fixé : présent continu → we are visiting."},{"type":"fill","q":"The forecast says it ___ tomorrow.","hint":"snow, will","answer":["will snow"],"explain":"Prédiction avec will : will + base → will snow."},{"type":"fill","q":"What ___ you going to do after school?","hint":"be","answer":["are"],"explain":"Be going to avec you : are you going to…?"},{"type":"error","q":"When I'll get home, I'll call you.","wrong":1,"fix":["I"],"explain":"Après when, présent : When I get home."},{"type":"error","q":"She will goes to the dentist tomorrow.","wrong":2,"fix":["go"],"explain":"Will + base, jamais de -s : she will go."},{"type":"error","q":"Maybe it will snows tomorrow.","wrong":3,"fix":["snow"],"explain":"Will + base : it will snow."},{"type":"error","q":"Are you going to playing hockey tonight?","wrong":4,"fix":["play"],"explain":"Be going to + base : going to play."},{"type":"error","q":"My mom and I is going to visit the museum next week.","wrong":4,"fix":["are"],"explain":"My mom and I = we, donc are going to."}],"reading":{"title":"Weekend Plans","text":"Hi Grandma!\n\nThe weather forecast says it's going to be sunny and warm this weekend, so we have big plans. On Saturday morning, Dad and I are going to ride our bikes along the Rideau Canal. In the afternoon, I'm meeting Emma at the library. We're going to work on our science project.\n\nOn Sunday, we're having a picnic in Gatineau Park with my cousins. Mom says it will probably be windy, so I'll bring my sweater.\n\nWhen I'm older, I'm going to visit you in Vancouver all by myself! I promise I'll call you on Sunday night.\n\nLove,\nJaden","questions":[{"q":"Selon la météo, quel temps fera-t-il ?","choices":["pluvieux et froid","ensoleillé et chaud","neigeux","brumeux"],"answer":1},{"q":"Que fera Jaden samedi après-midi ?","choices":["du vélo avec son père","un pique-nique","appeler sa grand-mère","travailler avec Emma à la bibliothèque"],"answer":3},{"q":"Pourquoi Jaden va-t-il apporter un chandail ?","choices":["Il va probablement venter.","Il va pleuvoir.","Il va neiger.","Sa mère a froid."],"answer":0},{"q":"Où habite la grand-mère ?","choices":["à Gatineau","à Ottawa","à Vancouver","à Toronto"],"answer":2},{"q":"Quand Jaden va-t-il appeler sa grand-mère ?","choices":["samedi matin","dimanche soir","samedi soir","lundi matin"],"answer":1}]},"pron":{"focus":"Les contractions du futur","ipa":"","explain":"À l'oral, [[will]] se cache presque toujours dans une contraction : [[I will]] devient [[I'll]] (« aïl »), [[we will]] devient [[we'll]] (« wiil »). Le plus grand piège, c'est [[won't]] (= will not) : il se dit « wôount », avec un « ô » qui glisse vers « ou ». Si tu dis « wannt », on entend [[want]] (vouloir)… et [[I won't go]] (je n'irai pas) devient [[I want to go]] (je veux y aller) : le contraire ! Enfin, [[going to]] se dit très souvent [[gonna]] (« GEU-neu ») à l'oral, mais à l'école, on l'écrit toujours [[going to]].","words":[{"en":"I'll","fr":"je vais, je + futur (I will)","hint":"« aïl » : une seule syllabe, « aï » qui glisse, puis un « l »"},{"en":"you'll","fr":"tu vas, tu + futur (you will)","hint":"« youl » : une seule syllabe"},{"en":"she'll","fr":"elle va, elle + futur (she will)","hint":"« chiil » : « ii » long, puis un « l »"},{"en":"it'll","fr":"ça va, il + futur (it will)","hint":"« I-deul » : deux syllabes, le « t » devient un petit « d »"},{"en":"we'll","fr":"nous allons, nous + futur (we will)","hint":"« wiil » : « ii » long ; [[will]] tout seul a un « i » court"},{"en":"they'll","fr":"ils vont, ils + futur (they will)","hint":"« théïl » : « th » qui vibre, « éï » qui glisse"},{"en":"won't","fr":"ne… pas + futur (will not)","hint":"« wôount » : « ô » qui glisse vers « ou », lèvres arrondies ; pas « wannt » !"},{"en":"want","fr":"vouloir","hint":"« wânt » : « â » bien ouvert, lèvres pas arrondies"},{"en":"gonna","fr":"va, vais (going to, à l'oral seulement)","hint":"« GEU-neu » : très familier, on le dit mais on ne l'écrit pas à l'école"},{"en":"going to","fr":"aller + verbe (futur proche)","hint":"« GÔOU-ing-tou » : la forme complète, pour écrire et parler clairement"}],"pairs":[["won't","want"],["we'll","will"]],"practice":["I'll call you tomorrow, but I won't be late.","It'll snow tonight, so we're gonna build a snowman.","I want to go, but I won't go alone."]},"mission":{"type":"oral","prompt":"Ta correspondante Mei, à Vancouver, te demande tes projets pour l'été prochain. Explique-lui ce que tu as déjà prévu, ce que tu penses qu'il va se passer (la météo, par exemple) et une chose que tu ne feras pas.","model":"Next summer, I'm going to visit my cousins in Toronto. We're leaving on the first of July. I think it'll be hot and sunny, so we'll go to the beach every day. I won't forget my sunscreen! When I'm there, I'll send you lots of photos.","checklist":["J'ai utilisé [[going to]] pour un projet déjà décidé","J'ai utilisé [[will]] ou [['ll]] pour une prédiction ou une décision ([[I think it'll be sunny]])","J'ai écrit [[When I'm there]], jamais « When I will be there »","J'ai prononcé [[won't]] « wôount », bien différent de [[want]]"]}},{"id":"6.2","title":"Comparer","titleEn":"Bigger and Better","goal":"Comparer des personnes et des choses avec les comparatifs, les superlatifs et as … as.","lesson":[{"type":"p","text":"Plus grand, le plus rapide, aussi drôle que… Pour comparer en anglais, tout dépend de la **longueur de l'adjectif**."},{"type":"table","head":["Adjectif","Comparatif (plus … que)","Superlatif (le plus …)"],"rows":[["court : tall","[[taller than]]","[[the tallest]]"],["finit par -e : nice","[[nicer than]]","[[the nicest]]"],["consonne + y : funny","[[funnier than]]","[[the funniest]]"],["court C-V-C : big, hot","[[bigger than]], [[hotter than]]","[[the biggest]], [[the hottest]]"],["long : interesting","[[more interesting than]]","[[the most interesting]]"],["good","[[better than]]","[[the best]]"],["bad","[[worse than]]","[[the worst]]"],["far","[[farther than]]","[[the farthest]]"]]},{"type":"rule","title":"Court ou long ?","text":"Adjectif court (une syllabe, ou deux qui finissent par -y) : **-er / -est**. Adjectif long : **more / the most**. Jamais les deux ensemble ! Pour « aussi … que » : **as + adjectif + as** : [[Léa is as tall as her brother.]] Au négatif : [[My bag isn't as heavy as yours.]]"},{"type":"rule","title":"Le superlatif : the + in","text":"Le superlatif prend **the**, et le lieu ou le groupe se dit avec **in** (ou **on** pour une équipe) : [[the tallest in my class]], [[the best player on the team]]. Avec une période : [[the worst day of my life]]."},{"type":"examples","items":[{"en":"My brother is taller than my dad.","fr":"Mon frère est plus grand que mon père."},{"en":"This book is more interesting than the movie.","fr":"Ce livre est plus intéressant que le film."},{"en":"Emma is the fastest runner in our school.","fr":"Emma est la coureuse la plus rapide de notre école."},{"en":"Your idea is better than my idea.","fr":"Ton idée est meilleure que mon idée."},{"en":"Hockey is as popular as soccer in my class.","fr":"Le hockey est aussi populaire que le soccer dans ma classe."}]},{"type":"tip","text":"Pièges de francophone : on ne dit **jamais** [[more big]] ni [[more better]] : c'est [[bigger]] et [[better]]. Et « que » dans une comparaison, c'est **than**, pas **that** : [[taller than me]]. Astuce : than et « que » ont tous les deux un **n**… presque !"},{"type":"dialogue","title":"Le nouveau téléphone","lines":[{"who":"Priya","en":"Which is better, your new phone or your old one?","fr":"Lequel est le meilleur, ton nouveau téléphone ou l'ancien ?"},{"who":"Jaden","en":"The new one is faster, but it's more expensive.","fr":"Le nouveau est plus rapide, mais il est plus cher."},{"who":"Priya","en":"Is the camera better?","fr":"La caméra est-elle meilleure ?"},{"who":"Jaden","en":"Yes, much better! And it's lighter than my old phone.","fr":"Oui, beaucoup mieux ! Et il est plus léger que mon ancien téléphone."},{"who":"Priya","en":"So it's the perfect phone!","fr":"Alors c'est le téléphone parfait !"},{"who":"Jaden","en":"Not really. It's the most expensive phone in the store!","fr":"Pas vraiment. C'est le téléphone le plus cher du magasin !"}]},{"type":"fun","text":"Le sais-tu ? Le Canada est le deuxième plus grand pays du monde par la superficie, après la Russie. En anglais : [[Canada is the second largest country in the world.]]"}],"vocab":[{"en":"better","fr":"meilleur, mieux (comparatif de good)","alt":[],"ex":"Your drawing is better than mine."},{"en":"the best","fr":"le meilleur, la meilleure","alt":[],"ex":"She is the best player on the team."},{"en":"worse","fr":"pire (comparatif de bad)","alt":[],"ex":"The weather is worse today."},{"en":"the worst","fr":"le pire, la pire","alt":[],"ex":"That was the worst movie ever."},{"en":"farther","fr":"plus loin","alt":["further"],"ex":"Toronto is farther than Montreal."},{"en":"than","fr":"que (dans une comparaison)","alt":[],"ex":"I'm taller than my sister."},{"en":"as tall as","fr":"aussi grand que","alt":["as big as"],"ex":"Noah is as tall as his dad."},{"en":"heavy","fr":"lourd","alt":[],"ex":"My backpack is so heavy!"},{"en":"fast","fr":"rapide, vite","alt":["quick"],"ex":"Cheetahs are very fast."},{"en":"slow","fr":"lent","alt":[],"ex":"The old bus is very slow."},{"en":"strong","fr":"fort","alt":[],"ex":"My grandpa is still very strong."},{"en":"smart","fr":"intelligent, futé","alt":["clever","intelligent"],"ex":"Dogs are very smart animals."},{"en":"dangerous","fr":"dangereux","alt":[],"ex":"Thin ice is dangerous."},{"en":"interesting","fr":"intéressant","alt":[],"ex":"This book is really interesting."},{"en":"famous","fr":"célèbre","alt":[],"ex":"He is a famous hockey player."},{"en":"noisy","fr":"bruyant","alt":["loud"],"ex":"The cafeteria is very noisy."},{"en":"quiet","fr":"calme, silencieux","alt":[],"ex":"The library is quiet."},{"en":"safe","fr":"sécuritaire, en sécurité","alt":[],"ex":"Is it safe to skate on the canal?"},{"en":"crowded","fr":"bondé, plein de monde","alt":[],"ex":"The bus was very crowded."}],"sentences":[{"en":"My brother is taller than my dad.","fr":"Mon frère est plus grand que mon père.","trap":["that","more"],"alt":[]},{"en":"This book is more interesting than the movie.","fr":"Ce livre est plus intéressant que le film.","trap":["interestinger","that"],"alt":[]},{"en":"Ottawa is colder than Vancouver in winter.","fr":"En hiver, il fait plus froid à Ottawa qu'à Vancouver.","trap":["more","that"],"alt":["In winter Ottawa is colder than Vancouver.","Ottawa is colder in winter than Vancouver."]},{"en":"Emma is the fastest runner in our school.","fr":"Emma est la coureuse la plus rapide de notre école.","trap":["of","most"],"alt":[]},{"en":"Your idea is better than my idea.","fr":"Ton idée est meilleure que mon idée.","trap":["gooder","more"],"alt":[]},{"en":"That was the worst day of my life!","fr":"C'était la pire journée de ma vie !","trap":["baddest","most"],"alt":[]},{"en":"Montreal is farther from here than Gatineau.","fr":"Montréal est plus loin d'ici que Gatineau.","trap":["more","that"],"alt":["Montreal is farther than Gatineau from here."]},{"en":"My bag isn't as heavy as your bag.","fr":"Mon sac n'est pas aussi lourd que ton sac.","trap":["than","more"],"alt":[]},{"en":"Is the library quieter than the park?","fr":"La bibliothèque est-elle plus calme que le parc ?","trap":["more","that"],"alt":[]},{"en":"This is the most dangerous street in the city.","fr":"C'est la rue la plus dangereuse de la ville.","trap":["more","dangerousest"],"alt":[]},{"en":"Hockey is as popular as soccer in my class.","fr":"Le hockey est aussi populaire que le soccer dans ma classe.","trap":["than","like"],"alt":["In my class hockey is as popular as soccer."]},{"en":"Who is the best player on your team?","fr":"Qui est le meilleur joueur de ton équipe ?","trap":["goodest","most"],"alt":[]}],"grammar":[{"type":"mcq","q":"An elephant is ___ than a horse.","choices":["more big","biger","bigger","the biggest"],"answer":2,"explain":"Big est court (C-V-C) : on double le g et on ajoute -er → bigger."},{"type":"mcq","q":"My sister is taller ___ me.","choices":["than","that","as","of"],"answer":0,"explain":"Dans une comparaison, « que » se dit than."},{"type":"mcq","q":"This is the ___ movie of the year!","choices":["goodest","most good","better","best"],"answer":3,"explain":"Good est irrégulier : good → better → the best."},{"type":"mcq","q":"Math is ___ than science for me.","choices":["difficulter","more difficult","most difficult"],"answer":1,"explain":"Difficult est long : more difficult than."},{"type":"mcq","q":"Léa is as tall ___ her brother.","choices":["than","that","as","like"],"answer":2,"explain":"Aussi … que = as … as."},{"type":"mcq","q":"Yesterday's test was bad, but today's test was even ___.","choices":["worse","badder","worst","more bad"],"answer":0,"explain":"Bad est irrégulier : bad → worse → the worst. Ici on compare deux examens : worse."},{"type":"fill","q":"My new phone is ___ than my old one.","hint":"fast","answer":["faster"],"explain":"Adjectif court : fast → faster."},{"type":"fill","q":"January is usually the ___ month in Ottawa.","hint":"cold","answer":["coldest"],"explain":"Superlatif d'un adjectif court : the coldest."},{"type":"fill","q":"This bag is ___ than that one.","hint":"expensive","answer":["more expensive"],"explain":"Adjectif long : more expensive than."},{"type":"fill","q":"Who is the ___ person in your family?","hint":"funny","answer":["funniest"],"explain":"Consonne + y : funny → the funniest."},{"type":"fill","q":"I live ___ from school than you.","hint":"far","answer":["farther","further"],"explain":"Far est irrégulier : farther (ou further)."},{"type":"fill","q":"The big box is ___ than the small box.","hint":"heavy","answer":["heavier"],"explain":"Consonne + y : heavy → heavier."},{"type":"error","q":"My dog is biger than your cat.","wrong":3,"fix":["bigger"],"explain":"Big : on double le g → bigger."},{"type":"error","q":"Lucas is taller that his brother.","wrong":3,"fix":["than"],"explain":"« Que » dans une comparaison = than, pas that."},{"type":"error","q":"This is the more expensive phone of all.","wrong":3,"fix":["most"],"explain":"Superlatif d'un adjectif long : the most expensive."},{"type":"error","q":"Noah is the best player of the team.","wrong":5,"fix":["on","in"],"explain":"Avec une équipe, on dit the best player on the team (in est aussi accepté)."},{"type":"error","q":"This year, my grades are worst than last year.","wrong":5,"fix":["worse"],"explain":"Pour comparer deux choses : worse than. The worst sert pour le superlatif."},{"type":"error","q":"My bag is as heavy than yours.","wrong":5,"fix":["as"],"explain":"Aussi … que = as … as, jamais as … than."}],"reading":{"title":"The Great Pet Debate","text":"Liam and Sofia are twins, but they never agree. This week, they are arguing about pets.\n\n\"Dogs are the best pets in the world,\" says Liam. \"They are smarter than cats, and they are more fun. My friend's dog runs faster than any cat!\"\n\n\"That's not true,\" says Sofia. \"Cats are quieter than dogs, and they are cleaner too. Also, a cat isn't as expensive as a dog.\"\n\nTheir mom has an idea. \"What about a fish? A fish is the quietest pet, and it's the cheapest too.\"\n\n\"But a fish is the most boring pet in the world!\" say the twins at the same time. For once, they agree!","questions":[{"q":"Selon Liam, pourquoi les chiens sont-ils les meilleurs ?","choices":["Ils sont plus calmes.","Ils sont plus intelligents et plus amusants.","Ils coûtent moins cher.","Ils sont plus propres."],"answer":1},{"q":
