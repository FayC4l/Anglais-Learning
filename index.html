terday.","If I had known, I will help.","If I had known, I would have helped."],"answer":3,"explain":"Jamais would après if : If I had known, I would have helped."},{"type":"mcq","q":"If she were braver, she ___ the coach for help last week.","choices":["would ask","would have asked","had asked","will ask"],"answer":1,"explain":"Mixte : un trait de caractère présent (were braver), un résultat passé (last week) → would have asked."},{"type":"fill","q":"If it ___ so cold, we would have gone skating.","hint":"not / be","answer":["hadn't been"],"explain":"Partie if du troisième conditionnel : past perfect → hadn't been."},{"type":"fill","q":"We ___ the bus if we had run faster.","hint":"catch","answer":["would have caught","could have caught","might have caught"],"explain":"Résultat passé imaginaire : would (ou could) have + caught."},{"type":"fill","q":"If only I ___ my keys at home!","hint":"not / leave","answer":["hadn't left"],"explain":"Regret sur le passé : if only + past perfect."},{"type":"fill","q":"If Amir had studied harder, he ___ in a better class now.","hint":"be","answer":["would be","might be","could be"],"explain":"Mixte : cause passée, résultat présent (now) → would be."},{"type":"fill","q":"I wish you ___ me the truth from the beginning.","hint":"tell","answer":["had told"],"explain":"Regret sur le passé : wish + had told."},{"type":"fill","q":"If I ___ you were sick, I would have brought you some soup.","hint":"know","answer":["had known"],"explain":"If + past perfect : had known."},{"type":"fill","q":"Leave now; ___, you'll be late.","hint":"sinon","answer":["otherwise","or else"],"explain":"Sinon = otherwise."},{"type":"error","q":"If you would told me earlier, I would have helped you.","wrong":2,"fix":["had"],"explain":"Jamais would après if : If you had told me."},{"type":"error","q":"If we had took a taxi, we would have arrived on time.","wrong":3,"fix":["taken"],"explain":"Had + participe passé : taken, pas took."},{"type":"error","q":"I wish I have listened to my mom.","wrong":3,"fix":["had"],"explain":"Regret sur le passé : wish + had + participe."},{"type":"error","q":"If she hadn't missed the bus, she would has arrived on time.","wrong":8,"fix":["have"],"explain":"Après would, toujours have (jamais has)."},{"type":"error","q":"If I had saved my money, I will have a new bike now.","wrong":7,"fix":["would"],"explain":"Résultat imaginaire au présent : would have a new bike now, pas will."}],"reading":{"title":"A Chain of Small Mistakes","text":"Last Friday was the worst day of Olivia's school year, and it all started with a tiny mistake. The night before, she had forgotten to set her alarm clock. As a result, she overslept by almost an hour.\n\nIf she had woken up on time, she would have caught the school bus. Instead, she had to run to the city bus stop, and on the way, she tripped and dropped her lunch in a puddle. If she hadn't been in such a hurry, she probably wouldn't have fallen.\n\nWhen she finally arrived at school, her class had already started the big science test. Her teacher let her write it, but she only had half the time. She did her best, but she couldn't finish. \"If only I had checked my alarm!\" she thought.\n\nAt lunch, she had nothing to eat, because her sandwich was still lying in a puddle somewhere near the bus stop. Luckily, her friend Ana shared her pasta with her. \"If you hadn't helped me with my project last week,\" Ana joked, \"I would have eaten it all myself!\"\n\nIn the evening, Olivia told her dad about her terrible day. He smiled and said that everybody had days like that. In hindsight, Olivia realized that one small action could have changed everything. Now she checks her alarm twice every night. If she had done that from the start, she would have saved herself a lot of trouble, and a perfectly good sandwich.","questions":[{"q":"What was Olivia's first mistake?","choices":["She missed the bus.","She forgot to set her alarm.","She dropped her lunch.","She forgot her science book."],"answer":1},{"q":"According to the text, why did Olivia probably fall?","choices":["The ground was icy.","Ana pushed her.","She was in a hurry.","She was looking at her phone."],"answer":2},{"q":"What happened with the science test?","choices":["She didn't have enough time to finish it.","She missed it completely.","She got a perfect score.","The teacher cancelled it."],"answer":0},{"q":"What does Ana's joke suggest?","choices":["Ana doesn't like pasta.","Ana was angry at Olivia.","Ana had forgotten her lunch.","Olivia had been kind to Ana before."],"answer":3},{"q":"What does Olivia do differently now?","choices":["She sets two alarms.","She takes a taxi.","She checks her alarm twice every night.","She goes to bed earlier."],"answer":2},{"q":"What is the main message of the story?","choices":["Science tests are too hard.","Small mistakes can have big consequences.","You should never take the bus.","Friends should always share their lunch."],"answer":1}]},"pron":{"focus":"would've, should've, could've","ipa":"/əv/","explain":"Quand on parle vite, [[would have]] devient [[would've]] : « WOU-deuv ». Le [[have]] fond en un tout petit « euv » collé au modal, et le l de [[would]], [[should]] et [[could]] reste muet. Le piège, même pour les anglophones : comme « euv » sonne exactement comme [[of]], beaucoup écrivent « would of »… et c'est **toujours faux** ! À l'écrit, c'est [[would have]] ou [[would've]], point final. À l'oral, n'oublie pas non plus le petit « d » de [[if I'd known]] : c'est lui qui dit que c'est du passé.","words":[{"en":"would've","fr":"aurait, aurais (would have)","hint":"« WOU-deuv » : l muet, « euv » tout petit ; à l'écrit, jamais « would of »"},{"en":"should've","fr":"aurais dû (should have)","hint":"« CHOU-deuv » : l muet, accent sur « chou »"},{"en":"could've","fr":"aurais pu (could have)","hint":"« KOU-deuv » : l muet, comme [[could]]"},{"en":"wouldn't have","fr":"n'aurait pas, n'aurais pas","hint":"« WOU-deun-teuv » : la négation est forte, le have se colle"},{"en":"if I'd known","fr":"si j'avais su","hint":"« i-faïd-NÔN » : le k de [[known]] est muet ; garde le petit « d »"},{"en":"I would've come","fr":"je serais venu, je serais venue","hint":"« aï-WOU-deuv-KEUM » : accent sur [[would]] et sur [[come]]"},{"en":"you should've told me","fr":"tu aurais dû me le dire","hint":"« you-CHOU-deuv-TÔLD-mi » : [[me]] reste léger"},{"en":"we could've won","fr":"on aurait pu gagner","hint":"« wi-KOU-deuv-OUEUN » : [[won]] se dit comme [[one]]"},{"en":"I wouldn't have gone","fr":"je ne serais pas allé, je ne serais pas allée","hint":"« aï-WOU-deun-teuv-GÂN » : deux coups forts"}],"pairs":[],"practice":["If I'd known about the party, I would've come.","You should've told me; we could've helped you.","If we had trained harder, we wouldn't have lost."]},"mission":{"type":"oral","prompt":"Raconte à voix haute, en cinq à sept phrases, une journée qui a mal tourné (vraie ou inventée). Dis ce qui se serait passé si tu avais agi autrement, ce que tu aurais dû faire, et termine par un regret avec [[If only]].","model":"Last winter, I missed the bus on the morning of my big science presentation. If I had set my alarm, I wouldn't have been late. I should've gone to bed earlier, too, instead of playing video games! My teacher was nice about it, but if I'd arrived on time, I would've gotten a better mark. If only I had listened to my mom! Now I always check my alarm twice before I go to sleep.","checklist":["J'ai utilisé [[if]] + [[had]] + participe, puis [[would have]] + participe","J'ai dit au moins un regret avec [[should've]] ou [[shouldn't have]]","J'ai terminé avec [[If only]] ou [[I wish]] + [[had]] + participe","J'ai dit « WOU-deuv » d'un seul souffle, avec le l muet","Je n'ai jamais mis [[would]] juste après [[if]]"]}},{"id":"10.2","title":"Il a dû…","titleEn":"It Must Have Been…","goal":"Faire des déductions et exprimer des regrets sur le passé avec must have, can't have, might have, should have et needn't have.","lesson":[{"type":"p","text":"Modal + [[have]] + **participe passé** = parler du passé avec nuance. Tu peux faire des **déductions** (« il a sûrement… », « elle n'a pas pu… ») ou juger ce qui s'est passé (« tu aurais dû… »)."},{"type":"table","head":["Modal","Sens","Exemple"],"rows":[["must have + participe","je suis presque sûr (oui)","[[She must have forgotten.]] Elle a dû oublier."],["can't have / couldn't have","c'est impossible (non)","[[He can't have seen us.]] Il n'a pas pu nous voir."],["might / may / could have","peut-être","[[They might have missed the bus.]] Ils ont peut-être raté l'autobus."],["should have","ça aurait été mieux (regret, reproche)","[[You should have told me.]] Tu aurais dû me le dire."],["shouldn't have","c'était une erreur","[[I shouldn't have shouted.]] Je n'aurais pas dû crier."],["could have","c'était possible, mais ce n'est pas arrivé","[[You could have hurt yourself!]] Tu aurais pu te blesser !"],["needn't have + participe","c'était inutile… mais on l'a fait","[[You needn't have brought a gift.]]"],["didn't need to + verbe","ce n'était pas nécessaire","[[I didn't need to wake up early.]]"]]},{"type":"rule","title":"Le piège de « il a dû »","text":"En français, « Il a dû partir » a **deux sens** ! Une **déduction** : [[He must have left.]] (je suppose qu'il est parti). Une **obligation** : [[He had to leave.]] (il était obligé de partir). Avant de traduire, demande-toi : supposition ou obligation ?"},{"type":"rule","title":"Le contraire de must have","text":"Le contraire de la déduction [[must have]] n'est **pas** [[mustn't have]], c'est [[can't have]] ou [[couldn't have]] : [[She can't have eaten the cake; she's allergic to chocolate!]]"},{"type":"tip","text":"À l'oral, [[should've]], [[could've]] et [[must've]] sonnent comme « should of »… mais on n'écrit **jamais** [[should of]] ! C'est toujours [[have]]. Autre piège : [[needn't have brought]] = je l'ai apporté pour rien ; [[didn't need to bring]] = ce n'était pas nécessaire (et souvent, je ne l'ai pas apporté)."},{"type":"examples","items":[{"en":"The ground is wet, so it must have rained last night.","fr":"Le sol est mouillé, alors il a dû pleuvoir la nuit dernière."},{"en":"Someone might have taken your bag by accident.","fr":"Quelqu'un a peut-être pris ton sac par accident."},{"en":"I shouldn't have eaten the whole bag of chips.","fr":"Je n'aurais pas dû manger tout le sac de croustilles."},{"en":"We needn't have hurried, because the movie started late.","fr":"Ce n'était pas la peine de se dépêcher, parce que le film a commencé en retard."}]},{"type":"dialogue","title":"Où est Karim ?","lines":[{"who":"Chloé","en":"Where's Karim? He should have been here at six.","fr":"Où est Karim ? Il aurait dû être ici à six heures."},{"who":"Malik","en":"He might have missed the bus. It's been snowing all day.","fr":"Il a peut-être raté l'autobus. Il neige depuis le matin."},{"who":"Chloé","en":"He can't have missed it. He texted me from the bus twenty minutes ago.","fr":"Il ne peut pas l'avoir raté. Il m'a texté de l'autobus il y a vingt minutes."},{"who":"Malik","en":"Then he must have gotten off at the wrong stop.","fr":"Alors il a dû descendre au mauvais arrêt."},{"who":"Chloé","en":"Typical! I should have sent him the address again.","fr":"Typique ! J'aurais dû lui renvoyer l'adresse."},{"who":"Malik","en":"Don't blame yourself. Oh look, here he is!","fr":"Ne te blâme pas. Oh, regarde, le voilà !"}]}],"vocab":[{"en":"must have","fr":"avoir sûrement… (déduction : il a dû)","alt":[],"ex":"She must have forgotten our meeting."},{"en":"can't have","fr":"n'avoir sûrement pas pu (c'est impossible)","alt":["couldn't have"],"ex":"He can't have finished already!"},{"en":"might have","fr":"avoir peut-être… (il a peut-être)","alt":["may have","could have"],"ex":"They might have gone to the park."},{"en":"should have","fr":"aurait dû","alt":[],"ex":"You should have asked me first."},{"en":"shouldn't have","fr":"n'aurait pas dû","alt":[],"ex":"I shouldn't have stayed up so late."},{"en":"needn't have","fr":"n'avait pas besoin de (mais l'a fait quand même)","alt":[],"ex":"You needn't have cooked; we already ate."},{"en":"mess","fr":"désordre, dégât","alt":[],"ex":"Who made this mess in the kitchen?"},{"en":"crumbs","fr":"miettes","alt":[],"ex":"There are crumbs all over the sofa."},{"en":"scratch","fr":"égratignure, rayure","alt":[],"ex":"There's a long scratch on the car door."},{"en":"leak","fr":"fuite (d'eau)","alt":[],"ex":"There's a leak under the sink."},{"en":"stain","fr":"tache","alt":[],"ex":"This chocolate stain won't come out."},{"en":"flat tire","fr":"pneu crevé (à plat)","alt":["flat"],"ex":"My bike has a flat tire again."},{"en":"blame","fr":"blâmer, rejeter la faute sur","alt":[],"ex":"Don't blame your sister; it was an accident."},{"en":"guess","fr":"deviner","alt":[],"ex":"Guess who I saw at the mall!"},{"en":"assume","fr":"supposer, présumer","alt":["suppose"],"ex":"I assumed that you were busy."},{"en":"obviously","fr":"de toute évidence, évidemment","alt":["clearly"],"ex":"Obviously, someone has been in my room."},{"en":"on purpose","fr":"exprès (volontairement)","alt":["deliberately","intentionally"],"ex":"I didn't do it on purpose!"},{"en":"by accident","fr":"par accident (sans faire exprès)","alt":["accidentally","by mistake"],"ex":"I deleted the photo by accident."}],"sentences":[{"en":"The ground is wet, so it must have rained last night.","fr":"Le sol est mouillé, alors il a dû pleuvoir la nuit dernière.","trap":["had","rain"],"alt":[]},{"en":"You can't have seen Maya at the mall; she's in Toronto this week.","fr":"Tu n'as pas pu voir Maya au centre commercial : elle est à Toronto cette semaine.","trap":["mustn't","saw"],"alt":[]},{"en":"I shouldn't have eaten the whole bag of chips.","fr":"Je n'aurais pas dû manger tout le sac de croustilles.","trap":["ate","wouldn't"],"alt":[]},{"en":"You should have told me that you were sick.","fr":"Tu aurais dû me dire que tu étais malade.","trap":["said","had"],"alt":[]},{"en":"Someone might have taken your bag by accident.","fr":"Quelqu'un a peut-être pris ton sac par accident.","trap":["took","of"],"alt":[]},{"en":"We needn't have hurried, because the movie started late.","fr":"Ce n'était pas la peine de se dépêcher, parce que le film a commencé en retard.","trap":["didn't","hurry"],"alt":[]},{"en":"He didn't break the vase on purpose; it was an accident.","fr":"Il n'a pas cassé le vase exprès ; c'était un accident.","trap":["broke","by"],"alt":[]},{"en":"There are crumbs everywhere, so the dog must have found the cookies.","fr":"Il y a des miettes partout, alors le chien a dû trouver les biscuits.","trap":["founded","had"],"alt":[]},{"en":"She could have hurt herself when she fell off her bike.","fr":"Elle aurait pu se blesser quand elle est tombée de son vélo.","trap":["can","hurted"],"alt":[]},{"en":"Don't blame me; I didn't make this mess!","fr":"Ne me blâme pas, ce n'est pas moi qui ai fait ce dégât !","trap":["do","done"],"alt":[]},{"en":"Ethan can't have finished his homework already; he only started ten minutes ago.","fr":"Ethan n'a pas pu déjà finir ses devoirs : il a commencé il y a seulement dix minutes.","trap":["mustn't","finish"],"alt":[]}],"grammar":[{"type":"mcq","q":"Félix wasn't at the party, so he ___ this coat here.","choices":["must have left","should have left","can't have left","needn't have left"],"answer":2,"explain":"Il n'était pas là : c'est impossible → can't have left."},{"type":"mcq","q":"Quel est le contraire de « must have » (déduction) ?","choices":["mustn't have","can't have","shouldn't have","needn't have"],"answer":1,"explain":"Le contraire d'une déduction sûre (must have), c'est can't have (impossible)."},{"type":"mcq","q":"Comment dit-on « Tu aurais dû me demander » ?","choices":["You must have asked me.","You should asked me.","You had to ask me.","You should have asked me."],"answer":3,"explain":"Aurait dû = should have + participe passé."},{"type":"mcq","q":"I'm not sure where Mei is. She ___ gone to the library.","choices":["might have","must have","should have","can't have"],"answer":0,"explain":"On n'est pas sûr : might have (peut-être)."},{"type":"mcq","q":"« Il a dû partir. » (C'est une supposition.) →","choices":["He had to leave.","He must have left.","He must leave.","He has to leave."],"answer":1,"explain":"Une supposition sur le passé → must have left. He had to leave = il était obligé."},{"type":"mcq","q":"The school gave us lunch, so we ___ bring sandwiches. We left them at home.","choices":["needn't have","shouldn't","didn't need to","mustn't"],"answer":2,"explain":"Ce n'était pas nécessaire et on ne l'a pas fait : didn't need to + verbe de base."},{"type":"fill","q":"You ___ me! I was so worried.","hint":"should / call","answer":["should have called"],"explain":"Reproche sur le passé : should have + participe passé."},{"type":"fill","q":"Sofia ___ my message; she answered in two seconds!","hint":"must / read","answer":["must have read"],"explain":"Déduction presque sûre sur le passé : must have read."},{"type":"fill","q":"Ana ___ the cake; she's allergic to chocolate!","hint":"can't / eat","answer":["can't have eaten","couldn't have eaten"],"explain":"C'est impossible : can't have + participe passé."},{"type":"fill","q":"I ___ my umbrella, because it didn't rain at all.","hint":"need not / bring","answer":["needn't have brought"],"explain":"Je l'ai apporté pour rien : needn't have brought."},{"type":"fill","q":"You ___ so many snacks; now you feel sick.","hint":"should not / eat","answer":["shouldn't have eaten"],"explain":"C'était une erreur : shouldn't have eaten."},{"type":"fill","q":"He was lucky. He ___ badly hurt.","hint":"could / be","answer":["could have been"],"explain":"C'était possible, mais ce n'est pas arrivé : could have been."},{"type":"error","q":"You should of told me the truth.","wrong":2,"fix":["have"],"explain":"On entend « should of », mais on écrit toujours should have."},{"type":"error","q":"She must have forget her lunch at home.","wrong":3,"fix":["forgotten"],"explain":"Après have, le participe passé : forgotten."},{"type":"error","q":"He mustn't have seen us, because he didn't wave.","wrong":1,"fix":["can't","couldn't"],"explain":"Déduction négative : can't have, pas mustn't have."},{"type":"error","q":"I should have went to bed earlier last night.","wrong":3,"fix":["gone"],"explain":"go → went → gone : après have, c'est gone."},{"type":"error","q":"We needn't have bring our coats; it was really warm.","wrong":3,"fix":["brought"],"explain":"Needn't have + participe passé : brought."}],"reading":{"title":"The Midnight Snack Mystery","text":"When the Nguyen family came downstairs on Sunday morning, the kitchen was a mess. The fridge door was open, there were crumbs all over the counter, and half of Grandma's birthday cake had disappeared.\n\n\"Someone must have been very hungry last night,\" said Mom, looking at everyone.\n\n\"It can't have been me,\" said Mei. \"I was at Priya's sleepover until this morning.\" That was true: Dad had picked her up an hour before.\n\nHer brother Jaden looked at the floor. \"It might have been the cat,\" he suggested. But the cat was sleeping peacefully on the sofa, and cats don't usually open fridges.\n\nThen Dad noticed a small chocolate stain on the stairs, then another, and another. The trail led straight to Jaden's bedroom door. \"Well,\" Dad said, \"the cat must have walked very carefully up the stairs and opened your door.\"\n\nJaden's face turned red. He admitted that he had woken up at midnight, starving. \"I only wanted a tiny piece,\" he explained, \"but it was so good!\"\n\n\"You should have asked us,\" said Mom. \"And you obviously shouldn't have eaten half of Grandma's cake!\"\n\nLuckily, Grandma's party wasn't until the evening. Jaden spent the whole afternoon baking a new cake with his dad, and he cleaned up every crumb. In the end, Grandma loved it. \"You needn't have made a second cake,\" she laughed, \"but I'm very glad you did!\"","questions":[{"q":"Why can't Mei have eaten the cake?","choices":["She doesn't like cake.","She was at a sleepover.","She was sleeping on the sofa.","She was baking with Dad."],"answer":1},{"q":"Who did Jaden blame at first?","choices":["The cat","Mom","Mei","Grandma"],"answer":0},{"q":"What clue led Dad to Jaden's room?","choices":["Footprints of milk","Cake crumbs in the hallway","A trail of chocolate stains","An open window"],"answer":2},{"q":"What did Dad mean when he talked about the cat walking up the stairs?","choices":["He really believed that the cat did it.","He wanted to buy a new cat.","He was angry at the cat.","He was joking, because the clues pointed to Jaden."],"answer":3},{"q":"Why did Grandma say \"You needn't have made a second cake\"?","choices":["She hates cake.","She didn't think a new cake was necessary, but she appreciated it.","She knew that Jaden couldn't bake.","She had already bought another cake."],"answer":1}]},"pron":{"focus":"must've, might've, can't have, needn't have","ipa":"/əv/","explain":"Pour faire des déductions sur le passé, le [[have]] se réduit encore en « euv » : [[must've]] (« MEUS-teuv »), [[might've]] (« MAÏ-deuv »). Remarque que le t de [[might]] devient un « d » léger devant la voyelle, comme dans [[water]]. Par contre, la négation reste bien forte : [[can't have]], [[shouldn't have]], [[needn't have]], parce que c'est elle qui porte le sens. Le piège des francophones : dire [[can't]] trop vite, comme [[can]]… et ta déduction dit le contraire ! Truc de détective : « euv » léger pour une hypothèse, négation bien appuyée pour une certitude.","words":[{"en":"must've","fr":"a dû (déduction : c'est sûrement ça)","hint":"« MEUS-teuv » : « meus », jamais « mouste »"},{"en":"might've","fr":"a peut-être (might have)","hint":"« MAÏ-deuv » : le t devient un « d » léger, comme dans [[water]]"},{"en":"may have","fr":"a peut-être (may have)","hint":"« MÉI-euv » : le h disparaît dans une phrase rapide"},{"en":"could've been","fr":"aurait pu être","hint":"« KOU-deuv-bin » : l muet ; [[been]] se dit « bin »"},{"en":"can't have","fr":"ne peut pas avoir (c'est impossible)","hint":"« KANT-euv » : négation forte, le t s'entend bien"},{"en":"can't have been","fr":"ne peut pas avoir été","hint":"« KANT-euv-bin » : tout l'accent sur [[can't]]"},{"en":"shouldn't have","fr":"n'aurait pas dû","hint":"« CHOU-deun-teuv » : l muet, accent sur « chou »"},{"en":"needn't have","fr":"n'avait pas besoin de (mais l'a fait)","hint":"« NII-deun-teuv » : accent sur « nii »"},{"en":"didn't need to","fr":"n'avait pas besoin de (et ne l'a pas fait)","hint":"« DI-deunt-NII-deu » : [[to]] devient un petit « deu »"}],"pairs":[],"practice":["She must've left early, but she can't have forgotten the meeting.","It might've been the wind, or the cat could've opened the door.","You needn't have brought a gift, but thank you!"]},"mission":{"type":"ecrit","prompt":"La dernière pointe de tarte a disparu du frigo ! Écris un message de cinq à sept phrases au groupe de ta famille avec tes déductions : qui a pu la manger, qui ne peut pas être coupable, et ce que le coupable aurait dû faire.","model":"Family alert: someone must have eaten the last piece of pie last night! It can't have been Dad, because he was working late. It might have been Liam, since he was the last one in the kitchen. The dog could have climbed on the counter, too, because there were crumbs on the floor. Whoever it was should have left me a note! And Mom, you needn't have bought another pie today: Grandma brought two this morning.","checklist":["J'ai utilisé [[must have]] pour une déduction presque sûre","J'ai utilisé [[can't have]] pour dire que c'est impossible (pas [[mustn't have]])","J'ai utilisé [[might have]], [[may have]] ou [[could have]] pour une possibilité","J'ai utilisé [[should have]] ou [[needn't have]] + participe passé","J'ai écrit [[have]] en entier ou [['ve]], jamais [[of]]"]}},{"id":"10.3","title":"Les expressions (1)","titleEn":"Speaking in Idioms","goal":"Comprendre et utiliser des expressions idiomatiques courantes comme un anglophone.","lesson":[{"type":"p","text":"Une **expression idiomatique**, c'est un groupe de mots dont le sens n'a rien à voir avec les mots eux-mêmes. Si tu traduis mot à mot, c'est la catastrophe ! Souvent, il existe un équivalent en français… mais avec une autre image : [[cost an arm and a leg]] (un bras et une jambe) = coûter **les yeux de la tête**."},{"type":"rule","title":"Comment les utiliser","text":"Les verbes des expressions se **conjuguent** normalement : [[She spilled the beans.]] [[I'm hitting the books tonight.]] Les possessifs changent selon la personne : [[pull someone's leg]] → [[You're pulling my leg!]] D'autres sont presque figées : [[It's a piece of cake.]] [[It's not rocket science.]] [[The ball is in your court.]]"},{"type":"table","head":["Expression","Mot à mot","Sens"],"rows":[["[[a piece of cake]]","un morceau de gâteau","très facile, un jeu d'enfant"],["[[spill the beans]]","renverser les fèves","vendre la mèche"],["[[under the weather]]","sous la météo","pas dans son assiette"],["[[once in a blue moon]]","une fois par lune bleue","très rarement"],["[[get cold feet]]","avoir les pieds froids","se dégonfler au dernier moment"],["[[cut corners]]","couper les coins","tourner les coins ronds, bâcler"],["[[the last straw]]","la dernière paille","la goutte qui fait déborder le vase"],["[[hit the sack]]","frapper le sac","aller se coucher"]]},{"type":"examples","items":[{"en":"The math test was a piece of cake.","fr":"L'examen de maths était un jeu d'enfant."},{"en":"I can't come tonight; I have to hit the books.","fr":"Je ne peux pas venir ce soir ; je dois me mettre à étudier."},{"en":"I've made my offer. The ball is in your court.","fr":"J'ai fait mon offre. La balle est dans ton camp."},{"en":"We've been working for hours. Let's call it a day.","fr":"On travaille depuis des heures. Arrêtons-nous là pour aujourd'hui."},{"en":"I'm still on the fence about joining the drama club.","fr":"J'hésite encore à m'inscrire au club de théâtre."}]},{"type":"tip","text":"Pièges de francophone : on ne dit pas [[the last drop]] pour « la goutte qui fait déborder le vase », mais [[the last straw]]. « Tourner autour du pot » se dit avec un buisson : [[beat around the bush]]. Et ne change **aucun mot** d'une expression : [[a piece of pie]] ou [[get cold hands]], ça ne veut plus rien dire !"},{"type":"dialogue","title":"Le projet d'histoire","lines":[{"who":"Priya","en":"Did you finish the history project? It took me forever.","fr":"As-tu fini le projet d'histoire ? Ça m'a pris une éternité."},{"who":"Samuel","en":"Honestly, it was a piece of cake. I finished in an hour.","fr":"Honnêtement, c'était un jeu d'enfant. J'ai fini en une heure."},{"who":"Priya","en":"You're pulling my leg! It was super long.","fr":"Tu me fais marcher ! C'était super long."},{"who":"Samuel","en":"Okay, okay, I'm joking. I hit the books all weekend.","fr":"D'accord, d'accord, je blague. J'ai étudié toute la fin de semaine."},{"who":"Priya","en":"Same here. I almost cut corners on the last part, but I didn't.","fr":"Moi aussi. J'ai failli bâcler la dernière partie, mais je ne l'ai pas fait."},{"who":"Samuel","en":"Good for you. Now let's call it a day and get some poutine.","fr":"Bravo. Maintenant, arrêtons-nous là pour aujourd'hui et allons manger une poutine."}]},{"type":"fun","text":"Le sais-tu ? En anglais, on appelle « blue moon » la deuxième pleine lune dans un même mois. Ça arrive seulement tous les deux ou trois ans… et elle n'est pas bleue du tout ! Pas étonnant que [[once in a blue moon]] veuille dire « très rarement »."}],"vocab":[{"en":"break the ice","fr":"briser la glace (détendre l'atmosphère)","alt":[],"ex":"He told a joke to break the ice."},{"en":"a piece of cake","fr":"un jeu d'enfant (très facile)","alt":[],"ex":"Don't worry, the test was a piece of cake."},{"en":"hit the books","fr":"se mettre à étudier sérieusement","alt":[],"ex":"Exams start Monday, so I'm hitting the books."},{"en":"under the weather","fr":"pas dans son assiette (un peu malade)","alt":[],"ex":"I'm feeling a bit under the weather today."},{"en":"once in a blue moon","fr":"tous les trente-six du mois (très rarement)","alt":[],"ex":"My cousin visits us once in a blue moon."},{"en":"cost an arm and a leg","fr":"coûter les yeux de la tête","alt":[],"ex":"Those skates cost an arm and a leg."},{"en":"spill the beans","fr":"vendre la mèche","alt":["let the cat out of the bag"],"ex":"Who spilled the beans about the surprise?"},{"en":"the ball is in your court","fr":"la balle est dans ton camp (c'est à toi de décider)","alt":[],"ex":"I said sorry. Now the ball is in your court."},{"en":"call it a day","fr":"s'arrêter là pour aujourd'hui","alt":["call it a night"],"ex":"We're all tired. Let's call it a day."},{"en":"on the fence","fr":"indécis (hésiter entre deux choix)","alt":[],"ex":"I'm still on the fence about the trip."},{"en":"hit the sack","fr":"aller se coucher (aller au lit)","alt":["hit the hay"],"ex":"I'm exhausted. I'm going to hit the sack."},{"en":"get cold feet","fr":"se dégonfler au dernier moment","alt":[],"ex":"She got cold feet before her solo."},{"en":"beat around the bush","fr":"tourner autour du pot","alt":["beat about the bush"],"ex":"Stop beating around the bush and tell me!"},{"en":"pull someone's leg","fr":"faire marcher quelqu'un (le taquiner)","alt":["pull somebody's leg"],"ex":"Relax, I'm just pulling your leg."},{"en":"a blessing in disguise","fr":"un mal pour un bien","alt":[],"ex":"Missing the bus was a blessing in disguise."},{"en":"it's not rocket science","fr":"ce n'est pas sorcier","alt":[],"ex":"Just follow the recipe. It's not rocket science."},{"en":"cut corners","fr":"tourner les coins ronds (bâcler)","alt":[],"ex":"Don't cut corners on your science project."},{"en":"the last straw","fr":"la goutte qui fait déborder le vase","alt":[],"ex":"When he lied again, that was the last straw."},{"en":"in hot water","fr":"dans le pétrin (en difficulté)","alt":[],"ex":"You'll be in hot water if Mom finds out."},{"en":"keep an eye on","fr":"surveiller (garder un œil sur)","alt":[],"ex":"Can you keep an eye on my bag?"}],"sentences":[{"en":"The math test was a piece of cake, so I finished early.","fr":"L'examen de maths était un jeu d'enfant, alors j'ai fini tôt.","trap":["slice","bread"],"alt":[]},{"en":"I can't come tonight because I have to hit the books.","fr":"Je ne peux pas venir ce soir parce que je dois me mettre à étudier.","trap":["hits","beat"],"alt":[]},{"en":"Félix is feeling a bit under the weather today.","fr":"Félix n'est pas dans son assiette aujourd'hui.","trap":["below","on"],"alt":["Today Félix is feeling a bit under the weather."]},{"en":"Those new skates cost an arm and a leg!","fr":"Ces nouveaux patins coûtent les yeux de la tête !","trap":["eyes","head"],"alt":[]},{"en":"Who spilled the beans about the surprise party?","fr":"Qui a vendu la mèche pour la fête surprise ?","trap":["spill","peas"],"alt":[]},{"en":"We've been working for hours, so let's call it a day.","fr":"On travaille depuis des heures, alors arrêtons-nous là pour aujourd'hui.","trap":["since","make"],"alt":[]},{"en":"I'm still on the fence about joining the drama club.","fr":"J'hésite encore à m'inscrire au club de théâtre.","trap":["in","join"],"alt":[]},{"en":"Stop beating around the bush and tell me what happened!","fr":"Arrête de tourner autour du pot et dis-moi ce qui s'est passé !","trap":["beat","tree"],"alt":[]},{"en":"Relax, I'm just pulling your leg.","fr":"Relaxe, je te fais juste marcher.","trap":["foot","pushing"],"alt":[]},{"en":"Missing the bus was a blessing in disguise, because I met my best friend.","fr":"Rater l'autobus a été un mal pour un bien, parce que j'ai rencontré mon meilleur ami.","trap":["disguised","bless"],"alt":[]},{"en":"Can you keep an eye on my little brother for a minute?","fr":"Peux-tu surveiller mon petit frère une minute ?","trap":["eyes","in"],"alt":[]},{"en":"When he forgot my birthday again, that was the last straw.","fr":"Quand il a encore oublié ma fête, ç'a été la goutte qui fait déborder le vase.","trap":["drop","glass"],"alt":[]}],"grammar":[{"type":"mcq","q":"« It costs an arm and a leg » veut dire que c'est…","choices":["très dangereux","très cher","très lourd","très loin"],"answer":1,"explain":"Cost an arm and a leg = coûter les yeux de la tête."},{"type":"mcq","q":"My grandma lives in Vancouver, so she only visits us ___.","choices":["once in a blue moon","a piece of cake","under the weather","on the fence"],"answer":0,"explain":"Once in a blue moon = très rarement."},{"type":"mcq","q":"Comment dit-on « vendre la mèche » ?","choices":["break the ice","cut corners","spill the beans","hit the sack"],"answer":2,"explain":"Spill the beans = révéler un secret, vendre la mèche."},{"type":"mcq","q":"On the first day of camp, the counsellor played a funny game to ___.","choices":["call it a day","hit the books","get cold feet","break the ice"],"answer":3,"explain":"Break the ice = détendre l'atmosphère entre des gens qui ne se connaissent pas."},{"type":"mcq","q":"Sofia wanted to sing in the show, but she ___ and stayed backstage.","choices":["got cold feet","hit the sack","broke the ice","kept an eye on"],"answer":0,"explain":"Get cold feet = se dégonfler au dernier moment."},{"type":"mcq","q":"I've made you an offer. Now ___.","choices":["it's a piece of cake","the ball is in your court","you're under the weather","it's the last straw"],"answer":1,"explain":"The ball is in your court = c'est à toi de décider."},{"type":"fill","q":"I'm so tired. I'm going to hit the ___.","hint":"aller me coucher","answer":["sack","hay"],"explain":"Hit the sack (ou hit the hay) = aller se coucher."},{"type":"fill","q":"Don't ___ corners on your project; do it properly.","hint":"bâcler","answer":["cut"],"explain":"Cut corners = tourner les coins ronds, bâcler."},{"type":"fill","q":"Are you serious, or are you ___ my leg?","hint":"faire marcher","answer":["pulling"],"explain":"Pull someone's leg = faire marcher quelqu'un ; ici au présent continu."},{"type":"fill","q":"Stop beating around the ___ and just say it!","hint":"tourner autour du pot","answer":["bush"],"explain":"Beat around the bush = tourner autour du pot."},{"type":"fill","q":"Can you keep an ___ on my bag while I go to the washroom?","hint":"surveiller","answer":["eye"],"explain":"Keep an eye on = surveiller."},{"type":"fill","q":"Breaking my arm was a blessing in ___: I discovered that I love reading.","hint":"un mal pour un bien","answer":["disguise"],"explain":"A blessing in disguise = un mal pour un bien."},{"type":"error","q":"This puzzle is a piece of pie.","wrong":6,"fix":["cake"],"explain":"L'expression est figée : a piece of cake."},{"type":"error","q":"Who spilled the peas about my surprise?","wrong":3,"fix":["beans"],"explain":"Vendre la mèche = spill the beans."},{"type":"error","q":"Okay, let's call it a week and go home.","wrong":5,"fix":["day","night"],"explain":"S'arrêter pour aujourd'hui = call it a day (ou call it a night le soir)."},{"type":"error","q":"I'm still on the wall about which camp to choose.","wrong":4,"fix":["fence"],"explain":"Hésiter = be on the fence."},{"type":"error","q":"He got cold hands and didn't jump into the lake.","wrong":3,"fix":["feet"],"explain":"Se dégonfler = get cold feet."},{"type":"error","q":"After a horrible week, losing my phone was the last drop.","wrong":10,"fix":["straw"],"explain":"La goutte qui fait déborder le vase = the last straw, pas the last drop."}],"reading":{"title":"Ethan's First Day","text":"Ethan had just moved from Montreal to Ottawa, and on his first day at his new school, he was so nervous that he almost got cold feet at the front door. His mom smiled and told him it wasn't rocket science: all he had to do was say hello.\n\nIn his first class, the teacher asked everyone to tell a joke to break the ice. Ethan was on the fence for a moment, but then he told the funniest joke he knew. The whole class laughed, and a boy named Karim gave him a high five.\n\nAt lunch, Karim told Ethan that the math teacher gave surprise tests only once in a blue moon. \"And don't worry,\" he added, \"they're always a piece of cake.\" That afternoon, the math teacher announced a surprise test. Ethan looked at Karim in panic, but Karim just laughed. He had been pulling Ethan's leg: the surprise tests happened every week, and they were anything but easy.\n\nAfter school, Ethan's new friends invited him to the arena. Hockey equipment can cost an arm and a leg, so Ethan only had old skates. Nobody cared. They played until the lights went off, and then they finally called it a day.\n\nThat night, Ethan was too excited to hit the sack. Moving to a new city had seemed like a disaster, but maybe it was a blessing in disguise.","questions":[{"q":"How did Ethan feel at the front door of the school?","choices":["Excited and calm","So nervous that he almost didn't go in","Angry at his mom","Bored"],"answer":1},{"q":"Why did the teacher ask students to tell a joke?","choices":["To help everyone feel comfortable","To give them a grade","To find the funniest student","To practise for a show"],"answer":0},{"q":"What was true about the math teacher's surprise tests?","choices":["They happened very rarely.","They were very easy.","They didn't exist.","They happened often and were difficult."],"answer":3},{"q":"Why did Ethan only have old skates?","choices":["He didn't like hockey.","He had lost his new skates.","Hockey equipment is very expensive.","Karim had borrowed them."],"answer":2},{"q":"At the end of the day, how did Ethan probably feel about moving to Ottawa?","choices":["He regretted it.","He was starting to see it as something positive.","He wanted to go back to Montreal right away.","He was still afraid of his new classmates."],"answer":1}]},"pron":{"focus":"Le rythme des expressions idiomatiques","ipa":"","explain":"Une expression idiomatique se dit comme un seul gros mot, avec des coups forts sur les mots-clés et des petits mots avalés : [[a piece of cake]] sonne « eu-PII-seuv-KÉIK ». Le dernier mot-clé est souvent le plus fort, parce que c'est lui qui « fait la chute » : [[once in a blue moon]], [[call it a day]]. Le piège des francophones : traduire dans sa tête et marquer des pauses entre chaque mot… et l'expression perd tout son charme ! Truc : apprends chaque expression comme une petite chanson, avec son rythme.","words":[{"en":"a piece of cake","fr":"un jeu d'enfant, du gâteau (très facile)","hint":"« eu-PII-seuv-KÉIK » : [[of]] devient « euv », collé à [[piece]]"},{"en":"break the ice","fr":"briser la glace","hint":"« BRÉIK-thi-AÏS » : devant une voyelle, [[the]] se dit « thi »"},{"en":"under the weather","fr":"pas dans son assiette, un peu malade","hint":"« EUN-deur-theu-OUÈ-theur » : deux th doux"},{"en":"once in a blue moon","fr":"une fois de temps en temps, très rarement","hint":"« OUEUN-si-neu-BLOU-MOUN » : tout glisse jusqu'à [[blue moon]]"},{"en":"cost an arm and a leg","fr":"coûter les yeux de la tête","hint":"« KÂS-teu-NARM-eun-deu-LÈG » : les consonnes glissent sur les voyelles"},{"en":"call it a day","fr":"arrêter pour aujourd'hui","hint":"« KÂ-li-deu-DÉI » : le t devient un « d » léger"},{"en":"hit the books","fr":"se mettre à étudier sérieusement","hint":"« HIT-theu-BOUKS » : [[the]] minuscule, deux coups forts"},{"en":"spill the beans","fr":"vendre la mèche","hint":"« SPIL-theu-BIINZ » : un z sonore à la fin"},{"en":"hit the sack","fr":"aller se coucher","hint":"« HIT-theu-SAK » : « sak », bien ouvert"},{"en":"pull someone's leg","fr":"faire marcher quelqu'un, le taquiner","hint":"« POUL-seum-weunz-LÈG » : accent fort sur [[pull]] et [[leg]]"}],"pairs":[],"practice":["This test is a piece of cake, but I'll still hit the books.","We only eat out once in a blue moon, because it costs an arm and a leg.","I'm a bit under the weather, so let's call it a day."]},"mission":{"type":"oral","prompt":"Ton ami Amir te demande comment s'est passée ta semaine. Raconte-la-lui à voix haute en cinq à sept phrases, avec au moins quatre expressions idiomatiques bien placées.","model":"What a week! On Monday, I had to break the ice with my new lab partner, but it was a piece of cake: she loves hockey too. On Wednesday, I was a bit under the weather, so I hit the sack really early. My brother tried to pull my leg by saying the test was cancelled, but I didn't believe him. I hit the books all Thursday night, and the test went really well. On Friday, after a long practice, the coach finally said that we could call it a day.","checklist":["J'ai utilisé au moins quatre expressions idiomatiques","Chaque expression a le bon sens dans ma phrase (pas de traduction mot à mot)","J'ai gardé les expressions telles quelles : [[a piece of cake]], pas [[a part of cake]]","J'ai dit chaque expression d'un seul souffle, avec les mots-clés forts"]}},{"id":"10.4","title":"Fabriquer des mots","titleEn":"Word Builder","goal":"Fabriquer de nouveaux mots avec des préfixes et des suffixes pour enrichir ton vocabulaire.","lesson":[{"type":"p","text":"Avec une seule racine, tu peux fabriquer toute une famille de mots : [[happy]] → [[unhappy]], [[happiness]], [[happily]]. Les **préfixes** (au début) changent le sens ; les **suffixes** (à la fin) changent souvent la nature du mot (nom, adjectif, verbe)."},{"type":"rule","title":"Les préfixes","text":"Contraire : [[un-]] (le plus courant : [[unfair]], [[unlucky]]), [[in-]] ([[invisible]]), [[im-]] devant m et p ([[impossible]], [[impolite]]), [[ir-]] devant r ([[irresponsible]]), [[il-]] devant l ([[illegal]], [[illogical]]), [[dis-]] ([[disagree]], [[dishonest]]). Autres : [[mis-]] = mal ([[misunderstand]]), [[re-]] = de nouveau ([[rewrite]]), [[over-]] = trop ([[overcrowded]]), [[under-]] = pas assez ([[undercooked]])."},{"type":"table","head":["Suffixe","Ça donne…","Exemples"],"rows":[["-ness, -ment, -ity, -tion, -ance","un nom","[[kindness]], [[improvement]], [[ability]], [[invention]], [[appearance]]"],["-hood, -ship","un nom (période, relation)","[[childhood]], [[friendship]]"],["-ful / -less","un adjectif (avec / sans)","[[helpful]], [[careless]], [[harmless]]"],["-able, -ous, -ive","un adjectif","[[enjoyable]], [[dangerous]], [[creative]]"],["-ize, -en","un verbe","[[realize]], [[organize]], [[strengthen]], [[widen]]"]]},{"type":"tip","text":"Pièges de francophone : [[unpossible]] n'existe pas → [[impossible]] ; on ne dit pas [[unpolite]] mais [[impolite]] ; « désaccord » donne [[disagree]], jamais [[desagree]]. Et le suffixe [[-ful]] n'a qu'**un seul l** : [[helpful]], [[careful]] (jamais helpfull)."},{"type":"rule","title":"L'orthographe qui bouge","text":"Le **y** devient **i** : [[happy]] → [[happiness]]. Le **e** final tombe souvent : [[create]] → [[creative]], [[argue]] → [[argument]] (mais [[excite]] → [[excitement]]). [[able]] → [[ability]], [[curious]] → [[curiosity]], [[strong]] → [[strength]] → [[strengthen]]."},{"type":"examples","items":[{"en":"It's impossible to finish this project in one night.","fr":"C'est impossible de finir ce projet en une seule nuit."},{"en":"Their friendship began in early childhood.","fr":"Leur amitié a commencé dans la petite enfance."},{"en":"Don't worry, this spider is completely harmless.","fr":"Ne t'inquiète pas, cette araignée est complètement inoffensive."},{"en":"Sorry, I think I misunderstood your question.","fr":"Désolé, je pense que j'ai mal compris ta question."}]},{"type":"dialogue","title":"La rédaction à refaire","lines":[{"who":"Zoé","en":"Ugh, I got my essay back. The teacher says I have to rewrite it.","fr":"Ouache, j'ai reçu ma rédaction corrigée. L'enseignante dit que je dois la réécrire."},{"who":"Noah","en":"Really? What was the problem?","fr":"Vraiment ? C'était quoi, le problème ?"},{"who":"Zoé","en":"Some parts were unclear, and I made a few careless mistakes.","fr":"Certaines parties n'étaient pas claires, et j'ai fait quelques fautes d'inattention."},{"who":"Noah","en":"That's not so bad. It's not impossible to fix!","fr":"Ce n'est pas si grave. Ce n'est pas impossible à corriger !"},{"who":"Zoé","en":"True. And she said there was a big improvement since last time.","fr":"C'est vrai. Et elle a dit qu'il y avait une grosse amélioration depuis la dernière fois."},{"who":"Noah","en":"See? That's really helpful feedback. Your next version will be even better.","fr":"Tu vois ? Ce sont des commentaires vraiment utiles. Ta prochaine version sera encore meilleure."}]}],"vocab":[{"en":"unfair","fr":"injuste","alt":[],"ex":"It's unfair that I always do the dishes!"},{"en":"unlucky","fr":"malchanceux (pas de chance)","alt":[],"ex":"We were unlucky: it rained all week."},{"en":"dishonest","fr":"malhonnête","alt":[],"ex":"Copying a friend's homework is dishonest."},{"en":"disagree","fr":"ne pas être d'accord","alt":[],"ex":"I disagree with you about that movie."},{"en":"misunderstand","fr":"mal comprendre","alt":[],"ex":"Sorry, I misunderstood your question."},{"en":"impolite","fr":"impoli","alt":["rude"],"ex":"It's impolite to talk with your mouth full."},{"en":"irresponsible","fr":"irresponsable","alt":[],"ex":"Leaving the stove on was irresponsible."},{"en":"rewrite","fr":"réécrire","alt":[],"ex":"I had to rewrite my whole essay."},{"en":"undercooked","fr":"pas assez cuit","alt":[],"ex":"The chicken was undercooked, so we put it back in the oven."},{"en":"overcrowded","fr":"bondé (trop plein de monde)","alt":["packed"],"ex":"The bus was overcrowded this morning."},{"en":"kindness","fr":"gentillesse","alt":[],"ex":"Thank you for your kindness."},{"en":"friendship","fr":"amitié","alt":[],"ex":"Their friendship lasted all their lives."},{"en":"childhood","fr":"enfance","alt":[],"ex":"My grandpa spent his childhood in Gatineau."},{"en":"improvement","fr":"amélioration","alt":[],"ex":"There's a big improvement in your writing."},{"en":"ability","fr":"capacité, habileté (être capable de)","alt":["skill"],"ex":"She has an amazing ability to learn languages."},{"en":"helpful","fr":"serviable, utile (qui aide)","alt":["useful"],"ex":"Thanks, you've been very helpful."},{"en":"careless","fr":"négligent, distrait (pas prudent)","alt":[],"ex":"I made a careless mistake on the test."},{"en":"harmless","fr":"inoffensif","alt":[],"ex":"Don't worry, that snake is harmless."},{"en":"enjoyable","fr":"agréable (qu'on apprécie)","alt":["pleasant"],"ex":"It was a very enjoyable evening."},{"en":"strengthen","fr":"renforcer","alt":[],"ex":"Swimming strengthens your whole body."}],"sentences":[{"en":"It's impossible to finish this project in one night.","fr":"C'est impossible de finir ce projet en une seule nuit.","trap":["unpossible","inpossible"],"alt":[]},{"en":"Thank you for your kindness and your patience.","fr":"Merci pour ta gentillesse et ta patience.","trap":["kindeness","kindful"],"alt":["Thank you for your patience and your kindness."]},{"en":"My parents disagree about which movie we should watch.","fr":"Mes parents ne sont pas d'accord sur le film qu'on devrait regarder.","trap":["unagree","desagree"],"alt":[]},{"en":"Sorry, I think I misunderstood your question.","fr":"Désolé, je pense que j'ai mal compris ta question.","trap":["disunderstood","ununderstood"],"alt":[]},{"en":"Leaving the door unlocked was really careless.","fr":"Laisser la porte déverrouillée, c'était vraiment négligent.","trap":["carefull","uncareful"],"alt":[]},{"en":"Their friendship began in early childhood.","fr":"Leur amitié a commencé dans la petite enfance.","trap":["friendhood","childship"],"alt":[]},{"en":"Don't worry, this spider is completely harmless.","fr":"Ne t'inquiète pas, cette araignée est complètement inoffensive.","trap":["harmfull","unharmful"],"alt":[]},{"en":"The bus was so overcrowded that we decided to walk.","fr":"L'autobus était tellement bondé qu'on a décidé de marcher.","trap":["undercrowded","such"],"alt":[]},{"en":"It's impolite to interrupt someone who is speaking.","fr":"C'est impoli d'interrompre quelqu'un qui parle.","trap":["unpolite","dispolite"],"alt":[]},{"en":"I need to rewrite my essay because it was too short.","fr":"Je dois réécrire ma rédaction parce qu'elle était trop courte.","trap":["unwrite","diswrite"],"alt":[]},{"en":"There has been a huge improvement in your English this year.","fr":"Ton anglais s'est énormément amélioré cette année.","trap":["improvation","improvness"],"alt":[]},{"en":"Exercise and good sleep strengthen your body.","fr":"L'exercice et un bon sommeil renforcent ton corps.","trap":["strongen","strengthens"],"alt":["Good sleep and exercise strengthen your body."]}],"grammar":[{"type":"mcq","q":"Le contraire de possible est…","choices":["unpossible","inpossible","impossible","dispossible"],"answer":2,"explain":"Devant p, le préfixe in- devient im- : impossible."},{"type":"mcq","q":"It's ___ to drive faster than the speed limit.","choices":["illegal","unlegal","dislegal","inlegal"],"answer":0,"explain":"Devant l, le préfixe in- devient il- : illegal."},{"type":"mcq","q":"Thank you! You've been very ___.","choices":["helpless","helpfull","helping","helpful"],"answer":3,"explain":"Qui aide = helpful, avec un seul l. Helpless veut dire « sans défense »."},{"type":"mcq","q":"Our ___ is the most important thing to me.","choices":["friendhood","friendship","friendness","friendity"],"answer":1,"explain":"Une relation → -ship : friendship."},{"type":"mcq","q":"My grandpa often talks about his ___ in Gatineau.","choices":["childship","childness","childhood","childment"],"answer":2,"explain":"Une période de la vie → -hood : childhood."},{"type":"mcq","q":"Quel mot veut dire « trop cuit » ?","choices":["overcooked","undercooked","miscooked","discooked"],"answer":0,"explain":"Over- = trop ; under- = pas assez."},{"type":"fill","q":"Please don't ___ me; I didn't mean it that way.","hint":"understand (mal)","answer":["misunderstand"],"explain":"Mis- = mal : misunderstand = mal comprendre."},{"type":"fill","q":"Your homework shows a big ___ since last month.","hint":"improve","answer":["improvement"],"explain":"Verbe + -ment = nom : improvement."},{"type":"fill","q":"Leaving your bike unlocked downtown is ___.","hint":"responsible (contraire)","answer":["irresponsible"],"explain":"Devant r, le préfixe devient ir- : irresponsible (deux r)."},{"type":"fill","q":"She has an amazing ___ to learn languages quickly.","hint":"able","answer":["ability"],"explain":"able → ability (nom en -ity)."},{"type":"fill","q":"The movie was so ___ that we watched it twice.","hint":"enjoy","answer":["enjoyable"],"explain":"Verbe + -able = adjectif : enjoyable (agréable)."},{"type":"fill","q":"The city decided to ___ the road because there were too many cars.","hint":"wide (verbe)","answer":["widen"],"explain":"Adjectif + -en = verbe : wide → widen (élargir)."},{"type":"error","q":"It's unpossible to sleep with all this noise.","wrong":1,"fix":["impossible"],"explain":"Unpossible n'existe pas : impossible."},{"type":"error","q":"Be carefull when you cross the street.","wrong":1,"fix":["careful"],"explain":"Le suffixe -ful n'a qu'un seul l : careful."},{"type":"error","q":"He was very unpolite to the waiter.","wrong":3,"fix":["impolite","rude"],"explain":"Le contraire de polite est impolite."},{"type":"error","q":"I completely desagree with you.","wrong":2,"fix":["disagree"],"explain":"En anglais, le préfixe est dis- : disagree."},{"type":"error","q":"That answer is unlogical.","wrong":3,"fix":["illogical"],"explain":"Devant l, on utilise il- : illogical."},{"type":"error","q":"There is a lot of happyness in this house.","wrong":5,"fix":["happiness"],"explain":"Le y devient i devant -ness : happiness."}],"reading":{"title":"The Kindness Club","text":"When Amir started grade eight, he felt invisible. His family had just moved to Ottawa, and he found it impossible to make friends. At lunch, he usually sat alone and pretended to read.\n\nOne day, his teacher, Madame Roy, announced that the school was starting a new club. Its goal was simple: to make the school a kinder place. Amir was unsure at first, but he decided to join.\n\nThe members of the Kindness Club did small, helpful things. They wrote encouraging notes and hid them in library books. They helped younger students who were lost or unhappy. Once a month, they organized a game afternoon for anyone who felt lonely. Nothing was too small. Even a smile, Madame Roy said, could change someone's day.\n\nAt first, some students thought the club was useless. A few boys even made unkind jokes about it. But little by little, the atmosphere in the school changed. There were fewer arguments in the hallways, and more students sat together at lunch.\n\nFor Amir, the biggest improvement was personal. His shyness slowly disappeared, and he discovered an ability that he didn't know he had: he was a wonderful listener. People enjoyed talking to him, and by the end of the year, he had more friends than he could count.\n\nYears later, Amir still remembers that club as the beginning of the most important friendship of his life. The boy who had sat next to him at the very first meeting became his best friend.","questions":[{"q":"How did Amir feel at the start of the year?","choices":["Popular","Invisible and alone","Angry","Excited"],"answer":1},{"q":"What was the goal of the club?","choices":["To win competitions","To read more books","To make the school a kinder place","To organize sports"],"answer":2},{"q":"Which activity did the club NOT do?","choices":["Hiding encouraging notes in books","Helping younger students","Organizing game afternoons","Selling cookies"],"answer":3},{"q":"What ability did Amir discover?","choices":["He was a great listener.","He was a great singer.","He was good at hockey.","He could speak four languages."],"answer":0},{"q":"What does the text suggest about small acts of kindness?","choices":["They are useless.","They can slowly change a whole school.","They only help the person who does them.","They are only for teachers."],"answer":1},{"q":"Why does Amir remember the club as so important?","choices":["Because Madame Roy gave him a prize","Because he became the club's president","Because he met his best friend there","Because the club became famous"],"answer":2}]},"pron":{"focus":"Les suffixes qui déplacent l'accent","ipa":"","explain":"Certains suffixes font **sauter** l'accent : avec [[-ity]], [[-ic]] et [[-ion]], l'accent tombe toujours sur la syllabe juste avant le suffixe. [[possible]] (« PÂ-si-beul ») devient [[possibility]] (« pâ-si-BI-li-ti »), [[economy]] devient [[economic]]. D'autres suffixes sont polis et ne touchent à rien : [[-ness]], [[-ment]], [[-ful]] gardent l'accent du mot de départ ([[happy]], [[happiness]]). Le piège des francophones : appuyer sur la fin de tous ces mots, comme en français (« possibili-TÉ »). Truc : « -ity, -ic, -ion » = accent juste avant moi !","words":[{"en":"possible","fr":"possible","hint":"« PÂ-si-beul » : accent au début, « beul » tout petit"},{"en":"possibility","fr":"une possibilité","hint":"« pâ-si-BI-li-ti » : accent juste avant -ity"},{"en":"economy","fr":"l'économie","hint":"« i-KÂ-neu-mi » : accent sur la 2e syllabe"},{"en":"economic","fr":"économique (lié à l'économie)","hint":"« è-keu-NÂ-mik » : accent juste avant -ic"},{"en":"electric","fr":"électrique","hint":"« i-LÈK-trik » : accent juste avant -ic"},{"en":"electricity","fr":"l'électricité","hint":"« i-lèk-TRI-si-ti » : l'accent saute juste avant -ity"},{"en":"educate","fr":"éduquer, instruire","hint":"« È-djeu-kéit » : accent au début ; « dj » comme dans [[juice]]"},{"en":"education","fr":"l'éducation, les études","hint":"« è-djeu-KÉI-cheun » : accent juste avant -tion"},{"en":"happy","fr":"heureux, heureuse","hint":"« HA-pi » : accent au début, h bien soufflé"},{"en":"happiness","fr":"le bonheur","hint":"« HA-pi-neus » : -ness ne déplace rien, l'accent reste au début"}],"pairs":[],"practice":["Electricity is essential to a modern economy.","Education is the key to happiness, and anything is possible."]},"mission":{"type":"ecrit","prompt":"Le site de ton école publie des critiques écrites par les élèves. Écris la critique d'un jeu vidéo (réel ou inventé) en cinq à sept phrases, avec au moins six mots fabriqués avec un préfixe ou un suffixe.","model":"This new puzzle game is absolutely unbelievable! The graphics are colourful, and the music is surprisingly relaxing. However, the instructions are a bit unclear, and I misunderstood the goal of the second level. The difficulty is also uneven: some levels are effortless, while others feel almost impossible. Still, the creativity of the designers is impressive, and the friendship between the two heroes is touching. My only disappointment was the price, which is unreasonable for such a short game.","checklist":["J'ai utilisé au moins trois préfixes ([[un-]], [[im-]], [[mis-]], [[dis-]]…)","J'ai utilisé au moins trois suffixes ([[-ness]], [[-ment]], [[-ity]], [[-ful]], [[-less]], [[-ive]]…)","J'ai choisi le bon préfixe négatif : [[impossible]], [[unclear]], pas [[unpossible]]","En relisant à voix haute, j'ai placé l'accent juste avant [[-ity]] : [[creativity]]"]}}]},{"id":11,"cefr":"C1","title":"Style","titleEn":"Style","intro":"Joue avec le style de l'anglais : mettre l'emphase comme un écrivain, passer du familier au formel, parler comme un vrai Canadien et déjouer les mots-pièges.","boss":{"name":"Lord Register","taunt":"Greetings, jeune personne. Je passe de « What's up? » à « I am writing to inform you » en un battement de cils. Never have I lost a duel… et ce n'est pas aujourd'hui que ça va commencer !","defeat":"Never have I been so humiliated… Bon. Fair enough, eh ?"},"units":[{"id":"11.1","title":"L'emphase","titleEn":"Little Did They Know","goal":"Mettre l'emphase sur une idée avec l'inversion, les phrases clivées et le do d'insistance.","lesson":[{"type":"p","text":"En français, pour frapper fort, tu dis : « Jamais je n'ai vu une chose pareille ! » L'anglais soutenu fait pareil, mais avec un truc spécial : quand la phrase **commence par un mot négatif ou restrictif**, on **inverse** l'auxiliaire et le sujet, comme dans une question : [[Never have I seen such a mess!]]"},{"type":"rule","title":"L'inversion après un mot négatif","text":"Mot négatif + **auxiliaire** + **sujet** + verbe. S'il y a déjà un auxiliaire (have, had, should, is…), on le met devant le sujet : [[Never have I been so tired.]] S'il n'y en a pas (présent ou passé simple), on ajoute **do / does / did** et le verbe revient à la **base** : [[Rarely does she complain.]] [[Little did he know…]]"},{"type":"table","head":["Début de phrase","Sens","Exemple"],"rows":[["Never / Rarely / Nowhere","jamais / rarement / nulle part","[[Rarely do we see moose in the city.]]"],["Not only … but also","non seulement… mais aussi","[[Not only did she win, but she also broke the record.]]"],["Hardly … when","à peine… que","[[Hardly had I sat down when the phone rang.]]"],["No sooner … than","aussitôt… que","[[No sooner had we arrived than it started to rain.]]"],["Under no circumstances / At no time","en aucun cas / à aucun moment","[[Under no circumstances should you open this door.]]"],["Little","être loin de se douter","[[Little did they know what was coming.]]"],["Only then / Only when / Only after","c'est seulement alors / quand / après que","[[Only then did I understand.]]"]]},{"type":"rule","title":"Les phrases clivées","text":"Pour mettre une partie de la phrase sous le projecteur : [[It was Tom who broke the window.]] (C'est Tom qui…) ou [[What I need is a long nap.]] (Ce dont j'ai besoin, c'est…). Avec **What**, le verbe be est au **singulier** : [[What we need is more time.]] On dit aussi [[All I want is…]] (Tout ce que je veux, c'est…). Pour une personne, c'est [[who]] (ou [[that]]), jamais [[which]] ni [[what]]."},{"type":"rule","title":"Le do d'insistance","text":"Pour insister ou contredire quelqu'un, ajoute **do / does / did** devant le verbe à la base, et appuie dessus en parlant : [[I do like your drawing!]] (Je l'aime vraiment !) [[She does know the answer.]] [[I did finish my homework!]] (Je te jure que je l'ai fini !)"},{"type":"examples","items":[{"en":"Never have I eaten such a big poutine.","fr":"Jamais je n'ai mangé une aussi grosse poutine."},{"en":"Only when the bell rang did we stop working.","fr":"C'est seulement quand la cloche a sonné qu'on a arrêté de travailler."},{"en":"It was Mei who found the solution.","fr":"C'est Mei qui a trouvé la solution."},{"en":"What surprised me was the silence.","fr":"Ce qui m'a surpris, c'est le silence."},{"en":"I did call you, but you didn't answer!","fr":"Je t'ai appelé, je te jure, mais tu n'as pas répondu !"}]},{"type":"tip","text":"Piège de francophone : on ne garde **pas** l'ordre normal après [[Never]] en début de phrase : ~~Never I have seen~~ → [[Never have I seen]]. Après l'auxiliaire, le verbe reste à la base : ~~Little did he knew~~ → [[Little did he know]]. Avec **Only when / Only after**, l'inversion se fait dans la **deuxième** partie : [[Only when I got home did I notice]]. Et retiens les couples : **Hardly… when**, mais **No sooner… than**."},{"type":"dialogue","title":"Après le match de soccer","lines":[{"who":"Ethan","en":"Never have I seen a goalie make so many saves!","fr":"Jamais je n'ai vu une gardienne faire autant d'arrêts !"},{"who":"Maya","en":"I know! Not only did she stop every penalty, but she also scored the last one.","fr":"Je sais ! Non seulement elle a arrêté tous les tirs de pénalité, mais en plus elle a marqué le dernier."},{"who":"Ethan","en":"Wait, it was the goalie who scored?","fr":"Attends, c'est la gardienne qui a marqué ?"},{"who":"Maya","en":"Yes! Little did the other team know that she used to play forward.","fr":"Oui ! L'autre équipe était loin de se douter qu'elle jouait autrefois à l'attaque."},{"who":"Ethan","en":"What I don't understand is why the coach didn't try that earlier.","fr":"Ce que je ne comprends pas, c'est pourquoi l'entraîneur n'a pas essayé ça avant."},{"who":"Maya","en":"Only at the last minute did he think of it.","fr":"C'est seulement à la dernière minute qu'il y a pensé."},{"who":"Ethan","en":"Well, I do hope she plays in the final!","fr":"Eh bien, j'espère vraiment qu'elle va jouer en finale !"}]}],"vocab":[{"en":"under no circumstances","fr":"en aucun cas","alt":["on no account"],"ex":"Under no circumstances should you feed the bears."},{"en":"not only … but also","fr":"non seulement… mais aussi","alt":[],"ex":"She is not only funny but also very kind."},{"en":"hardly","fr":"à peine (… when)","alt":["barely","scarcely"],"ex":"Hardly had we sat down when the fire alarm rang."},{"en":"no sooner … than","fr":"aussitôt… que (mot à mot : pas plus tôt… que)","alt":[],"ex":"No sooner had I left than it started to rain."},{"en":"little did I know","fr":"j'étais loin de me douter","alt":[],"ex":"Little did I know that my friends were hiding behind the couch."},{"en":"only then","fr":"c'est seulement à ce moment-là que","alt":[],"ex":"Only then did I see the note on the fridge."},{"en":"at no time","fr":"à aucun moment","alt":[],"ex":"At no time did the coach raise his voice."},{"en":"nowhere","fr":"nulle part","alt":[],"ex":"Nowhere is the snow as deep as in our backyard."},{"en":"what I need is","fr":"ce dont j'ai besoin, c'est","alt":[],"ex":"What I need is a good night's sleep."},{"en":"all I want is","fr":"tout ce que je veux, c'est","alt":[],"ex":"All I want is five more minutes of sleep."},{"en":"rarely","fr":"rarement","alt":["seldom"],"ex":"Rarely does my cat let anyone touch her."},{"en":"indeed","fr":"en effet, vraiment","alt":[],"ex":"It was a long trip indeed."},{"en":"astonished","fr":"stupéfait","alt":["amazed","stunned"],"ex":"We were astonished by the size of the moose."},{"en":"breathtaking","fr":"à couper le souffle","alt":[],"ex":"The view from the top of the mountain was breathtaking."},{"en":"spotless","fr":"impeccable, d'une propreté parfaite","alt":[],"ex":"After two hours of cleaning, the kitchen was spotless."},{"en":"emphasize","fr":"souligner, mettre l'accent sur","alt":["stress"],"ex":"The coach emphasized the importance of teamwork."},{"en":"unbelievable","fr":"incroyable","alt":["incredible"],"ex":"Your story is unbelievable!"},{"en":"reveal","fr":"révéler","alt":[],"ex":"A good magician never reveals his tricks."}],"sentences":[{"en":"Never have I seen such a beautiful sunset.","fr":"Jamais je n'ai vu un aussi beau coucher de soleil.","trap":["did","saw"],"alt":["I have never seen such a beautiful sunset."]},{"en":"Little did we know that the test had been cancelled.","fr":"Nous étions loin de nous douter que l'examen avait été annulé.","trap":["knew","didn't"],"alt":[]},{"en":"Not only did Félix win the race, but he also broke the school record.","fr":"Non seulement Félix a gagné la course, mais il a aussi battu le record de l'école.","trap":["won","does"],"alt":[]},{"en":"Hardly had we left the house when it started to rain.","fr":"À peine étions-nous sortis de la maison qu'il a commencé à pleuvoir.","trap":["than","did"],"alt":["We had hardly left the house when it started to rain."]},{"en":"No sooner had the bell rung than everyone ran outside.","fr":"Aussitôt la cloche sonnée, tout le monde a couru dehors.","trap":["when","rang"],"alt":["The bell had no sooner rung than everyone ran outside."]},{"en":"Under no circumstances should you share your password.","fr":"En aucun cas tu ne dois partager ton mot de passe.","trap":["shouldn't","don't"],"alt":["You should share your password under no circumstances."]},{"en":"Only then did I realize how lucky I was.","fr":"C'est seulement à ce moment-là que j'ai compris la chance que j'avais.","trap":["realized","I've"],"alt":[]},{"en":"What I really need is a long weekend at the cottage.","fr":"Ce dont j'ai vraiment besoin, c'est d'une longue fin de semaine au chalet.","trap":["that","are"],"alt":["A long weekend at the cottage is what I really need."]},{"en":"It was Zoé who found the missing keys under the couch.","fr":"C'est Zoé qui a trouvé les clés perdues sous le divan.","trap":["which","what"],"alt":[]},{"en":"I do like your drawing, but the colours are too dark.","fr":"J'aime vraiment ton dessin, mais les couleurs sont trop foncées.","trap":["likes","does"],"alt":[]},{"en":"We did warn you that the ice was too thin!","fr":"On t'avait bien prévenu que la glace était trop mince !","trap":["warned","does"],"alt":[]}],"grammar":[{"type":"mcq","q":"Never ___ such a delicious poutine.","choices":["I have eaten","have I eaten","I ate","did I ate"],"answer":1,"explain":"Never en début de phrase → inversion : auxiliaire (have) + sujet (I) + participe (eaten)."},{"type":"mcq","q":"Not only ___ the dishes, but he also cleaned his room.","choices":["he washed","he did wash","washed he","did he wash"],"answer":3,"explain":"Après Not only en début de phrase, on inverse avec did : did he wash (verbe à la base)."},{"type":"mcq","q":"No sooner had we sat down ___ the movie started.","choices":["than","when","that","then"],"answer":0,"explain":"On dit No sooner… than. (C'est Hardly qui va avec when.)"},{"type":"mcq","q":"Hardly had she closed the door ___ someone knocked.","choices":["than","then","when","that"],"answer":2,"explain":"On dit Hardly… when. (C'est No sooner qui va avec than.)"},{"type":"mcq","q":"Only when I got home ___ that my phone was missing.","choices":["I noticed","did I notice","I did notice","noticed I"],"answer":1,"explain":"Avec Only when, l'inversion se fait dans la deuxième partie de la phrase : did I notice."},{"type":"mcq","q":"It was Malik ___ scored the winning goal.","choices":["which","what","who","whom"],"answer":2,"explain":"Dans une phrase clivée sur une personne : It was Malik who… (ou that). Jamais which ni what pour une personne."},{"type":"fill","q":"Never ___ so much snow in one day!","hint":"I / see (present perfect)","answer":["have I seen"],"explain":"Never en tête → inversion : have I seen."},{"type":"fill","q":"Little ___ that his friends were planning a surprise.","hint":"he / know (passé)","answer":["did he know"],"explain":"Little en tête → did + sujet + verbe à la base : did he know."},{"type":"fill","q":"Under no circumstances ___ leave the room during the exam.","hint":"you / should","answer":["should you"],"explain":"Under no circumstances en tête → inversion : should you."},{"type":"fill","q":"Rarely ___ late for school.","hint":"Ethan / be (présent)","answer":["is Ethan"],"explain":"Rarely en tête → on inverse be et le sujet : is Ethan."},{"type":"fill","q":"What I love about winter ___ skating on the canal.","hint":"be (présent)","answer":["is"],"explain":"Phrase clivée avec What : le verbe be est au singulier → is."},{"type":"fill","q":"You say I never help, but I ___ the dishes yesterday!","hint":"do (passé, avec insistance)","answer":["did do"],"explain":"Do d'insistance au passé : did + verbe à la base → I did do the dishes."},{"type":"error","q":"Never have I saw such a mess.","wrong":3,"fix":["seen"],"explain":"Après have, il faut le participe passé : have I seen, pas saw."},{"type":"error","q":"No sooner had we arrived when it began to snow.","wrong":5,"fix":["than"],"explain":"No sooner va toujours avec than."},{"type":"error","q":"Not only did she sang, but she also danced.","wrong":4,"fix":["sing"],"explain":"Après did, le verbe revient à la base : did she sing."},{"type":"error","q":"It was Amir which helped me with my project.","wrong":3,"fix":["who","that"],"explain":"Amir est une personne : It was Amir who (ou that) helped me."},{"type":"error","q":"Only after the game did we went for pizza.","wrong":6,"fix":["go"],"explain":"Après did, le verbe est à la base : did we go."},{"type":"error","q":"She does likes your idea; she's just shy.","wrong":2,"fix":["like"],"explain":"Do d'insistance : does + verbe à la base → she does like."}],"reading":{"title":"The Night the Lights Went Out","text":"Never had Priya been so excited about a sleepover. Her cousin Léa had come all the way from Montreal, and the two girls had planned the perfect evening: pizza, a movie and a board game that would probably last until midnight.\n\nLittle did they know that the weather had other plans. Around eight o'clock, freezing rain began to fall on Ottawa. Hardly had the movie started when the lights flickered and the screen went black. The whole street was dark.\n\nWhat surprised Priya most was how quiet the house became. No fridge humming, no music from her brother's room, nothing at all. Only then did she realize how much noise their machines made every day.\n\nHer dad lit a few candles and found an old lantern in the basement. Not only did he find the board game in the dark, but he also managed to make hot chocolate on the gas stove. Under no circumstances, he told the girls, were they to open the fridge, because the food had to stay cold.\n\nIt was Léa who suggested telling stories instead of playing. At first, Priya rolled her eyes. Rarely did her cousin have good ideas, or so she thought. But Léa's story about a lost beaver who dreamed of becoming a hockey player was so funny that even Priya's dad laughed until he cried.\n\nNo sooner had they finished the third story than the lights came back on. The fridge started humming, the movie started playing again, and Priya's brother cheered from upstairs.\n\nStrangely, nobody wanted to watch the movie anymore. “Can we turn the lights off again?” Léa asked. And she did mean it.\n\nThe next morning, Priya wrote one sentence in her diary: “Never have I enjoyed a blackout so much.”","questions":[{"q":"Why was Léa at Priya's house?","choices":["She lived next door.","Her own house had lost power.","She had come from Montreal for a sleepover.","She wanted to borrow a board game."],"answer":2},{"q":"What happened just after the movie started?","choices":["The lights went out.","Priya's brother started playing music.","Léa told a story.","The freezing rain stopped."],"answer":0},{"q":"Why did Priya's dad tell the girls not to open the fridge?","choices":["He was hiding a surprise in it.","The fridge door was broken.","It was making too much noise.","He wanted to keep the food cold."],"answer":3},{"q":"Before that night, what did Priya think of Léa's ideas?","choices":["She thought they were usually excellent.","She thought they were usually not very good.","She thought they were too scary.","She had never heard any of them."],"answer":1},{"q":"Why did nobody want to watch the movie anymore?","choices":["The screen was still broken.","It was too late to watch anything.","They had enjoyed the evening without electricity more.","Priya's brother wanted the TV."],"answer":2},{"q":"What does the last sentence of the story suggest?","choices":["The blackout became a happy memory for Priya.","Priya was angry about the blackout.","Priya was scared during the whole night.","Priya wants to stop writing in her diary."],"answer":0}]},"pron":{"focus":"L'accent d'insistance qui change le sens","ipa":"","explain":"En anglais, on peut changer le sens d'une phrase sans changer un seul mot, juste en appuyant sur un autre mot ! Dans [[I didn't say he stole it]], appuie sur « I » et c'est quelqu'un d'autre qui l'a dit ; sur « say », tu l'as seulement pensé ; sur « he », c'est un autre qui l'a volé ; sur « stole », il l'a peut-être juste emprunté. Le piège des francophones : en français, on insiste avec « c'est moi qui… », alors qu'en anglais la voix suffit (et [[I did do it]] sert aussi à insister). Chaque exemple ci-dessous a une suite qui aide la voix de synthèse à trouver le bon accent, mais si elle insiste trop peu, exagère toi-même : plus fort, plus long, plus haut !","words":[{"en":"I didn't say he stole it, Emma did","fr":"ce n'est pas moi qui ai dit qu'il l'avait volé, c'est Emma","hint":"« AÏ-di-deunt-séi… » : tout le poids sur [[I]], le reste bien plat"},{"en":"I didn't say he stole it, I only thought it","fr":"je ne l'ai pas dit, je l'ai seulement pensé","hint":"« aï-di-deunt-SÉI… » : appuie sur [[say]], puis sur [[thought]]"},{"en":"I didn't say he stole it, I said she did","fr":"je n'ai pas dit que c'était lui, j'ai dit que c'était elle","hint":"« …séi-HII-stôl-it » : appuie sur [[he]] puis sur [[she]]"},{"en":"I didn't say he stole it, he borrowed it","fr":"je n'ai pas dit qu'il l'avait volé, il l'a emprunté","hint":"« …séi-hi-STÔL-it » : appuie sur [[stole]] puis sur [[borrowed]]"},{"en":"I did do my homework","fr":"je les ai vraiment faits, mes devoirs !","hint":"« aï-DID-dou-maï-HÔM-weurk » : [[did]] très fort, c'est l'insistance"},{"en":"never have I seen","fr":"jamais je n'ai vu","hint":"« NÈ-veur-hav-aï-SIIN » : gros accent sur [[never]]"},{"en":"little did he know","fr":"il était loin de se douter","hint":"« LI-deul-did-hi-NÔ » : le t devient un « d » léger ; accent sur [[little]] et [[know]]"},{"en":"what I need is a break","fr":"ce dont j'ai besoin, c'est une pause","hint":"« weut-aï-NIID-iz-eu-BRÉIK » : la voix monte sur [[need]], puis tombe sur [[break]]"},{"en":"it was Maya who called","fr":"c'est Maya qui a appelé","hint":"« it-weuz-MAÏ-eu-hou-KÂLD » : tout l'accent sur le nom"}],"pairs":[],"practice":["I didn't say he stole it.","Never have I seen such a huge snowman!","What I really need is a long vacation."]},"mission":{"type":"oral","prompt":"Raconte à voix haute, en cinq à sept phrases, la plus belle surprise de ta vie (vraie ou inventée). Utilise au moins deux inversions ([[Never have I…]], [[Little did I know…]], [[Not only…]]) et une phrase clivée ([[What I loved most was…]], [[It was… who…]]).","model":"Let me tell you about the best surprise of my life. Little did I know, when I walked into the gym, that my whole class was waiting for me. Not only had they decorated the room, but they had also baked my favourite cake. Never have I felt so happy! What I loved most was the funny video they had made. And it was my best friend Zoé who had organized everything. I really do owe her a big thank-you!","checklist":["Après [[Never]], [[Little]] ou [[Not only]], j'ai inversé : [[Never have I felt]], pas [[Never I have felt]]","J'ai fait une phrase clivée avec [[What I…]] ou [[It was… who…]]","J'ai utilisé [[do]] ou [[did]] d'insistance au moins une fois","J'ai appuyé fort sur les mots d'insistance ([[never]], [[did]], le nom après [[It was]])"]}},{"id":"11.2","title":"Formel ou familier","titleEn":"Dear Sir or Madam","goal":"Passer du langage familier au langage formel et écrire un courriel poli et soutenu.","lesson":[{"type":"p","text":"Un même message peut s'habiller en jogging ou en complet-cravate. À ton ami : [[I need help.]] À la directrice : [[I would appreciate your assistance.]] C'est ce qu'on appelle le **registre** : familier, neutre ou formel."},{"type":"table","head":["Familier / neutre","Formel","Sens"],"rows":[["ask for","[[request]]","demander"],["help","[[assist]]","aider"],["need","[[require]]","avoir besoin de"],["buy","[[purchase]]","acheter"],["find out","[[discover]]","découvrir, apprendre"],["give back","[[return]]","rendre"],["tell","[[inform]]","informer"],["get","[[receive]]","recevoir"],["about","[[regarding]]","au sujet de"],["enough","[[sufficient]]","suffisant"],["say sorry","[[apologize]]","s'excuser"]]},{"type":"rule","title":"Le courriel formel, étape par étape","text":"1. Ouverture : [[Dear Sir or Madam,]] (si tu ne connais pas le nom). 2. Le but : [[I am writing to request information about…]] 3. La demande polie : [[I would be grateful if you could…]] 4. Une pièce jointe : [[Please find attached…]] 5. La fin : [[Thank you in advance for your assistance.]] [[I look forward to hearing from you.]] 6. La signature : [[Kind regards,]] ou [[Sincerely,]]. **Pas de contractions** dans un courriel formel : [[I am]], pas [[I'm]]."},{"type":"rule","title":"look forward to + -ing","text":"Dans [[look forward to]], le mot [[to]] est une **préposition**, pas le « to » de l'infinitif. Donc il est suivi d'un nom ou d'un verbe en **-ing** : [[I look forward to hearing from you.]] [[We look forward to meeting you.]] Jamais ~~look forward to hear~~."},{"type":"rule","title":"L'oral familier : gonna, wanna, gotta","text":"Entre amis, à l'oral ou par texto : [[gonna]] = going to, [[wanna]] = want to, [[gotta]] = (have) got to. [[I'm gonna be late.]] [[Do you wanna come?]] [[I gotta go!]] Attention : [[gonna]] remplace seulement **going to + verbe**. Pour un lieu, on garde [[going to]] : [[I'm going to the mall]], jamais ~~I'm gonna the mall~~. Et ces formes n'ont **jamais** leur place dans un courriel formel."},{"type":"examples","items":[{"en":"I am writing to request information about your summer camp.","fr":"Je vous écris pour demander des renseignements sur votre camp d'été."},{"en":"I would be grateful if you could reply by Friday.","fr":"Je vous serais reconnaissant de répondre d'ici vendredi."},{"en":"Please find attached my application form.","fr":"Vous trouverez ci-joint mon formulaire d'inscription."},{"en":"We apologize for any inconvenience.","fr":"Nous nous excusons pour tout désagrément."},{"en":"I'm gonna call you after supper.","fr":"Je vais t'appeler après le souper."}]},{"type":"tip","text":"Deux pièges de francophone : 1) ~~I look forward to see you~~ → [[I look forward to seeing you]]. 2) Le faux ami [[demand]] ne veut **pas** dire « demander » : il veut dire **exiger**, et ça sonne agressif ! Pour demander poliment, c'est [[request]] ou [[ask for]]."},{"type":"dialogue","title":"Un courriel à la bibliothèque","lines":[{"who":"Sofia","en":"I gotta write to the library. My book is two weeks late!","fr":"Il faut que j'écrive à la bibliothèque. Mon livre a deux semaines de retard !"},{"who":"Olivia","en":"Okay, but don't start with “Hey”. Start with “Dear Sir or Madam”.","fr":"OK, mais ne commence pas par « Hey ». Commence par « Dear Sir or Madam »."},{"who":"Sofia","en":"Then what? “I wanna give the book back later”?","fr":"Et après ? « Je veux ren
