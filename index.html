"Selon Sofia, quel animal coûte moins cher qu'un chien ?","choices":["le poisson","le lapin","le chat","l'oiseau"],"answer":2},{"q":"Quelle idée a la mère ?","choices":["un poisson","un chien","un chat","un oiseau"],"answer":0},{"q":"Pourquoi les jumeaux n'aiment-ils pas cette idée ?","choices":["Le poisson coûte trop cher.","Le poisson est bruyant.","Ils ont peur des poissons.","Le poisson est l'animal le plus ennuyant."],"answer":3},{"q":"Qu'est-ce qui est surprenant à la fin ?","choices":["Ils se disputent encore.","Ils achètent un chien.","Les jumeaux sont enfin d'accord.","La mère se fâche."],"answer":2}]},"pron":{"focus":"Le son « eur » de bird","ipa":"/ɜr/","explain":"Les francophones lisent souvent les lettres une par une : « bird » avec un « i », « work » avec un « o », « learn » avec « éa »… Mais en anglais, **ir**, **er**, **ur**, **ear** et **or** après un « w » donnent presque toujours le même son : un « eu » suivi d'un « r » anglais, « eurr ». Arrondis un peu les lèvres, recule le bout de ta langue sans toucher le palais, et grogne tout doucement : [[bird]] = « beurd », [[work]] = « weurk », [[learn]] = « leurn ». Attention, sinon [[work]] (travailler) devient [[walk]] (marcher), et [[shirt]] (chemise) devient [[short]] (court) !","words":[{"en":"bird","fr":"oiseau","hint":"« beurd » : « eu » + « r » anglais, pas « bird » avec un « i »"},{"en":"first","fr":"premier, première","hint":"« feurst » : le « ir » fait « eur »"},{"en":"worse","fr":"pire (comparatif de bad)","hint":"« weurss » : le « or » après « w » fait « eur »"},{"en":"worst","fr":"le pire (superlatif de bad)","hint":"« weurst » : comme [[worse]], plus un « t »"},{"en":"work","fr":"travailler ; le travail","hint":"« weurk » : pas « wôrk » ! Sinon on entend [[walk]]"},{"en":"word","fr":"mot","hint":"« weurd » : le « or » fait « eur »"},{"en":"learn","fr":"apprendre","hint":"« leurn » : le « ear » fait « eur », pas « léarne »"},{"en":"heard","fr":"a entendu (passé de hear)","hint":"« heurd » : rime avec [[bird]], pas avec [[hear]]"},{"en":"shirt","fr":"chemise ; t-shirt (dans T-shirt)","hint":"« cheurt » : le « ir » fait « eur »"},{"en":"girl","fr":"fille","hint":"« gueurl » : « eur », puis un « l » ; une seule syllabe"}],"pairs":[["walk","work"],["short","shirt"],["torn","turn"],["four","fur"],["born","burn"],["heart","hurt"]],"practice":["The early bird catches the worm.","My first word was bird.","This shirt is worse than that one, but this one is the worst!"]},"mission":{"type":"ecrit","prompt":"Le journal de l'école organise un débat : l'hiver ou l'été à Ottawa ? Écris un court texte d'opinion qui compare les deux saisons, avec au moins un comparatif et un superlatif.","model":"In my opinion, winter is better than summer. Summer is hotter, but winter is more fun! Skating on the Rideau Canal is the best activity of the year. The worst thing about winter is the cold wind, but my new coat is warmer than my old one.","checklist":["J'ai utilisé -er ou [[more]] + [[than]] pour comparer (jamais « more hot » ni « more big »)","J'ai utilisé [[the]] + -est ou [[the most]] pour un superlatif","J'ai utilisé les formes irrégulières : [[better]], [[the best]], [[worse]], [[the worst]]","J'ai écrit [[than]] (comparaison), pas [[that]]","J'ai relu à voix haute : « weurss » pour [[worse]], « weurst » pour [[worst]]"]}},{"id":"6.3","title":"As-tu déjà… ?","titleEn":"Have You Ever?","goal":"Raconter tes expériences de vie avec le present perfect, ever, never, been et gone.","lesson":[{"type":"p","text":"As-tu déjà vu un orignal ? As-tu déjà mangé des sushis ? Pour parler de tes **expériences de vie**, sans dire **quand**, l'anglais utilise le **present perfect**."},{"type":"rule","title":"La formule","text":"**have / has + participe passé**. [[I have seen a moose.]] [[She has never eaten sushi.]] Question : [[Have you ever been to Toronto?]] Réponse courte : [[Yes, I have.]] / [[No, I haven't.]] Contractions : [[I've]], [[she's]], [[haven't]], [[hasn't]]."},{"type":"table","head":["Base","Passé","Participe passé"],"rows":[["be","was / were","[[been]]"],["go","went","[[gone]]"],["see","saw","[[seen]]"],["do","did","[[done]]"],["eat","ate","[[eaten]]"],["write","wrote","[[written]]"],["take","took","[[taken]]"],["break","broke","[[broken]]"],["fly","flew","[[flown]]"],["ride","rode","[[ridden]]"],["swim","swam","[[swum]]"],["drive","drove","[[driven]]"],["meet","met","[[met]]"],["try","tried","[[tried]]"]]},{"type":"rule","title":"Ever, never, once, twice","text":"[[ever]] = déjà (dans une question) : [[Have you ever tried maple taffy?]] [[never]] = jamais, avec un verbe **affirmatif** : [[I have never flown.]] Combien de fois : [[once]] (une fois), [[twice]] (deux fois), [[three times]]."},{"type":"rule","title":"Been ou gone ?","text":"[[She has been to Paris.]] = elle y est allée **et elle est revenue**. [[She has gone to Paris.]] = elle est partie là-bas **et elle y est encore**. Pour raconter une expérience, c'est presque toujours **been**."},{"type":"examples","items":[{"en":"Have you ever seen a moose?","fr":"As-tu déjà vu un orignal ?"},{"en":"I have never eaten sushi.","fr":"Je n'ai jamais mangé de sushis."},{"en":"My grandparents have been to Mexico twice.","fr":"Mes grands-parents sont allés au Mexique deux fois."},{"en":"Mom isn't here. She has gone to the store.","fr":"Maman n'est pas là. Elle est partie au magasin."},{"en":"Has your brother ever broken his arm?","fr":"Ton frère s'est-il déjà cassé le bras ?"}]},{"type":"tip","text":"Pièges de francophone : « Je n'ai jamais… » = [[I have never…]], **pas** [[I haven't never]] (une seule négation !). « Es-tu déjà allé à… ? » = [[Have you ever been to…?]] Et attention au participe : [[I have seen]], jamais [[I have saw]]."},{"type":"dialogue","title":"Le Carnaval","lines":[{"who":"Zoé","en":"Have you ever been to Quebec City?","fr":"Es-tu déjà allée à Québec ?"},{"who":"Mei","en":"Yes, I have! I've been there twice.","fr":"Oui ! J'y suis allée deux fois."},{"who":"Zoé","en":"Lucky! I've never been there. Have you ever tried maple taffy?","fr":"Chanceuse ! Je n'y suis jamais allée. As-tu déjà goûté la tire d'érable ?"},{"who":"Mei","en":"Of course! I ate some at the Winter Carnival last year.","fr":"Bien sûr ! J'en ai mangé au Carnaval d'hiver l'année passée."},{"who":"Zoé","en":"Where's your brother? Is he home?","fr":"Où est ton frère ? Est-il à la maison ?"},{"who":"Mei","en":"No, he's gone to the library. He has never been to the Carnival!","fr":"Non, il est parti à la bibliothèque. Lui, il n'est jamais allé au Carnaval !"}]},{"type":"fun","text":"Le sais-tu ? La tire d'érable (en anglais [[maple taffy]]) se fait en versant du sirop d'érable bouillant sur de la neige propre. On l'enroule ensuite sur un bâtonnet. Miam !"}],"vocab":[{"en":"ever","fr":"déjà (dans une question)","alt":[],"ex":"Have you ever seen a whale?"},{"en":"never","fr":"jamais","alt":[],"ex":"I have never been to Europe."},{"en":"once","fr":"une fois","alt":[],"ex":"I have ridden a horse once."},{"en":"twice","fr":"deux fois","alt":[],"ex":"She has seen that movie twice."},{"en":"been","fr":"été (participe passé de be)","alt":[],"ex":"Have you ever been to Toronto?"},{"en":"gone","fr":"allé, parti (participe passé de go)","alt":[],"ex":"Dad has gone to work."},{"en":"seen","fr":"vu (participe passé de see)","alt":[],"ex":"I have never seen a bear."},{"en":"done","fr":"fait (participe passé de do)","alt":[],"ex":"Have you done your homework?"},{"en":"eaten","fr":"mangé (participe passé de eat)","alt":[],"ex":"Have you ever eaten snails?"},{"en":"written","fr":"écrit (participe passé de write)","alt":[],"ex":"She has written a story in English."},{"en":"taken","fr":"pris (participe passé de take)","alt":[],"ex":"I have never taken the train."},{"en":"broken","fr":"cassé (participe passé de break)","alt":[],"ex":"Liam has broken his leg twice."},{"en":"flown","fr":"pris l'avion (participe passé de fly)","alt":[],"ex":"Have you ever flown in a helicopter?"},{"en":"ridden","fr":"monté, fait du cheval ou du vélo (participe passé de ride)","alt":[],"ex":"Have you ever ridden a horse?"},{"en":"swum","fr":"nagé (participe passé de swim)","alt":[],"ex":"I have swum in the ocean."},{"en":"driven","fr":"conduit (participe passé de drive)","alt":[],"ex":"My sister has never driven a car."},{"en":"met","fr":"rencontré (participe passé de meet)","alt":[],"ex":"Have you ever met a famous person?"},{"en":"tried","fr":"essayé, goûté (participe passé de try)","alt":[],"ex":"Have you ever tried maple taffy?"}],"sentences":[{"en":"Have you ever seen a moose?","fr":"As-tu déjà vu un orignal ?","trap":["saw","Did"],"alt":[]},{"en":"I have never eaten sushi.","fr":"Je n'ai jamais mangé de sushis.","trap":["ate","ever"],"alt":[]},{"en":"My grandparents have been to Mexico twice.","fr":"Mes grands-parents sont allés au Mexique deux fois.","trap":["went","was"],"alt":[]},{"en":"She isn't here. She has gone to the dentist.","fr":"Elle n'est pas là. Elle est partie chez le dentiste.","trap":["went","have"],"alt":[]},{"en":"Has your brother ever broken his arm?","fr":"Ton frère s'est-il déjà cassé le bras ?","trap":["broke","Did"],"alt":[]},{"en":"I have flown to Vancouver once.","fr":"J'ai pris l'avion pour Vancouver une fois.","trap":["flew","flied"],"alt":[]},{"en":"Have they ever ridden a horse?","fr":"Ont-ils déjà fait du cheval ?","trap":["rode","Do"],"alt":[]},{"en":"I have met a famous hockey player.","fr":"J'ai rencontré un joueur de hockey célèbre.","trap":["meeted","has"],"alt":[]},{"en":"Zoé has written three stories in English.","fr":"Zoé a écrit trois histoires en anglais.","trap":["wrote","have"],"alt":[]},{"en":"How many times have you been to Toronto?","fr":"Combien de fois es-tu allé à Toronto ?","trap":["did","was"],"alt":[]},{"en":"My dad has never driven a big truck.","fr":"Mon père n'a jamais conduit de gros camion.","trap":["drove","ever"],"alt":[]},{"en":"Have you ever tried maple taffy?","fr":"As-tu déjà goûté la tire d'érable ?","trap":["try","Did"],"alt":[]}],"grammar":[{"type":"mcq","q":"Have you ever ___ a bear?","choices":["saw","seen","see","seeing"],"answer":1,"explain":"Present perfect = have + participe passé : seen."},{"type":"mcq","q":"Emma ___ never been to Montreal.","choices":["have","is","has","did"],"answer":2,"explain":"Avec she (Emma), on utilise has."},{"type":"mcq","q":"Mom isn't home. She has ___ to the store.","choices":["gone","been","went","go"],"answer":0,"explain":"Elle n'est pas revenue (isn't home) : has gone."},{"type":"mcq","q":"I've ___ to Quebec City twice. I loved it!","choices":["go","went","be","been"],"answer":3,"explain":"Expérience terminée, on est revenu : been."},{"type":"mcq","q":"« Have you ever eaten poutine? » Réponse courte positive :","choices":["Yes, I did.","Yes, I have.","Yes, I ate.","Yes, I am."],"answer":1,"explain":"On répond avec le même auxiliaire que la question : Have you…? → Yes, I have."},{"type":"mcq","q":"Comment dit-on « Je n'ai jamais nagé dans un lac » ?","choices":["I have never swam in a lake.","I haven't never swum in a lake.","I have never swum in a lake.","I have never swim in a lake."],"answer":2,"explain":"Have + never + participe passé (swum). Une seule négation."},{"type":"fill","q":"Have you ever ___ a horse?","hint":"ride","answer":["ridden"],"explain":"Ride → rode → ridden."},{"type":"fill","q":"My grandma has never ___ a car.","hint":"drive","answer":["driven"],"explain":"Drive → drove → driven."},{"type":"fill","q":"Liam has ___ his arm twice!","hint":"break","answer":["broken"],"explain":"Break → broke → broken."},{"type":"fill","q":"___ you ever been to Vancouver?","hint":"auxiliaire","answer":["Have"],"explain":"Question au present perfect avec you : Have you ever…?"},{"type":"fill","q":"My parents have ___ this movie three times.","hint":"see","answer":["seen"],"explain":"See → saw → seen."},{"type":"fill","q":"She has ___ on a plane many times.","hint":"fly","answer":["flown"],"explain":"Fly → flew → flown."},{"type":"fill","q":"I have ___ eaten snails. Yuck!","hint":"jamais","answer":["never"],"explain":"« Jamais » = never, entre have et le participe."},{"type":"error","q":"Have you ever saw a moose?","wrong":3,"fix":["seen"],"explain":"Après have, le participe passé : seen, pas saw."},{"type":"error","q":"My mom and dad has never flown in a helicopter.","wrong":4,"fix":["have"],"explain":"My mom and dad = they, donc have."},{"type":"error","q":"Has Lucas and Mei ever ridden a horse?","wrong":0,"fix":["Have"],"explain":"Lucas and Mei = they, donc Have."},{"type":"error","q":"Has your uncle ever wrote a book?","wrong":4,"fix":["written"],"explain":"Write → wrote → written : après has, le participe passé."},{"type":"error","q":"Where is Félix? He has been to the store.","wrong":5,"fix":["gone"],"explain":"Félix n'est pas revenu : il est encore au magasin, donc has gone."}],"reading":{"title":"Karim's Adventures","text":"Karim is thirteen, but he has already done many exciting things. He has been to six countries, and he has flown on a plane more than ten times. He has seen whales near Tadoussac, in Quebec, and he has swum in the Pacific Ocean.\n\nHe has also tried many kinds of food. He has eaten sushi in Vancouver and poutine in Montreal. But he has never eaten snails, and he says he never will!\n\nKarim's best friend, Ana, has never travelled outside Ontario. \"Have you ever been scared on a plane?\" she asks. \"Never,\" says Karim. \"But I have been scared on a horse! I have ridden a horse only once.\"\n\nRight now, Karim isn't at school. He has gone to Toronto with his dad, and Ana misses him already.","questions":[{"q":"Dans combien de pays Karim est-il allé ?","choices":["trois","six","dix","treize"],"answer":1},{"q":"Qu'est-ce que Karim n'a jamais mangé ?","choices":["des sushis","de la poutine","du sirop d'érable","des escargots"],"answer":3},{"q":"Où Karim a-t-il vu des baleines ?","choices":["près de Tadoussac","à Vancouver","à Toronto","en Ontario"],"answer":0},{"q":"Qu'est-ce qui a déjà fait peur à Karim ?","choices":["l'avion","une baleine","un cheval","les escargots"],"answer":2},{"q":"Où est Karim en ce moment ?","choices":["à l'école","à Toronto","à Montréal","chez Ana"],"answer":1}]},"pron":{"focus":"Les contractions de have","ipa":"","explain":"À l'oral, [[have]] et [[has]] se cachent souvent dans des contractions : [[I have]] devient [[I've]] (« aïv »), [[she has]] devient [[she's]] (« chiiz »). Le « v » de [[I've]] est tout petit, mais ne le saute pas : « I seen » est une faute, il faut dire [[I've seen]] ! Attention, [[she's]] peut vouloir dire **she is** ou **she has** : regarde le mot d'après ([[She's eating]] = she is, [[She's eaten]] = she has). Et voici un secret canadien : [[been]] se dit « binn », avec un « i » court, comme [[bin]] (poubelle), et pas « biine ».","words":[{"en":"I've","fr":"j'ai (I have)","hint":"« aïv » : une seule syllabe, avec un petit « v » qu'on entend à peine"},{"en":"you've","fr":"tu as (you have)","hint":"« youv » : une seule syllabe"},{"en":"we've","fr":"nous avons (we have)","hint":"« wiiv » : « ii » long, petit « v »"},{"en":"she's been","fr":"elle est allée, elle a été (she has been)","hint":"« chiiz-BINN » : ici, [[she's]] = she has ; [[been]] avec un « i » court"},{"en":"haven't","fr":"n'ai pas, n'avons pas…","hint":"« HA-veunt » : accent au début, « t » final très léger"},{"en":"hasn't","fr":"n'a pas","hint":"« HA-zeunt » : le « s » se dit « z »"},{"en":"have you ever","fr":"as-tu déjà… ?","hint":"« hav-yeu-ÈV-eur » : la force va sur « ÈV »"},{"en":"I've never","fr":"je n'ai jamais","hint":"« aïv-NÈV-eur » : la force va sur « NÈV »"},{"en":"been","fr":"été, allé (participe de be)","hint":"« binn » : au Canada, un « i » court ; pas « biine »"},{"en":"gone","fr":"allé, parti (participe de go)","hint":"« gânn » : un « â » ouvert ; [[gone]] = parti et pas encore revenu"}],"pairs":[],"practice":["Have you ever been to Vancouver?","I've never seen a moose, but my sister has.","She's been to Toronto, but she hasn't been to Montreal."]},"mission":{"type":"oral","prompt":"Pendant un dîner de famille, tu joues à « As-tu déjà… ? » avec ta cousine anglophone Olivia. Pose-lui deux questions avec [[Have you ever]], et raconte deux de tes propres expériences (une chose que tu as déjà faite, une chose que tu n'as jamais faite).","model":"Have you ever been to Quebec City? I've been there twice with my family. Have you ever eaten poutine? I've never tried maple taffy, but my brother has. He says it's delicious!","checklist":["J'ai posé mes questions avec [[Have you ever]] + participe passé ([[been]], [[eaten]], [[seen]])","J'ai utilisé [[I've]] ou [[I've never]] pour parler de mes expériences, sans date précise","J'ai dit [[been]] « binn », avec un « i » court","J'ai fait entendre le petit « v » de [[I've]]"]}},{"id":"6.4","title":"Depuis","titleEn":"Since When?","goal":"Dire depuis quand avec for / since, already, yet, just, et choisir entre present perfect et passé simple.","lesson":[{"type":"p","text":"En français, on dit « J'habite ici **depuis** deux ans » au présent. En anglais, c'est **impossible** : une situation qui a commencé dans le passé et qui **continue encore** se met au **present perfect**."},{"type":"rule","title":"For ou since ?","text":"**for** + une **durée** : [[for two years]], [[for ten minutes]], [[for ages]]. **since** + un **point de départ** : [[since Monday]], [[since September]], [[since I was six]]. Question : [[How long have you lived here?]] (Depuis combien de temps… ?)"},{"type":"table","head":["for (durée)","since (point de départ)"],"rows":[["[[for three days]]","[[since Tuesday]]"],["[[for a week]]","[[since last week]]"],["[[for five years]]","[[since grade one]]"],["[[for a long time]]","[[since I was born]]"]]},{"type":"rule","title":"Already, yet, just","text":"[[already]] = déjà (c'est fait, parfois plus tôt que prévu) : [[I've already finished.]] [[yet]] = encore / déjà, à la **fin** d'une question ou d'une négation : [[Have you finished yet?]] [[I haven't finished yet.]] [[just]] = venir de : [[I've just eaten.]] (Je viens de manger.)"},{"type":"rule","title":"Present perfect ou passé simple ?","text":"Si tu dis **quand** (yesterday, last year, two days ago, when I was six), c'est le **passé simple** : [[I lost my keys yesterday.]] Si le moment n'est pas précisé ou si ça continue jusqu'à maintenant : **present perfect** : [[I've lost my keys!]] [[I've lived here for two years.]]"},{"type":"examples","items":[{"en":"I have lived in Ottawa for five years.","fr":"J'habite à Ottawa depuis cinq ans."},{"en":"She has been sick since Monday.","fr":"Elle est malade depuis lundi."},{"en":"We moved here when I was six.","fr":"Nous avons déménagé ici quand j'avais six ans."},{"en":"Have you finished your project yet?","fr":"As-tu déjà fini ton projet ?"},{"en":"I haven't seen my cousin for ages.","fr":"Je n'ai pas vu mon cousin depuis une éternité."}]},{"type":"tip","text":"LE piège des francophones : « Je suis ici depuis deux ans » ne se dit **jamais** [[I am here since two years]]. On dit [[I have been here for two years]] : present perfect + **for** (car deux ans est une durée). Et jamais de present perfect avec un moment précis : [[I saw him yesterday]], pas [[I have seen him yesterday]]."},{"type":"dialogue","title":"La nouvelle amie","lines":[{"who":"Félix","en":"How long have you lived in Ottawa, Priya?","fr":"Depuis combien de temps habites-tu à Ottawa, Priya ?"},{"who":"Priya","en":"I've lived here for three years. We moved here from Toronto.","fr":"J'habite ici depuis trois ans. On a déménagé de Toronto."},{"who":"Félix","en":"And how long have you known Emma?","fr":"Et depuis quand connais-tu Emma ?"},{"who":"Priya","en":"Since grade five. She's my best friend!","fr":"Depuis la cinquième année. C'est ma meilleure amie !"},{"who":"Félix","en":"Have you finished the science project yet?","fr":"As-tu déjà fini le projet de sciences ?"},{"who":"Priya","en":"Not yet! I've just started it. And you?","fr":"Pas encore ! Je viens de le commencer. Et toi ?"},{"who":"Félix","en":"I've already finished it. I finished it last night!","fr":"Je l'ai déjà fini. Je l'ai fini hier soir !"}]}],"vocab":[{"en":"for two years","fr":"depuis deux ans (durée)","alt":[],"ex":"I have lived here for two years."},{"en":"since Monday","fr":"depuis lundi (point de départ)","alt":[],"ex":"She has been sick since Monday."},{"en":"how long","fr":"combien de temps, depuis combien de temps","alt":[],"ex":"How long have you known Emma?"},{"en":"already","fr":"déjà (c'est fait)","alt":[],"ex":"I have already finished my homework."},{"en":"not yet","fr":"pas encore","alt":[],"ex":"Have you eaten? Not yet."},{"en":"just","fr":"venir de (I've just…)","alt":[],"ex":"I've just arrived."},{"en":"recently","fr":"récemment","alt":["lately"],"ex":"Have you seen Liam recently?"},{"en":"so far","fr":"jusqu'à maintenant","alt":[],"ex":"So far, I've read two books this month."},{"en":"all my life","fr":"toute ma vie","alt":[],"ex":"I have lived in Gatineau all my life."},{"en":"a long time","fr":"longtemps","alt":[],"ex":"We have known them for a long time."},{"en":"for ages","fr":"depuis une éternité","alt":[],"ex":"I haven't seen you for ages!"},{"en":"since then","fr":"depuis ce temps-là","alt":[],"ex":"We met in grade one. We've been friends since then."},{"en":"known","fr":"connu (participe passé de know)","alt":[],"ex":"I have known Mei since kindergarten."},{"en":"had","fr":"eu (participe passé de have)","alt":[],"ex":"We have had this cat for two years."},{"en":"grown","fr":"grandi, poussé (participe passé de grow)","alt":[],"ex":"Wow, you have grown a lot!"},{"en":"collect","fr":"collectionner","alt":[],"ex":"I have collected hockey cards since I was six."},{"en":"neighbourhood","fr":"quartier","alt":[],"ex":"We have lived in this neighbourhood for ten years."},{"en":"best friend","fr":"meilleur ami, meilleure amie","alt":[],"ex":"Zoé has been my best friend since grade two."},{"en":"finish","fr":"finir, terminer","alt":[],"ex":"Have you finished your project yet?"}],"sentences":[{"en":"I have lived in Ottawa for five years.","fr":"J'habite à Ottawa depuis cinq ans.","trap":["since","am"],"alt":["For five years I have lived in Ottawa.","I have lived for five years in Ottawa."]},{"en":"We have known each other since kindergarten.","fr":"Nous nous connaissons depuis la maternelle.","trap":["for","know"],"alt":["Since kindergarten we have known each other."]},{"en":"How long have you played the piano?","fr":"Depuis combien de temps joues-tu du piano ?","trap":["since","do"],"alt":[]},{"en":"She has been sick since Monday.","fr":"Elle est malade depuis lundi.","trap":["for","is"],"alt":["Since Monday she has been sick."]},{"en":"I have just finished my homework.","fr":"Je viens de finir mes devoirs.","trap":["finish","yet"],"alt":[]},{"en":"Have you finished your project yet?","fr":"As-tu déjà fini ton projet ?","trap":["Do","finishing"],"alt":[]},{"en":"My parents bought this house ten years ago.","fr":"Mes parents ont acheté cette maison il y a dix ans.","trap":["have","since"],"alt":["Ten years ago my parents bought this house."]},{"en":"I haven't seen my cousin for ages.","fr":"Je n'ai pas vu mon cousin depuis une éternité.","trap":["since","didn't"],"alt":[]},{"en":"Mei has already eaten, so she isn't hungry.","fr":"Mei a déjà mangé, alors elle n'a pas faim.","trap":["yet","ate"],"alt":[]},{"en":"We moved here when I was six.","fr":"Nous avons déménagé ici quand j'avais six ans.","trap":["have","since"],"alt":["When I was six we moved here."]},{"en":"I've been on the hockey team since last year.","fr":"Je fais partie de l'équipe de hockey depuis l'an dernier.","trap":["for","am"],"alt":["Since last year I've been on the hockey team."]},{"en":"How long has Félix had his dog?","fr":"Depuis combien de temps Félix a-t-il son chien ?","trap":["have","since"],"alt":[]}],"grammar":[{"type":"mcq","q":"I ___ here since September.","choices":["am","was","have been","be"],"answer":2,"explain":"Ça a commencé en septembre et ça continue : present perfect → I have been."},{"type":"mcq","q":"We have lived in this neighbourhood ___ three years.","choices":["for","since","during","ago"],"answer":0,"explain":"Three years est une durée : for."},{"type":"mcq","q":"She has been my best friend ___ grade two.","choices":["for","ago","during","since"],"answer":3,"explain":"Grade two est un point de départ : since."},{"type":"mcq","q":"I ___ that movie last weekend.","choices":["have seen","saw","have saw","seen"],"answer":1,"explain":"Last weekend est un moment précis et fini : passé simple → saw."},{"type":"mcq","q":"I haven't finished my project ___.","choices":["already","since","yet","just"],"answer":2,"explain":"À la fin d'une phrase négative, « pas encore » = not … yet."},{"type":"mcq","q":"Comment dit-on « Je viens de manger » ?","choices":["I come to eat.","I have just eaten.","I just come of eating.","I have eaten yet."],"answer":1,"explain":"« Venir de » = have just + participe passé."},{"type":"mcq","q":"___ you move to Canada two years ago?","choices":["Have","Has","Did","Do"],"answer":2,"explain":"Two years ago = moment précis et fini : passé simple → Did you move…?"},{"type":"fill","q":"I have known Priya ___ we were five.","hint":"depuis","answer":["since"],"explain":"« Depuis que nous avions cinq ans » : un point de départ → since."},{"type":"fill","q":"They have had their dog ___ two years.","hint":"depuis","answer":["for"],"explain":"Two years est une durée : for."},{"type":"fill","q":"We ___ in Gatineau since I was born.","hint":"live","answer":["have lived","have been living"],"explain":"Ça a commencé à ma naissance et ça continue : present perfect → have lived."},{"type":"fill","q":"Lucas ___ his phone yesterday.","hint":"lose","answer":["lost"],"explain":"Yesterday = moment précis : passé simple → lost."},{"type":"fill","q":"Hurry up! The movie has ___ started!","hint":"déjà","answer":["already"],"explain":"« Déjà » (c'est fait) dans une phrase affirmative = already."},{"type":"fill","q":"___ have you lived here?","hint":"depuis combien de temps","answer":["How long"],"explain":"« Depuis combien de temps » = How long + present perfect."},{"type":"error","q":"Zoé has been my friend since several years.","wrong":5,"fix":["for"],"explain":"Several years est une durée : for, pas since."},{"type":"error","q":"My cousins have live in Toronto since last summer.","wrong":3,"fix":["lived"],"explain":"Have + participe passé : have lived."},{"type":"error","q":"We've bought a new car three weeks ago.","wrong":0,"fix":["We"],"explain":"Avec ago (moment précis), on utilise le passé simple : We bought."},{"type":"error","q":"I haven't eaten lunch already, so I'm hungry.","wrong":4,"fix":["yet"],"explain":"Dans une phrase négative, « pas encore » = not … yet."},{"type":"error","q":"I have known Emma for grade one.","wrong":4,"fix":["since"],"explain":"Grade one est un point de départ : since."}],"reading":{"title":"New in the Neighbourhood","text":"Ana and her family moved to Ottawa from Brazil two years ago. At first, Ana didn't speak English or French. Now she has lived here for two years, and she speaks both languages very well!\n\nAna has made many friends since she arrived. Her best friend is Zoé. They have known each other since grade six, and they have been on the same soccer team for a year.\n\nIn Brazil, Ana never saw snow. But in Canada, she has already learned to skate on the Rideau Canal. She hasn't tried skiing yet, but she wants to try this winter.\n\nAna's grandmother still lives in Brazil. Ana hasn't seen her for a long time, but they talk on the phone every Sunday.","questions":[{"q":"Quand Ana est-elle arrivée à Ottawa ?","choices":["il y a deux ans","il y a six ans","l'an dernier","il y a un mois"],"answer":0},{"q":"Depuis quand Ana et Zoé se connaissent-elles ?","choices":["depuis la maternelle","depuis la sixième année","depuis l'hiver dernier","depuis deux semaines"],"answer":1},{"q":"Depuis combien de temps jouent-elles dans la même équipe de soccer ?","choices":["deux ans","six mois","trois ans","un an"],"answer":3},{"q":"Qu'est-ce qu'Ana n'a pas encore essayé ?","choices":["le patin","le soccer","le ski","le français"],"answer":2},{"q":"Comment Ana garde-t-elle contact avec sa grand-mère ?","choices":["Elle lui écrit des lettres.","Elle lui parle au téléphone chaque dimanche.","Elle la visite chaque été.","Elle lui envoie des courriels."],"answer":1}]},"pron":{"focus":"Les liaisons de l'anglais","ipa":"","explain":"Tu connais les liaisons en français : « les_amis ». En anglais, ça arrive **tout le temps** ! Quand un mot finit par une consonne et que le suivant commence par une voyelle, la consonne saute sur le mot suivant : [[pick it up]] se dit « pi-ki-TEUP », comme un seul mot. Dans [[an hour]], le « h » est muet, donc on dit « eu-NAOU-eur ». C'est pour ça que l'anglais parlé semble aller si vite ! Truc pour ton oreille : si tu entends un mot inconnu, c'est peut-être deux ou trois petits mots collés.","words":[{"en":"for a year","fr":"depuis un an, pendant un an","hint":"« feu-reu-YIR » : le « r » de [[for]] se colle au [[a]]"},{"en":"for an hour","fr":"depuis une heure, pendant une heure","hint":"« feu-reu-NAOU-eur » : tout se colle, et le « h » de [[hour]] est muet"},{"en":"since April","fr":"depuis avril","hint":"« sinn-SÉÏ-preul » : le « s » de [[since]] saute sur [[April]]"},{"en":"an hour","fr":"une heure","hint":"« eu-NAOU-eur » : le « h » est muet, le « n » saute sur le mot suivant"},{"en":"turn it on","fr":"allume-le","hint":"« teur-ni-TÂNN » : trois mots, un seul souffle ; la force va sur [[on]]"},{"en":"pick it up","fr":"ramasse-le","hint":"« pi-ki-TEUP » : la force va sur [[up]]"},{"en":"at all","fr":"du tout","hint":"« eu-DÂL » : le « t » saute sur [[all]] et devient un petit « d »"},{"en":"not at all","fr":"pas du tout","hint":"« nâ-deu-DÂL » : les « t » deviennent de petits « d », tout est collé"}],"pairs":[],"practice":["I've lived in Ottawa for a year.","We've been here since April.","I've waited for an hour, and the bus isn't here yet."]},"mission":{"type":"ecrit","prompt":"Le journal de ton école présente les nouveaux élèves. Écris un petit texte pour te présenter : depuis quand tu habites dans ta ville, depuis combien de temps tu es à l'école, ce que tu as déjà fait et ce que tu n'as pas encore fait.","model":"Hi! My name is Priya. I was born in Toronto, but I've lived in Ottawa since April. I've been at this school for two months, and I've already made three good friends. I haven't joined a club yet, but I'd like to try the science club. I've played the piano for six years!","checklist":["J'ai utilisé le present perfect pour une situation qui dure encore ([[I've lived here since April]])","J'ai utilisé [[for]] + une durée et [[since]] + un point de départ","Je n'ai jamais écrit « I am here since » : j'ai mis [[I've been here]]","J'ai utilisé le passé simple pour une date terminée ([[I was born]])","J'ai placé [[already]] avant le participe et [[yet]] à la fin de la phrase"]}}]},{"id":7,"cefr":"B1+","title":"Nuances","titleEn":"Shades","intro":"Parler des règles et donner des conseils, imaginer ce qui va arriver avec if, déjouer les faux amis et choisir entre -ing et to : ton anglais devient précis.","boss":{"name":"Les Jumeaux Faux-Amis","taunt":"On ressemble à des mots français, mais méfie-toi… Actually, tu vas perdre. Et ça, ce n'est pas une déception, c'est une certitude !","defeat":"Quoi ?! Tu as vu clair dans notre jeu… On retourne se cacher à la library — euh, à la bibliothèque !"},"units":[{"id":"7.1","title":"Obligations et conseils","titleEn":"Rules of the Game","goal":"Dire ce qui est obligatoire, interdit, conseillé ou possible avec must, have to, should et might.","lesson":[{"type":"p","text":"[[must]], [[should]], [[might]], [[may]] et [[could]] sont des **modaux** : des petits verbes spéciaux. **Jamais de -s**, **jamais de to** après, et toujours le verbe de base : [[She must go.]] (et non *she musts to go*)."},{"type":"rule","title":"Obligation : must ou have to ?","text":"[[must]] = obligation forte, souvent une règle écrite ou ce que **toi** tu juges nécessaire : [[You must wear a helmet.]] [[have to]] = obligation qui vient de l'extérieur (règlement, horaire). Lui, il se conjugue comme un verbe normal : [[She has to leave.]], [[Do you have to work?]] Au passé, [[must]] n'existe pas : on dit [[had to]] ([[I had to wait.]])."},{"type":"table","head":["Forme","Sens","Exemple"],"rows":[["must","obligation (c'est nécessaire)","[[You must wear a seat belt.]]"],["have to / has to","obligation (règle extérieure)","[[He has to take his medicine.]]"],["mustn't","**interdiction** (tu n'as pas le droit !)","[[You mustn't swim alone.]]"],["don't have to / doesn't have to","**pas obligé** (comme tu veux)","[[You don't have to come.]]"],["should / shouldn't","conseil (tu devrais / tu ne devrais pas)","[[You should rest.]]"],["might / may / could","possibilité (peut-être)","[[It might rain.]]"]]},{"type":"rule","title":"Possibilité : might, may, could","text":"[[might]], [[may]] et [[could]] = « peut-être » : [[I might be late.]] = Je vais peut-être être en retard. Pour dire « peut-être pas », utilise [[might not]] ou [[may not]] : [[She might not come.]] Attention : [[couldn't]] ne veut **pas** dire « peut-être pas », mais « n'a pas pu / ne pourrait pas »."},{"type":"tip","text":"LE grand piège : [[mustn't]] ≠ [[don't have to]] ! [[You mustn't come.]] = Tu n'as **pas le droit** de venir. [[You don't have to come.]] = Tu n'es **pas obligé** de venir (mais tu peux !). Truc : « interdit » = [[mustn't]] ; « pas obligé » = [[don't have to]]."},{"type":"p","text":"Pour parler de santé : « J'ai mal à la tête » = [[I have a headache]], « J'ai de la fièvre » = [[I have a fever]]. Et [[advice]] (des conseils) est **indénombrable** : [[some advice]], [[a piece of advice]], jamais *an advice* ni *advices*."},{"type":"examples","items":[{"en":"You must wear a seat belt in the car.","fr":"Tu dois porter ta ceinture de sécurité dans l'auto."},{"en":"We don't have to go to school on Saturday.","fr":"On n'est pas obligés d'aller à l'école le samedi."},{"en":"You mustn't touch the stove. It's hot!","fr":"Tu ne dois pas toucher à la cuisinière. Elle est chaude !"},{"en":"You should see a doctor.","fr":"Tu devrais voir un médecin."},{"en":"I might stay home tomorrow. I have a fever.","fr":"Je vais peut-être rester à la maison demain. J'ai de la fièvre."},{"en":"Did you have to wait a long time?","fr":"As-tu dû attendre longtemps ?"}]},{"type":"dialogue","title":"Chez l'infirmière de l'école","lines":[{"who":"Malik","en":"Excuse me. I have a headache and a sore throat.","fr":"Excusez-moi. J'ai mal à la tête et mal à la gorge."},{"who":"Nurse","en":"Let me check. Oh, you have a fever. You should go home and rest.","fr":"Laisse-moi vérifier. Oh, tu fais de la fièvre. Tu devrais rentrer chez toi et te reposer."},{"who":"Malik","en":"Do I have to call my mom?","fr":"Est-ce que je dois appeler ma mère ?"},{"who":"Nurse","en":"No, you don't have to. I'll call her.","fr":"Non, tu n'es pas obligé. Je vais l'appeler."},{"who":"Malik","en":"Can I take some medicine?","fr":"Est-ce que je peux prendre un médicament ?"},{"who":"Nurse","en":"No, you mustn't take medicine without your parents' permission.","fr":"Non, tu n'as pas le droit de prendre de médicament sans la permission de tes parents."},{"who":"Malik","en":"Okay. I might miss my hockey game tonight…","fr":"D'accord. Je vais peut-être manquer ma partie de hockey ce soir…"},{"who":"Nurse","en":"Your health comes first!","fr":"Ta santé passe en premier !"}]},{"type":"fun","text":"Le sais-tu ? Au Canada, porter la ceinture de sécurité en voiture est obligatoire dans toutes les provinces et tous les territoires : [[You must wear a seat belt!]]"}],"vocab":[{"en":"headache","fr":"mal de tête","alt":[],"ex":"I have a terrible headache."},{"en":"sore throat","fr":"mal de gorge","alt":[],"ex":"She can't sing today. She has a sore throat."},{"en":"stomach ache","fr":"mal de ventre","alt":["stomachache","tummy ache"],"ex":"I ate too much candy and now I have a stomach ache."},{"en":"fever","fr":"fièvre","alt":[],"ex":"You have a fever. You should stay in bed."},{"en":"cough","fr":"toux","alt":[],"ex":"My little brother has a bad cough."},{"en":"flu","fr":"grippe","alt":["the flu"],"ex":"Half of my class has the flu."},{"en":"medicine","fr":"médicament","alt":["medication"],"ex":"Take your medicine after dinner."},{"en":"nurse","fr":"infirmier, infirmière","alt":[],"ex":"The nurse gave me a glass of water."},{"en":"appointment","fr":"rendez-vous (chez le médecin, le dentiste)","alt":[],"ex":"I have an appointment with the doctor at four o'clock."},{"en":"rest","fr":"se reposer","alt":[],"ex":"You should rest this weekend."},{"en":"advice","fr":"conseils (nom indénombrable)","alt":[],"ex":"Can you give me some advice?"},{"en":"rule","fr":"règle (consigne à respecter)","alt":[],"ex":"The first rule is simple: no running."},{"en":"allowed","fr":"permis (autorisé)","alt":["permitted"],"ex":"Dogs are not allowed in the store."},{"en":"helmet","fr":"casque (de vélo, de hockey)","alt":[],"ex":"You must wear a helmet on your bike."},{"en":"seat belt","fr":"ceinture de sécurité","alt":["seatbelt"],"ex":"Put on your seat belt, please."},{"en":"sunscreen","fr":"crème solaire","alt":["sunblock"],"ex":"Don't forget your sunscreen at the beach."},{"en":"lifeguard","fr":"sauveteur, sauveteuse (à la plage, à la piscine)","alt":[],"ex":"The lifeguard blew her whistle."},{"en":"healthy","fr":"sain (bon pour la santé)","alt":[],"ex":"Fruit is a healthy snack."}],"sentences":[{"en":"You mustn't swim alone in the lake.","fr":"Tu n'as pas le droit de nager seul dans le lac.","trap":["to","don't"],"alt":["You mustn't swim in the lake alone."]},{"en":"We don't have to wear a uniform at our school.","fr":"Nous ne sommes pas obligés de porter un uniforme à notre école.","trap":["mustn't","doesn't"],"alt":["At our school, we don't have to wear a uniform."]},{"en":"She has to take her medicine after dinner.","fr":"Elle doit prendre son médicament après le souper.","trap":["have","takes"],"alt":["After dinner, she has to take her medicine."]},{"en":"Do I have to bring my helmet tomorrow?","fr":"Est-ce que je dois apporter mon casque demain ?","trap":["Does","brings"],"alt":[]},{"en":"You should wear sunscreen at the beach.","fr":"Tu devrais mettre de la crème solaire à la plage.","trap":["to","wears"],"alt":["At the beach, you should wear sunscreen."]},{"en":"You shouldn't eat so much candy before bed.","fr":"Tu ne devrais pas manger autant de bonbons avant de te coucher.","trap":["don't","eats"],"alt":[]},{"en":"It might snow tonight, so take your toque.","fr":"Il va peut-être neiger ce soir, alors prends ta tuque.","trap":["snows","will"],"alt":[]},{"en":"My brother had to stay in bed for three days.","fr":"Mon frère a dû rester au lit pendant trois jours.","trap":["must","has"],"alt":[]},{"en":"You don't have to finish your plate if you're full.","fr":"Tu n'es pas obligé de finir ton assiette si tu n'as plus faim.","trap":["mustn't","must"],"alt":["If you're full, you don't have to finish your plate."]},{"en":"The lifeguard says we mustn't run near the pool.","fr":"Le sauveteur dit qu'on n'a pas le droit de courir près de la piscine.","trap":["to","runs"],"alt":[]},{"en":"You may feel tired after you take this medicine.","fr":"Tu te sentiras peut-être fatigué après avoir pris ce médicament.","trap":["feels","to"],"alt":["After you take this medicine, you may feel tired."]},{"en":"Does your sister have to wear glasses?","fr":"Est-ce que ta sœur doit porter des lunettes ?","trap":["has","Do"],"alt":[]}],"grammar":[{"type":"mcq","q":"The museum is free today. You ___ pay to go in.","choices":["mustn't","don't have to","have to","must"],"answer":1,"explain":"C'est gratuit : tu n'es pas obligé de payer → don't have to. Mustn't voudrait dire que c'est interdit de payer !"},{"type":"mcq","q":"Be careful! You ___ skate here. The ice is too thin!","choices":["don't have to","might","have to","mustn't"],"answer":3,"explain":"C'est dangereux, donc interdit : mustn't."},{"type":"mcq","q":"Comment dit-on « Tu n'es pas obligée de venir » ?","choices":["You mustn't come.","You don't must come.","You don't have to come.","You haven't to come."],"answer":2,"explain":"« Pas obligé » = don't have to. You mustn't come = tu n'as pas le droit de venir."},{"type":"mcq","q":"Yesterday, I ___ wait for the bus for an hour.","choices":["had to","must","have to","musted"],"answer":0,"explain":"Must n'a pas de passé : on utilise had to."},{"type":"mcq","q":"Take your umbrella. It ___ rain this afternoon.","choices":["mustn't","might","has to","doesn't have to"],"answer":1,"explain":"On n'est pas sûr : c'est une possibilité → might (peut-être)."},{"type":"mcq","q":"Quelle phrase est correcte ?","choices":["You should to rest.","You shoulds rest.","You should resting.","You should rest."],"answer":3,"explain":"Après un modal : verbe de base, sans to, sans -s, sans -ing."},{"type":"mcq","q":"I'm not sure yet, but I ___ go to the party. I'm very tired. (possibilité négative)","choices":["might not","mustn't","couldn't","don't have to"],"answer":0,"explain":"« Peut-être pas » = might not. Couldn't veut dire « n'a pas pu »."},{"type":"fill","q":"Hockey players ___ wear a helmet. It's the rule.","hint":"devoir (obligation)","answer":["must","have to"],"explain":"Une règle obligatoire : must ou have to, les deux sont corrects ici."},{"type":"fill","q":"My sister ___ get up early on Sundays. She can stay in bed.","hint":"ne pas être obligée","answer":["doesn't have to","doesn't need to"],"explain":"Pas obligée → doesn't have to (avec she : does)."},{"type":"fill","q":"Last year, we ___ wear a uniform at school.","hint":"devoir, au passé","answer":["had to"],"explain":"Au passé, l'obligation se dit had to."},{"type":"fill","q":"You look tired. You ___ go to bed early tonight.","hint":"conseil","answer":["should"],"explain":"Pour un conseil : should + verbe de base."},{"type":"fill","q":"___ your dad have to work on Saturdays?","hint":"auxiliaire de question","answer":["Does"],"explain":"Have to se conjugue comme un verbe normal : Does your dad have to…?"},{"type":"fill","q":"Students ___ use their phones during the test. It's forbidden!","hint":"interdiction, avec must","answer":["mustn't"],"explain":"Interdit → mustn't (must not)."},{"type":"error","q":"She musts wear glasses to read.","wrong":1,"fix":["must"],"explain":"Un modal ne prend jamais de -s : she must."},{"type":"error","q":"He have to take his medicine every morning.","wrong":1,"fix":["has"],"explain":"Have to se conjugue : he has to."},{"type":"error","q":"Did you must wait a long time?","wrong":2,"fix":["have to"],"explain":"Must n'existe pas au passé : Did you have to wait…?"},{"type":"error","q":"Can you give me an advice?","wrong":4,"fix":["some"],"explain":"Advice est indénombrable : some advice (ou a piece of advice), jamais an advice."},{"type":"error","q":"I have a fever, so I might stays home tomorrow.","wrong":7,"fix":["stay"],"explain":"Après might : verbe de base, sans -s."}],"reading":{"title":"The New Pool Rules","text":"Every summer, Zoé works as a junior lifeguard at the community pool in Ottawa. This year, the pool has some new rules, and Zoé has to explain them to the kids.\n\nFirst, swimmers must take a shower before they go into the water. Children under eight must stay with an adult at all times. Nobody is allowed to run near the pool, because the floor is wet and slippery. You can bring a snack, but you mustn't eat it inside: food is only allowed on the grass outside.\n\nSome things are not obligatory. Swimmers don't have to wear a swimming cap, and they don't have to bring their own towel, because the pool lends towels for free.\n\nOn sunny days, Zoé gives the same advice to everyone: \"You should wear sunscreen, and you should drink lots of water.\" Last week, a boy called Félix didn't listen. He stayed in the sun all afternoon without a hat. In the evening, he had a headache and a fever, and he had to stay in bed the next day.\n\nTomorrow, the weather might be stormy. When there is thunder, the pool has to close. Zoé hopes the storm won't come, because she might lose a day of work.","questions":[{"q":"What does Zoé do in the summer?","choices":["She teaches swimming to adults.","She works as a junior lifeguard.","She sells sunscreen at the pool.","She cleans the showers."],"answer":1},{"q":"Which of these is optional at the pool?","choices":["Taking a shower before swimming","Staying with an adult if you are under eight","Wearing a swimming cap","Eating your snack next to the water"],"answer":2},{"q":"Why don't swimmers need their own towel?","choices":["Because the pool lends towels for free.","Because towels are not allowed.","Because it is always sunny.","Because Zoé brings towels for everyone."],"answer":0},{"q":"What happened to Félix?","choices":["He lost his towel.","He ran and fell on the wet floor.","He forgot his swimming cap.","He got sick after a day in the sun."],"answer":3},{"q":"Why is Zoé worried about the storm?","choices":["She is scared of thunder.","She is probably paid only when the pool is open.","She has to swim in the storm.","She has no umbrella."],"answer":1}]},"pron":{"focus":"Les lettres muettes des modaux","ipa":"/ʃʊd/ – /kʊd/ – /wʊd/","explain":"En anglais, certaines lettres sont là juste pour la décoration ! Dans [[should]], [[could]] et [[would]], le **l est muet** : les trois riment avec [[good]] (« choud », « koud », « woud »). Même chose dans [[talk]], [[walk]], [[half]] et [[salmon]], et dans [[mustn't]], où le premier t disparaît (« MEU-seunt »). Le piège des francophones : tout lire comme en français et faire sonner un beau « l » dans « choulde » ou « oualk ». Truc : [[would]] se prononce exactement comme [[wood]] (le bois) ; si tu sais dire l'un, tu sais dire l'autre !","words":[{"en":"should","fr":"devrais, devrait (conseil)","hint":"« choud » : le l ne se prononce jamais ; un « ou » bref"},{"en":"could","fr":"pourrais, pourrait ; pouvait","hint":"« koud » : l muet ; rime avec « choud »"},{"en":"would","fr":"auxiliaire du conditionnel (I would go = j'irais)","hint":"« woud » : l muet ; le conditionnel et « le bois » se prononcent exactement pareil !"},{"en":"wood","fr":"le bois","hint":"« woud » : l muet ; le conditionnel et « le bois » se prononcent exactement pareil !"},{"en":"shouldn't","fr":"ne devrais pas, ne devrait pas","hint":"« CHOU-deunt » : l muet ; accent sur la première syllabe"},{"en":"mustn't","fr":"ne doit pas (c'est interdit)","hint":"« MEU-seunt » : le premier t est muet ; et attention, ça veut dire « interdit » !"},{"en":"talk","fr":"parler, discuter","hint":"« tâk » : l muet ; un « â » bien ouvert, comme dans « pâte »"},{"en":"walk","fr":"marcher ; une promenade","hint":"« wâk » : l muet ; ne le confonds pas avec « weurk » (travailler)"},{"en":"half","fr":"la moitié ; demi","hint":"« haf » : l muet ; on souffle bien le h"},{"en":"salmon","fr":"le saumon","hint":"« SA-meun » : l muet, donc surtout pas « sal-mon » !"}],"pairs":[],"practice":["How much wood would a woodchuck chuck if a woodchuck could chuck wood?","You should walk for half an hour every day.","You mustn't talk during the test, and you shouldn't walk around."]},"mission":{"type":"oral","prompt":"Un nouveau joueur arrive dans ton équipe de natation. Explique-lui à voix haute les règles de la piscine : deux choses obligatoires, une chose interdite, une chose pas obligatoire, puis donne-lui un conseil.","model":"Welcome to the team! You have to wear a swimming cap, and you must take a shower before you get in the pool. You mustn't run around the pool, because the floor is slippery. You don't have to bring goggles; the coach has extra ones. Oh, and you should drink lots of water, or you might get a headache.","checklist":["J'ai utilisé [[have to]] ou [[must]] pour une règle obligatoire","J'ai utilisé [[mustn't]] pour une chose **interdite**","J'ai utilisé [[don't have to]] pour une chose pas obligatoire (et je ne l'ai pas confondu avec [[mustn't]])","J'ai donné un conseil avec [[should]] + verbe de base, sans [[to]]","Je n'ai pas prononcé le l de [[should]] ni le premier t de [[mustn't]]"]}},{"id":"7.2","title":"Si…","titleEn":"What If?","goal":"Parler de vérités générales et de conséquences probables avec if, unless, when et as soon as.","lesson":[{"type":"p","text":"Pour parler d'une condition, l'anglais a plusieurs « conditionnels ». Ici, les deux premiers : le **zéro** (c'est toujours vrai) et le **premier** (c'est probable, dans le futur)."},{"type":"rule","title":"Le conditionnel zéro","text":"[[If]] + présent, présent : pour les vérités générales et les faits scientifiques. [[If you heat ice, it melts.]] Ici, [[if]] veut presque dire [[when]] (chaque fois que)."},{"type":"rule","title":"Le premier conditionnel","text":"[[If]] + présent, [[will]] + verbe : pour une situation future probable. [[If it rains tomorrow, we'll stay home.]] **Jamais de will après if** : *If it will rain* ❌. Même règle après [[when]], [[as soon as]], [[unless]], [[before]] et [[after]] quand on parle du futur : [[I'll call you as soon as I get home.]]"},{"type":"table","head":["Mot","Sens","Exemple"],"rows":[["if","si (peut-être)","[[If I see Maya, I'll tell her.]]"],["when","quand (c'est sûr que ça va arriver)","[[When I get home, I'll eat.]]"],["unless","à moins que (= if… not)","[[Unless you hurry, you'll miss the bus.]]"],["as soon as","dès que","[[As soon as it stops raining, we'll go out.]]"]]},{"type":"tip","text":"Piège de francophone : en français, on dit « Quand je **serai** grand… » avec un futur. En anglais, c'est le présent : [[When I'm older]], jamais *When I will be older*. Et [[unless]] contient déjà la négation : [[unless you study]] = si tu n'étudies pas. Ne dis jamais *unless you don't study*."},{"type":"p","text":"La virgule : quand la phrase commence par [[If]], on met une virgule au milieu : [[If it snows, we'll go skiing.]] Quand [[if]] est au milieu, pas de virgule : [[We'll go skiing if it snows.]] Les deux ordres sont corrects !"},{"type":"examples","items":[{"en":"If you mix blue and yellow, you get green.","fr":"Si tu mélanges du bleu et du jaune, tu obtiens du vert."},{"en":"If we recycle more, we'll produce less garbage.","fr":"Si on recycle plus, on va produire moins de déchets."},{"en":"Plants die if they don't get water.","fr":"Les plantes meurent si elles ne reçoivent pas d'eau."},{"en":"I won't go unless you come with me.","fr":"Je n'irai pas à moins que tu viennes avec moi."},{"en":"I'll text you as soon as the bus arrives.","fr":"Je t'écris dès que l'autobus arrive."}]},{"type":"dialogue","title":"Le projet vert","lines":[{"who":"Priya","en":"Our school wastes so much paper!","fr":"Notre école gaspille tellement de papier !"},{"who":"Liam","en":"If we put a recycling bin in every class, people will use it.","fr":"Si on met un bac de recyclage dans chaque classe, les gens vont s'en servir."},{"who":"Priya","en":"Good idea. But they won't recycle unless we explain the rules.","fr":"Bonne idée. Mais ils ne recycleront pas à moins qu'on explique les règles."},{"who":"Liam","en":"As soon as the principal says yes, we'll make some posters.","fr":"Dès que la directrice dit oui, on fera des affiches."},{"who":"Priya","en":"And if we save energy too, the school will save money.","fr":"Et si on économise aussi l'énergie, l'école va économiser de l'argent."},{"who":"Liam","en":"When I see the principal tomorrow, I'll ask her.","fr":"Quand je verrai la directrice demain, je vais lui demander."}]},{"type":"fun","text":"Le sais-tu ? Le fameux bac bleu de recyclage ([[blue box]]) a été lancé en Ontario, à Kitchener, au début des années 1980. Aujourd'hui, on en voit partout au Canada !"}],"vocab":[{"en":"environment","fr":"environnement","alt":[],"ex":"We must protect the environment."},{"en":"recycle","fr":"recycler","alt":[],"ex":"If you recycle cans, they become new cans."},{"en":"recycling bin","fr":"bac de recyclage","alt":["blue box"],"ex":"Put the bottles in the recycling bin."},{"en":"green bin","fr":"bac vert (pour le compost)","alt":["compost bin"],"ex":"Banana peels go in the green bin."},{"en":"waste","fr":"gaspiller","alt":[],"ex":"Don't waste water when you brush your teeth."},{"en":"save","fr":"économiser (de l'énergie, de l'eau)","alt":[],"ex":"If we save energy, we save money."},{"en":"energy","fr":"énergie","alt":[],"ex":"Solar energy comes from the sun."},{"en":"plastic bag","fr":"sac de plastique","alt":[],"ex":"This store doesn't give plastic bags anymore."},{"en":"reusable","fr":"réutilisable","alt":[],"ex":"I always bring a reusable bottle to school."},{"en":"litter","fr":"déchets jetés par terre","alt":[],"ex":"There is a lot of litter in the park."},{"en":"climate change","fr":"changements climatiques","alt":[],"ex":"Climate change is a big problem for the planet."},{"en":"planet","fr":"planète","alt":[],"ex":"Earth is our only planet."},{"en":"melt","fr":"fondre","alt":[],"ex":"If you leave your ice cream in the sun, it melts."},{"en":"freeze","fr":"geler","alt":[],"ex":"Water freezes at zero degrees Celsius."},{"en":"heat","fr":"chauffer (rendre chaud)","alt":["warm up","heat up"],"ex":"If you heat chocolate, it melts."},{"en":"tap","fr":"robinet","alt":["faucet"],"ex":"Turn off the tap, please."},{"en":"unless","fr":"à moins que (si… ne… pas)","alt":[],"ex":"We'll lose unless we work together."},{"en":"as soon as","fr":"dès que","alt":[],"ex":"Call me as soon as you arrive."}],"sentences":[{"en":"If you heat ice, it melts.","fr":"Si on chauffe de la glace, elle fond.","trap":["heats","melted"],"alt":[]},{"en":"If it rains tomorrow, we'll stay inside.","fr":"S'il pleut demain, on va rester à l'intérieur.","trap":["will","rain"],"alt":["We'll stay inside if it rains tomorrow."]},{"en":"We'll call you as soon as we arrive in Toronto.","fr":"On t'appellera dès qu'on arrivera à Toronto.","trap":["will","arrived"],"alt":["As soon as we arrive in Toronto, we'll call you."]},{"en":"You'll miss the bus unless you hurry.","fr":"Tu vas manquer l'autobus à moins de te dépêcher.","trap":["don't","will"],"alt":["Unless you hurry, you'll miss the bus."]},{"en":"Plants die if they don't get enough water.","fr":"Les plantes meurent si elles ne reçoivent pas assez d'eau.","trap":["dies","doesn't"],"alt":[]},{"en":"When I'm older, I'll buy an electric car.","fr":"Quand je serai plus vieux, je vais acheter une voiture électrique.","trap":["will","be"],"alt":["I'll buy an electric car when I'm older."]},{"en":"Unless we save energy, the planet will get warmer.","fr":"À moins qu'on économise l'énergie, la planète va se réchauffer.","trap":["don't","gets"],"alt":["The planet will get warmer unless we save energy."]},{"en":"What will you do if the bus doesn't come?","fr":"Que vas-tu faire si l'autobus ne vient pas ?","trap":["didn't","comes"],"alt":[]},{"en":"If you freeze water, it turns into ice.","fr":"Si on fait geler de l'eau, elle se transforme en glace.","trap":["will","turned"],"alt":[]},{"en":"Bring a reusable bag when you go to the store.","fr":"Apporte un sac réutilisable quand tu vas au magasin.","trap":["will","goes"],"alt":["When you go to the store, bring a reusable bag."]},{"en":"I'll recycle these bottles as soon as I finish my homework.","fr":"Je vais recycler ces bouteilles dès que j'aurai fini mes devoirs.","trap":["will","finished"],"alt":["As soon as I finish my homework, I'll recycle these bottles."]},{"en":"The ice on the canal melts when the weather gets warm.","fr":"La glace du canal fond quand le temps se réchauffe.","trap":["melted","get"],"alt":["When the weather gets warm, the ice on the canal melts."]}],"grammar":[{"type":"mcq","q":"If it ___ tomorrow, we'll cancel the picnic.","choices":["will rain","rains","rained","rain"],"answer":1,"explain":"Après if : présent (it rains), jamais will."},{"type":"mcq","q":"If you mix red and white, you ___ pink.","choices":["get","will got","getting","gets"],"answer":0,"explain":"Vérité générale (conditionnel zéro) : if + présent, présent → you get."},{"type":"mcq","q":"« Je n'irai pas au parc à moins que tu viennes avec moi. » → I won't go to the park ___ you come with me.","choices":["if","when","unless","as soon as"],"answer":2,"explain":"« À moins que » = unless."},{"type":"mcq","q":"Comment dit-on « Je t'appellerai dès que j'arriverai » ?","choices":["I'll call you as soon as I'll arrive.","I call you as soon as I arrive.","I'll call you as soon as I arrive.","I'll call you as soon I arrive."],"answer":2,"explain":"Après as soon as : présent (I arrive). La conséquence au futur : I'll call."},{"type":"mcq","q":"If you put water in the freezer, it ___.","choices":["will freezes","freezes","freeze","is freeze"],"answer":1,"explain":"Fait scientifique : présent, et avec it → freezes."},{"type":"mcq","q":"Quelle phrase est correcte ?","choices":["When I will be sixteen, I'll learn to drive.","When I am sixteen, I will to learn to drive.","When I'll be sixteen, I learn to drive.","When I'm sixteen, I'll learn to drive."],"answer":3,"explain":"Après when : présent (I'm sixteen). Puis will + verbe de base."},{"type":"mcq","q":"« Maya arrive à six heures, c'est sûr. Quand elle arrivera, on mangera. » → ___ she arrives, we'll eat.","choices":["If","When","Unless","As soon"],"answer":1,"explain":"C'est sûr qu'elle arrive : when (quand). If voudrait dire qu'elle va peut-être venir."},{"type":"fill","q":"If Maya ___ the bus, she'll walk to school.","hint":"miss","answer":["misses"],"explain":"Après if : présent, et avec she → misses."},{"type":"fill","q":"We ___ to the beach if it's sunny tomorrow.","hint":"go, futur avec will","answer":["will go"],"explain":"Premier conditionnel : if + présent, will + verbe."},{"type":"fill","q":"I'll text you as soon as the movie ___.","hint":"finish","answer":["finishes"],"explain":"Après as soon as : présent, même si on parle du futur."},{"type":"fill","q":"___ you study, you won't pass the test.","hint":"à moins que","answer":["Unless"],"explain":"Unless = if… not : si tu n'étudies pas."},{"type":"fill","q":"If you heat chocolate, it ___.","hint":"melt","answer":["melts","will melt"],"explain":"Fait général : melts (conditionnel zéro). Will melt est aussi accepté."},{"type":"error","q":"As soon as she arrive, we'll start the movie.","wrong":4,"fix":["arrives"],"explain":"Après as soon as : présent, avec she → arrives."},{"type":"error","q":"If you mix blue and yellow, you gets green.","wrong":7,"fix":["get"],"explain":"Avec you : pas de -s → you get."},{"type":"error","q":"I'll phone you when I'll get home.","wrong":4,"fix":["I"],"explain":"Jamais will après when quand on parle du futur : when I get home."},{"type":"error","q":"If it'll rain tomorrow, we'll stay home.","wrong":1,"fix":["it"],"explain":"Jamais will après if : If it rains… Ici, it'll devient it."},{"type":"error","q":"If we don't save energy, the planet get warmer.","wrong":7,"fix":["will get","gets"],"explain":"Conséquence : will get (ou gets, vérité générale). Get seul ne va pas avec the planet."}],"reading":{"title":"The Green Challenge","text":"This month, Noah's class is taking part in the Green Challenge. The rules are simple: if a class saves the most energy and produces the least garbage, it wins a trip to a nature park.\n\nOn the first day, Noah looked inside the recycling bin and was shocked. It was full of food! \"If we put food in the recycling bin, the plastic can't be recycled,\" he explained. \"Food goes in the green bin.\" So the class made posters for every bin.\n\nNext, Amir checked the classroom. The lights were on all day, even at lunch, and the tap in the corner was always dripping. \"If nobody uses the lights at lunch, we'll save a lot of energy,\" he said. \"And if we fix that tap, we'll stop wasting water.\"\n\nSome students complained. \"Unless everyone helps, we won't win,\" Noah told them. As soon as they saw the results of the first week, they changed their minds: their class was in second place!\n\nNow the whole class has new habits. When they finish their lunch, they sort everything carefully. Plastic bags are gone, and everyone brings reusable containers. The final results will come out next Friday. If they win, Noah will bring his camera to the park.","questions":[{"q":"What does the winning class get?","choices":["A new recycling bin","A trip to a nature park","A camera","A pizza lunch"],"answer":1},{"q":"What problem did Noah find on the first day?","choices":["The green bin was broken.","There were no posters.","There was food in the recycling bin.","The lights were off."],"answer":2},{"q":"What did Amir notice in the classroom?","choices":["The lights were always on and the tap was dripping.","Someone threw litter on the floor.","The class had no green bin.","The posters had mistakes."],"answer":0},{"q":"Why did the students change their minds about the challenge?","choices":["Their teacher gave them a test.","Noah promised them a prize.","They saw that they had a real chance to win.","The lights stopped working."],"answer":2},{"q":"What will happen if the class wins?","choices":["Amir will make new posters.","Noah will bring his camera to the park.","The school will buy new lights.","They will stop recycling."],"answer":1}]},"pron":{"focus":"La mélodie des phrases avec if","ipa":"","explain":"Une phrase avec [[if]], [[unless]] ou [[as soon as]] a deux parties, comme une colline : la voix **monte** à la virgule (« attends, ce n'est pas fini ! »), puis **redescend** à la fin (« voilà, c'est fini »). Bonne nouvelle : le français fait pareil, écoute-toi dire « s'il pleut, on reste à l'intérieur ». La différence : en anglais, le mouvement part de la syllabe forte du dernier mot important, pas de la toute dernière syllabe ; dans [[if you recycle]], ça monte dès « saï ». Et à la fin, laisse vraiment tomber ta voix, sinon on croit que tu poses une question ! Truc : quand [[if]] arrive au milieu de la phrase, il n'y a pas de virgule… et une seule descente.","words":[{"en":"if it rains, we stay inside","fr":"s'il pleut, on reste à l'intérieur","hint":"« if it RAINS ↗ we stay in-SIDE ↘ » : ça monte à la virgule, puis ça redescend"},{"en":"if you heat ice, it melts","fr":"si on chauffe de la glace, elle fond","hint":"« if you heat ICE ↗ it MELTS ↘ » : une vérité scientifique, même mélodie"},{"en":"if you recycle, you help the planet","fr":"si tu recycles, tu aides la planète","hint":"« if you re-CY-cle ↗ you help the PLA-net ↘ » : la montée part de « saï », pas de la fin du mot"},{"en":"if we plant trees, the air will be cleaner","fr":"si on plante des arbres, l'air sera plus propre","hint":"« if we plant TREES ↗ the air will be CLEA-ner ↘ » : c'est le dernier mot important qui décide"},{"en":"if you waste energy, you waste money","fr":"si tu gaspilles l'énergie, tu gaspilles de l'argent","hint":"« if you waste EN-er-gy ↗ you waste MO-ney ↘ » : le mot « énergie » appuie au début, pas « é-ner-GIE » !"},{"en":"unless you hurry, you'll miss the bus","fr":"à moins que tu te dépêches, tu vas rater l'autobus","hint":"« un-LESS you HUR-ry ↗ you'll miss the BUS ↘ » : le premier mot appuie sur sa deuxième syllabe, « eun-LÈSS »"},{"en":"as soon as I get home, I'll call you","fr":"dès que j'arrive à la maison, je t'appelle","hint":"« as soon as I get HOME ↗ I'll CALL you ↘ » : la voix tombe sur l'avant-dernier mot ; le dernier reste tout bas"},{"en":"when the bin is full, take it out","fr":"quand le bac est plein, sors-le","hint":"« when the bin is FULL ↗ take it OUT ↘ » : le coup final va sur la petite particule"},{"en":"we'll go swimming if it's sunny","fr":"on ira se baigner s'il fait soleil","hint":"« we'll go SWIM-ming if it's SUN-ny ↘ » : la condition est à la fin, donc pas de virgule et une seule descente"}],"pairs":[],"practice":["If it rains tomorrow, we'll clean the park next weekend.","Unless we recycle more, our garbage will keep growing.","As soon as the snow melts, we'll plant some trees."]},"mission":{"type":"ecrit","prompt":"Ton école organise une semaine verte. Écris une petite affiche de cinq ou six phrases pour convaincre les élèves de poser des gestes pour l'environnement, avec [[if]], [[unless]], [[as soon as]] ou [[when]].","model":"Green Week starts on Monday! If you bring a reusable water bottle, you won't need plastic ones. If we all turn off the lights when we leave a room, our school will save energy. Unless we sort our garbage properly, the recycling bins won't help. As soon as the snow melts, we'll plant trees behind the gym. Join us and make a difference!","checklist":["J'ai écrit au moins deux phrases avec [[if]] + présent, puis [[will]] ou [[won't]]","Je n'ai jamais mis [[will]] juste après [[if]], [[unless]], [[when]] ou [[as soon as]]","J'ai utilisé [[unless]] (« à moins que ») sans ajouter de négation en plus","J'ai mis une virgule quand la phrase commence par la condition","J'ai utilisé au moins trois mots de l'environnement"]}},{"id":"7.3","title":"Les faux amis","titleEn":"False Friends","goal":"Éviter les faux amis qui piègent les francophones et choisir le bon mot.","lesson":[{"type":"p","text":"Un **faux ami**, c'est un mot anglais qui ressemble à un mot français… mais qui veut dire **autre chose**. Les jumeaux Faux-Amis adorent te piéger !"},{"type":"table","head":["Mot anglais","Veut dire…","Ne veut PAS dire…","Pour dire ça :"],"rows":[["[[actually]]","en fait, en réalité","actuellement","[[currently]], [[now]]"],["[[eventually]]","à la longue, finalement (après longtemps)","éventuellement","[[maybe]], [[possibly]]"],["[[library]]","bibliothèque","librairie","[[bookstore]]"],["[[sensible]]","raisonnable","sensible","[[sensitive]]"],["[[deception]]","tromperie","déception","[[disappointment]]"],["[[attend]]","assister à (être présent)","attendre","[[wait for]]"],["[[assist]]","aider","assister à","[[attend]]"],["[[pretend]]","faire semblant","prétendre (affirmer)","[[claim]]"],["[[achieve]]","réaliser, atteindre (un but)","achever (finir)","[[finish]]"],["[[lecture]]","conférence, cours magistral","lecture","[[reading]]"],["[[rude]]","impoli","rude (dur)","[[tough]], [[harsh]]"],["[[resume]]","reprendre (après une pause)","résumer","[[sum up]]"],["[[journey]]","voyage, long trajet","journée","[[day]]"],["[[coin]]","pièce de monnaie","coin (de rue)","[[corner]]"],["[[injury]]","blessure","injure","[[insult]]"]]},{"type":"rule","title":"Comment les reconnaître ?","text":"Quand un mot anglais ressemble à du français, **méfie-toi** et regarde le contexte. [[Actually]] sert surtout à corriger ou à nuancer : [[I thought it was easy. Actually, it was hard.]] [[Eventually]] veut dire que quelque chose arrive **enfin, après beaucoup de temps** : [[He eventually found his keys.]] Pour « actuellement », dis [[currently]] : [[She's currently in Vancouver.]]"},{"type":"tip","text":"Le piège le plus fréquent : « J'attends l'autobus » = [[I'm waiting for the bus]], et non *I'm attending the bus*. Et « Je suis sensible » = [[I'm sensitive]]. Si tu dis [[I'm sensible]], tu dis « je suis raisonnable » !"},{"type":"examples","items":[{"en":"Actually, I'm not from Montreal. I'm from Gatineau.","fr":"En fait, je ne viens pas de Montréal. Je viens de Gatineau."},{"en":"I'm currently reading a great book.","fr":"Je lis actuellement un super livre."},{"en":"Don't be so sensitive! It was a joke.","fr":"Ne sois pas si sensible ! C'était une blague."},{"en":"Mei pretended to be sick.","fr":"Mei a fait semblant d'être malade."},{"en":"She achieved her dream.","fr":"Elle a réalisé son rêve."},{"en":"What a disappointment!","fr":"Quelle déception !"}]},{"type":"dialogue","title":"La bibliothèque ou la librairie ?","lines":[{"who":"Félix","en":"I'm going to the library to buy a book.","fr":"Je vais à la bibliothèque acheter un livre."},{"who":"Chloé","en":"Actually, you can't buy books at the library. You borrow them!","fr":"En fait, on ne peut pas acheter de livres à la bibliothèque. On les emprunte !"},{"who":"Félix","en":"Oh no! Where can I buy one, then?","fr":"Oh non ! Où est-ce que je peux en acheter un, alors ?"},{"who":"Chloé","en":"At the bookstore across the street.","fr":"À la librairie en face."},{"who":"Félix","en":"Thanks. I'm currently reading a mystery series, and I want the next one.","fr":"Merci. Je lis actuellement une série de romans policiers, et je veux le prochain."},{"who":"Chloé","en":"Be sensible: check the library first. It's free!","fr":"Sois raisonnable : vérifie d'abord à la bibliothèque. C'est gratuit !"},{"who":"Félix","en":"You're right. Eventually, I'll read every book in Ottawa!","fr":"Tu as raison. À la longue, je vais lire tous les livres d'Ottawa !"}]},{"type":"fun","text":"Le sais-tu ? L'expression anglaise [[false friends]] est une traduction directe de l'expression française « faux amis », inventée par deux linguistes français en 1928."}],"vocab":[{"en":"actually","fr":"en fait (en réalité)","alt":[],"ex":"Actually, I prefer tea."},{"en":"currently","fr":"actuellement (en ce moment)","alt":["at the moment","right now"],"ex":"My dad is currently working in Toronto."},{"en":"eventually","fr":"à la longue, tôt ou tard","alt":["sooner or later"],"ex":"Don't worry, you'll eventually understand."},{"en":"library","fr":"bibliothèque","alt":[],"ex":"I borrowed this book from the library."},{"en":"bookstore","fr":"librairie (magasin de livres)","alt":["bookshop"],"ex":"I bought a comic book at the bookstore."},{"en":"sensible","fr":"raisonnable (qui a du bon sens)","alt":["reasonable"],"ex":"Wearing a helmet is a sensible choice."},{"en":"sensitive","fr":"sensible (émotif, délicat)","alt":[],"ex":"My sister is very sensitive. She cries at every movie."},{"en":"disappointment","fr":"déception","alt":[],"ex":"The rainy weekend was a big disappointment."},{"en":"attend","fr":"assister à (être présent à)","alt":[],"ex":"All students must attend the meeting."},{"en":"assist","fr":"aider (mot plus formel)","alt":["help"],"ex":"The nurse will assist the doctor."},{"en":"pretend","fr":"faire semblant","alt":[],"ex":"Let's pretend we're astronauts!"},{"en":"achieve","fr":"réaliser, atteindre (un but)","alt":["accomplish","reach"],"ex":"You can achieve your goals if you work hard."},{"en":"coin","fr":"pièce de monnaie","alt":[],"ex":"A loonie is a one-dollar coin."},{"en":"lecture","fr":"conférence (exposé devant un public)","alt":["talk"],"ex":"We attended a lecture about space."},{"en":"injury","fr":"blessure","alt":[],"ex":"He can't play because of a knee injury."},{"en":"rude","fr":"impoli","alt":["impolite"],"ex":"It's rude to talk with your mouth full."},{"en":"resume","fr":"reprendre (recommencer après une pause)","alt":[],"ex":"The game will resume in ten minutes."},{"en":"journey","fr":"voyage (long trajet)","alt":["trip"],"ex":"It was a long journey, but we finally arrived."}],"sentences":[{"en":"Actually, I don't like chocolate very much.","fr":"En fait, je n'aime pas tellement le chocolat.","trap":["Currently","likes"],"alt":["I actually don't like chocolate very much.","I don't like chocolate very much, actually."]},{"en":"We're waiting for the bus in front of the library.","fr":"On attend l'autobus devant la bibliothèque.","trap":["attending","bookstore"],"alt":["In front of the library, we're waiting for the bus."]},{"en":"Liam pretended to be asleep when his mom came in.","fr":"Liam a fait semblant de dormir quand sa mère est entrée.","trap":["pretends","come"],"alt":["When his mom came in, Liam pretended to be asleep."]},{"en":"Hundreds of students attended the science lecture.","fr":"Des centaines d'élèves ont assisté à la conférence scientifique.","trap":["assisted","reading"],"alt":[]},{"en":"My little brother is very sensitive about his height.","fr":"Mon petit frère est très sensible au sujet de sa taille.","trap":["sensible"],"alt":[]},{"en":"Staying home was a sensible decision.","fr":"Rester à la maison était une décision raisonnable.","trap":["sensitive","Stay"],"alt":[]},{"en":"Losing the final was a big disappointment.","fr":"Perdre la finale a été une grosse déception.","trap":["deception","Lose"],"alt":[]},{"en":"Eventually, Karim found his phone under the couch.","fr":"Karim a fini par trouver son téléphone sous le divan.","trap":["Possibly","finds"],"alt":["Karim eventually found his phone under the couch.","Karim found his phone under the couch eventually."]},{"en":"Sofia achieved her goal and made the team.","fr":"Sofia a atteint son objectif et a été choisie dans l'équipe.","trap":["finished","achieve"],"alt":[]},{"en":"Don't be rude to the bus driver.","fr":"Ne sois pas impoli avec le chauffeur d'autobus.","trap":["rough","Doesn't"],"alt":[]},{"en":"The game will resume after the break.","fr":"La partie va reprendre après la pause.","trap":["summarize","resumes"],"alt":["After the break, the game will resume."]},{"en":"I found an old coin in the sand.","fr":"J'ai trouvé une vieille pièce de monnaie dans le sable.","trap":["corner","founded"],"alt":["In the sand, I found an old coin."]}],"grammar":[{"type":"mcq","q":"« Je lis actuellement un roman. » → I'm ___ reading a novel.","choices":["actually","currently","eventually"],"answer":1,"explain":"Actuellement = currently. Actually veut dire « en fait »."},{"type":"mcq","q":"« Je vais à la librairie acheter un livre. » → I'm going to the ___ to buy a book.","choices":["bookstore","library","librairy"],"answer":0,"explain":"Librairie = bookstore. Library = bibliothèque (on emprunte, on n'achète pas)."},{"type":"mcq","q":"Ana cries at every sad movie. She's very ___.","choices":["sensible","sensational","sensitive"],"answer":2,"explain":"Sensible (émotif) = sensitive. Sensible en anglais veut dire « raisonnable »."},{"type":"mcq","q":"« Elle a assisté au concert. » → She ___ the concert.","choices":["assisted","attended","waited for"],"answer":1,"explain":"Assister à (être présent) = attend. Assist veut dire « aider »."},{"type":"mcq","q":"Our team lost the final. What a ___!","choices":["disappointment","deception","deceiving"],"answer":0,"explain":"Déception = disappointment. Deception veut dire « tromperie »."},{"type":"mcq","q":"« Il a fait semblant de dormir. » → He ___ to be asleep.","choices":["achieved","claimed","attended","pretended"],"answer":3,"explain":"Faire semblant = pretend."},{"type":"mcq","q":"« J'attends mes amis. » → I'm ___ my friends.","choices":["attending","waiting for","assisting"],"answer":1,"explain":"Attendre = wait for. Attend = être présent à un événement."},{"type":"fill","q":"I thought the test was hard, but ___ it was easy.","hint":"en fait","answer":["actually"],"explain":"En fait = actually."},{"type":"fill","q":"After three hours of searching, they ___ found the cat.","hint":"finalement, après longtemps","answer":["eventually","finally"],"explain":"Eventually (ou finally) = finalement, après beaucoup de temps. Pas « éventuellement » !"},{"type":"fill","q":"Please don't be ___. Say please and thank you.","hint":"impoli","answer":["rude","impolite"],"explain":"Impoli = rude (ou impolite). En anglais, rude ne veut pas dire « dur »."},{"type":"fill","q":"Malik fell off his bike, but his ___ isn't serious.","hint":"blessure","answer":["injury"],"explain":"Blessure = injury. Une injure, c'est an insult."},{"type":"fill","q":"The meeting will ___ after lunch.","hint":"reprendre","answer":["resume","start again","begin again"],"explain":"Reprendre après une pause = resume. Résumer, c'est sum up."},{"type":"fill","q":"I need a two-dollar ___ for the machine.","hint":"pièce de monnaie","answer":["coin"],"explain":"Pièce de monnaie = coin. Un coin de rue, c'est a corner."},{"type":"error","q":"I'm attending my sister in front of the school.","wrong":1,"fix":["waiting for"],"explain":"Attendre quelqu'un = wait for. Attend = assister à."},{"type":"error","q":"We borrowed three books from the bookstore.","wrong":6,"fix":["library"],"explain":"On emprunte des livres à la bibliothèque : library. Bookstore = librairie (on achète)."},{"type":"error","q":"Don't cry! You're too sensible.","wrong":4,"fix":["sensitive"],"explain":"Sensible (émotif) = sensitive. Sensible = raisonnable."},{"type":"error","q":"This summer, I want to achieve my homework early.","wrong":5,"fix":["finish","do"],"explain":"Achever (finir) = finish. Achieve = atteindre un but."},{"type":"error","q":"Losing the game was a big deception for our team.","wrong":6,"fix":["disappointment"],"explain":"Déception = disappointment. Deception = tromperie."}],"reading":{"title":"Félix in Toronto","text":"Last summer, Félix spent two weeks with his cousin Olivia in Toronto. His English was good, but the false friends tricked him again and again.\n\nOn the first day, Olivia asked him, \"What do you want to do today?\" Félix answered, \"I want to go to the library to buy a comic book.\" Olivia laughed. \"Actually, you can't buy anything at the library. You mean the bookstore!\"\n\nThe next day, Félix told Olivia's mom that he was very sensible, because sad movies always made him cry. She smiled kindly and explained that he meant \"sensitive\". A sensible person makes good, reasonable choices.\n\nLater that week, they attended a lecture about dinosaurs at a museum. When it was over, Félix said, \"That was a great reading!\" Olivia whispered, \"In English, a reading is something you read. This was a lecture!\"\n\nAt the end of the trip, Félix felt a little disappointment, because he was making so many mistakes. But Olivia told him, \"Don't worry. Everyone learns this way. Eventually, the false friends won't trick you anymore.\"\n\nNow Félix has a notebook of false friends. He reads it every night, and he currently has more than fifty words in it.","questions":[{"q":"Where did Félix want to buy a comic book on the first day?","choices":["At the museum","At school","At the library","At a coin shop"],"answer":2},{"q":"What did Félix really mean when he said he was \"sensible\"?","choices":["That he was reasonable","That he cried easily","That he was very smart","That he liked science"],"answer":1},{"q":"What did Félix and Olivia do at the museum?","choices":["They attended a lecture about dinosaurs.","They bought books.","They worked as guides.","They waited all day."],"answer":0},{"q":"What does Olivia probably think about Félix's mistakes?","choices":["She finds them annoying and stops talking to him.","She is angry because he is rude.","She wants him to go back home.","She thinks they are normal when you learn a language."],"answer":3},{"q":"What does Félix do now to fight the false friends?","choices":["He only speaks French.","He reads his notebook of false friends every night.","He watches sad movies.","He goes to the library every day."],"answer":1}]},"pron":{"focus":"Les mots transparents qui piègent","ipa":"","explain":"Les mots « transparents » sont des pièges sournois : tu les comprends tout de suite, alors tu les prononces… à la française ! En anglais, ils perdent souvent des syllabes : [[comfortable]] n'en a que trois (« KEUMF-teur-beul ») et [[chocolate]] seulement deux (« TCHÂ-kleut »). L'accent tombe souvent au début ([[interesting]], [[different]], [[restaurant]]), alors que le français appuie sur la fin. Truc : avant de dire un mot transparent, compte ses syllabes sur tes doigts… et écoute d'abord la voix anglaise !","words":[{"en":"comfortable","fr":"confortable ; à l'aise","hint":"« KEUMF-teur-beul » : trois syllabes seulement ; le « or » s'efface"},{"en":"vegetable","fr":"un légume","hint":"« VÈDJ-teu-beul » : trois syllabes, pas quatre ; le deuxième e est muet"},{"en":"chocolate","fr":"le chocolat","hint":"« TCHÂ-kleut » : deux syllabes ; « tch » comme dans « tchou-tchou »"},{"en":"interesting","fr":"intéressant","hint":"« IN-tres-ting » : trois syllab
