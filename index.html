],"reading":{"title":"Same Cat, Different Words","text":"Our English teacher gave us a strange assignment: describe the same moment twice, once as a fan and once as a critic. Zoé chose her neighbour's cat, Biscuit. Here is what she wrote.\n\nVersion one: Biscuit is a slim, elegant cat with a curious mind. Every morning, she strolls across our garden as if she owned it. She is determined: when she wants to come inside, she waits patiently at the door until someone opens it. Her owner, an old man with a childlike smile, is thrifty and makes her toys out of old socks. When Biscuit sees me, she glances at me with her bright green eyes, then goes back to her nap in the sun.\n\nVersion two: Biscuit is a skinny, nosy cat who sticks her face into everybody's business. Every morning, she wanders through our garden as if she owned it. She is stubborn: when she wants to come inside, she stares at the door and meows until someone gives up. Her owner is so stingy that he makes her toys out of old socks. When Biscuit sees me, she glares at me with her cold green eyes, then goes back to sleeping all day, the lazy thing.\n\nZoé's teacher wrote one comment at the bottom of the page: “Same cat, same facts, completely different story. Well done.”\n\nZoé smiled when she read it. She had learned something important: choosing a word is like choosing a pair of glasses. The world stays the same, but it changes what everyone else sees. From now on, she decided, she would choose her glasses very carefully, especially when writing about her little brother.","questions":[{"q":"What was the assignment?","choices":["To write a story about a lost cat","To describe the same moment twice, from two different points of view","To interview a neighbour","To write a poem about glasses"],"answer":1},{"q":"In version two, which word replaces “determined”?","choices":["nosy","skinny","stubborn","lazy"],"answer":2},{"q":"How is the owner described in version two?","choices":["As stingy","As thrifty","As childlike","As determined"],"answer":0},{"q":"What attitude toward Biscuit does version one show?","choices":["Fear","Anger","Boredom","Affection and admiration"],"answer":3},{"q":"Why does the teacher write “Same cat, same facts”?","choices":["Because Zoé copied the same text twice","Because the facts don't change; only the connotation of the words does","Because the cat is famous","Because both versions are too short"],"answer":1},{"q":"What does Zoé's last decision suggest?","choices":["She will stop writing about her family.","She will buy new glasses.","She knows her word choices could make her brother look good or bad.","She thinks her brother is a cat."],"answer":2}]},"pron":{"focus":"L'intonation des émotions et des sous-entendus","ipa":"","explain":"En anglais, la mélodie peut dire le contraire des mots ! Une voix qui **descend** franchement est sincère ([[Fine.]] = ça va vraiment) ; une voix qui **descend puis remonte** (le « ton fourche ») sous-entend un « mais… » : [[Fine…]] = d'accord, mais je ne suis pas content. Et une voix toute **plate**, presque ennuyée, sonne sarcastique : [[Great.]] = c'est tout sauf génial. Soyons honnêtes : la voix de synthèse de l'appli ne sait pas jouer toutes ces émotions, elle lit presque tout de façon neutre ; elle te sert pour les sons, mais c'est **toi** l'acteur pour la mélodie, en suivant les indices. Le piège des francophones : garder la mélodie française partout, qui monte souvent à la fin… et avoir l'air de poser une question quand tu veux être poli !","words":[{"en":"fine","fr":"bien, d'accord","hint":"« FAÏN » ↘ (descend) = ça va vraiment ; ↘↗ (descend puis remonte) = bon… d'accord, mais j'ai un reproche"},{"en":"really","fr":"vraiment","hint":"« RII-li » ↗ (monte) = « Ah oui ? » surprise et intérêt ; ↘ (descend, lent) = je ne suis pas impressionné"},{"en":"great","fr":"génial, super","hint":"« GRÉIT » ↘ qui part de haut = vrai enthousiasme ; tout plat et bas = sarcasme"},{"en":"sure","fr":"bien sûr, d'accord","hint":"« CHOUR » ↘ = oui, sans problème ; ↘↗ allongé = oui… mais j'en doute"},{"en":"whatever","fr":"peu importe, n'importe quoi","hint":"« weu-DÈ-veur » ↘ sec = très impoli, ça veut dire « je m'en fiche » ; à éviter avec les adultes !"},{"en":"sorry","fr":"désolé ; pardon ?","hint":"« SÔ-ri » ↘ = je m'excuse ; ↗ (monte) = « Pardon ? Je n'ai pas compris »"},{"en":"thanks a lot","fr":"merci beaucoup","hint":"« THANK-seu-LÂT » ↘ chaleureux = sincère ; plat et lent = « merci pour rien » (sarcasme)"},{"en":"oh","fr":"oh, ah","hint":"« Ô » ↘ long = déception ; ↗ court = surprise ; ↘↗ = « ah, je vois… »"},{"en":"that's nice","fr":"c'est gentil, c'est bien","hint":"« thats-NAÏS » ↘ chaleureux = sincère ; plat = poli, mais pas intéressé"}],"pairs":[],"practice":["Oh, that's just great.","Really? I didn't know that!","Sure, I'd love to help."]},"mission":{"type":"oral","prompt":"Ton ami dit que ton petit frère est [[nosy]], [[stubborn]], [[stingy]] et [[childish]]. Défends-le à voix haute en cinq à sept phrases, en remplaçant chaque mot négatif par un mot positif qui veut presque dire la même chose. Commence par un [[Sure]] ou un [[Really?]] avec une mélodie qui montre ton émotion.","model":"Really? You think my little brother is nosy? Sure, he asks a lot of questions, but he isn't nosy, he's just curious. And he's not stubborn, he's determined: he practised his skating jumps every day until he finally landed one. Okay, he never spends his allowance, but that makes him thrifty, not stingy. And childish? No way. He's childlike: he still gets excited about the first snow, and honestly, that's what I love about him.","checklist":["J'ai remplacé chaque mot négatif par son « jumeau » positif ([[curious]], [[determined]], [[thrifty]], [[childlike]])","J'ai montré la différence de sens, pas seulement changé le mot","Mon [[Really?]] montait (surprise), mon [[Sure]] descendait puis remontait (oui, mais…)","J'ai vraiment joué l'émotion avec ma voix, sans attendre que l'appli le fasse pour moi"]}},{"id":"12.3","title":"Phrasal verbs et proverbes","titleEn":"Actions Speak Louder","goal":"Utiliser des phrasal verbs avancés et placer le bon proverbe au bon moment.","lesson":[{"type":"p","text":"Les anglophones parlent avec des **phrasal verbs** (verbe + petit mot) et des **proverbes** à tout bout de champ. Les connaître, c'est comprendre les vraies conversations, les films et les séries… et répondre du tac au tac !"},{"type":"table","head":["Phrasal verb","Sens","Exemple"],"rows":[["come up with","trouver (une idée)","[[Who came up with this plan?]]"],["put up with","supporter, endurer","[[I can't put up with this noise.]]"],["get away with","s'en tirer sans punition","[[He cheated and got away with it.]]"],["look down on","mépriser","[[Never look down on anyone.]]"],["look up to","admirer (un modèle)","[[I look up to my big sister.]]"],["run into","tomber sur quelqu'un","[[I ran into my teacher at the mall.]]"],["come across","trouver une chose par hasard","[[I came across an old photo.]]"],["bring up","aborder (un sujet)","[[Don't bring up the test again!]]"],["cut down on","consommer moins de","[[I'm cutting down on sugar.]]"],["figure out","comprendre, trouver la solution","[[I can't figure out this puzzle.]]"],["turn out","s'avérer","[[The test turned out to be easy.]]"],["end up","finir par, se retrouver à","[[We ended up walking home.]]"],["fall out with","se brouiller avec","[[She fell out with her best friend.]]"],["get over","se remettre de","[[He got over his cold.]]"],["live up to","être à la hauteur de","[[The movie didn't live up to the book.]]"],["make up for","compenser, se faire pardonner","[[I'll make up for it.]]"],["stand out","se démarquer","[[Her red coat stands out.]]"]]},{"type":"rule","title":"Séparable ou pas ?","text":"Les phrasal verbs à **trois mots** ne se séparent jamais : [[put up with it]], [[make up for it]]. Certains verbes à deux mots sont **séparables** ([[figure out]], [[bring up]]) : avec un **pronom**, le pronom va obligatoirement **au milieu** : [[figure it out]], jamais ~~figure out it~~. Après [[end up]] et [[make up for]], le verbe prend **-ing** : [[We ended up eating sushi.]] [[I'll make up for being late.]]"},{"type":"table","head":["Proverbe anglais","Équivalent français","Quand l'utiliser"],"rows":[["[[Actions speak louder than words.]]","Les gestes valent mieux que les paroles.","quelqu'un promet sans agir"],["[[Better late than never.]]","Mieux vaut tard que jamais.","ça arrive en retard, mais ça arrive"],["[[Every cloud has a silver lining.]]","À quelque chose malheur est bon.","un problème cache un avantage"],["[[The early bird catches the worm.]]","L'avenir appartient à ceux qui se lèvent tôt.","il faut s'y prendre tôt"],["[[Don't count your chickens before they hatch.]]","Il ne faut pas vendre la peau de l'ours avant de l'avoir tué.","quelqu'un se vante trop tôt"],["[[Easier said than done.]]","C'est plus facile à dire qu'à faire.","un conseil simple mais difficile à suivre"]]},{"type":"examples","items":[{"en":"My sister came up with a brilliant idea.","fr":"Ma sœur a eu une idée géniale."},{"en":"I ran into Noah at the library.","fr":"Je suis tombé sur Noah à la bibliothèque."},{"en":"It took me an hour to figure it out.","fr":"Ça m'a pris une heure pour comprendre."},{"en":"The trip turned out to be amazing.","fr":"Le voyage s'est avéré génial."},{"en":"Better late than never!","fr":"Mieux vaut tard que jamais !"}]},{"type":"tip","text":"Pièges de francophone : « supporter » quelqu'un = [[put up with]], pas [[support]] (qui veut dire soutenir, encourager) ! [[look up to]] (admirer) n'est pas [[look up]] (chercher dans le dictionnaire). Et les proverbes ne se traduisent **jamais** mot à mot : on ne dit pas ~~Better late that never~~, ni « sell the bear's skin » : on apprend la version anglaise par cœur."},{"type":"dialogue","title":"Drame à la récré","lines":[{"who":"Zoé","en":"Did you hear? Ethan fell out with Noah over a hockey card.","fr":"As-tu entendu ? Ethan s'est brouillé avec Noah à cause d'une carte de hockey."},{"who":"Karim","en":"Seriously? I ran into them yesterday and they seemed fine.","fr":"Sérieux ? Je suis tombé sur eux hier et ils avaient l'air correct."},{"who":"Zoé","en":"Well, Ethan says Noah got away with trading him a fake card.","fr":"Ben, Ethan dit que Noah lui a échangé une fausse carte sans se faire prendre."},{"who":"Karim","en":"I can't put up with all this drama. They need to figure it out themselves.","fr":"Je ne supporte pas tout ce drame. Ils doivent régler ça eux-mêmes."},{"who":"Zoé","en":"Noah promised to make up for it, but he hasn't done anything yet.","fr":"Noah a promis de se faire pardonner, mais il n'a encore rien fait."},{"who":"Karim","en":"Actions speak louder than words. Let's see if he brings him a real one.","fr":"Les gestes valent mieux que les paroles. On verra s'il lui apporte une vraie carte."},{"who":"Zoé","en":"If he does it next week, well, better late than never!","fr":"S'il le fait la semaine prochaine, eh bien, mieux vaut tard que jamais !"}]}],"vocab":[{"en":"come up with","fr":"trouver (une idée), inventer","alt":["think of"],"ex":"Who came up with this crazy plan?"},{"en":"put up with","fr":"supporter, endurer","alt":["tolerate","stand"],"ex":"I can't put up with his jokes anymore."},{"en":"get away with","fr":"s'en tirer sans punition","alt":[],"ex":"Nobody gets away with cheating in our class."},{"en":"look down on","fr":"mépriser, regarder de haut","alt":["despise"],"ex":"Don't look down on people who make mistakes."},{"en":"look up to","fr":"admirer (un modèle)","alt":["admire"],"ex":"Many kids look up to their older cousins."},{"en":"run into","fr":"tomber sur (quelqu'un) par hasard","alt":["bump into"],"ex":"I ran into my old coach at the mall."},{"en":"bring up","fr":"aborder (un sujet)","alt":["raise","mention"],"ex":"Please don't bring up my bad grade at dinner."},{"en":"cut down on","fr":"consommer moins de, réduire","alt":["cut back on"],"ex":"I'm trying to cut down on screen time."},{"en":"figure out","fr":"comprendre, trouver la solution","alt":["work out"],"ex":"I finally figured out the answer."},{"en":"end up","fr":"finir par, se retrouver à","alt":[],"ex":"We ended up staying until midnight."},{"en":"fall out with","fr":"se brouiller avec","alt":[],"ex":"She fell out with her cousin over a silly game."},{"en":"get over","fr":"se remettre de","alt":["recover from"],"ex":"It took me a week to get over the flu."},{"en":"live up to","fr":"être à la hauteur de","alt":[],"ex":"The new movie didn't live up to our expectations."},{"en":"make up for","fr":"compenser, se faire pardonner","alt":[],"ex":"I'll make up for it by helping you tomorrow."},{"en":"actions speak louder than words","fr":"les gestes valent mieux que les paroles","alt":[],"ex":"Don't just say sorry; actions speak louder than words."},{"en":"better late than never","fr":"mieux vaut tard que jamais","alt":[],"ex":"You finally finished your project? Better late than never!"},{"en":"every cloud has a silver lining","fr":"à quelque chose malheur est bon","alt":[],"ex":"The game was cancelled, but every cloud has a silver lining: no homework tonight!"},{"en":"the early bird catches the worm","fr":"l'avenir appartient à ceux qui se lèvent tôt","alt":[],"ex":"The store opens at eight, and the early bird catches the worm."},{"en":"don't count your chickens before they hatch","fr":"il ne faut pas vendre la peau de l'ours avant de l'avoir tué","alt":[],"ex":"You haven't won yet; don't count your chickens before they hatch."},{"en":"easier said than done","fr":"c'est plus facile à dire qu'à faire","alt":[],"ex":"Just stop being nervous? Easier said than done!"}],"sentences":[{"en":"Who came up with the idea of a snow fort contest?","fr":"Qui a eu l'idée d'un concours de forts de neige ?","trap":["comes","by"],"alt":[]},{"en":"I can't put up with this noise any longer.","fr":"Je ne peux plus supporter ce bruit.","trap":["support","puts"],"alt":[]},{"en":"We ran into our old teacher at the grocery store.","fr":"Nous sommes tombés sur notre ancienne enseignante à l'épicerie.","trap":["runned","onto"],"alt":["At the grocery store we ran into our old teacher."]},{"en":"My sister really looks up to her coach.","fr":"Ma sœur admire vraiment son entraîneuse.","trap":["look","on"],"alt":[]},{"en":"It took me a whole hour to figure it out.","fr":"Ça m'a pris une heure entière pour trouver la solution.","trap":["figured","understand"],"alt":[]},{"en":"We missed the bus and ended up walking home in the rain.","fr":"On a raté l'autobus et on a fini par rentrer à pied sous la pluie.","trap":["walk","to"],"alt":[]},{"en":"It took Félix two weeks to get over his cold.","fr":"Félix a mis deux semaines à se remettre de son rhume.","trap":["got","from"],"alt":[]},{"en":"I'll make up for being late by buying you lunch.","fr":"Je vais me faire pardonner mon retard en t'offrant le dîner (le repas du midi).","trap":["buy","been"],"alt":["By buying you lunch, I'll make up for being late."]},{"en":"Actions speak louder than words, so show me you're sorry.","fr":"Les gestes valent mieux que les paroles, alors montre-moi que tu es désolé.","trap":["then","speaks"],"alt":[]},{"en":"Don't count your chickens before they hatch.","fr":"Il ne faut pas vendre la peau de l'ours avant de l'avoir tué.","trap":["hatched","chicken"],"alt":[]},{"en":"The early bird catches the worm, so let's leave at dawn.","fr":"L'avenir appartient à ceux qui se lèvent tôt, alors partons à l'aube.","trap":["catch","lets"],"alt":[]}],"grammar":[{"type":"mcq","q":"I can't ___ my brother's loud music anymore!","choices":["put up","support","put with","put up with"],"answer":3,"explain":"Supporter (endurer) = put up with, les trois mots. support veut dire soutenir."},{"type":"mcq","q":"Quel proverbe convient ? « Liam a promis cent fois de m'aider, mais il n'est jamais venu. »","choices":["Better late than never","Actions speak louder than words","The early bird catches the worm","Every cloud has a silver lining"],"answer":1,"explain":"Il promet sans agir : Actions speak louder than words."},{"type":"mcq","q":"This puzzle is hard, but I'll ___.","choices":["figure it out","figure out it","figure out","out figure it"],"answer":0,"explain":"Avec un pronom, il se place au milieu : figure it out."},{"type":"mcq","q":"Quel proverbe convient ? « Notre voyage a été annulé, mais on a découvert un musée génial dans notre propre ville. »","choices":["Don't count your chickens before they hatch","Better late than never","Every cloud has a silver lining","Easier said than done"],"answer":2,"explain":"Un malheur qui cache un avantage : Every cloud has a silver lining."},{"type":"mcq","q":"Don't ___ people just because they have less money than you.","choices":["look up to","look after","look for","look down on"],"answer":3,"explain":"Mépriser = look down on. look up to veut dire admirer."},{"type":"mcq","q":"Quel proverbe convient ? « Ta sœur se vante déjà de gagner le concours… qui n'a même pas commencé. »","choices":["Every cloud has a silver lining","Better late than never","Don't count your chickens before they hatch","The early bird catches the worm"],"answer":2,"explain":"Se vanter trop tôt : Don't count your chickens before they hatch."},{"type":"mcq","q":"I ___ an old photo of my grandparents while cleaning the basement.","choices":["came across","ran into","came up with","stood out"],"answer":0,"explain":"Trouver une chose par hasard : come across. run into, c'est pour croiser une personne."},{"type":"fill","q":"Who ___ this brilliant idea?","hint":"come up with (passé)","answer":["came up with"],"explain":"come up with = trouver une idée. Au passé : came up with."},{"type":"fill","q":"Malik ___ his best friend over a silly video game.","hint":"se brouiller avec (passé)","answer":["fell out with"],"explain":"fall out with = se brouiller avec. Au passé : fell out with."},{"type":"fill","q":"Unfortunately, the sequel didn't ___ our expectations.","hint":"être à la hauteur de","answer":["live up to"],"explain":"live up to = être à la hauteur de."},{"type":"fill","q":"Dad is trying to ___ sugar.","hint":"consommer moins de","answer":["cut down on","cut back on"],"explain":"cut down on = réduire sa consommation de."},{"type":"fill","q":"The quiz ___ to be much easier than we thought.","hint":"s'avérer (passé)","answer":["turned out"],"explain":"turn out = s'avérer. Au passé : turned out."},{"type":"fill","q":"He cheated on the test and ___ it!","hint":"s'en tirer sans punition (passé)","answer":["got away with"],"explain":"get away with = s'en tirer sans punition. Au passé : got away with."},{"type":"error","q":"I can't put up for this noise anymore.","wrong":4,"fix":["with"],"explain":"Supporter = put up with."},{"type":"error","q":"We ran into an old friend at the mall, so we ended up have lunch together.","wrong":13,"fix":["having","eating"],"explain":"end up + -ing : we ended up having lunch."},{"type":"error","q":"Better late that never!","wrong":2,"fix":["than"],"explain":"Pour comparer : than. Better late than never."},{"type":"error","q":"I'm trying to cut down of junk food.","wrong":5,"fix":["on"],"explain":"Le phrasal verb est cut down on."},{"type":"error","q":"The early bird catch the worm.","wrong":3,"fix":["catches"],"explain":"The early bird = it : le verbe prend un -s → catches."}],"reading":{"title":"The Science Fair","text":"Sofia and Samuel had been best friends since kindergarten, so nobody expected them to fall out with each other two weeks before the science fair.\n\nIt started with a simple question: whose project was it, really? Sofia said that the idea of building a solar-powered fan had been hers. Samuel said that an idea was useless if nobody could make it work. Neither of them was willing to give up, and soon they weren't even sitting together at lunch.\n\nTheir teacher, who had seen this kind of thing before, didn't take sides. She simply reminded them that the project would not finish itself. “You can put up with each other for two more weeks,” she said with a smile, “or you can both start from scratch.”\n\nNeither of them wanted to start again. So, for a few days, they worked in silence. Then something unexpected happened. While looking for a missing screw, Sofia came across Samuel's notebook. On the first page, he had written: “Sofia's idea. Make it work!”\n\nShe felt terrible. Samuel had figured out how to make the fan spin, and he had only wanted some credit for that. He had never claimed that the idea was his. He had simply been tired of being ignored.\n\nThe next morning, Sofia brought him a hot chocolate to make up for her behaviour. Samuel looked surprised, then laughed. “Better late than never,” he said.\n\nTheir fan didn't win first prize. It ended up in third place, behind a robot and a volcano. But when they walked out of the gym together, laughing again like old times, they both knew they had won something more important.","questions":[{"q":"Why did Sofia and Samuel stop talking to each other?","choices":["Samuel broke the fan.","They argued about whose project it really was.","Sofia wanted to change partners.","Their teacher separated them."],"answer":1},{"q":"What did the teacher do?","choices":["She took Sofia's side.","She cancelled their project.","She didn't take sides and reminded them to keep working.","She gave them a new partner."],"answer":2},{"q":"What did Sofia find in Samuel's notebook?","choices":["A note saying the idea was hers","A drawing of a robot","The missing screw","A list of complaints about her"],"answer":0},{"q":"Why did Sofia feel terrible?","choices":["She had lost the screw.","Her fan stopped working.","She had forgotten her notebook.","She realized Samuel had never tried to take credit for her idea."],"answer":3},{"q":"What does Samuel mean when he says “Better late than never”?","choices":["He is angry that Sofia was late for school.","He accepts her apology, even though it came late.","He wants another hot chocolate.","He thinks the fair started too late."],"answer":1},{"q":"What is the “something more important” that they won?","choices":["A trip to a science museum","First prize","A new robot","Their friendship back"],"answer":3}]},"pron":{"focus":"L'accent des verbes à trois mots","ipa":"","explain":"Dans un verbe à trois mots comme [[come up with]], c'est la **particule du milieu** qui prend le coup le plus fort : « keu-MEUP-with ». La préposition finale ([[with]], [[to]], [[of]], [[for]], [[on]]) reste petite et se colle au complément. Et comme dans les phrasal verbs simples, tout s'enchaîne : la consonne de la fin glisse sur la voyelle suivante, [[run out of]] sonne « reu-NAOU-deuv ». Le piège des francophones : couper entre chaque mot, ou appuyer sur le dernier comme en français. Truc : imagine que la particule est la vedette, et les deux autres ses gardes du corps !","words":[{"en":"come up with","fr":"trouver (une idée), inventer","hint":"« keu-MEUP-with » : le m glisse sur [[up]], qui prend l'accent"},{"en":"put up with","fr":"endurer, supporter","hint":"« pou-DEUP-with » : le t devient un « d » léger devant [[up]]"},{"en":"look forward to","fr":"avoir hâte de (+ -ing)","hint":"« louk-FOR-weurd-teu » : accent sur « for », [[to]] tout petit"},{"en":"get away with","fr":"s'en tirer, s'en sortir sans punition","hint":"« guè-deu-OUÉI-with » : accent sur « wéi »"},{"en":"catch up with","fr":"rattraper (quelqu'un)","hint":"« ka-TCHEUP-with » : le « tch » glisse sur [[up]]"},{"en":"run out of","fr":"manquer de, ne plus avoir de","hint":"« reu-NAOU-deuv » : le n glisse sur [[out]], le t devient « d »"},{"en":"look up to","fr":"admirer (quelqu'un)","hint":"« lou-KEUP-teu » : accent sur [[up]]"},{"en":"cut down on","fr":"réduire, consommer moins de","hint":"« keut-DAOU-nân » : accent sur [[down]], le n glisse sur [[on]]"},{"en":"make up for","fr":"compenser, se rattraper","hint":"« méi-KEUP-for » : le k glisse sur [[up]]"},{"en":"fall out with","fr":"se brouiller avec","hint":"« fâ-LAOUT-with » : le l glisse sur [[out]]"}],"pairs":[],"practice":["I can't put up with the noise, so I came up with a plan.","Don't count your chickens before they hatch.","Actions speak louder than words."]},"mission":{"type":"ecrit","prompt":"Le blogue de ton école publie chaque semaine « Le proverbe de la semaine ». Écris un billet de six à huit phrases : choisis un proverbe anglais, raconte une petite histoire qui l'illustre (vraie ou inventée), et utilise au moins quatre verbes à particule de l'unité.","model":"This week's proverb: actions speak louder than words. Last month, my friend Jaden fell out with his teammate after a silly argument. He kept saying sorry, but nothing changed. Then he came up with a better idea: every day, he helped his teammate catch up with the rest of the class in math. That made up for everything, and now they're inseparable again. So, if you've hurt someone's feelings, don't just talk: show them you care. And if it takes a while, remember: better late than never!","checklist":["J'ai cité au moins un proverbe exact, sans le traduire mot à mot","Mon histoire illustre vraiment le sens du proverbe","J'ai utilisé au moins quatre verbes à trois mots ([[come up with]], [[fall out with]], [[make up for]]…)","Après [[look forward to]], j'ai mis un verbe en -ing, si je l'ai utilisé","En relisant à voix haute, j'ai mis l'accent sur la particule du milieu"]}},{"id":"12.4","title":"Le grand oral","titleEn":"Say It Right","goal":"Déjouer les pièges de prononciation de l'anglais et comprendre un long reportage audio.","lesson":[{"type":"p","text":"Dernière étape ! En anglais, l'orthographe et la prononciation ne s'entendent pas toujours très bien. Des lettres muettes, des mots qui sonnent pareil, des accents toniques qui changent le sens… Les connaître, c'est parler et écrire comme un vrai bilingue."},{"type":"table","head":["Mot","Lettre muette","Ça sonne à peu près comme"],"rows":[["[[knife]]","k","« naïf »"],["[[knight]]","k, gh","« naït »"],["[[island]]","s","« aï-leund »"],["[[Wednesday]]","d (et un e)","« WENZ-dé »"],["[[comb]]","b","« kôm »"],["[[doubt]]","b","« daout »"],["[[listen]]","t","« LI-seun »"],["[[hour]]","h","« aou-eur »"],["[[honest]]","h","« O-nest »"],["[[receipt]]","p","« ri-SÎT »"]]},{"type":"rule","title":"Les homophones : même son, sens différent","text":"[[knight]] (chevalier) / [[night]] (nuit). [[weather]] (météo) / [[whether]] (si). [[peace]] (paix) / [[piece]] (morceau). [[right]] (droite, correct) / [[write]] (écrire). [[hear]] (entendre) / [[here]] (ici). [[flour]] (farine) / [[flower]] (fleur). À l'oral, aucun problème ; à l'écrit, c'est le piège parfait !"},{"type":"rule","title":"L'accent tonique qui change le sens","text":"Pour beaucoup de mots de deux syllabes, le **nom** a l'accent sur la **première** syllabe et le **verbe** sur la **deuxième** : [[a REcord]] (un disque, un record) / [[to reCORD]] (enregistrer). [[a PREsent]] (un cadeau) / [[to preSENT]] (présenter). [[an OBject]] (un objet) / [[to obJECT]] (s'opposer)."},{"type":"table","head":["Mot en -ough","Ça sonne comme","Sens"],"rows":[["[[though]]","« dzo »","pourtant"],["[[through]]","« srou »","à travers"],["[[thought]]","« sôt »","pensé, une pensée"],["[[tough]]","« teuf »","dur, coriace"],["[[enough]]","« i-NEUF »","assez"],["[[cough]]","« kof »","toux, tousser"]]},{"type":"examples","items":[{"en":"I waited for an hour.","fr":"J'ai attendu une heure."},{"en":"I don't know whether the weather will be nice.","fr":"Je ne sais pas si la météo sera belle."},{"en":"Can I have a piece of cake?","fr":"Est-ce que je peux avoir un morceau de gâteau ?"},{"en":"We walked through the forest, though it was tough.","fr":"On a marché à travers la forêt, même si c'était dur."},{"en":"Please keep your receipt.","fr":"Gardez votre reçu, s'il vous plaît."}]},{"type":"tip","text":"Piège de francophone : en anglais, le **h se prononce presque toujours** ([[house]], [[happy]], [[hockey]]) : ne l'avale pas ! Seuls quelques mots ont un h muet : [[hour]], [[honest]], [[honour]], [[heir]]. C'est pour ça qu'on dit [[an hour]] et [[an honest answer]], mais [[a house]]."},{"type":"fun","text":"Le sais-tu ? Il y a très longtemps, on prononçait vraiment le k de [[knight]] et de [[knife]] ! Le son a disparu, mais l'orthographe est restée. Et [[Wednesday]] vient du vieil anglais : c'était « le jour de Woden », un dieu ancien. Voilà pourquoi il y a un d qu'on n'entend plus."},{"type":"dialogue","title":"La répétition","lines":[{"who":"Chloé","en":"Can you listen to my presentation? I'm giving it on Wednesday.","fr":"Peux-tu écouter ma présentation ? Je la fais mercredi."},{"who":"Noah","en":"Sure. But careful: the d in Wednesday is silent.","fr":"Bien sûr. Mais attention : le d de Wednesday est muet."},{"who":"Chloé","en":"Seriously? Okay. Knights lived in castles, sometimes on an island.","fr":"Sérieux ? D'accord. Les chevaliers vivaient dans des châteaux, parfois sur une île."},{"who":"Noah","en":"Good, but no k in knight and no s in island!","fr":"Bien, mais pas de k dans knight et pas de s dans island !"},{"who":"Chloé","en":"This is tough. I thought I knew all this.","fr":"C'est dur. Je pensais que je savais tout ça."},{"who":"Noah","en":"Honestly, you're doing great. Just record yourself and listen.","fr":"Honnêtement, tu te débrouilles super bien. Enregistre-toi et écoute."},{"who":"Chloé","en":"Good idea. I'll record myself tonight and keep working on it all weekend.","fr":"Bonne idée. Je vais m'enregistrer ce soir et continuer à travailler toute la fin de semaine."}]}],"vocab":[{"en":"knife","fr":"couteau","alt":[],"ex":"Please pass me the butter knife."},{"en":"knight","fr":"chevalier","alt":[],"ex":"The knight lived in a stone castle."},{"en":"island","fr":"île","alt":[],"ex":"We took a boat to the island."},{"en":"Wednesday","fr":"mercredi","alt":[],"ex":"We have gym class every Wednesday."},{"en":"comb","fr":"peigne","alt":[],"ex":"I can't find my comb."},{"en":"doubt","fr":"doute, douter","alt":[],"ex":"I doubt that it will snow today."},{"en":"listen","fr":"écouter","alt":[],"ex":"Listen carefully to the instructions."},{"en":"hour","fr":"heure (soixante minutes)","alt":[],"ex":"The movie lasted two hours."},{"en":"honest","fr":"honnête","alt":[],"ex":"Thank you for your honest answer."},{"en":"receipt","fr":"reçu (de caisse)","alt":[],"ex":"Keep the receipt in case you need to return it."},{"en":"weather","fr":"météo, temps qu'il fait","alt":[],"ex":"The weather is perfect for skating."},{"en":"whether","fr":"si (whether… or not)","alt":[],"ex":"I don't know whether he is coming or not."},{"en":"peace","fr":"paix","alt":[],"ex":"I just want some peace and quiet."},{"en":"piece","fr":"morceau","alt":[],"ex":"Can I have a piece of pie?"},{"en":"flour","fr":"farine","alt":[],"ex":"We need more flour for the pancakes."},{"en":"though","fr":"pourtant, quand même","alt":[],"ex":"It was cold. We had fun, though."},{"en":"through","fr":"à travers","alt":[],"ex":"The train goes through a long tunnel."},{"en":"tough","fr":"dur, coriace","alt":[],"ex":"The final exam was tough."},{"en":"cough","fr":"toux, tousser","alt":[],"ex":"My little sister has a bad cough."},{"en":"record","fr":"enregistrer (verbe, accent sur CORD)","alt":[],"ex":"Can you record my speech?"}],"sentences":[{"en":"I wonder whether the weather will be nice on Wednesday.","fr":"Je me demande si la météo sera belle mercredi.","trap":["wether","Wensday"],"alt":[]},{"en":"Can I have a piece of cake and some peace and quiet?","fr":"Est-ce que je peux avoir un morceau de gâteau et un peu de tranquillité ?","trap":["peice","peaces"],"alt":["Can I have some peace and quiet and a piece of cake?"]},{"en":"Honestly, it took me an hour to find my receipt.","fr":"Honnêtement, ça m'a pris une heure pour trouver mon reçu.","trap":["a","receit"],"alt":["It took me an hour to find my receipt, honestly."]},{"en":"Listen carefully: the island is only reachable by boat.","fr":"Écoute bien : on ne peut aller sur l'île qu'en bateau.","trap":["lissen","iland"],"alt":["Listen carefully: the island is reachable only by boat."]},{"en":"Although it was tough, we walked through the storm.","fr":"Même si c'était dur, nous avons marché à travers la tempête.","trap":["threw","tought"],"alt":["We walked through the storm, although it was tough."]},{"en":"I thought I had a cough, but it was only allergies.","fr":"Je pensais que j'avais une toux, mais c'était seulement des allergies.","trap":["taught","coff"],"alt":[]},{"en":"We need two cups of flour for this recipe.","fr":"Il nous faut deux tasses de farine pour cette recette.","trap":["flower","cup"],"alt":["For this recipe we need two cups of flour."]},{"en":"I doubt that he will record the whole concert.","fr":"Je doute qu'il enregistre tout le concert.","trap":["dout","records"],"alt":[]},{"en":"Can you hear me from over here?","fr":"M'entends-tu d'ici ?","trap":["heard","ear"],"alt":[]},{"en":"She is honest enough to admit her mistakes.","fr":"Elle est assez honnête pour admettre ses erreurs.","trap":["enought","honnest"],"alt":[]},{"en":"The knight rode through the night to reach the castle.","fr":"Le chevalier a chevauché toute la nuit pour atteindre le château.","trap":["threw","nite"],"alt":[]}],"grammar":[{"type":"mcq","q":"Dans quel mot le k est-il muet ?","choices":["kitchen","kangaroo","knife","kick"],"answer":2,"explain":"Devant un n, le k est muet : knife se dit « naïf »."},{"type":"mcq","q":"Quelle lettre est muette dans island ?","choices":["i","s","l","d"],"answer":1,"explain":"island se dit « aï-leund » : le s est muet."},{"type":"mcq","q":"Quel mot rime avec tough ?","choices":["enough","though","through","cough"],"answer":0,"explain":"tough (« teuf ») rime avec enough (« i-NEUF »). Les autres -ough sonnent tous différemment !"},{"type":"mcq","q":"Dans « Can you record my speech? », où est l'accent de record ?","choices":["Sur la première syllabe : REcord","Sur la deuxième syllabe : reCORD","Sur les deux syllabes de façon égale"],"answer":1,"explain":"Ici, record est un verbe (enregistrer) : l'accent va sur la deuxième syllabe, reCORD."},{"type":"mcq","q":"Quel mot commence par un h muet ?","choices":["house","happy","hockey","honest"],"answer":3,"explain":"honest se dit « O-nest ». Dans les autres mots, le h se prononce."},{"type":"mcq","q":"Quelle paire n'est PAS une paire d'homophones ?","choices":["knight / night","though / through","peace / piece","weather / whether"],"answer":1,"explain":"though (« dzo ») et through (« srou ») ne se prononcent pas pareil. Les autres paires, oui !"},{"type":"mcq","q":"Quel mot a un b muet ?","choices":["bubble","about","doubt","baby"],"answer":2,"explain":"doubt se dit « daout » : le b est muet."},{"type":"fill","q":"I don't know ___ we'll go skating or not.","hint":"si (weather ou whether ?)","answer":["whether"],"explain":"si = whether. weather, c'est la météo."},{"type":"fill","q":"The ___ forecast says it will snow tonight.","hint":"météo (weather ou whether ?)","answer":["weather"],"explain":"La météo = the weather."},{"type":"fill","q":"Can I have a ___ of pizza?","hint":"morceau (peace ou piece ?)","answer":["piece"],"explain":"Un morceau = a piece. peace, c'est la paix."},{"type":"fill","q":"Keep your ___ in case you want to return the jacket.","hint":"reçu","answer":["receipt"],"explain":"Un reçu = a receipt (le p est muet !)."},{"type":"fill","q":"We walked ___ the forest to reach the lake.","hint":"à travers (though, through ou thought ?)","answer":["through"],"explain":"À travers = through."},{"type":"fill","q":"It was raining. We went outside, ___.","hint":"quand même (though, through ou tough ?)","answer":["though"],"explain":"En fin de phrase, though = quand même, pourtant."},{"type":"error","q":"I have a terrible coff and a sore throat.","wrong":4,"fix":["cough"],"explain":"La toux s'écrit cough, même si ça se prononce « kof »."},{"type":"error","q":"We waited for a hour at the dentist.","wrong":3,"fix":["an"],"explain":"Le h de hour est muet : le mot commence par un son de voyelle → an hour."},{"type":"error","q":"Can you right your name on the form?","wrong":2,"fix":["write"],"explain":"Écrire = write. right veut dire droite ou correct."},{"type":"error","q":"My mom bought a bag of flower to bake a cake.","wrong":6,"fix":["flour"],"explain":"La farine = flour. flower, c'est une fleur !"},{"type":"error","q":"I can't here you because the music is too loud.","wrong":2,"fix":["hear"],"explain":"Entendre = hear. here veut dire ici."}],"reading":{"title":"Word Nerds: Episode Twelve","text":"Maya: Welcome back to Word Nerds, the podcast where two students from Ottawa try to figure out why English is so strange. I'm Maya.\n\nEthan: And I'm Ethan. Today's question comes from a listener in Gatineau named Léa. She writes: “Why is there a b in doubt if nobody pronounces it?”\n\nMaya: Great question, Léa, and the answer is a little surprising. Hundreds of years ago, English borrowed this word from French, and it was spelled without any b at all. Later, some scholars decided that English words should look more like Latin. The Latin word had a b, so they added one. Nobody ever started pronouncing it, though.\n\nEthan: So the b is basically a decoration?\n\nMaya: Pretty much. The same thing happened with receipt, which got its p from Latin. And island got an s because people thought it was related to the word isle. It isn't, by the way.\n\nEthan: Okay, but what about knight? Was the k always silent?\n\nMaya: No! Centuries ago, people really pronounced it. Over time, the sound disappeared, but the spelling stayed the same.\n\nEthan: That's the real problem, isn't it? Pronunciation kept changing, but spelling became fixed once books started being printed.\n\nMaya: Exactly. Printing helped make spelling stable, but people never stopped changing the way they talked. That's why though, through, tough and cough look alike but sound completely different.\n\nEthan: So, Maya, what's the lesson for our listeners?\n\nMaya: Don't trust your eyes. Listen to real speakers, and when in doubt, check a dictionary. And Léa, you were right to doubt that b!\n\nEthan: Thanks for listening, everyone. Next week, we'll find out why Wednesday is so hard to spell.","questions":[{"q":"Why did scholars add a b to doubt?","choices":["To make it easier to pronounce","Because the French word had a b","To make it look more like the Latin word","Because printers made a mistake"],"answer":2},{"q":"According to Maya, why does island have an s?","choices":["People wrongly thought it was related to isle.","The s used to be pronounced.","It was added by printers.","It comes from the Latin word for water."],"answer":0},{"q":"Why do though, through, tough and cough look alike but sound different?","choices":["They come from four different languages.","Scholars invented them as a joke.","Pronunciation kept changing after spelling became fixed.","Printers changed their spelling every year."],"answer":2},{"q":"What does Maya mean by “you were right to doubt that b”?","choices":["Léa should start pronouncing the b.","Léa was right to suspect that the b has no role in pronunciation.","Léa made a spelling mistake in her question.","The b will soon be removed from dictionaries."],"answer":1},{"q":"What can we guess about the next episode?","choices":["It will be the last episode.","It will be about French words only.","Léa will be a guest.","It will explain the strange spelling of a day of the week."],"answer":3},{"q":"What is the main message of the episode?","choices":["English spelling often hides history, so don't rely only on how a word looks.","English spelling is random and has no history.","Latin is easier than English.","Silent letters should be pronounced carefully."],"answer":0}]},"pron":{"focus":"Lettres muettes et casse-tête « ough »","ipa":"","explain":"L'anglais est plein de lettres fantômes : le k devant n ([[knife]], [[knight]]), le b après m ou devant t ([[comb]], [[doubt]]), le t de [[listen]], le s de [[island]], le h de [[hour]] et [[honest]], le p de [[receipt]], et même le d de [[Wednesday]] ! Et « ough » est le roi du casse-tête : « ô » dans [[though]], « ou » dans [[through]], « euf » dans [[tough]], « â » dans [[thought]], « âf » dans [[cough]]. Il n'y a pas de règle magique : c'est l'oreille qui apprend, alors répète chaque mot jusqu'à ce qu'il sonne naturel. Bonne nouvelle : [[knight]] et [[night]], [[hour]] et [[our]] se prononcent exactement pareil, deux mots pour le prix d'un !","words":[{"en":"knight","fr":"un chevalier","hint":"« NAÏT » : le k est muet ; identique à [[night]] (la nuit)"},{"en":"island","fr":"une île","hint":"« AÏ-leund » : le s est muet, accent au début"},{"en":"Wednesday","fr":"mercredi","hint":"« OUÈNZ-déi » : deux syllabes seulement, le d est muet"},{"en":"doubt","fr":"un doute, douter","hint":"« DAOUT » : le b est muet"},{"en":"hour","fr":"une heure","hint":"« AOUR » : le h est muet ; identique à [[our]] (notre)"},{"en":"receipt","fr":"un reçu, une facture","hint":"« ri-SIIT » : le p est muet, accent à la fin"},{"en":"though","fr":"pourtant, quand même","hint":"« thô » : th doux, « ough » = « ô »"},{"en":"through","fr":"à travers","hint":"« throu » : th soufflé, « ough » = « ou »"},{"en":"tough","fr":"dur, difficile, coriace","hint":"« TEUF » : « ough » = « euf »"},{"en":"thought","fr":"une pensée ; pensé (passé de think)","hint":"« THÂT » : th soufflé, « ough » = « â », gh muet"}],"pairs":[["comb","come"],["listen","lesson"],["island","Iceland"],["cough","cuff"]],"practice":["Honestly, I doubt the knight can reach the island in an hour.","Although the walk through the snow was tough, I thought it was fun.","On Wednesday, listen carefully and keep your receipt."]},"mission":{"type":"oral","prompt":"Le grand oral ! Tu animes l'introduction du balado de ton école. Présente à voix haute, en six à huit phrases, l'invitée du jour : une autrice qui vient de publier un roman. Glisse au moins cinq mots-pièges de l'unité (lettres muettes, « ough »).","model":"Hi everyone, and welcome to the Wednesday edition of our school podcast! To be honest, I had my doubts about today's topic, but our guest turned out to be amazing. She's a writer who has just published a novel about a knight who lives alone on a tiny island. Although the story is often funny, it's also quite tough at times. I thought it would take me a week to read, but I went through it in a few hours! Stay with us: after the break, she'll answer all your questions.","checklist":["J'ai utilisé au moins cinq mots de l'unité ([[Wednesday]], [[honest]], [[doubt]], [[knight]], [[island]], [[though]], [[through]]…)","Je n'ai prononcé aucune lettre fantôme : pas de k dans [[knight]], pas de s dans [[island]], pas de h dans [[honest]]","J'ai dit [[Wednesday]] en deux syllabes : « OUÈNZ-déi »","J'ai bien distingué [[though]], [[through]], [[tough]] et [[thought]]","J'ai parlé comme un vrai animateur : souriant, avec des pauses et des mots forts"]}}]}];</script>
