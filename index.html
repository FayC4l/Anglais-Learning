,"fr":"avoir besoin de","alt":[],"ex":"We need a new ruler."},{"en":"know","fr":"savoir (connaître)","alt":[],"ex":"Do you know my brother?"},{"en":"live","fr":"habiter (vivre)","alt":[],"ex":"My aunt lives in Toronto."},{"en":"speak","fr":"parler (une langue)","alt":[],"ex":"Do you speak English?"},{"en":"understand","fr":"comprendre","alt":[],"ex":"I don't understand."},{"en":"work","fr":"travailler","alt":[],"ex":"My mom works in Gatineau."},{"en":"what","fr":"que (quoi)","alt":[],"ex":"What do you want?"},{"en":"where","fr":"où","alt":[],"ex":"Where do you live?"},{"en":"when","fr":"quand","alt":[],"ex":"When do you have lunch?"},{"en":"who","fr":"qui","alt":[],"ex":"Who is your teacher?"},{"en":"why","fr":"pourquoi","alt":[],"ex":"Why are you sad?"},{"en":"which","fr":"lequel (quel, parmi un choix)","alt":[],"ex":"Which pen do you want?"}],"sentences":[{"en":"She doesn't like pizza.","fr":"Elle n'aime pas la pizza.","trap":["don't","likes"],"alt":[]},{"en":"Do you speak French?","fr":"Parles-tu français ?","trap":["Does","speaks"],"alt":[]},{"en":"Where does your aunt live?","fr":"Où habite ta tante ?","trap":["do","lives"],"alt":[]},{"en":"My dad doesn't work on Saturday.","fr":"Mon père ne travaille pas le samedi.","trap":["don't","works"],"alt":[]},{"en":"Does Zoé understand English?","fr":"Est-ce que Zoé comprend l'anglais ?","trap":["Do","understands"],"alt":[]},{"en":"I don't know where she lives.","fr":"Je ne sais pas où elle habite.","trap":["does","live"],"alt":[]},{"en":"Why do you hate Mondays?","fr":"Pourquoi détestes-tu les lundis ?","trap":["does","hates"],"alt":[]},{"en":"What does Malik want?","fr":"Que veut Malik ?","trap":["do","wants"],"alt":[]},{"en":"When do they have lunch?","fr":"Quand dînent-ils (à quelle heure prennent-ils le repas du midi) ?","trap":["does","has"],"alt":[]},{"en":"Who speaks English at home?","fr":"Qui parle anglais à la maison ?","trap":["do","speak"],"alt":[]},{"en":"We need a new ruler.","fr":"Nous avons besoin d'une nouvelle règle.","trap":["needs","of"],"alt":[]},{"en":"Which colour do you like?","fr":"Quelle couleur aimes-tu ?","trap":["does","likes"],"alt":[]}],"grammar":[{"type":"mcq","q":"___ your brother speak French?","choices":["Do","Does","Is"],"answer":1,"explain":"Your brother = he : la question se fait avec does."},{"type":"mcq","q":"She doesn't ___ hockey.","choices":["like","likes","liking"],"answer":0,"explain":"Après doesn't, le verbe reste à la forme de base : like."},{"type":"mcq","q":"___ do you live? — In Gatineau.","choices":["Who","When","Where","What"],"answer":2,"explain":"La réponse est un lieu : on demande où, donc where."},{"type":"mcq","q":"___ is your best friend? — Amir.","choices":["What","Who","Which"],"answer":1,"explain":"La réponse est une personne : who = qui."},{"type":"mcq","q":"Does Léa like cats? — Yes, ___.","choices":["she likes","she is","she does"],"answer":2,"explain":"Réponse courte : on reprend l'assistant de la question → Yes, she does."},{"type":"mcq","q":"Who ___ Spanish in your family?","choices":["speak","speaks","do speak"],"answer":1,"explain":"Who est le sujet : pas de do, et le verbe prend un -s comme avec he."},{"type":"mcq","q":"___ pen do you want, the red pen or the blue pen?","choices":["Which","Who","Where","When"],"answer":0,"explain":"On choisit parmi deux objets : which = lequel / quel."},{"type":"fill","q":"My mom ___ work on Sunday.","hint":"ne… pas","answer":["doesn't"],"explain":"My mom = she : la négation est doesn't + verbe de base."},{"type":"fill","q":"___ they live in Toronto?","hint":"question","answer":["Do"],"explain":"Avec they, la question commence par do."},{"type":"fill","q":"Does Ethan ___ my sister?","hint":"connaître","answer":["know"],"explain":"Connaître = know. Après does, pas de -s."},{"type":"fill","q":"I ___ understand this word.","hint":"ne… pas","answer":["don't"],"explain":"Avec I, la négation est don't."},{"type":"fill","q":"___ does your dad work? — In a hospital.","hint":"où","answer":["Where"],"explain":"Où = where. On demande un lieu."},{"type":"fill","q":"Maya ___ a new bag.","hint":"vouloir","answer":["wants"],"explain":"Vouloir = want. Phrase affirmative avec she : wants."},{"type":"error","q":"She doesn't likes Mondays.","wrong":2,"fix":["like"],"explain":"Doesn't garde déjà le -s : le verbe reste like."},{"type":"error","q":"Do your sister speak English?","wrong":0,"fix":["Does"],"explain":"Your sister = she : la question commence par does."},{"type":"error","q":"Where does you live?","wrong":1,"fix":["do"],"explain":"Avec you, c'est do : Where do you live?"},{"type":"error","q":"He don't work on Saturday.","wrong":1,"fix":["doesn't"],"explain":"Avec he, la négation est doesn't."},{"type":"error","q":"Does Noah wants a dog?","wrong":2,"fix":["want"],"explain":"Après does, le verbe reste à la forme de base : want."}],"reading":{"title":"A New Friend","text":"Félix is new in Ana's class. Ana wants to be his friend.\n\n“Where do you live, Félix?”\n\n“I live in Gatineau, but my mom works in Ottawa.”\n\n“Do you speak English at home?”\n\n“No, we don't. We speak French. My dad doesn't speak English, but he understands it.”\n\n“What do you like?”\n\n“I love hockey, but I hate Mondays!”\n\n“Why?”\n\n“Because we have a math test every Monday!”","questions":[{"q":"Où habite Félix ?","choices":["À Ottawa","À Gatineau","À Toronto","À Montréal"],"answer":1},{"q":"Qui travaille à Ottawa ?","choices":["Le père de Félix","Ana","Félix","La mère de Félix"],"answer":3},{"q":"Quelle langue parle-t-on chez Félix ?","choices":["Le français","L'anglais","L'anglais et le français","L'espagnol"],"answer":0},{"q":"Que sait-on du père de Félix ?","choices":["Il parle très bien anglais","Il ne comprend pas l'anglais","Il comprend l'anglais, mais ne le parle pas","Il travaille à Gatineau"],"answer":2},{"q":"Pourquoi Félix déteste-t-il les lundis ?","choices":["Il n'y a pas de hockey","Il a un examen de maths","Il se lève tôt","Il ne voit pas Ana"],"answer":1}]},"pron":{"focus":"La mélodie des questions","ipa":"","explain":"En anglais, la voix ne fait pas la même chose pour toutes les questions. Quand on peut répondre **oui ou non** ([[Do you like pizza?]]), la voix **monte** à la fin, comme un ascenseur qui va vers le haut ↗. Quand la question commence par un mot comme [[where]], [[what]] ou [[when]] ([[Where do you live?]]), la voix **descend** à la fin ↘, comme dans une phrase normale : le mot en « wh » fait déjà le travail de la question ! Petit secret : dans la vraie vie, [[do you]] se dit très vite, presque « deu-yeu ». Écoute bien la voix, puis exagère la mélodie en répétant.","words":[{"en":"do you like pizza","fr":"aimes-tu la pizza ?","hint":"« deu-yeu-LAÏK-PIT-sa ↗ » : oui ou non, donc la voix monte à la fin"},{"en":"does she speak French","fr":"parle-t-elle français ?","hint":"« deuz-chi-SPIIK-FRÈNNTCH ↗ » : la voix monte à la fin"},{"en":"are you hungry","fr":"as-tu faim ?","hint":"« âr-yeu-HEUN-gri ↗ » : la voix monte sur « gri »"},{"en":"do you understand","fr":"comprends-tu ?","hint":"« deu-yeu-eun-deur-STANND ↗ » : accent et montée à la fin"},{"en":"where do you live","fr":"où habites-tu ?","hint":"« WÈR-deu-yeu-LIV ↘ » : question en « wh », la voix descend à la fin"},{"en":"what do you want","fr":"que veux-tu ?","hint":"« WEU-deu-yeu-WANNT ↘ » : la voix descend, comme une phrase normale"},{"en":"when is your birthday","fr":"quand est ton anniversaire ?","hint":"« WÈNN-iz-yeur-BEURTH-déï ↘ » : la voix descend à la fin"},{"en":"why are you sad","fr":"pourquoi es-tu triste ?","hint":"« WAÏ-âr-yeu-SAD ↘ » : la voix descend sur « SAD »"}],"pairs":[],"practice":["Do you like hockey?","Where do you live?","Does your brother speak English?"]},"mission":{"type":"oral","prompt":"Une nouvelle élève, Priya, arrive de Vancouver dans ta classe. Pose-lui quatre questions pour faire connaissance : deux questions avec réponse oui/non et deux questions avec un mot en « wh ».","model":"Hi, Priya! Where do you live? Do you speak French? What do you like? Does your brother go to this school?","checklist":["J'ai utilisé [[do]] avec I, you, we, they et [[does]] avec he, she, it","Après [[does]], j'ai gardé le verbe de base ([[Does he go]], pas « Does he goes »)","Ma voix est montée à la fin des questions oui/non ↗","Ma voix est descendue à la fin des questions en [[where]], [[what]], [[when]] ↘"]}},{"id":"3.3","title":"La nourriture","titleEn":"Snack Time","goal":"Parler de nourriture, commander poliment et demander des quantités avec some, any, much et many.","lesson":[{"type":"p","text":"Pour parler de nourriture, il faut d'abord savoir si on peut **compter** la chose ou non. Ça change tout : a / an, -s, some / any, much / many ! Verbes utiles : [[eat]] (manger) et [[drink]] (boire)."},{"type":"rule","title":"Comptable ou pas ?","text":"Ce qu'on peut compter prend **a / an** et un **-s** au pluriel : [[an egg]], [[two eggs]], [[an apple]], [[three cookies]]. Ce qu'on ne peut pas compter ne prend **jamais** a ni -s : [[water]], [[milk]], [[bread]], [[cheese]], [[juice]], [[maple syrup]]."},{"type":"table","head":["","Comptable (pluriel)","Indénombrable"],"rows":[["Affirmatif : some","[[I have some apples.]]","[[I have some milk.]]"],["Négatif : any","[[I don't have any apples.]]","[[I don't have any milk.]]"],["Question : any","[[Do you have any apples?]]","[[Do you have any milk?]]"]]},{"type":"rule","title":"How much ou How many ?","text":"[[How many]] + chose comptable au pluriel : [[How many eggs?]] [[How much]] + chose indénombrable : [[How much water?]] Et [[a lot of]] (beaucoup de) marche avec les deux : [[a lot of cookies]], [[a lot of juice]]."},{"type":"rule","title":"Commander poliment","text":"[[I'd like]] = je voudrais (c'est [[I would like]]). Pour offrir quelque chose : [[Would you like some juice?]] Ici on garde **some**, parce qu'on offre."},{"type":"examples","items":[{"en":"I'd like some water, please.","fr":"Je voudrais de l'eau, s'il vous plaît."},{"en":"We don't have any bread.","fr":"Nous n'avons pas de pain."},{"en":"How many eggs do you need?","fr":"De combien d'œufs as-tu besoin ?"},{"en":"How much milk does she want?","fr":"Combien de lait veut-elle ?"},{"en":"My grandpa eats a lot of cheese.","fr":"Mon grand-père mange beaucoup de fromage."}]},{"type":"tip","text":"Le français dit « **du** pain », « **de l'**eau ». En anglais : pas d'article, ou **some**. Jamais [[a bread]] ni [[breads]] ! Et pour parler en général, pas de the : « J'aime le fromage » = [[I like cheese.]]"},{"type":"fun","text":"Le sais-tu ? La **poutine** vient du Québec : des frites ([[fries]]), du fromage en grains et une sauce brune. Et le Québec produit la majorité du sirop d'érable ([[maple syrup]]) de la planète !"},{"type":"dialogue","title":"Au casse-croûte","lines":[{"who":"Employé","en":"Hi! What would you like?","fr":"Bonjour ! Qu'est-ce que tu voudrais ?"},{"who":"Maya","en":"I'd like some fries and some water, please.","fr":"Je voudrais des frites et de l'eau, s'il vous plaît."},{"who":"Employé","en":"Would you like some cheese on your fries?","fr":"Voudrais-tu du fromage sur tes frites ?"},{"who":"Maya","en":"Yes, please! A lot of cheese!","fr":"Oui, s'il vous plaît ! Beaucoup de fromage !"},{"who":"Employé","en":"Sorry, we don't have any cheese today.","fr":"Désolé, nous n'avons pas de fromage aujourd'hui."},{"who":"Maya","en":"Oh no! No poutine for me today!","fr":"Oh non ! Pas de poutine pour moi aujourd'hui !"}]}],"vocab":[{"en":"bread","fr":"pain","alt":[],"ex":"We don't have any bread."},{"en":"milk","fr":"lait","alt":[],"ex":"I'd like some milk, please."},{"en":"water","fr":"eau","alt":[],"ex":"How much water do you drink?"},{"en":"juice","fr":"jus","alt":[],"ex":"Would you like some juice?"},{"en":"cheese","fr":"fromage","alt":[],"ex":"My grandpa eats a lot of cheese."},{"en":"egg","fr":"œuf","alt":[],"ex":"I have an egg for breakfast."},{"en":"apple","fr":"pomme","alt":[],"ex":"She eats an apple every day."},{"en":"vegetable","fr":"légume","alt":[],"ex":"He doesn't like vegetables."},{"en":"fries","fr":"frites","alt":["french fries"],"ex":"I'd like some fries, please."},{"en":"pancake","fr":"crêpe","alt":[],"ex":"Liam eats six pancakes!"},{"en":"maple syrup","fr":"sirop d'érable","alt":[],"ex":"Canadians love maple syrup."},{"en":"cookie","fr":"biscuit","alt":[],"ex":"We have a lot of cookies."},{"en":"how much","fr":"combien (chose qu'on ne compte pas)","alt":[],"ex":"How much milk do you want?"},{"en":"how many","fr":"combien (chose qu'on compte)","alt":[],"ex":"How many eggs do you need?"},{"en":"a lot of","fr":"beaucoup de","alt":["lots of"],"ex":"My dad drinks a lot of water."},{"en":"I'd like","fr":"je voudrais","alt":[],"ex":"I'd like some juice, please."}],"sentences":[{"en":"I'd like some water, please.","fr":"Je voudrais de l'eau, s'il vous plaît.","trap":["any","waters"],"alt":[]},{"en":"We don't have any bread.","fr":"Nous n'avons pas de pain.","trap":["some","breads"],"alt":[]},{"en":"How many eggs do you need?","fr":"De combien d'œufs as-tu besoin ?","trap":["much","does"],"alt":[]},{"en":"How much milk does she want?","fr":"Combien de lait veut-elle ?","trap":["many","wants"],"alt":[]},{"en":"My grandpa eats a lot of cheese.","fr":"Mon grand-père mange beaucoup de fromage.","trap":["eat","cheeses"],"alt":[]},{"en":"Do you have any apples?","fr":"As-tu des pommes ?","trap":["Does","apple"],"alt":[]},{"en":"Canadians love maple syrup.","fr":"Les Canadiens adorent le sirop d'érable.","trap":["loves","syrups"],"alt":[]},{"en":"Zoé never drinks milk.","fr":"Zoé ne boit jamais de lait.","trap":["drink","doesn't"],"alt":[]},{"en":"Would you like some juice?","fr":"Voudrais-tu du jus ?","trap":["Do","juices"],"alt":[]},{"en":"He doesn't like vegetables.","fr":"Il n'aime pas les légumes.","trap":["likes","vegetable"],"alt":[]},{"en":"We have a lot of cookies.","fr":"Nous avons beaucoup de biscuits.","trap":["much","cookie"],"alt":[]},{"en":"Liam eats pancakes with maple syrup.","fr":"Liam mange des crêpes avec du sirop d'érable.","trap":["eat","syrups"],"alt":[]}],"grammar":[{"type":"mcq","q":"How ___ water do you drink every day?","choices":["many","much","lot"],"answer":1,"explain":"Water ne se compte pas : how much."},{"type":"mcq","q":"How ___ apples do you want?","choices":["many","much","any"],"answer":0,"explain":"Apples se comptent (pluriel) : how many."},{"type":"mcq","q":"I don't have ___ cheese.","choices":["a","some","any"],"answer":2,"explain":"Phrase négative : any. Et cheese ne se compte pas, donc jamais a."},{"type":"mcq","q":"Lequel de ces mots est indénombrable (jamais de a, jamais de -s) ?","choices":["egg","apple","cookie","bread"],"answer":3,"explain":"Bread ne se compte pas : on dit some bread, jamais a bread ni breads."},{"type":"mcq","q":"Comment dit-on « Je voudrais du jus » ?","choices":["I like some juice.","I'd like of juice.","I'd like some juice.","I'd like juices."],"answer":2,"explain":"Je voudrais = I'd like, et « du » = some."},{"type":"mcq","q":"We need ___ eggs for breakfast.","choices":["a lot of","much","a"],"answer":0,"explain":"A lot of marche avec un pluriel. Much va avec ce qui ne se compte pas, et a n'est jamais suivi d'un pluriel."},{"type":"fill","q":"How ___ cookies do you want?","hint":"combien","answer":["many"],"explain":"Cookies se comptent : how many."},{"type":"fill","q":"How ___ milk do we need?","hint":"combien","answer":["much"],"explain":"Milk ne se compte pas : how much."},{"type":"fill","q":"She doesn't want ___ fries.","hint":"des (phrase négative)","answer":["any"],"explain":"Dans une phrase négative, « des » = any."},{"type":"fill","q":"I'd like ___ bread, please.","hint":"du (phrase affirmative)","answer":["some"],"explain":"Phrase affirmative : « du » = some."},{"type":"fill","q":"___ like some cheese, please.","hint":"je voudrais","answer":["I'd"],"explain":"Je voudrais = I'd like (I would like)."},{"type":"fill","q":"My brother eats ___ apple every day.","hint":"un / une","answer":["an"],"explain":"Apple commence par une voyelle : an apple."},{"type":"error","q":"I'd like a bread, please.","wrong":2,"fix":["some","the"],"explain":"Bread ne se compte pas : jamais a. On dit some bread."},{"type":"error","q":"How many milk do you want?","wrong":1,"fix":["much"],"explain":"Milk ne se compte pas : how much."},{"type":"error","q":"We don't have some eggs.","wrong":3,"fix":["any"],"explain":"Dans une phrase négative, on utilise any."},{"type":"error","q":"How much cookies do you have?","wrong":1,"fix":["many"],"explain":"Cookies se comptent : how many."},{"type":"error","q":"I don't eat many cheese.","wrong":3,"fix":["much"],"explain":"Cheese ne se compte pas : much, pas many."}],"reading":{"title":"Sunday Breakfast","text":"Every Sunday, Olivia and Liam have breakfast at their grandma's house. Grandma always makes a lot of pancakes with maple syrup. Liam loves pancakes. He eats six!\n\nOlivia doesn't like pancakes. She has an egg and some bread with cheese.\n\n“Would you like some juice?” Grandma asks.\n\n“No, thank you. I'd like some milk, please,” Olivia says.\n\n“Sorry, I don't have any milk today.”\n\nSo Olivia drinks water. And how many pancakes does Grandma eat? Zero! She never has breakfast.","questions":[{"q":"Quand Olivia et Liam déjeunent-ils chez leur grand-mère ?","choices":["Le samedi","Le dimanche","Tous les jours","Le lundi"],"answer":1},{"q":"Combien de crêpes Liam mange-t-il ?","choices":["Deux","Zéro","Six","Dix"],"answer":2},{"q":"Que mange Olivia ?","choices":["Des crêpes au sirop d'érable","Des frites","Une pomme et un biscuit","Un œuf et du pain avec du fromage"],"answer":3},{"q":"Pourquoi Olivia boit-elle de l'eau ?","choices":["Grand-maman n'a pas de lait","Elle n'aime pas le jus","Elle a très soif","Le lait est pour Liam"],"answer":0},{"q":"Combien de crêpes grand-maman mange-t-elle ?","choices":["Six","Une","Aucune","Beaucoup"],"answer":2}]},"pron":{"focus":"Les sons « dj » (juice) et « tch » (cheese)","ipa":"/dʒ/ – /tʃ/","explain":"Le « j » français de « jus » est tout doux. Le « j » anglais de [[juice]], lui, commence par un petit « d » : « djouss », comme dans « adjectif ». Même chose pour le « ch » : en anglais, [[cheese]] se dit « tchiiz », avec un petit « t » devant, comme un éternuement : « atchoum ! ». Le piège du francophone, c'est de dire « shicken » pour [[chicken]] : on entend alors un autre mot, comme [[ship]] (bateau) au lieu de [[chip]] (croustille) ! Truc : pour faire le « t » ou le « d », colle d'abord le bout de ta langue derrière tes dents du haut, puis décolle-la d'un coup.","words":[{"en":"juice","fr":"jus","hint":"« djouss » : un petit « d » devant le « j », puis un « ou » long"},{"en":"jam","fr":"confiture","hint":"« djamm » : « dj » au début, bouche bien ouverte sur le « a »"},{"en":"orange","fr":"orange","hint":"« Ô-rinndj » : accent au début, et finis par « ndj » (pas « o-ranje »)"},{"en":"vegetables","fr":"légumes","hint":"« VÈDJ-teu-beulz » : trois syllabes seulement, accent au début, « dj » au milieu"},{"en":"fridge","fr":"frigo, réfrigérateur","hint":"« fridj » : finis par « dj », le « d » écrit ne s'entend pas tout seul"},{"en":"cheese","fr":"fromage","hint":"« tchiiz » : « tch » comme dans « atchoum », « ii » long, puis un « z »"},{"en":"chicken","fr":"poulet","hint":"« TCHI-kinn » : « tch », pas « sh » ! Accent au début"},{"en":"lunch","fr":"dîner (repas du midi)","hint":"« leuntch » : un « eu » court, puis « ntch »"},{"en":"kitchen","fr":"cuisine (la pièce)","hint":"« KI-tchinn » : « tch » au milieu, accent au début"}],"pairs":[["jeep","cheap"],["joke","choke"],["badge","batch"],["chip","ship"],["chair","share"],["watch","wash"]],"practice":["I'd like some orange juice and a cheese sandwich for lunch.","Charlie eats chicken and vegetables in the kitchen."]},"mission":{"type":"ecrit","prompt":"Ton ami Ethan vient dîner chez toi samedi. Écris-lui un message pour lui dire ce que vous avez à manger, ce que vous n'avez pas, puis demande-lui ce qu'il aimerait manger.","model":"Hi, Ethan! We have some chicken and a lot of vegetables. We don't have any juice. What would you like for lunch?","checklist":["J'ai utilisé [[some]] dans une phrase affirmative et [[any]] dans une phrase négative","Je n'ai pas mis de « s » aux noms indénombrables ([[juice]], [[cheese]], pas « juices »)","J'ai utilisé [[would like]] pour demander poliment","J'ai relu à voix haute avec « tch » dans [[chicken]] et « dj » dans [[juice]]"]}},{"id":"3.4","title":"La maison","titleEn":"Home Sweet Home","goal":"Décrire une maison avec there is / there are et dire où sont les objets.","lesson":[{"type":"p","text":"Pour décrire ta maison, tu as besoin de **« il y a »**. En anglais : [[there is]] (un seul) et [[there are]] (plusieurs). Une pièce de la maison = [[a room]]."},{"type":"table","head":["","Singulier","Pluriel"],"rows":[["Affirmatif","[[There is a lamp.]]","[[There are two lamps.]]"],["Négatif","[[There isn't a fridge.]]","[[There aren't any windows.]]"],["Question","[[Is there a couch?]]","[[Are there any chairs?]]"],["Réponse courte","[[Yes, there is.]] / [[No, there isn't.]]","[[Yes, there are.]] / [[No, there aren't.]]"]]},{"type":"rule","title":"Is ou are ?","text":"Regarde le nom qui suit : un seul → [[there is]] (ou [[there's]]) ; plusieurs → [[there are]]. Pour compter : [[How many rooms are there?]] Et au négatif pluriel, on ajoute **any** : [[There aren't any stairs.]]"},{"type":"table","head":["Anglais","Français"],"rows":[["[[in]]","dans"],["[[on]]","sur"],["[[under]]","sous"],["[[next to]]","à côté de"],["[[between]]","entre"],["[[behind]]","derrière"],["[[in front of]]","devant"],["[[above]]","au-dessus de"]]},{"type":"examples","items":[{"en":"There are two bedrooms in my house.","fr":"Il y a deux chambres dans ma maison."},{"en":"Is there a fridge in the kitchen?","fr":"Y a-t-il un frigo dans la cuisine ?"},{"en":"There aren't any windows in the bathroom.","fr":"Il n'y a pas de fenêtres dans la salle de bain."},{"en":"The lamp is between the bed and the window.","fr":"La lampe est entre le lit et la fenêtre."},{"en":"My cat sleeps under the couch.","fr":"Mon chat dort sous le canapé."}]},{"type":"tip","text":"« Il y a » ne se traduit **jamais** par [[It has]] ni [[There have]] ! Et « devant » = [[in front of]], pas [[before]] : before, c'est pour le temps ([[before dinner]]). Enfin, « à côté **de** » = [[next to]], jamais [[next of]]."},{"type":"fun","text":"Le sais-tu ? Au Canada, on dit souvent [[washroom]] pour les toilettes dans un lieu public. À la maison, on parle plutôt de la [[bathroom]]."},{"type":"dialogue","title":"Visite chez Priya","lines":[{"who":"Priya","en":"Welcome! This is the living room.","fr":"Bienvenue ! Voici le salon."},{"who":"Jaden","en":"Wow, there is a big couch!","fr":"Wow, il y a un gros canapé !"},{"who":"Priya","en":"Yes, and my bedroom is next to the kitchen.","fr":"Oui, et ma chambre est à côté de la cuisine."},{"who":"Jaden","en":"Are there any cookies in the kitchen?","fr":"Est-ce qu'il y a des biscuits dans la cuisine ?"},{"who":"Priya","en":"No, there aren't. Sorry!","fr":"Non, il n'y en a pas. Désolée !"},{"who":"Jaden","en":"Where is your dog?","fr":"Où est ton chien ?"},{"who":"Priya","en":"He's under my bed, as always!","fr":"Il est sous mon lit, comme toujours !"}]}],"vocab":[{"en":"kitchen","fr":"cuisine","alt":[],"ex":"Is there a fridge in the kitchen?"},{"en":"bedroom","fr":"chambre","alt":[],"ex":"There are two bedrooms in my house."},{"en":"bathroom","fr":"salle de bain","alt":["washroom"],"ex":"The bathroom is next to my bedroom."},{"en":"living room","fr":"salon","alt":[],"ex":"We watch TV in the living room."},{"en":"couch","fr":"canapé (divan)","alt":["sofa"],"ex":"My cat sleeps under the couch."},{"en":"lamp","fr":"lampe","alt":[],"ex":"There is a lamp next to my bed."},{"en":"fridge","fr":"frigo (réfrigérateur)","alt":["refrigerator"],"ex":"There isn't any milk in the fridge."},{"en":"window","fr":"fenêtre","alt":[],"ex":"There is a big window in the living room."},{"en":"door","fr":"porte","alt":[],"ex":"My bag is behind the door."},{"en":"stairs","fr":"escalier","alt":["staircase"],"ex":"There aren't any stairs in my house."},{"en":"under","fr":"sous","alt":[],"ex":"The dog is under the table."},{"en":"next to","fr":"à côté de","alt":[],"ex":"The bathroom is next to the kitchen."},{"en":"between","fr":"entre","alt":[],"ex":"The lamp is between the bed and the window."},{"en":"behind","fr":"derrière","alt":[],"ex":"The cat is behind the door."},{"en":"in front of","fr":"devant","alt":[],"ex":"Emma is in front of the house."},{"en":"above","fr":"au-dessus de","alt":["over"],"ex":"There is a lamp above the table."}],"sentences":[{"en":"There are two bedrooms in my house.","fr":"Il y a deux chambres dans ma maison.","trap":["is","have"],"alt":["In my house there are two bedrooms."]},{"en":"Is there a fridge in the kitchen?","fr":"Y a-t-il un frigo dans la cuisine ?","trap":["Are","has"],"alt":[]},{"en":"There aren't any windows in the bathroom.","fr":"Il n'y a pas de fenêtres dans la salle de bain.","trap":["isn't","some"],"alt":["In the bathroom there aren't any windows."]},{"en":"My cat sleeps under the couch.","fr":"Mon chat dort sous le canapé.","trap":["sleep","is"],"alt":[]},{"en":"The lamp is between the bed and the window.","fr":"La lampe est entre le lit et la fenêtre.","trap":["are","of"],"alt":[]},{"en":"How many rooms are there in your house?","fr":"Combien de pièces y a-t-il dans ta maison ?","trap":["much","is"],"alt":[]},{"en":"The bathroom is next to my bedroom.","fr":"La salle de bain est à côté de ma chambre.","trap":["of","are"],"alt":[]},{"en":"There is a big window above the couch.","fr":"Il y a une grande fenêtre au-dessus du canapé.","trap":["are","has"],"alt":["Above the couch there is a big window."]},{"en":"My bag is behind the door.","fr":"Mon sac est derrière la porte.","trap":["of","are"],"alt":[]},{"en":"Emma is in front of the house.","fr":"Emma est devant la maison.","trap":["before","at"],"alt":[]},{"en":"Are there any cookies in the kitchen?","fr":"Y a-t-il des biscuits dans la cuisine ?","trap":["Is","much"],"alt":[]},{"en":"There isn't a lamp in my bedroom.","fr":"Il n'y a pas de lampe dans ma chambre.","trap":["aren't","It"],"alt":["In my bedroom there isn't a lamp."]}],"grammar":[{"type":"mcq","q":"There ___ three windows in my bedroom.","choices":["is","are","have"],"answer":1,"explain":"Three windows = plusieurs : there are."},{"type":"mcq","q":"___ a lamp in the living room?","choices":["Is there","Are there","There is"],"answer":0,"explain":"Une seule lampe et c'est une question : Is there…?"},{"type":"mcq","q":"Comment dit-on « devant la maison » ?","choices":["before the house","behind the house","in front of the house"],"answer":2,"explain":"Devant = in front of. Before sert pour le temps, et behind veut dire derrière."},{"type":"mcq","q":"There aren't ___ chairs in the kitchen.","choices":["any","a","some"],"answer":0,"explain":"Négatif + pluriel : any."},{"type":"mcq","q":"Comment dit-on « entre la porte et la fenêtre » ?","choices":["next the door and the window","between the door and the window","above the door and the window"],"answer":1,"explain":"Entre = between."},{"type":"mcq","q":"How many bedrooms ___ there in your house?","choices":["have","is","has","are"],"answer":3,"explain":"Bedrooms est au pluriel : How many bedrooms are there?"},{"type":"fill","q":"There ___ a big couch in the living room.","hint":"il y a","answer":["is"],"explain":"A big couch = un seul : there is."},{"type":"fill","q":"___ there any eggs in the fridge?","hint":"question","answer":["Are"],"explain":"Eggs est au pluriel : Are there any…?"},{"type":"fill","q":"There ___ any cookies in the kitchen.","hint":"il n'y a pas de","answer":["aren't"],"explain":"Pluriel + négatif : there aren't any."},{"type":"fill","q":"The bathroom is ___ the kitchen and my bedroom.","hint":"entre","answer":["between"],"explain":"Entre deux choses = between."},{"type":"fill","q":"My bag is ___ the door.","hint":"derrière","answer":["behind"],"explain":"Derrière = behind."},{"type":"fill","q":"The lamp is ___ the table.","hint":"au-dessus de","answer":["above","over"],"explain":"Au-dessus de = above (ou over)."},{"type":"error","q":"There is two bathrooms in the house.","wrong":1,"fix":["are"],"explain":"Two bathrooms = pluriel : there are."},{"type":"error","q":"Is there any chairs in the kitchen?","wrong":0,"fix":["Are"],"explain":"Chairs est au pluriel : Are there any chairs?"},{"type":"error","q":"The cat is next of the couch.","wrong":4,"fix":["to"],"explain":"À côté de = next to, jamais next of."},{"type":"error","q":"There aren't some windows in the bathroom.","wrong":2,"fix":["any"],"explain":"Dans une phrase négative : any, pas some."},{"type":"error","q":"Are there a fridge in the kitchen?","wrong":0,"fix":["Is"],"explain":"A fridge = un seul : Is there a fridge?"}],"reading":{"title":"Priya's House","text":"Priya lives in a small house in Gatineau. There are five rooms: a kitchen, a living room, a bathroom and two bedrooms. There aren't any stairs.\n\nIn the living room, there is a big couch in front of the window. There is a lamp next to the couch. Priya's bedroom is between the bathroom and the kitchen. In her bedroom, there is a bed, a desk and a chair. Above the bed, there is a photo of her dog, Max.\n\nAnd where is Max? He is under the bed, as always!","questions":[{"q":"Combien de chambres y a-t-il dans la maison ?","choices":["Une","Deux","Trois","Cinq"],"answer":1},{"q":"Où est le canapé ?","choices":["Devant la fenêtre","Derrière la porte","Dans la chambre","À côté du lit"],"answer":0},{"q":"Où est la chambre de Priya ?","choices":["À côté du salon","Au-dessus de la cuisine","Entre la salle de bain et la cuisine","Derrière la maison"],"answer":2},{"q":"Qu'est-ce qu'il y a au-dessus du lit ?","choices":["Une lampe","Une fenêtre","Un bureau","Une photo du chien"],"answer":3},{"q":"Où est Max ?","choices":["Sur le canapé","Sous le lit","Dans la cuisine","Devant la maison"],"answer":1}]},"pron":{"focus":"Le « ou » court (book) ou long (food)","ipa":"/ʊ/ – /uː/","explain":"En français, il y a un seul « ou ». En anglais, il y en a deux ! Le « ou » **long** de [[food]] et [[room]] est tendu : avance les lèvres comme pour un bisou et étire le son, « fouuud ». Le « ou » **court** de [[book]] et [[good]] est rapide et paresseux : les lèvres bougent à peine, et ça ressemble presque à un « eu ». Le piège : les deux s'écrivent souvent « oo », alors l'orthographe ne t'aide pas ! Écoute bien la différence entre [[full]] (plein) et [[fool]] (un nigaud).","words":[{"en":"book","fr":"livre","hint":"« bouk » : un « ou » très court et détendu, presque « beuk »"},{"en":"look","fr":"regarder","hint":"« louk » : « ou » court, lèvres presque pas arrondies"},{"en":"good","fr":"bon, bonne, bien","hint":"« goud » : « ou » court et rapide"},{"en":"cook","fr":"cuisiner ; un cuisinier","hint":"« kouk » : « ou » court, comme dans [[book]]"},{"en":"put","fr":"mettre, poser","hint":"« pout » : « ou » court ; ça ne rime pas avec [[but]] !"},{"en":"food","fr":"nourriture","hint":"« fouud » : « ou » long, lèvres en bisou"},{"en":"room","fr":"pièce, chambre","hint":"« rouum » : « ou » long et tendu, « r » anglais au début"},{"en":"bedroom","fr":"chambre à coucher","hint":"« BÈD-rouum » : accent au début, « ou » long à la fin"},{"en":"bathroom","fr":"salle de bain","hint":"« BATH-rouum » : « th » soufflé, accent au début, « ou » long à la fin"},{"en":"school","fr":"école","hint":"« skouul » : « ou » long, puis un « l » bien sombre"}],"pairs":[["full","fool"],["pull","pool"]],"practice":["Look at the good book in my room.","Put the food on the table in the kitchen."]},"mission":{"type":"oral","prompt":"Ton cousin de Montréal t'appelle en vidéo, et il veut pratiquer son anglais. Fais-lui visiter ta chambre : dis ce qu'il y a dedans et où se trouvent au moins deux choses.","model":"This is my bedroom. There is a bed next to the window. There are a lot of books on my desk. And look, my cat is under the bed!","checklist":["J'ai utilisé [[there is]] avec une seule chose et [[there are]] avec plusieurs","J'ai utilisé au moins deux prépositions de lieu ([[on]], [[under]], [[next to]], [[between]]…)","J'ai dit « ou » long dans [[room]] et « ou » court dans [[book]] et [[look]]","Je n'ai pas dit « it has » pour « il y a »"]}}]},{"id":4,"cefr":"A2","title":"En action","titleEn":"In Action","intro":"Dis ce qui se passe en ce moment, parle de tes talents sportifs, trouve ton chemin en ville et magasine comme un pro.","boss":{"name":"Capitaine Can","taunt":"I can skate, I can ski, I can win ! Et toi, tu dis encore « I can to swim » ? Ha !","defeat":"Je ne peux pas y croire… You can, and I can't !"},"units":[{"id":"4.1","title":"En ce moment","titleEn":"Right Now!","goal":"Dire ce qui se passe en ce moment avec le présent continu, et le distinguer du présent simple.","lesson":[{"type":"p","text":"Pour dire ce qui se passe **en ce moment**, l'anglais utilise le **présent continu** : be + verbe en **-ing**. [[I am reading.]] = Je lis (en ce moment)."},{"type":"table","head":["Sujet","Affirmatif","Négatif","Question"],"rows":[["I","[[I am eating.]]","[[I'm not eating.]]","[[Am I eating?]]"],["he / she / it","[[She is eating.]]","[[She isn't eating.]]","[[Is she eating?]]"],["you / we / they","[[They are eating.]]","[[They aren't eating.]]","[[Are they eating?]]"]]},{"type":"rule","title":"L'orthographe du -ing","text":"1. En général, on ajoute -ing : [[read]] → [[reading]]. 2. Un **-e** muet à la fin ? On l'enlève : [[write]] → [[writing]], [[dance]] → [[dancing]]. 3. Mot court qui finit par voyelle + consonne ? On **double** la consonne : [[run]] → [[running]], [[sit]] → [[sitting]], [[swim]] → [[swimming]]."},{"type":"rule","title":"Maintenant ou d'habitude ?","text":"Présent simple = habitude : [[every day]], [[usually]], [[never]]. Présent continu = maintenant : [[right now]], [[Look!]], [[Listen!]], [[Shh!]], [[today]]. [[Zoé usually walks, but today she is running.]]"},{"type":"p","text":"Ces verbes gardent leur petit mot : [[wait for]] (attendre quelqu'un ou quelque chose), [[listen to]] (écouter), [[look at]] (regarder). On dit [[We are waiting for the bus.]], jamais [[waiting the bus]]."},{"type":"examples","items":[{"en":"What are you doing?","fr":"Qu'est-ce que tu fais (en ce moment) ?"},{"en":"My dad is cooking dinner.","fr":"Mon père prépare le souper."},{"en":"They aren't listening to the teacher.","fr":"Ils n'écoutent pas l'enseignante."},{"en":"Is Maya sleeping?","fr":"Est-ce que Maya dort ?"},{"en":"Priya is writing a story.","fr":"Priya écrit une histoire."}]},{"type":"tip","text":"Le français n'a qu'un présent (« je mange »), l'anglais en a deux ! Et certains verbes ne prennent **jamais** -ing, même en ce moment : [[know]], [[like]], [[want]], [[need]], [[understand]]. On dit [[I know the answer.]], jamais [[I am knowing]]."},{"type":"dialogue","title":"Au téléphone","lines":[{"who":"Zoé","en":"Hi Noah! What are you doing?","fr":"Salut Noah ! Qu'est-ce que tu fais ?"},{"who":"Noah","en":"I'm cooking dinner with my dad.","fr":"Je prépare le souper avec mon père."},{"who":"Zoé","en":"You're cooking? You never cook!","fr":"Tu cuisines ? Tu ne cuisines jamais !"},{"who":"Noah","en":"I know! My dad is laughing a lot.","fr":"Je sais ! Mon père rit beaucoup."},{"who":"Zoé","en":"And your sister? Is she helping?","fr":"Et ta sœur ? Est-ce qu'elle aide ?"},{"who":"Noah","en":"No, she isn't. She's sitting on the couch and listening to music.","fr":"Non. Elle est assise sur le canapé et elle écoute de la musique."}]}],"vocab":[{"en":"right now","fr":"en ce moment","alt":["now","at the moment"],"ex":"I am reading a book right now."},{"en":"run","fr":"courir","alt":[],"ex":"She is running in the park."},{"en":"write","fr":"écrire","alt":[],"ex":"He is writing to his grandma."},{"en":"sit","fr":"s'asseoir (être assis)","alt":[],"ex":"The baby is sitting on the couch."},{"en":"cook","fr":"cuisiner (faire à manger)","alt":[],"ex":"My dad is cooking dinner."},{"en":"wait","fr":"attendre","alt":[],"ex":"We are waiting for the bus."},{"en":"sleep","fr":"dormir","alt":[],"ex":"Shh! The baby is sleeping."},{"en":"dance","fr":"danser","alt":[],"ex":"Emma is dancing in the kitchen."},{"en":"sing","fr":"chanter","alt":[],"ex":"Mei is singing in the living room."},{"en":"read","fr":"lire","alt":[],"ex":"Mom is reading a book."},{"en":"listen to","fr":"écouter","alt":[],"ex":"They aren't listening to the teacher."},{"en":"look at","fr":"regarder (observer)","alt":[],"ex":"Look at the ducks!"},{"en":"talk","fr":"parler (bavarder)","alt":["chat"],"ex":"Why are you talking?"},{"en":"help","fr":"aider","alt":[],"ex":"Malik is helping his dad."},{"en":"laugh","fr":"rire","alt":[],"ex":"Why are you laughing?"}],"sentences":[{"en":"I am reading a book right now.","fr":"Je lis un livre en ce moment.","trap":["read","is"],"alt":["Right now I am reading a book."]},{"en":"She is running in the park.","fr":"Elle court dans le parc (en ce moment).","trap":["runing","runs"],"alt":[]},{"en":"What are you doing?","fr":"Qu'est-ce que tu fais (en ce moment) ?","trap":["do","is"],"alt":[]},{"en":"My dad is cooking dinner.","fr":"Mon père prépare le souper (en ce moment).","trap":["cooks","are"],"alt":[]},{"en":"They aren't listening to the teacher.","fr":"Ils n'écoutent pas l'enseignant (en ce moment).","trap":["isn't","listen"],"alt":[]},{"en":"Is Maya sleeping?","fr":"Est-ce que Maya dort (en ce moment) ?","trap":["Does","sleep"],"alt":[]},{"en":"We are waiting for the bus.","fr":"Nous attendons l'autobus (en ce moment).","trap":["wait","to"],"alt":[]},{"en":"Zoé usually walks, but today she is running.","fr":"D'habitude, Zoé marche, mais aujourd'hui elle court.","trap":["runs","walking"],"alt":["Zoé usually walks, but she is running today."]},{"en":"I know the answer.","fr":"Je connais la réponse.","trap":["am","knowing"],"alt":[]},{"en":"Why are you laughing?","fr":"Pourquoi ris-tu (en ce moment) ?","trap":["laugh","do"],"alt":[]},{"en":"The baby is sitting on the couch.","fr":"Le bébé est assis sur le canapé.","trap":["siting","sits"],"alt":[]},{"en":"He is writing to his grandma.","fr":"Il écrit à sa grand-mère (en ce moment).","trap":["writting","writes"],"alt":[]}],"grammar":[{"type":"mcq","q":"Look! The baby ___.","choices":["sleeps","is sleeping","sleeping"],"answer":1,"explain":"Look! = ça se passe maintenant : présent continu, be + -ing."},{"type":"mcq","q":"Comment écrit-on run + -ing ?","choices":["running","runing","runnig"],"answer":0,"explain":"Run est court et finit par voyelle + consonne : on double le n → running."},{"type":"mcq","q":"Ethan ___ hockey every Saturday.","choices":["is playing","play","plays"],"answer":2,"explain":"Every Saturday = une habitude : présent simple, avec -s pour he."},{"type":"mcq","q":"I ___ the answer.","choices":["am knowing","know","knowing"],"answer":1,"explain":"Know ne se met jamais en -ing : I know."},{"type":"mcq","q":"___ they listening to music?","choices":["Is","Do","Are"],"answer":2,"explain":"Présent continu avec they : Are they…ing?"},{"type":"mcq","q":"Comment dit-on « Qu'est-ce que tu fais en ce moment ? »","choices":["What do you do right now?","What are you doing right now?","What you are doing right now?"],"answer":1,"explain":"En ce moment = présent continu, et dans la question be passe devant le sujet : What are you doing?"},{"type":"fill","q":"Shh! Noah ___ right now.","hint":"sleep","answer":["is sleeping"],"explain":"Right now = présent continu : is sleeping."},{"type":"fill","q":"We ___ for the bus right now.","hint":"wait","answer":["are waiting"],"explain":"We + are + verbe en -ing : are waiting."},{"type":"fill","q":"Look! Emma and Chloé ___ in the kitchen.","hint":"dance","answer":["are dancing"],"explain":"Look! = maintenant. Dance perd son -e : dancing."},{"type":"fill","q":"My sister ___ to music every evening.","hint":"listen","answer":["listens"],"explain":"Every evening = habitude : présent simple, avec -s pour she."},{"type":"fill","q":"Right now, I ___ some water.","hint":"avoir besoin de","answer":["need"],"explain":"Need ne se met jamais en -ing, même en ce moment : I need."},{"type":"fill","q":"Look! The ducks ___ in the water.","hint":"swim","answer":["are swimming"],"explain":"Swim est court, voyelle + consonne : on double le m → swimming."},{"type":"fill","q":"___ Malik helping his dad?","hint":"question","answer":["Is"],"explain":"Malik = he : Is he helping…?"},{"type":"error","q":"She is runing in the park.","wrong":2,"fix":["running"],"explain":"On double le n : running."},{"type":"error","q":"They is dancing in the kitchen.","wrong":1,"fix":["are"],"explain":"Avec they, c'est are : they are dancing."},{"type":"error","q":"What are you do right now?","wrong":3,"fix":["doing"],"explain":"Présent continu : be + verbe en -ing → What are you doing?"},{"type":"error","q":"Priya is writting a story.","wrong":2,"fix":["writing"],"explain":"Write perd son -e et ne double pas le t : writing."},{"type":"error","q":"Shh! The baby sleeps right now.","wrong":3,"fix":["is sleeping"],"explain":"Right now = présent continu : the baby is sleeping."}],"reading":{"title":"A Saturday Morning","text":"It's Saturday morning at the Nguyen house. Dad is in the kitchen. He is cooking pancakes. Mom isn't cooking today. She is sitting on the couch and she is reading a book. Grandpa is sleeping in his chair. My little sister Mei is dancing and singing in the living room.\n\nAnd me? I'm writing this story! I usually play soccer on Saturday, but today my friend Jaden is sick. So I'm sitting at the kitchen table, I'm writing, and I'm waiting for pancakes!","questions":[{"q":"Que fait papa ?","choices":["Il lit un livre","Il prépare des crêpes","Il dort","Il danse"],"answer":1},{"q":"Où est maman ?","choices":["Dans la cuisine","Dans sa chambre","Au parc","Sur le canapé"],"answer":3},{"q":"Qui dort ?","choices":["Grand-papa","Mei","Papa","Jaden"],"answer":0},{"q":"Que fait d'habitude la personne qui raconte, le samedi ?","choices":["Elle écrit des histoires","Elle prépare des crêpes","Elle joue au soccer","Elle regarde la télé"],"answer":2},{"q":"Pourquoi ne joue-t-elle pas au soccer aujourd'hui ?","choices":["Elle est fatiguée","Son ami Jaden est malade","Elle fait ses devoirs","Elle aide sa mère"],"answer":1}]},"pron":{"focus":"Le son « ng » de -ing","ipa":"/ŋ/","explain":"Tu connais déjà ce son ! C'est la fin de « camping » ou de « parking » en français : un son qui vibre dans le nez, avec l'arrière de la langue collé au fond du palais. En anglais, on l'entend à la fin de tous les mots en **-ing** : [[running]], [[swimming]], [[reading]]. Deux pièges : ne pas ajouter un « g » dur à la fin (« sing-gue »), et ne pas le remplacer par un simple « n », sinon [[sing]] (chanter) devient [[sin]] (péché) et [[thing]] (chose) devient [[thin]] (mince). Truc : garde ta bouche ouverte et laisse le son sortir par le nez, comme un bourdon : « nnnggg ».","words":[{"en":"running","fr":"en train de courir","hint":"« REU-ning » : finis dans le nez, comme « parking », sans « g » dur"},{"en":"swimming","fr":"en train de nager ; la natation","hint":"« SWI-ming » : accent au début, « ng » dans le nez à la fin"},{"en":"reading","fr":"en train de lire ; la lecture","hint":"« RII-ding » : « ii » long, puis « ng » sans « g » dur"},{"en":"playing","fr":"en train de jouer","hint":"« PLÉÏ-ing » : « éï » qui glisse, puis « ing »"},{"en":"morning","fr":"matin","hint":"« MÔR-ning » : « r » anglais, accent au début, « ng » au bout"},{"en":"sing","fr":"chanter","hint":"« sing » : comme la fin de « camping », pas « sine » ni « sing-gue »"},{"en":"thing","fr":"chose","hint":"« thing » : « th » soufflé, langue entre les dents, puis « ng » dans le nez"},{"en":"long","fr":"long, longue","hint":"« lông » : « ô » ouvert, puis « ng » dans le nez, sans « g » dur"},{"en":"wrong","fr":"faux, mauvais (pas correct)","hint":"« rông » : le « w » est muet ! Puis « ng » dans le nez"}],"pairs":[["sing","sin"],["thing","thin"],["rang","ran"],["wing","win"],["bang","ban"]],"practice":["This morning, I'm running, swimming and singing.","Something is wrong with the long song."]},"mission":{"type":"ecrit","prompt":"C'est samedi matin. Ton ami Amir t'écrit : [[What are you doing?]] Réponds-lui par texto : dis ce que tu fais en ce moment et ce que font deux personnes de ta famille, puis pose-lui la même question.","model":"Hi, Amir! I'm reading a comic book in my room. My brother is playing a video game, and my parents are cooking breakfast. What are you doing?","checklist":["J'ai utilisé [[am]], [[is]] ou [[are]] + verbe en -ing pour ce qui se passe en ce moment","Je n'ai pas oublié le verbe [[to be]] (« I reading » est incomplet !)","J'ai bien écrit l'-ing : [[swimming]], [[running]] (consonne doublée), [[writing]] (sans le « e »)","J'ai relu à voix haute en finissant les -ing dans le nez, sans « g » dur"]}},{"id":"4.2","title":"Sports et talents","titleEn":"Game On!","goal":"Dire ce qu'on sait faire avec can / can't et parler des sports qu'on aime.","lesson":[{"type":"p","text":"Au Canada, le sport, c'est sérieux ! Pour dire ce que tu sais faire (ou pas), tu as besoin de [[can]] et [[can't]]."},{"type":"rule","title":"can / can't","text":"[[can]] = pouvoir ou savoir faire. Toujours suivi du **verbe de base**, **sans to** et **sans -s** : [[She can swim.]] Négation : [[can't]]. Question : on inverse → [[Can you ski?]] — [[Yes, I can.]] / [[No, I can't.]]"},{"type":"table","head":["Sujet","Affirmatif","Négatif","Question"],"rows":[["I / you","[[I can skate.]]","[[I can't skate.]]","[[Can you skate?]]"],["he / she","[[He can skate.]]","[[He can't skate.]]","[[Can he skate?]]"],["we / they","[[They can skate.]]","[[They can't skate.]]","[[Can they skate?]]"]]},{"type":"rule","title":"Aimer faire quelque chose","text":"[[enjoy]], [[like]], [[love]] et [[hate]] + verbe en **-ing** : [[I enjoy skiing.]] [[She hates losing.]] Avec like, love et hate, to + verbe marche aussi ([[I love to swim.]]), mais **jamais avec enjoy**. Et jamais le verbe tout seul : [[I like play]] ✗."},{"type":"rule","title":"Être bon en…","text":"[[good at]] + sport ou verbe en -ing : [[I'm good at hockey.]] [[Ana is good at climbing.]] Jamais [[good in]] !"},{"type":"p","text":"Mots utiles : [[very well]] (très bien), [[a ball]] (un ballon, une balle), [[lose]] (perdre) → [[losing]], [[skate]] → [[skating]], [[ski]] → [[skiing]]."},{"type":"examples","items":[{"en":"I can't swim very well.","fr":"Je ne sais pas très bien nager."},{"en":"Can your sister ski?","fr":"Est-ce que ta sœur sait skier ?"},{"en":"We enjoy playing soccer.","fr":"Nous aimons jouer au soccer."},{"en":"Are you good at swimming?","fr":"Es-tu bon en natation ?"},{"en":"My team never wins.","fr":"Mon équipe ne gagne jamais."}]},{"type":"tip","text":"« Je sais nager » = [[I can swim.]], pas [[I know swim]]. Pas de -s après can : [[He can ski.]], jamais [[He cans]] ni [[He can skis]]. Et jamais de to : [[I can to swim]] ✗."},{"type":"fun","text":"Le sais-tu ? Le hockey est le sport national d'hiver du Canada, et la crosse est son sport national d'été."},{"type":"dialogue","title":"Une nouvelle joueuse","lines":[{"who":"Liam","en":"Can you skate, Priya?","fr":"Sais-tu patiner, Priya ?"},{"who":"Priya","en":"Yes, I can! I love skating.","fr":"Oui ! J'adore patiner."},{"who":"Liam","en":"Are you good at hockey?","fr":"Es-tu bonne au hockey ?"},{"who":"Priya","en":"Not really. But I'm good at skiing.","fr":"Pas vraiment. Mais je suis bonne en ski."},{"who":"Liam","en":"Do you want to play on my team?","fr":"Veux-tu jouer dans mon équipe ?"},{"who":"Priya","en":"Sure! But I can't catch very well.","fr":"Bien sûr ! Mais je n'attrape pas très bien."},{"who":"Liam","en":"No problem. My team never wins!","fr":"Pas de problème. Mon équipe ne gagne jamais !"}]}],"vocab":[{"en":"swim","fr":"nager","alt":[],"ex":"I can't swim very well."},{"en":"skate","fr":"patiner","alt":[],"ex":"Do you like skating?"},{"en":"ski","fr":"skier","alt":[],"ex":"Can your sister ski?"},{"en":"ride a bike","fr":"faire du vélo","alt":["ride a bicycle"],"ex":"Noah can ride a bike."},{"en":"climb","fr":"grimper","alt":[],"ex":"Ana is good at climbing."},{"en":"jump","fr":"sauter","alt":[],"ex":"My dog can jump very high."},{"en":"throw","fr":"lancer","alt":[],"ex":"Can you throw the ball?"},{"en":"catch","fr":"attraper","alt":[],"ex":"Can you catch the ball?"},{"en":"win","fr":"gagner","alt":[],"ex":"My team never wins."},{"en":"team","fr":"équipe","alt":[],"ex":"Do you want to play on my team?"},{"en":"game","fr":"partie (match)","alt":["match"],"ex":"He loves watching hockey games."},{"en":"soccer","fr":"soccer (football européen)","alt":[],"ex":"We enjoy playing soccer."},{"en":"enjoy","fr":"aimer (prendre plaisir à)","alt":[],"ex":"I enjoy skiing."},{"en":"good at","fr":"bon en (doué pour)","alt":[],"ex":"Are you good at swimming?"},{"en":"can","fr":"pouvoir (savoir faire)","alt":[],"ex":"She can skate very well."},{"en":"can't","fr":"ne pas pouvoir (ne pas savoir faire)","alt":[],"ex":"My grandpa can't ski."}],"sentences":[{"en":"I can't swim very well.","fr":"Je ne sais pas très bien nager.","trap":["to","swimming"],"alt":[]},{"en":"Can your sister ski?","fr":"Est-ce que ta sœur sait skier ?","trap":["Does","skis"],"alt":[]},{"en":"Noah can ride a bike.","fr":"Noah sait faire du vélo.","trap":["cans","to"],"alt":[]},{"en":"We enjoy playing soccer.","fr":"Nous aimons jouer au soccer.","trap":["play","to"],"alt":[]},{"en":"Ana is good at climbing.","fr":"Ana est douée pour grimper.","trap":["in","climb"],"alt":[]},{"en":"Do you like skating?","fr":"Aimes-tu patiner ?","trap":["skate","Does"],"alt":[]},{"en":"My team never wins.","fr":"Mon équipe ne gagne jamais.","trap":["win","don't"],"alt":[]},{"en":"He loves watching hockey games.","fr":"Il adore regarder des matchs de hockey.","trap":["watch","love"],"alt":[]},{"en":"Can you catch the ball?","fr":"Peux-tu attraper le ballon ?","trap":["to","catching"],"alt":[]},{"en":"I hate losing!","fr":"Je déteste perdre !","trap":["lose","loseing"],"alt":[]},{"en":"Mei can't skate, but she can ski.","fr":"Mei ne sait pas patiner, mais elle sait skier.","trap":["skates","to"],"alt":[]},{"en":"Are you good at swimming?","fr":"Es-tu bon en natation ?","trap":["in","swim"],"alt":[]}],"grammar":[{"type":"mcq","q":"She ___ swim.","choices":["cans","can","can to"],"answer":1,"explain":"Can ne prend jamais de -s et jamais de to : she can swim."},{"type":"mcq","q":"I enjoy ___ with my friends.","choices":["to play","play","playing"],"answer":2,"explain":"Après enjoy, toujours le verbe en -ing : enjoy playing."},{"type":"mcq","q":"Can you ski? — Yes, ___.","choices":["I can","I do","I ski"],"answer":0,"explain":"La réponse courte reprend can : Yes, I can."},{"type":"mcq","q":"Liam is good ___ hockey.","choices":["in","at","on"],"answer":1,"explain":"Être bon en = good at."},{"type":"mcq","q":"Comment dit-on « Je sais nager » ?","choices":["I can to swim.","I know swim.","I can swim."],"answer":2,"explain":"Savoir faire = can + verbe de base, sans to."},{"type":"mcq","q":"___ Emma ride a bike? — No, she can't.","choices":["Does","Can","Is"],"answer":1,"explain":"La réponse est she can't, donc la question commence par can."},{"type":"fill","q":"My grandpa ___ ski.","hint":"ne pas pouvoir","answer":["can't"],"explain":"Ne pas savoir / pouvoir = can't + verbe de base."},{"type":"fill","q":"Sofia can ___ very well.","hint":"nager","answer":["swim"],"explain":"Après can : verbe de base, sans -s → swim."},{"type":"fill","q":"We love ___ on the Rideau Canal in winter.","hint":"skate","answer":["skating","to skate"],"explain":"Love + verbe en -ing (ou to + verbe) : skating. Skate perd son -e."},{"type":"fill","q":"Do you enjoy ___ soccer?","hint":"play","answer":["playing"],"explain":"Enjoy est toujours suivi de -ing : playing."},{"type":"fill","q":"Karim is good at ___.","hint":"climb","answer":["climbing"],"explain":"Après good at, le verbe prend -ing : climbing."},{"type":"fill","q":"My team ___ every game!","hint":"win","answer":["wins"],"explain":"My team = it : présent simple avec -s → wins."},{"type":"error","q":"She cans ride a bike.","wrong":1,"fix":["can"],"explain":"Can ne prend jamais de -s."},{"type":"error","q":"He can skis very well.","wrong":2,"fix":["ski"],"explain":"Après can, verbe de base sans -s : he can ski."},{"type":"error","q":"I like play hockey.","wrong":2,"fix":["playing","to play"],"explain":"Après like : verbe en -ing (ou to + verbe), jamais le verbe seul."},{"type":"error","q":"Jaden is good in soccer.","wrong":3,"fix":["at"],"explain":"Être bon en = good at, jamais good in."},{"type":"error","q":"Maya enjoys ski in winter.","wrong":2,"fix":["skiing"],"explain":"Après enjoy, toujours -ing : skiing."}],"reading":{"title":"Ethan's Team","text":"Ethan loves hockey. He plays on a team in Ottawa, but he isn't very good at skating. His sister Chloé can skate very well. She can ski, swim and ride a bike too! Ethan can't ski, but he enjoys swimming.\n\nEthan's team never wins. But the players don't care. They love playing hockey together.\n\nToday, Chloé is watching the game. Ethan's team is losing again, but Ethan is laughing with his friends. “We can't win, but we can have fun!” he says.","questions":[{"q":"Ethan est-il bon en patin ?","choices":["Oui, très bon","Il ne sait pas patiner du tout","Non, pas très bon","Le texte ne le dit pas"],"answer":2},{"q":"Que sait faire Chloé ?","choices":["Patiner, skier, nager et faire du vélo","Seulement patiner","Skier, mais pas nager","Jouer au soccer"],"answer":0},{"q":"Quel sport Ethan ne sait-il pas faire ?","choices":["La natation","Le ski","Le hockey","Le patin"],"answer":1},{"q":"Que se passe-t-il pendant la partie d'aujourd'hui ?","choices":["L'équipe d'Ethan gagne","Chloé joue avec Ethan","Ethan pleure","L'équipe d'Ethan perd"],"answer":3},{"q":"Comment réagit Ethan ?","choices":["Il est fâché","Il rit avec ses amis","Il rentre chez lui","Il arrête le hockey"],"answer":1}]},"pron":{"focus":"can (tout petit) ou can't (fort)","ipa":"/kən/ – /kænt/","explain":"Voici un piège qui cause beaucoup de malentendus ! Dans une phrase, [[can]] devient tout petit et rapide, presque « keun » : [[I can skate]] se dit « aï-keun-SKÉÏT ». Mais [[can't]] reste **fort**, avec un « a » bien ouvert : « aï-KANNT-SKÉÏT ». Le « t » de [[can't]] s'entend à peine, alors écoute surtout la **force** du mot : si [[can]] est faible, c'est oui ; s'il est fort et long, c'est non ! Une exception : seul à la fin d'une réponse, [[can]] redevient fort : [[Yes, I can!]]","words":[{"en":"can","fr":"peux, peut, pouvons… (savoir faire)","hint":"Dans une phrase : « keun », tout petit. Seul à la fin ([[Yes, I can]]) : « KANN », fort"},{"en":"can't","fr":"ne peux pas, ne peut pas…","hint":"« KANNT » : toujours fort, « a » bien ouvert ; le « t » est très léger"},{"en":"I can skate","fr":"je sais patiner","hint":"« aï-keun-SKÉÏT » : [[can]] tout petit, la force va sur [[skate]]"},{"en":"I can't skate","fr":"je ne sais pas patiner","hint":"« aï-KANNT-SKÉÏT » : [[can't]] aussi fort que [[skate]]"},{"en":"can you swim","fr":"sais-tu nager ?","hint":"« keun-yeu-SWIM ↗ » : [[can]] petit, la voix monte à la fin"},{"en":"skating","fr":"le patinage","hint":"« SKÉÏ-ting » : « éï » qui glisse, accent au début"},{"en":"skiing","fr":"le ski","hint":"« SKII-ing » : deux syllabes, « ii » long, puis « ing »"},{"en":"hockey","fr":"le hockey","hint":"« HÂ-ki » : souffle le « h », accent au début"},{"en":"soccer","fr":"le soccer","hint":"« SÂ-keur » : accent au début, « r » anglais à la fin"}],"pairs":[["can","can't"]],"practice":["I can skate, but I can't ski.","Can you play hockey? Yes, I can!","My sister can swim, but she can't skate."]},"mission":{"type":"oral","prompt":"Tu t'inscris à un camp de jour sportif à Ottawa. La monitrice anglophone te demande ce que tu sais faire. Dis-lui deux choses que tu sais faire, une chose que tu ne sais pas faire, et un sport que tu adores.","model":"I can skate and I can swim, but I can't ski. I love playing soccer, and I'm good at hockey!","checklist":["Après [[can]] ou [[can't]], j'ai mis le verbe de base, sans [[to]] et sans « s » ([[she can swim]])","J'ai dit [[can]] tout petit (« keun ») et [[can't]] fort (« KANNT »)","J'ai utilisé [[love]], [[like]] ou [[enjoy]] + verbe en -ing","J'ai dit [[good at]] + sport ou + verbe en -ing"]}},{"id":"4.3","title":"En ville","titleEn":"Around Town","goal":"Demander et donner son chemin en ville avec l'impératif.","lesson":[{"type":"p","text":"Tu te promènes à Ottawa et tu cherches la bibliothèque ? Il faut savoir **demander** ton chemin et **comprendre** la réponse. Pour commencer poliment : [[Excuse me…]] (Excusez-moi…)."},{"type":"rule","title":"L'impératif : donner un ordre ou une direction","text":"Verbe de base, **sans sujet** : [[Turn left.]] [[Go straight.]] Négatif : [[Don't]] + verbe : [[Don't run!]] Pour proposer de faire quelque chose ensemble : [[Let's]] + verbe : [[Let's go!]] (Allons-y !)"},{"type":"table","head":["Anglais","Français"],"rows":[["[[turn left]]","tourner à gauche"],["[[turn right]]","tourner à droite"],["[[go straight]]","aller tout droit"],["[[at the corner]]","au coin"],["[[at the traffic lights]]","aux feux de circulation"],["[[across from]]","en face de"],["[[next to]]","à côté de"],["[[near]]","près de"],["[[far from]]","loin de"],["[[cross the street]]","traverser la rue"]]},{"type":"rule","title":"Demander son chemin","text":"[[Where is the bank?]] → [[It's next to the park.]] [[How do I get to the library?]] (Comment je me rends à la bibliothèque ?) → [[Go straight and turn left.]] [[Is it far from here?]] (Est-ce loin d'ici ?) → [[No, it's near.]]"},{"type":"examples","items":[{"en":"Turn left at the traffic lights.","fr":"Tourne à gauche aux feux de circulation."},{"en":"Don't run in the library!","fr":"Ne cours pas dans la bibliothèque !"},{"en":"How do I get to the hospital?","fr":"Comment est-ce que je me rends à l'hôpital ?"},{"en":"The bank is across from the park.","fr":"La banque est en face du parc."},{"en":"Let's go to the movie theatre!","fr":"Allons au cinéma !"}]},{"type":"tip","text":"Faux ami géant ! [[library]] = **bibliothèque** : on y emprunte ([[borrow]]) des livres. La **librairie**, où on achète des livres, c'est le [[bookstore]]. Autre piège : « près **de** » = [[near]], sans of. Et « Ne cours pas » = [[Don't run]], jamais [[No run]]."},{"type":"fun","text":"Le sais-tu ? En hiver, une partie du canal Rideau, à Ottawa, devient une immense patinoire. Le canal est inscrit au patrimoine mondial de l'UNESCO."},{"type":"dialogue","title":"Perdu au centre-ville","lines":[{"who":"Félix","en":"Excuse me, where is the post office?","fr":"Excusez-moi, où est le bureau de poste ?"},{"who":"Passante","en":"It's on Elm Street, next to the bank.","fr":"Il est sur la rue Elm, à côté de la banque."},{"who":"Félix","en":"How do I get to Elm Street?","fr":"Comment je me rends à la rue Elm ?"},{"who":"Passante","en":"Go straight and turn right at the traffic lights.","fr":"Va tout droit et tourne à droite aux feux de circulation."},{"who":"Félix","en":"Is it far from here?","fr":"Est-ce loin d'ici ?"},{"who":"Passante","en":"No, it's near. But don't cross the street here!","fr":"Non, c'est proche. Mais ne traverse pas la rue ici !"},{"who":"Félix","en":"OK. Thank you very much!","fr":"D'accord. Merci beaucoup !"}]}],"vocab":[{"en":"library","fr":"bibliothèque","alt":[],"ex":"Don't run in the library!"},{"en":"bookstore","fr":"librairie","alt":["bookshop"],"ex":"I buy books at the bookstore."},{"en":"bank","fr":"banque","alt":[],"ex":"The bank is across from the park."},{"en":"hospital","fr":"hôpital","alt":[],"ex":"How do I get to the hospital?"},{"en":"post office","fr":"bureau de poste","alt":[],"ex":"Where is the post office?"},{"en":"grocery store","fr":"épicerie (supermarché)","alt":["supermarket"],"ex":"Is the grocery store far from here?"},{"en":"street","fr":"rue","alt":[],"ex":"Don't cross the street here."},{"en":"corner","fr":"coin (de rue)","alt":[],"ex":"Turn left at the corner."},{"en":"traffic lights","fr":"feux de circulation","alt":["traffic light"],"ex":"Turn right at the traffic lights."},{"en":"turn left","fr":"tourner à gauche","alt":[],"ex":"Turn left at the bank."},{"en":"turn right","fr":"tourner à droite","alt":[],"ex":"Go straight and turn right."},{"en":"go straight","fr":"aller tout droit","alt":["go straight ahead"],"ex":"Go straight and turn left."},{"en":"across from","fr":"en face de","alt":["opposite"],"ex":"The library is across from the park."},{"en":"near","fr":"près de","alt":["close to"],"ex":"The library is near my school."},{"en":"far from","fr":"loin de","alt":[],"ex":"Is the hospital far from here?"},{"en":"movie theatre","fr":"cinéma","alt":["cinema","movie theater"],"ex":"Let's go to the movie theatre!"}],"sentences":[{"en":"Turn left at the traffic lights.","fr":"Tourne à gauche aux feux de circulation.","trap":["To","on"],"alt":[]},{"en":"Don't run in the library!","fr":"Ne cours pas dans la bibliothèque !","trap":["No","bookstore"],"alt":[]},{"en":"Where is the post office?","fr":"Où est le bureau de poste ?","trap":["are","Who"],"alt":[]},{"en":"How do I get to the hospital?","fr":"Comment est-ce que je me rends à l'hôpital ?","trap":["does","at"],"alt":[]},{"en":"Go straight and turn right.","fr":"Va tout droit et tourne à droite.","trap":["Goes","to"],"alt":[]},{"en":"The bank is across from the park.","fr":"La banque est en face du parc.","trap":["front","of"],"alt":[]},{"en":"The bookstore is on Rideau Street.","fr":"La librairie est sur la rue Rideau.","trap":["at","library"],"alt":[]},{"en":"Is the grocery store far from here?","fr":"Est-ce que l'épicerie est loin d'ici ?","trap":["of","Does"],"alt":[]},{"en":"Let's go to the movie theatre!","fr":"Allons au cinéma !","trap":["Let","goes"],"alt":[]},{"en":"Don't cross the street here.","fr":"Ne traverse pas la rue ici.","trap":["Not","crosses"],"alt":[]},{"en":"The library is near my school.","fr":"La bibliothèque est près de mon école.","trap":["of","bookstore"],"alt":[]},{"en":"Turn right at the corner.","fr":"Tourne à droite au coin de la rue.","trap":["Turns","of"],"alt":[]}],"grammar":[{"type":"mcq","q":"Tu veux emprunter un livre gratuitement. Tu vas à la…","choices":["bookstore","library","bank"],"answer":1,"explain":"On emprunte des livres à la bibliothèque = library. Le bookstore, c'est la librairie (on achète)."},{"type":"mcq","q":"Comment dit-on « Ne cours pas ! » ?","choices":["Don't run!","No run!","Don't to run!","Not run!"],"answer":0,"explain":"Impératif négatif : Don't + verbe de base."},{"type":"mcq","q":"___ is the hospital? — It's on Carling Avenue.","choices":["Who","What","Where"],"answer":2,"explain":"La réponse est un lieu : where."},{"type":"mcq","q":"« La banque est en face du bureau de poste. » The bank is ___ the post office.","choices":["across of","across from","in front"],"answer":1,"explain":"En face de = across from."},{"type":"mcq","q":"How do I get ___ the library?","choices":["to","at","in"],"answer":0,"explain":"Se rendre à un endroit = get to."},{"type":"mcq","q":"Comment dit-on « Allons au parc ! » ?","choices":["Let's going to the park!","Go we to the park!","Let's go to the park!"],"answer":2,"explain":"Allons… = Let's + verbe de base."},{"type":"fill","q":"___ left at the corner.","hint":"tourner","answer":["Turn"],"explain":"Impératif : le verbe de base, sans sujet → Turn left."},{"type":"fill","q":"___ run in the street!","hint":"ne… pas (ordre)","answer":["Don't"],"explain":"Impératif négatif : Don't + verbe."},{"type":"fill","q":"The grocery store is ___ the bank.","hint":"à côté de","answer":["next to"],"explain":"À côté de = next to."},{"type":"fill","q":"I need a book for school. Let's go to the ___.","hint":"bibliothèque","answer":["library"],"explain":"Bibliothèque = library (faux ami !)."},{"type":"fill","q":"Is the hospital ___ from here?","hint":"loin","answer":["far"],"explain":"Loin de = far from."},{"type":"fill","q":"Go ___ and turn right at the traffic lights.","hint":"tout droit","answer":["straight"],"explain":"Aller tout droit = go straight."},{"type":"error","q":"Turns left at the bank.","wrong":0,"fix":["Turn"],"explain":"L'impératif n'a pas de -s : Turn left."},{"type":"error","q":"Don't crossing the street!","wrong":1,"fix":["cross"],"explain":"Après don't, verbe de base : Don't cross."},{"type":"error","q":"The bank is across of the library.","wrong":4,"fix":["from"],"explain":"En face de = across from, jamais across of."},{"type":"error","q":"How does I get to the bank?","wrong":1,"fix":["do"],"explain":"Avec I, c'est do : How do I get to…?"},{"type":"error","q":"Where are the post office?","wrong":1,"fix":["is"],"explain":"The post office = un seul endroit : Where is…?"},{"type":"error","q":"I borrow books at the bookstore.","wrong":5,"fix":["library"],"explain":"On emprunte (borrow) des livres à la bibliothèque = library. Au bookstore, on les achète."}],"reading":{"title":"Where Is the Library?","text":"Amir is new in Ottawa. He wants to borrow a book, so he asks a woman in the street.\n\n“Excuse me, where is the library?”\n\n“Go straight and turn left at the traffic lights. The library is next to the bank, across from the park.”\n\n“Is it far from here?”\n\n“No, it's near.”\n\nAmir goes straight and turns left at the traffic lights. Oh no! He sees a bookstore, not a library. But wait! He looks across the street and sees the park. Across from the park, next to the bank, there is a big building. It's the library!","questions":[{"q":"Que veut faire Amir ?","choices":["Acheter un livre","Emprunter un livre","Aller à la banque","Jouer au parc"],"answer":1},{"q":"Où est la bibliothèque ?","choices":["À côté de la banque, en face du parc","À côté du parc, en face de la banque","Derrière la librairie","Loin d'ici"],"answer":0},{"q":"Où Amir doit-il tourner à gauche ?","choices":["Au coin de la banque","Devant le parc","Aux feux de circulation","Après la librairie"],"answer":2},{"q":"Qu'est-ce qu'Amir voit d'abord, après avoir tourné ?","choices":["La bibliothèque","La banque","Un hôpital","Une librairie"],"answer":3}]},"pron":{"focus":"Le « a » de cat et le « eu » de cup","ipa":"/æ/ – /ʌ/","explain":"Voici deux sons qui n'existent pas tout à fait en français. Le « a » de [[cat]] et de [[map]] se fait avec la bouche **grande ouverte**, la mâchoire bien descendue, un peu comme si tu disais « a » et « è » en même temps. Le son de [[cup]] et de [[bus]], lui, est un « eu » court et détendu, comme quand tu hésites : « euh… ». Le grand piège : dire [[bus]] comme le « bus » français (avec un « u ») ou « bousse » ; en anglais, c'est « beuss » ! Si tu mélanges les deux sons, [[cat]] (chat) devient [[cut]] (couper), et [[bag]] (sac) devient [[bug]] (insecte).","words":[{"en":"bank","fr":"banque","hint":"« bannk » : bouche grande ouverte, jamais nasal comme « banque »"},{"en":"map","fr":"carte, plan","hint":"« mapp » : « a » très ouvert, mâchoire descendue"},{"en":"traffic lights","fr":"feux de circulation","hint":"« TRA-fik-laïts » : accent sur « TRA », « a » bien ouvert"},{"en":"back","fr":"en arrière, de retour","hint":"« bak » : « a » ouvert, entre « a » et « è »"},{"en":"bus","fr":"autobus","hint":"« beuss » : jamais le « u » français ! Un « eu » court et détendu"},{"en":"up","fr":"en haut, vers le haut","hint":"« eup » : « eu » court, comme dans « euh »"},{"en":"one","fr":"un, une","hint":"« weunn » : commence par un « w » ! Pas « onne »"},{"en":"much","fr":"beaucoup (indénombrable)","hint":"« meutch » : « eu » court, puis « tch »"},{"en":"fun","fr":"amusant ; le plaisir","hint":"« feunn » : « eu » court, surtout pas « fonne »"}],"pairs":[["cap","cup"],["hat","hut"],["bag","bug"],["cat","cut"],["match","much"],["ran","run"]],"practice":["Turn back at the bank and run to the bus stop.","The bus stops at the traffic lights, across from the bank."]},"mission":{"type":"ecrit","prompt":"Une nouvelle élève anglophone, Sofia, veut aller à la bibliothèque après l'école. Écris-lui un petit mot pour lui expliquer le chemin depuis la porte de l'école.","model":"Go out of the school and turn left. Go straight to the traffic lights, then turn right. The library is next to the bank, across from the bus stop.","checklist":["J'ai donné les directions à l'impératif, sans [[you]] ([[Turn left]], [[Go straight]])","J'ai écrit [[library]] pour la bibliothèque (pas « librairie » !)","J'ai utilisé au moins une expression de lieu : [[next to]], [[across from]], [[on the corner]]…","J'ai relu à voix haute avec « a » ouvert dans [[bank]] et « eu » dans [[bus]]"]}},{"id":"4.4","title":"Au magasin","titleEn":"Let's Go Shopping","goal":"Magasiner des vêtements, demander les prix et utiliser this, that, these, those et les pronoms compléments.","lesson":[{"type":"p","text":"L'hiver arrive à Ottawa : il te faut une tuque et des mitaines ! Au magasin, tu dois demander le prix, montrer ce que tu veux et dire « je **le** prends »."},{"type":"rule","title":"Combien ça coûte ?","text":"Un seul objet : [[How much is this toque?]] → [[It's fifteen dollars.]] Plusieurs : [[How much are these boots?]] → [[They're ninety dollars.]] Attention : [[pants]] est **toujours pluriel** : [[These pants are cheap.]]"},{"type":"table","head":["Nombre","Anglais"],"rows":[["30","[[thirty]]"],["40","[[forty]]"],["50","[[fifty]]"],["60","[[sixty]]"],["70","[[seventy]]"],["80","[[eighty]]"],["90","[[ninety]]"],["100","[[a hundred]]"]]},{"type":"table","head":["","Ici (près de moi)","Là-bas (loin)"],"rows":[["Singulier","[[this coat]]","[[that coat]]"],["Pluriel","[[these coats]]","[[those coats]]"]]},{"type":"table","head":["Sujet","Complément","Exemple"],"rows":[["I","me","[[Help me!]]"],["you","you","[[I see you.]]"],["he","him","[[Give it to him.]]"],["she","her","[[I can't see her.]]"],["it","it","[[I love it!]]"],["we","us","[[Can you help us?]]"],["they","them","[[I want them.]]"]]},{"type":"rule","title":"Les pronoms compléments","text":"Après un verbe (ou après to, for, at…), on utilise **me, you, him, her, it, us, them**. Ils se placent **après** le verbe, pas avant comme en français : « Je **la** vois » = [[I see her.]] « Je **les** achète » = [[I buy them.]] « Puis-je **l'**essayer ? » = [[Can I try it on?]]"},{"type":"examples","items":[{"en":"How much are those boots?","fr":"Combien coûtent ces bottes-là ?"},{"en":"These pants are too big.","fr":"Ce pantalon est trop grand."},{"en":"I like this sweater, but it's expensive.","fr":"J'aime ce chandail, mais il est cher."},{"en":"My mom buys them for me.","fr":"Ma mère me les achète."},{"en":"I don't have enough money.","fr":"Je n'ai pas assez d'argent."}]},{"type":"tip","text":"« **Ce** pantalon » = [[these pants]] (pluriel en anglais !). « **Trop** cher » = [[too expensive]], jamais [[too much expensive]]. Et le pronom ne passe jamais devant le verbe : « je **le** veux » = [[I want it]]. Petits mots utiles : [[over there]] (là-bas), [[enough]] (assez), [[too]] (trop)."},{"type":"fun","text":"Le sais-tu ? [[toque]] (ou [[tuque]]) est un mot typiquement canadien. Ailleurs, les anglophones disent plutôt [[beanie]] ou [[winter hat]]."},{"type":"dialogue","title":"Au magasin de vêtements","lines":[{"who":"Vendeuse","en":"Hi! Can I help you?","fr":"Bonjour ! Je peux t'aider ?"},{"who":"Samuel","en":"Yes, please. How much is this toque?","fr":"Oui, s'il vous plaît. Combien coûte cette tuque ?"},{"who":"Vendeuse","en":"It's twenty dollars.","fr":"Elle coûte vingt dollars."},{"who":"Samuel","en":"And how much are those mittens over there?","fr":"Et combien coûtent ces mitaines-là ?"},{"who":"Vendeuse","en":"They're cheap: only ten dollars. Do you want to try them on?","fr":"Elles ne sont pas chères : seulement dix dollars. Veux-tu les essayer ?"},{"who":"Samuel","en":"Yes! I love them. I'm buying the toque and the mittens!","fr":"Oui ! Je les adore. J'achète la tuque et les mitaines !"}]}],"vocab":[{"en":"toque","fr":"tuque","alt":["tuque"],"ex":"How much is this toque?"},{"en":"coat","fr":"manteau","alt":[],"ex":"That coat is very expensive."},{"en":"boots","fr":"bottes","alt":[],"ex":"How much are those boots?"},{"en":"mittens","fr":"mitaines","alt":[],"ex":"Those mittens are very cheap."},{"en":"pants","fr":"pantalon","alt":["trousers"],"ex":"These pants are too big."},{"en":"shoes","fr":"souliers (chaussures)","alt":[],"ex":"I want to buy those shoes."},{"en":"dress","fr":"robe","alt":[],"ex":"I love this dress!"},{"en":"sweater","fr":"chandail (pull)","alt":[],"ex":"I like this sweater, but it's expensive."},{"en":"price","fr":"prix","alt":[],"ex":"What is the price of this coat?"},{"en":"cheap","fr":"pas cher (bon marché)","alt":["inexpensive"],"ex":"This sweater is cheap."},{"en":"expensive","fr":"cher (coûteux)","alt":[],"ex":"That's too expensive!"},{"en":"size","fr":"taille (grandeur)","alt":[],"ex":"What size do you need?"},{"en":"try on","fr":"essayer (un vêtement)","alt":[],"ex":"Can I try it on?"},{"en":"buy","fr":"acheter","alt":[],"ex":"My mom buys them for me."},{"en":"money","fr":"argent","alt":[],"ex":"I don't have enough money."},{"en":"how much is","fr":"combien coûte","alt":[],"ex":"How much is this dress?"}],"sentences":[{"en":"How much is this toque?","fr":"Combien coûte cette tuque ?","trap":["are","these"],"alt":[]},{"en":"How much are those boots?","fr":"Combien coûtent ces bottes-là ?","trap":["is","that"],"alt":[]},{"en":"These pants are too big.","fr":"Ce pantalon est trop grand.","trap":["is","This"],"alt":[]},{"en":"I like this sweater, but it's expensive.","fr":"J'aime ce chandail, mais il est cher.","trap":["these","much"],"alt":[]},{"en":"Can I try it on?","fr":"Est-ce que je peux l'essayer (ce chandail) ?","trap":["him","the"],"alt":[]},{"en":"My mom buys them for me.","fr":"Ma mère me les achète.","trap":["they","I"],"alt":[]},{"en":"Can you help us, please?","fr":"Peux-tu nous aider, s'il te plaît ?","trap":["we","our"],"alt":[]},{"en":"Those mittens are very cheap.","fr":"Ces mitaines-là sont très bon marché.","trap":["That","is"],"alt":[]},{"en":"What size do you need?","fr":"De quelle taille as-tu besoin ?","trap":["does","much"],"alt":[]},{"en":"I don't have enough money.","fr":"Je n'ai pas assez d'argent.","trap":["moneys","doesn't"],"alt":[]},{"en":"Give it to him.","fr":"Donne-le-lui.","trap":["he","its"],"alt":[]},{"en":"That coat is twenty dollars.","fr":"Ce manteau-là coûte vingt dollars.","trap":["Those","are"],"alt":[]}],"grammar":[{"type":"mcq","q":"How much ___ these shoes?","choices":["is","are","does"],"answer":1,"explain":"These shoes = pluriel : How much are…?"},{"type":"mcq","q":"Do you know Malik? I see ___ every day.","choices":["his","he","him"],"answer":2,"explain":"Après le verbe, on utilise le pronom complément : him."},{"type":"mcq","q":"Look at ___ boots over there!","choices":["those","this","these"],"answer":0,"explain":"Boots = pluriel, over there = loin : those."},{"type":"mcq","q":"Comment dit-on « ce pantalon » ?","choices":["this pants","these pants","this pant"],"answer":1,"explain":"Pants est toujours pluriel en anglais : these pants."},{"type":"mcq","q":"« Ma grand-mère nous appelle chaque dimanche. » My grandma calls ___ every Sunday.","choices":["our","we","them","us"],"answer":3,"explain":"Nous (complément) = us, et il se place après le verbe."},{"type":"mcq","q":"Comment dit-on « C'est trop cher » ?","choices":["It's too much expensive.","It's too expensive.","It's very cheap."],"answer":1,"explain":"Trop + adjectif = too + adjectif. Jamais too much expensive."},{"type":"fill","q":"How much ___ this toque?","hint":"être","answer":["is"],"explain":"This toque = un seul objet : How much is…?"},{"type":"fill","q":"I love these mittens. I want to buy ___.","hint":"les","answer":["them"],"explain":"Les (complément, pluriel) = them, placé après le verbe."},{"type":"fill","q":"Where is Chloé? I can't see ___.","hint":"la","answer":["her"],"explain":"La (une fille) = her."},{"type":"fill","q":"___ coat over there is very expensive.","hint":"ce… -là","answer":["That"],"explain":"Un seul objet, loin (over there) : that."},{"type":"fill","q":"Can I try on ___ shoes? They're right here.","hint":"ces (ici)","answer":["these"],"explain":"Pluriel et près de moi : these."},{"type":"fill","q":"This sweater is ___. It's only five dollars!","hint":"pas cher","answer":["cheap","inexpensive"],"explain":"Pas cher = cheap."},{"type":"error","q":"How much is these boots?","wrong":2,"fix":["are"],"explain":"These boots = pluriel : How much are…?"},{"type":"error","q":"I like this pants.","wrong":2,"fix":["these","those"],"explain":"Pants est pluriel : these pants."},{"type":"error","q":"The teacher helps we every day.","wrong":3,"fix":["us"],"explain":"Après le verbe : pronom complément us, pas we."},{"type":"error","q":"Where are my mittens? I can't find they.","wrong":7,"fix":["them"],"explain":"Après le verbe find : them, pas they."},{"type":"error","q":"Those coat is very cheap.","wrong":0,"fix":["That","This"],"explain":"Coat est au singulier : that coat (ou this coat)."},{"type":"error","q":"I want to buy that shoes.","wrong":4,"fix":["those","these"],"explain":"Shoes est au pluriel : those shoes."}],"reading":{"title":"Winter Shopping","text":"It's November and Olivia needs winter clothes. She goes shopping with her dad.\n\n“Look at those boots! I love them!” says Olivia.\n\n“How much are they?” asks Dad.\n\n“They're ninety dollars.”\n\n“That's too expensive!”\n\nThen Olivia tries on a red coat. It's cheap, but it's too small. Next, she sees a blue toque and some mittens.\n\n“How much is this toque?”\n\n“It's fifteen dollars, and the mittens are ten dollars.”\n\nDad buys the toque and the mittens for her. Olivia is happy, and her dad is happy too!","questions":[{"q":"Pourquoi Olivia magasine-t-elle ?","choices":["Pour l'anniversaire de son père","Elle a besoin de vêtements d'hiver","Pour l'école","Pour le hockey"],"answer":1},{"q":"Pourquoi papa n'achète-t-il pas les bottes ?","choices":["Elles sont trop petites","Olivia ne les aime pas","Elles sont trop chères","Elles sont rouges"],"answer":2},{"q":"Quel est le problème du manteau rouge ?","choices":["Il est trop petit","Il est trop cher","Il est trop grand","Il est bleu"],"answer":0},{"q":"Combien papa paie-t-il en tout ?","choices":["Quinze dollars","Dix dollars","Quatre-vingt-dix dollars","Vingt-cinq dollars"],"answer":3}]},"pron":{"focus":"thirTEEN ou THIRty ?","ipa":"","explain":"Au magasin, une erreur de prononciation peut te coûter cher : 15 $ ou 50 $, ce n'est pas pareil ! Les nombres en **-teen** (13 à 19) ont l'accent **à la fin**, avec un « ii » long et un « t » bien net : [[fifteen]] = « fif-TIIN ». Les dizaines en **-ty** ont l'accent **au début**, et la fin est toute courte : [[fifty]] = « FIF-ti ». Au Canada, le « t » entre deux voyelles ou après un « r » devient souvent un petit « d » rapide : [[thirty]] sonne comme « THEUR-di ». Truc : si tu n'es pas certain d'avoir bien entendu, demande poliment : [[Sorry, fifteen or fifty?]]","words":[{"en":"thirteen","fr":"treize","hint":"« theur-TIIN » : accent à la fin, « ii » long, « t » net"},{"en":"thirty","fr":"trente","hint":"« THEUR-di » : accent au début, fin courte, le « t » devient un petit « d »"},{"en":"fourteen","fr":"quatorze","hint":"« fôr-TIIN » : accent à la fin, « ii » long"},{"en":"forty","fr":"quarante","hint":"« FÔR-di » : accent au début ; attention, ça s'écrit sans « u » !"},{"en":"fifteen","fr":"quinze","hint":"« fif-TIIN » : accent à la fin"},{"en":"fifty","fr":"cinquante","hint":"« FIF-ti » : accent au début ; ici le « t » reste un vrai « t »"},{"en":"sixteen","fr":"seize","hint":"« siks-TIIN » : accent à la fin"},{"en":"sixty","fr":"soixante","hint":"« SIKS-ti » : accent au début, fin courte"},{
