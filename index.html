dre le livre plus tard » ?"},{"who":"Olivia","en":"No way! Write: I am writing to request a few more days to return the book.","fr":"Pas question ! Écris : Je vous écris pour demander quelques jours de plus pour rendre le livre."},{"who":"Sofia","en":"That sounds so much better. How do I end it?","fr":"C'est vraiment mieux. Comment je termine ?"},{"who":"Olivia","en":"Thank you in advance for your assistance. I look forward to hearing from you.","fr":"Je vous remercie à l'avance de votre aide. Au plaisir d'avoir de vos nouvelles."},{"who":"Sofia","en":"Perfect. Kind regards, Sofia!","fr":"Parfait. Cordialement, Sofia !"}]}],"vocab":[{"en":"request","fr":"demander (formel)","alt":[],"ex":"I am writing to request a refund."},{"en":"assist","fr":"aider (formel)","alt":[],"ex":"Our staff will be happy to assist you."},{"en":"require","fr":"avoir besoin de, exiger (formel)","alt":[],"ex":"This job requires a lot of patience."},{"en":"purchase","fr":"acheter (formel)","alt":[],"ex":"You can purchase tickets at the door."},{"en":"discover","fr":"découvrir, apprendre (formel)","alt":[],"ex":"We discovered that the museum was closed."},{"en":"return","fr":"rendre, remettre (formel)","alt":[],"ex":"Please return the books before the end of June."},{"en":"inform","fr":"informer, prévenir (formel)","alt":["notify"],"ex":"We will inform you if anything changes."},{"en":"receive","fr":"recevoir","alt":[],"ex":"Did you receive my email?"},{"en":"regarding","fr":"au sujet de, concernant","alt":["concerning"],"ex":"I have a question regarding the field trip."},{"en":"sufficient","fr":"suffisant (formel)","alt":[],"ex":"One hour should be sufficient."},{"en":"apologize","fr":"s'excuser (formel)","alt":[],"ex":"We apologize for the delay."},{"en":"attached","fr":"ci-joint, en pièce jointe","alt":[],"ex":"Please find attached a copy of my report card."},{"en":"grateful","fr":"reconnaissant","alt":["thankful"],"ex":"I would be grateful if you could help me."},{"en":"look forward to","fr":"avoir hâte de (+ -ing)","alt":[],"ex":"I look forward to meeting you."},{"en":"sincerely","fr":"veuillez agréer… (formule de fin très formelle)","alt":[],"ex":"Sincerely, Jaden Moreau"},{"en":"kind regards","fr":"cordialement (fin de courriel)","alt":["best regards"],"ex":"Kind regards, Olivia"},{"en":"gonna","fr":"aller + verbe (familier, à l'oral)","alt":[],"ex":"I'm gonna be late."},{"en":"wanna","fr":"vouloir + verbe (familier, à l'oral)","alt":[],"ex":"Do you wanna play outside?"},{"en":"gotta","fr":"devoir + verbe (familier, à l'oral)","alt":[],"ex":"Sorry, I gotta go!"},{"en":"inconvenience","fr":"dérangement, désagrément","alt":[],"ex":"We apologize for any inconvenience."}],"sentences":[{"en":"I am writing to request information about your summer camp.","fr":"Je vous écris pour demander des renseignements sur votre camp d'été.","trap":["for","asking"],"alt":[]},{"en":"I look forward to hearing from you.","fr":"Au plaisir d'avoir de vos nouvelles.","trap":["hear","forwards"],"alt":[]},{"en":"I would be grateful if you could send me the schedule.","fr":"Je vous serais reconnaissant de m'envoyer l'horaire.","trap":["sent","gratefully"],"alt":[]},{"en":"Please find attached a copy of my report card.","fr":"Vous trouverez ci-joint une copie de mon bulletin.","trap":["join","attach"],"alt":["Please find a copy of my report card attached."]},{"en":"We regret to inform you that the pool is closed today.","fr":"Nous avons le regret de vous informer que la piscine est fermée aujourd'hui.","trap":["informing","closing"],"alt":["We regret to inform you that today the pool is closed."]},{"en":"Do you wanna come to my place?","fr":"Tu veux venir chez moi ?","trap":["want","gonna"],"alt":[]},{"en":"We apologize for any inconvenience this may cause.","fr":"Nous nous excusons pour tout désagrément que cela pourrait causer.","trap":["excuse","inconvenient"],"alt":[]},{"en":"I am writing to complain about the noise from the construction site.","fr":"Je vous écris pour me plaindre du bruit du chantier.","trap":["complaining","for"],"alt":[]},{"en":"Thank you in advance for your assistance.","fr":"Je vous remercie à l'avance de votre aide.","trap":["advanced","assist"],"alt":[]},{"en":"I gotta go home, my mom is calling me.","fr":"Faut que je rentre, ma mère m'appelle.","trap":["got","to"],"alt":["My mom is calling me, I gotta go home."]}],"grammar":[{"type":"mcq","q":"Quelle phrase convient le mieux dans un courriel à ta directrice d'école ?","choices":["Hey! I wanna talk about the field trip.","Dear Madam, I am writing regarding the field trip.","Yo, what's up with the field trip?","Hi! Gotta ask you something about the field trip."],"answer":1,"explain":"Formule d'ouverture formelle (Dear Madam), pas de contraction, et regarding au lieu de about."},{"type":"mcq","q":"I look forward to ___ you at the meeting.","choices":["see","saw","seen","seeing"],"answer":3,"explain":"Dans look forward to, to est une préposition : on met le verbe en -ing."},{"type":"mcq","q":"Quelle est la version formelle de : « Can you tell me when the gym opens? »","choices":["Could you inform me when the gym opens?","Can you tell me when does the gym open?","Tell me when the gym opens.","Wanna tell me when the gym opens?"],"answer":0,"explain":"Could (plus poli que can) + inform (formel pour tell). La 2e phrase a en plus une erreur : pas d'inversion dans une question indirecte."},{"type":"mcq","q":"I'm ___ be late, sorry!","choices":["wanna","gotta","gonna","going"],"answer":2,"explain":"I'm gonna = I'm going to. I'm wanna et I'm gotta n'existent pas, et I'm going be oublie le to."},{"type":"mcq","q":"Quelle formule termine bien un courriel formel ?","choices":["See ya!","Kind regards,","Love,","Later, buddy!"],"answer":1,"explain":"Kind regards (ou Sincerely) est la formule de fin polie. Les autres sont pour les amis ou la famille."},{"type":"mcq","q":"Dans un courriel, le verbe anglais « demand » veut dire…","choices":["exiger","demander poliment","répondre","proposer"],"answer":0,"explain":"Faux ami ! demand = exiger (agressif). Pour demander poliment : request ou ask for."},{"type":"fill","q":"We ___ more chairs for the concert.","hint":"need (formel)","answer":["require"],"explain":"need → require dans un registre formel."},{"type":"fill","q":"I am writing to ___ information about your summer jobs.","hint":"demander (formel)","answer":["request"],"explain":"request information = demander des renseignements (formel). Jamais demand !"},{"type":"fill","q":"Please ___ the book to the library by Friday.","hint":"give back (formel)","answer":["return"],"explain":"give back → return en registre formel."},{"type":"fill","q":"I look forward to ___ from you.","hint":"hear","answer":["hearing"],"explain":"look forward to + -ing : hearing."},{"type":"fill","q":"We would like to ___ you that the meeting has been cancelled.","hint":"tell (formel)","answer":["inform","notify"],"explain":"tell someone → inform someone en registre formel."},{"type":"fill","q":"Sorry, I ___ go, my mom is calling me!","hint":"have got to (familier, à l'oral)","answer":["gotta"],"explain":"À l'oral entre amis, have got to → gotta."},{"type":"error","q":"I look forward to meet you next week.","wrong":4,"fix":["meeting"],"explain":"look forward to + -ing : meeting, pas meet."},{"type":"error","q":"I would be grateful if you could sending me a brochure.","wrong":7,"fix":["send"],"explain":"Après could, le verbe est à la base : could send."},{"type":"error","q":"I am writing to demand information about the swimming lessons.","wrong":4,"fix":["request"],"explain":"demand = exiger, c'est agressif ! Pour demander poliment des renseignements : request."},{"type":"error","q":"I'm gonna the mall with my cousins.","wrong":1,"fix":["going to"],"explain":"gonna remplace seulement going to + verbe. Pour un lieu : I'm going to the mall."},{"type":"error","q":"We look forward to welcome you at the museum.","wrong":4,"fix":["welcoming"],"explain":"look forward to + -ing : welcoming."}],"reading":{"title":"Two Messages, Two Styles","text":"Jaden wanted to volunteer at the Riverside Community Centre this summer. First, he texted his best friend, Malik.\n\n“Hey! Gonna apply for that volunteer thing at the centre. Wanna do it with me? Gotta send the email tonight, so let me know!”\n\nMalik answered with a thumbs-up and three exclamation marks. Then Jaden opened his laptop to write to the manager, Sandra Okafor. His first try began with “Hi Sandra, I wanna help at your camp.” He read it aloud, frowned and deleted everything.\n\nHis older sister, Ana, was looking over his shoulder. “You're not texting a friend,” she said. “You're writing to someone who might give you a job. Make it sound professional.”\n\nForty minutes later, this is what Jaden sent:\n\nDear Sandra Okafor,\n\nI am writing to request information about volunteer positions at the Riverside Community Centre this summer. I am fourteen years old, I speak French and English, and I have assisted at my school's reading club for two years.\n\nI would be grateful if you could inform me whether you require any documents, such as a reference letter. I am available from the end of June until the end of August.\n\nThank you for your time. I look forward to hearing from you.\n\nSincerely,\nJaden Moreau\n\nTwo days later, he received an answer. The manager thanked him for his clear and polite message and invited him to an interview. At the bottom, she had added a short note: “It is rare to receive such a well-written email from a student.”\n\nJaden forwarded the message to Malik. A minute later, his phone buzzed: “Wait, you wrote that? Can you write mine too?”","questions":[{"q":"Why did Jaden delete his first try?","choices":["His computer stopped working.","Malik told him to start again.","It sounded too casual for a message to a manager.","He had written to the wrong person."],"answer":2},{"q":"Which of these did Jaden mention in his email?","choices":["His age and the languages he speaks","His favourite sports","Malik's phone number","His marks in math"],"answer":0},{"q":"What did Jaden want to know?","choices":["How much the job pays","Whether he needs to send any documents","Where the centre is","If Malik can come too"],"answer":1},{"q":"What can we guess about Ana?","choices":["She works at the community centre.","She is younger than Jaden.","She wants to volunteer too.","She knows how a formal message should sound."],"answer":3},{"q":"What did the manager think of Jaden's email?","choices":["She found it too long.","She didn't understand it.","She thought it was impressive for a student.","She thought it was rude."],"answer":2},{"q":"What does Malik's last text suggest?","choices":["He is surprised, and he would like help with his own email.","He is angry that Jaden applied without him.","He thinks the email is too formal.","He has already been hired."],"answer":0}]},"pron":{"focus":"Anglais familier ou soigné à l'oral","ipa":"","explain":"Entre amis, les anglophones collent les mots : [[going to]] devient [[gonna]], [[want to]] devient [[wanna]], [[don't know]] devient [[dunno]]. C'est normal et naturel à l'oral, et tu dois les **comprendre** ! Mais attention : à l'écrit soigné (courriel, travail scolaire), on ne les écrit jamais. Autre piège : [[gonna]] ne remplace [[going to]] que pour le futur : [[I'm gonna eat]], oui ; [[I'm gonna the park]], jamais ! Truc : avec tes amis, relaxe ; avec la directrice, articule chaque mot.","words":[{"en":"gonna","fr":"va, vais (going to, familier)","hint":"« GEU-neu » : seulement pour le futur, jamais pour un lieu"},{"en":"going to","fr":"aller (futur, soigné)","hint":"« GÔ-ing-tou » : on entend bien les trois syllabes"},{"en":"wanna","fr":"veux (want to, familier)","hint":"« OUÂ-neu » : le t disparaît complètement"},{"en":"want to","fr":"vouloir (soigné)","hint":"« OUÂNT-tou » : le t s'entend, puis [[to]]"},{"en":"gotta","fr":"dois (have got to, familier)","hint":"« GÂ-deu » : le t devient un « d » léger"},{"en":"lemme","fr":"laisse-moi (let me, familier)","hint":"« LÈ-mi » ; version soignée : [[let me]], « lèt-MI »"},{"en":"gimme","fr":"donne-moi (give me, familier)","hint":"« GUI-mi » ; version soignée : [[give me]], « guiv-MI »"},{"en":"dunno","fr":"sais pas (I don't know, familier)","hint":"« deu-NÔ » ; version soignée : [[I don't know]], « aï-dônt-NÔ »"},{"en":"kinda","fr":"un peu, plutôt (kind of, familier)","hint":"« KAÏN-deu » ; version soignée : [[kind of]], « KAÏN-deuv »"}],"pairs":[],"practice":["I dunno, I kinda wanna stay home tonight.","I don't know; I kind of want to stay home tonight.","I'm going to call you later, so don't forget to answer."]},"mission":{"type":"ecrit","prompt":"Tu veux être bénévole cet été au camp de jour du centre communautaire de ton quartier. Écris un courriel formel de cinq à huit phrases à la responsable du camp pour demander des renseignements (tâches, horaire, formation). Aucun mot familier !","model":"Dear Sir or Madam, I am writing to inquire about the volunteer positions at your summer day camp. I am fourteen years old, I speak French and English fluently, and I have experience assisting younger children at my local library. I would be grateful if you could inform me of the requirements and the deadline to apply. I would also like to know whether any training is provided. Please find attached a short description of my experience. Thank you for your time, and I look forward to hearing from you. Sincerely, Léa Gagnon","checklist":["J'ai commencé par [[Dear Sir or Madam]] ou [[Dear]] + nom, et terminé par [[Sincerely]]","J'ai utilisé des verbes soignés ([[inquire]], [[request]], [[assist]], [[inform]], [[require]])","J'ai écrit [[I would be grateful if you could]] pour faire une demande polie","J'ai écrit [[I look forward to hearing]] + -ing, pas [[to hear]]","Aucun [[gonna]], [[wanna]], contraction familière ni émoji"]}},{"id":"11.3","title":"L'anglais de la vraie vie","titleEn":"No Worries, Eh?","goal":"Comprendre et utiliser l'anglais parlé de tous les jours, version canadienne.","lesson":[{"type":"p","text":"À l'école, on apprend l'anglais « du livre ». Mais dans la cour d'école ou à l'aréna, à Ottawa, tu vas entendre [[no worries]], [[my bad]], [[legit]]… Voici ton kit de survie de l'anglais parlé, version canadienne."},{"type":"table","head":["Expression","Sens","Exemple"],"rows":[["no worries","pas de souci, de rien","[[Thanks! — No worries!]]"],["my bad","c'est ma faute, oups","[[My bad, I took your pencil.]]"],["fair enough","c'est correct, ça se défend","[[You're tired? Fair enough.]]"],["it's up to you","c'est toi qui décides","[[Pizza or tacos? It's up to you.]]"],["hang out","passer du temps ensemble","[[Wanna hang out after school?]]"],["I'm down","je suis partant","[[Skating? I'm down!]]"],["sketchy","louche, pas fiable","[[That website looks sketchy.]]"],["legit","pour vrai, authentique","[[Is this story legit?]]"],["take a rain check","remettre à plus tard","[[Can I take a rain check?]]"],["no way","pas question ! / sans blague !","[[No way, that's my seat!]]"]]},{"type":"rule","title":"Le Canada en mots","text":"[[washroom]] = les toilettes dans un lieu public. [[double-double]] = un café avec deux crèmes et deux sucres. [[loonie]] = la pièce de un dollar (le huard) et [[toonie]] = la pièce de deux dollars. [[toque]] = une tuque. [[pop]] = une boisson gazeuse. [[runners]] = des espadrilles. [[keener]] = un élève super zélé (un peu moqueur). Et le célèbre [[eh]], à la fin d'une phrase, pour demander si l'autre est d'accord : [[Cold today, eh?]]"},{"type":"rule","title":"Un registre familier","text":"Toutes ces expressions sont **familières** : parfaites avec tes amis, ta famille ou à l'aréna, mais à éviter dans un courriel formel (rappelle-toi l'étape 11.2). On écrit [[Thank you for your assistance]] à la directrice, pas [[No worries, you're awesome!]]"},{"type":"examples","items":[{"en":"My bad, I forgot to text you back.","fr":"Ma faute, j'ai oublié de te répondre."},{"en":"Do you have a toonie for the parking meter?","fr":"As-tu une pièce de deux dollars pour le parcomètre ?"},{"en":"That guy online seems sketchy.","fr":"Ce gars en ligne a l'air louche."},{"en":"Can I take a rain check on the movie?","fr":"Est-ce qu'on peut remettre le film à plus tard ?"},{"en":"Nice game, eh?","fr":"Beau match, hein ?"}]},{"type":"tip","text":"Pièges : [[pop]] veut dire une boisson gazeuse, pas seulement la musique pop ! [[hang out]] (passer du temps ensemble) n'est **pas** [[hang up]] (raccrocher le téléphone). Et [[my bad]] sert pour une **petite** erreur ; pour quelque chose de grave, dis plutôt [[I'm really sorry]]. Attention aussi à l'orthographe : [[loonie]], pas [[looney]] (qui veut dire « cinglé ») !"},{"type":"fun","text":"Le sais-tu ? La pièce de un dollar canadien montre un **huard** ([[loon]] en anglais) : c'est pour ça qu'on l'appelle [[loonie]]. Quand la pièce de deux dollars est arrivée, les gens ont mélangé [[two]] et [[loonie]] pour inventer [[toonie]] !"},{"type":"dialogue","title":"Au casse-croûte de l'aréna","lines":[{"who":"Liam","en":"I'm starving. Wanna grab something before the game?","fr":"Je meurs de faim. On prend quelque chose avant le match ?"},{"who":"Noah","en":"I'm down. Do you have a toonie? I only have a loonie.","fr":"Je suis partant. As-tu une pièce de deux dollars ? J'ai juste un huard."},{"who":"Liam","en":"No worries, I've got you. A pop and some fries?","fr":"Pas de souci, je t'invite. Une boisson gazeuse et des frites ?"},{"who":"Noah","en":"Legit, you're awesome. My dad is getting his usual double-double.","fr":"Pour vrai, t'es génial. Mon père prend son double-double habituel."},{"who":"Liam","en":"Of course he is. Hey, where's the washroom?","fr":"Évidemment. Hé, où sont les toilettes ?"},{"who":"Noah","en":"Down the hall, next to the skate rental. Hurry up, the game starts soon!","fr":"Au bout du couloir, à côté de la location de patins. Dépêche-toi, le match commence bientôt !"},{"who":"Liam","en":"Wait, where's my toque? Oh, my bad, it's in my bag!","fr":"Attends, où est ma tuque ? Oh, ma faute, elle est dans mon sac !"}]}],"vocab":[{"en":"no worries","fr":"pas de souci, de rien","alt":["no problem"],"ex":"Thanks for the ride! — No worries!"},{"en":"my bad","fr":"c'est ma faute (oups !)","alt":[],"ex":"My bad, I stepped on your foot."},{"en":"fair enough","fr":"c'est correct, ça se défend","alt":[],"ex":"You want to stay home? Fair enough."},{"en":"it's up to you","fr":"c'est toi qui décides","alt":[],"ex":"Pizza or tacos? It's up to you."},{"en":"hang out","fr":"passer du temps ensemble, traîner","alt":[],"ex":"We usually hang out at the park after school."},{"en":"awesome","fr":"génial, super","alt":["amazing"],"ex":"Your new skateboard is awesome!"},{"en":"sketchy","fr":"louche, pas fiable","alt":["shady"],"ex":"That website looks sketchy."},{"en":"legit","fr":"pour vrai, authentique (familier)","alt":[],"ex":"Is this autograph legit?"},{"en":"eh","fr":"hein ? (à la canadienne)","alt":[],"ex":"Cold today, eh?"},{"en":"washroom","fr":"toilettes (dans un lieu public)","alt":["restroom"],"ex":"Excuse me, where is the washroom?"},{"en":"double-double","fr":"café deux crèmes, deux sucres","alt":[],"ex":"My dad orders a double-double every morning."},{"en":"loonie","fr":"pièce de un dollar (huard)","alt":[],"ex":"The parking costs a loonie."},{"en":"toonie","fr":"pièce de deux dollars","alt":[],"ex":"Can I borrow a toonie?"},{"en":"toque","fr":"bonnet de laine pour l'hiver (tuque)","alt":["tuque"],"ex":"Don't forget your toque, it's freezing!"},{"en":"keener","fr":"élève très zélé, premier de classe (familier)","alt":[],"ex":"Ana is a keener; she always does extra homework."},{"en":"pop","fr":"boisson gazeuse (liqueur)","alt":["soda","soft drink"],"ex":"Can I have a pop with my fries?"},{"en":"runners","fr":"espadrilles, souliers de course","alt":["sneakers"],"ex":"Put on your runners, we're going for a walk."},{"en":"take a rain check","fr":"remettre une invitation à plus tard","alt":[],"ex":"I'm busy tonight; can I take a rain check?"},{"en":"I'm down","fr":"je suis partant","alt":["I'm in"],"ex":"Ice cream after practice? I'm down!"},{"en":"no way","fr":"pas question ! / sans blague !","alt":[],"ex":"No way, you met a real astronaut?"}],"sentences":[{"en":"No worries, you can keep the toonie.","fr":"Pas de souci, tu peux garder la pièce de deux dollars.","trap":["worry","keeps"],"alt":[]},{"en":"My bad, I thought the game started at seven.","fr":"Ma faute, je pensais que le match commençait à sept heures.","trap":["fault","begun"],"alt":[]},{"en":"Where do you like to hang out with your friends?","fr":"Où aimes-tu passer du temps avec tes amis ?","trap":["hangs","likes"],"alt":[]},{"en":"It's up to you, we can watch a movie or play outside.","fr":"C'est toi qui décides, on peut regarder un film ou jouer dehors.","trap":["for","its"],"alt":["It's up to you, we can play outside or watch a movie."]},{"en":"That website looks sketchy, so don't give them your address.","fr":"Ce site a l'air louche, alors ne leur donne pas ton adresse.","trap":["look","doesn't"],"alt":[]},{"en":"Is this story legit, or did you make it up?","fr":"Cette histoire est-elle vraie, ou tu l'as inventée ?","trap":["made","invent"],"alt":[]},{"en":"Excuse me, do you know where the washroom is?","fr":"Excusez-moi, savez-vous où sont les toilettes ?","trap":["does","are"],"alt":[]},{"en":"My dad can't start his day without a double-double.","fr":"Mon père ne peut pas commencer sa journée sans un double-double.","trap":["doesn't","starts"],"alt":[]},{"en":"Mom made me wear my toque to school.","fr":"Maman m'a obligé à porter ma tuque pour aller à l'école.","trap":["wearing","maked"],"alt":[]},{"en":"Fair enough, but it's still my turn to choose.","fr":"C'est correct, mais c'est quand même mon tour de choisir.","trap":["choosing","its"],"alt":[]},{"en":"Ana is a bit of a keener; she always does extra homework.","fr":"Ana est un peu trop zélée : elle fait toujours des devoirs en plus.","trap":["keen","do"],"alt":[]}],"grammar":[{"type":"mcq","q":"Ton ami te dit : « Sorry, I stepped on your foot! » Tu réponds gentiment :","choices":["My bad!","No worries!","Sketchy!","I'm down!"],"answer":1,"explain":"No worries = pas de souci. My bad, c'est ce que dit la personne qui a fait l'erreur."},{"type":"mcq","q":"Tu as pris le crayon de ton amie par erreur. Tu dis : « ___, here it is. »","choices":["Fair enough","No way","My bad","I'm down"],"answer":2,"explain":"My bad = c'est ma faute, oups. On le dit pour une petite erreur qu'on a faite soi-même."},{"type":"mcq","q":"Un inconnu en ligne t'offre des cadeaux gratuits si tu lui donnes ton mot de passe. C'est…","choices":["awesome","legit","a keener","sketchy"],"answer":3,"explain":"sketchy = louche, pas fiable. Ne donne jamais ton mot de passe !"},{"type":"mcq","q":"Au Canada, un toonie vaut…","choices":["deux dollars","un dollar","vingt-cinq cents","cinq dollars"],"answer":0,"explain":"toonie = la pièce de deux dollars (two + loonie). Le loonie vaut un dollar."},{"type":"mcq","q":"« Do you want to come skating? » — « ___ What time? »","choices":["My bad!","I'm down!","No worries!","Fair enough!"],"answer":1,"explain":"I'm down = je suis partant. C'est la seule réponse qui accepte l'invitation."},{"type":"mcq","q":"Ton amie explique qu'elle ne peut pas venir parce qu'elle a un rendez-vous chez le dentiste. Tu réponds : « ___. Next time, then! »","choices":["No way","My bad","Fair enough","Sketchy"],"answer":2,"explain":"Fair enough = c'est correct, je comprends ta raison."},{"type":"mcq","q":"Quel mot n'a PAS sa place dans un courriel formel ?","choices":["regarding","grateful","receive","awesome"],"answer":3,"explain":"awesome est familier. Les trois autres sont des mots formels de l'étape 11.2."},{"type":"fill","q":"Can you watch my bag? I need to go to the ___.","hint":"toilettes (lieu public, au Canada)","answer":["washroom"],"explain":"Au Canada, les toilettes publiques : the washroom."},{"type":"fill","q":"Do you want to ___ at my place on Saturday?","hint":"passer du temps ensemble","answer":["hang out"],"explain":"hang out = passer du temps ensemble (pas hang up, qui veut dire raccrocher)."},{"type":"fill","q":"I can't come tonight. Can I take a ___?","hint":"remettre à plus tard","answer":["rain check"],"explain":"take a rain check = remettre une invitation à plus tard."},{"type":"fill","q":"Cold today, ___?","hint":"hein ? (à la canadienne)","answer":["eh"],"explain":"Le fameux eh canadien, à la fin d'une phrase, pour chercher l'accord de l'autre."},{"type":"fill","q":"Wear your ___, it's minus twenty outside!","hint":"bonnet de laine pour l'hiver","answer":["toque","tuque"],"explain":"Une tuque = a toque (on voit aussi l'orthographe tuque en anglais canadien)."},{"type":"fill","q":"Pizza or tacos? I don't mind, it's ___ to you.","hint":"c'est toi qui décides","answer":["up"],"explain":"It's up to you = c'est toi qui décides."},{"type":"error","q":"Can I borrow a looney for the vending machine?","wrong":4,"fix":["loonie"],"explain":"La pièce de un dollar s'écrit loonie. looney veut dire « cinglé » !"},{"type":"error","q":"No worry, I'll help you clean up.","wrong":1,"fix":["worries"],"explain":"L'expression est toujours au pluriel : No worries."},{"type":"error","q":"Do you want to hang up at the park after school?","wrong":5,"fix":["out"],"explain":"hang out = passer du temps ensemble. hang up = raccrocher le téléphone."},{"type":"error","q":"It's up for you, we can leave whenever you want.","wrong":2,"fix":["to"],"explain":"L'expression est It's up to you."}],"reading":{"title":"Karim's First Week","text":"On his first day at his new school in Ottawa, Karim thought his English was pretty good. He had studied it for years in Paris. By lunchtime, however, he wasn't so sure.\n\nIn the hallway, a boy bumped into him and said, “My bad!” before running off. Karim had no idea what was bad, or whose it was. At recess, a girl named Chloé asked if he wanted to hang out after school. Karim imagined laundry hanging on a line and politely said no.\n\nLuckily, Chloé didn't give up. She sat next to him at lunch and offered him a cookie. When Karim thanked her, she answered, “No worries!” He wondered what she was supposed to be worried about.\n\nThen she asked if he had a loonie for the vending machine. Karim looked confused, so she showed him a gold-coloured coin with a bird on it. “It's a loon,” she explained. “That's why we call it a loonie. And the two-dollar coin is a toonie.” Karim laughed for the first time that day.\n\nAfter school, Chloé's dad picked them up. He was holding a coffee. “Double-double,” he said proudly, as if it were a secret password. Karim later learned that it meant two creams and two sugars.\n\nThat evening, Karim wrote a list in his notebook: my bad, no worries, hang out, loonie, toonie, double-double. At the bottom, he added one more word that he had heard at least ten times: eh.\n\nThe next morning, Chloé waved at him. “Want to hang out at recess?” she asked.\n\n“I'm down,” Karim answered with a grin.\n\nChloé raised her eyebrows. “Wow, you learn fast, eh?”","questions":[{"q":"Why did Karim say no when Chloé first invited him?","choices":["He had to go home early.","He didn't like Chloé.","He had too much homework.","He didn't understand what “hang out” meant."],"answer":3},{"q":"Why is the one-dollar coin called a loonie?","choices":["Because it shows a loon.","Because it is gold-coloured.","Because it was designed in Paris.","Because it is used in vending machines."],"answer":0},{"q":"What does “double-double” mean in the story?","choices":["A very large coffee","A coffee with two creams and two sugars","Two coffees","A secret password"],"answer":1},{"q":"How did Karim most likely feel during his first morning?","choices":["Proud of his perfect English","Angry at his teachers","Confused by the English he heard","Bored and sleepy"],"answer":2},{"q":"Why does Chloé raise her eyebrows at the end?","choices":["She is angry that Karim is late.","She is surprised that Karim used a slang expression so naturally.","She didn't hear Karim's answer.","She thinks Karim is being rude."],"answer":1},{"q":"What did Karim write in his notebook?","choices":["Chloé's phone number","His homework","A list of new expressions","A letter to his friends in Paris"],"answer":2}]},"pron":{"focus":"L'accent canadien","ipa":"/ʌʊ/ – /ɾ/","explain":"Bonne nouvelle : à Ottawa, tu entends l'anglais canadien tous les jours ! Premier secret : dans [[about]], [[out]] ou [[house]], le son « aou » commence plus haut, presque comme « eou » dit d'un seul coup. Non, les Canadiens ne disent pas « a boot » : ça, c'est une blague des Américains ! Deuxième secret : entre deux voyelles, le t devient un « d » très léger ([[water]], [[city]], [[better]]), et [[sorry]] se dit « SÔ-ri », avec un « ô » bien rond. Attention : selon ton appareil, la voix de l'appli peut avoir un accent américain, alors écoute aussi les gens autour de toi !","words":[{"en":"about","fr":"à propos de, environ","hint":"« eu-BEOUT » : « eou » en un seul son rapide, qui part de « eu » et glisse vers « ou »"},{"en":"out","fr":"dehors","hint":"« EOUT » : un seul son qui glisse, très court"},{"en":"house","fr":"une maison","hint":"« HEOUS » : h soufflé, puis le même glissement « eou »"},{"en":"sorry","fr":"désolé, désolée","hint":"« SÔ-ri » : « ô » rond, le mot préféré des Canadiens !"},{"en":"water","fr":"de l'eau","hint":"« OUÂ-deur » : le t devient un « d » léger"},{"en":"better","fr":"meilleur, mieux","hint":"« BÈ-deur » : t léger, comme un « d » rapide"},{"en":"little","fr":"petit, un peu","hint":"« LI-deul » : le t devient « d », et la fin « deul » est toute petite"},{"en":"city","fr":"une ville","hint":"« SI-di » : le t devient un « d » léger"},{"en":"Toronto","fr":"Toronto","hint":"« teu-RÂN-tô » ; beaucoup de gens de là-bas disent même « TRÂ-nô » !"},{"en":"eh","fr":"hein ? (n'est-ce pas ?)","hint":"« ÉI » : la voix monte, comme une petite question"}],"pairs":[],"practice":["Sorry, eh! There's a little water all over the house.","We drove to Toronto for about a week, and the city was better than I thought."]},"mission":{"type":"oral","prompt":"Hugo, ton correspondant de France, arrive à Ottawa demain. Au téléphone, explique-lui à voix haute, en cinq à sept phrases, quatre ou cinq mots canadiens qu'il va entendre partout.","model":"Hey Hugo, welcome to Ottawa! Here are a few words you'll hear all the time. A loonie is a one-dollar coin, and a toonie is a two-dollar coin. If someone offers you a double-double, it's a coffee with two creams and two sugars. When it's cold, put on your toque: that's a warm winter hat. And if you need the washroom, just ask, no worries. See you tomorrow, eh!","checklist":["J'ai expliqué au moins quatre mots canadiens ([[loonie]], [[toonie]], [[double-double]], [[toque]], [[washroom]]…)","J'ai utilisé des expressions de la vraie vie ([[no worries]], [[eh]], [[awesome]]…)","J'ai fait glisser le son de [[out]] et [[about]], sans dire « a boot »","J'ai dit le t léger de [[water]], [[city]] et [[little]]","Mon [[eh]] montait, comme une petite question"]}},{"id":"11.4","title":"Les mots qui piègent","titleEn":"Tricky Twins","goal":"Ne plus confondre les paires de mots anglais qui se ressemblent ou se prononcent pareil.","lesson":[{"type":"p","text":"Même les anglophones se trompent avec ces mots-là ! Ils se ressemblent, se prononcent parfois pareil… mais ne veulent pas du tout dire la même chose. Un bon détective des mots les repère tout de suite."},{"type":"table","head":["Paire","La différence","Exemple"],"rows":[["affect / effect","verbe (influencer) / nom (un effet)","[[The noise affects me. It has a bad effect on me.]]"],["lose / loose","perdre / lâche, pas serré","[[Don't lose your keys! My shoe is loose.]]"],["borrow / lend","emprunter / prêter","[[Can I borrow your pen? Can you lend me your pen?]]"],["say / tell","dire quelque chose / dire à quelqu'un","[[She said hello. She told me a secret.]]"],["rise / raise","monter tout seul / lever quelque chose","[[The sun rises. Raise your hand.]]"],["fewer / less","moins de (qu'on compte) / moins de (qu'on ne compte pas)","[[fewer cars, less traffic]]"],["advice / advise","conseil (nom) / conseiller (verbe)","[[good advice; I advise you to rest]]"],["quiet / quite","silencieux / assez, plutôt","[[a quiet room; quite cold]]"],["accept / except","accepter / sauf","[[I accept. Everyone except me.]]"],["then / than","ensuite / que (comparaison)","[[taller than me; and then we left]]"],["principal / principle","directeur d'école / principe","[[The principal has strong principles.]]"],["stationary / stationery","immobile / articles de papeterie","[[a stationary bus; a stationery store]]"],["compliment / complement","éloge / complément","[[a nice compliment; a good complement]]"],["practice / practise","nom / verbe (au Canada)","[[hockey practice; I practise every day]]"]]},{"type":"rule","title":"Les sosies à apostrophe","text":"[[its]] = son, sa (possessif) / [[it's]] = it is ou it has. [[their]] = leur / [[there]] = là / [[they're]] = they are. [[your]] = ton, ta / [[you're]] = you are. [[whose]] = à qui, dont / [[who's]] = who is ou who has. Truc infaillible : si tu peux remplacer par **it is / they are / you are / who is**, mets l'apostrophe. Sinon, pas d'apostrophe !"},{"type":"rule","title":"Le casse-tête lie / lay","text":"[[lie]] (s'allonger) : lie, **lay**, lain, lying. [[lay]] (poser quelque chose à plat) : lay, **laid**, laid, laying. Le piège : le passé de lie est… [[lay]] ! [[Yesterday I lay on the couch.]] mais [[Yesterday I laid my bag on the floor.]] (Et [[lie]] au sens de mentir est régulier : lie, lied, lied.)"},{"type":"examples","items":[{"en":"Can you lend me your charger?","fr":"Peux-tu me prêter ton chargeur ?"},{"en":"There are fewer students but less noise.","fr":"Il y a moins d'élèves mais moins de bruit."},{"en":"The dog is lying in its bed.","fr":"Le chien est couché dans son lit."},{"en":"They're leaving their bikes over there.","fr":"Ils laissent leurs vélos là-bas."},{"en":"My grandpa gave me some great advice.","fr":"Mon grand-père m'a donné de très bons conseils."}]},{"type":"tip","text":"Pièges de francophone : ~~Can you borrow me your pen?~~ → [[Can you lend me your pen?]] On **emprunte à** quelqu'un ([[borrow from]]) et on **prête à** quelqu'un ([[lend to]]). Aussi : [[advice]] est indénombrable : ~~an advice, advices~~ → [[some advice, a piece of advice]]. Et ~~She said me~~ → [[She told me]] : [[tell]] veut une personne juste après."},{"type":"fun","text":"Truc de mémoire : stationEry, avec un **e** comme **e**nveloppe (papeterie). StationAry, avec un **a** comme **a**rrêté (immobile). Et le [[principal]] de ton école est ton **pal** (copain, en anglais)… enfin, on l'espère !"},{"type":"dialogue","title":"Devoirs à deux","lines":[{"who":"Emma","en":"Can I borrow your eraser? I'll give it back right away.","fr":"Je peux emprunter ta gomme à effacer ? Je te la redonne tout de suite."},{"who":"Lucas","en":"Sure, I'll lend it to you. Just don't lose it this time!","fr":"Bien sûr, je te la prête. Mais ne la perds pas cette fois !"},{"who":"Emma","en":"Very funny. Hey, do we say fewer mistakes or less mistakes?","fr":"Très drôle. Hé, on dit fewer mistakes ou less mistakes ?"},{"who":"Lucas","en":"Fewer mistakes, because you can count them. But less homework, because you can't.","fr":"Fewer mistakes, parce qu'on peut les compter. Mais less homework, parce qu'on ne peut pas."},{"who":"Emma","en":"I wish we had less homework. Can I lie down for five minutes?","fr":"J'aimerais qu'on ait moins de devoirs. Je peux m'allonger cinq minutes ?"},{"who":"Lucas","en":"No way. Your homework won't do itself, and it's due tomorrow.","fr":"Pas question. Tes devoirs ne vont pas se faire tout seuls, et c'est pour demain."},{"who":"Emma","en":"Fine. But that's quite mean, you know.","fr":"D'accord. Mais c'est plutôt méchant, tu sais."}]}],"vocab":[{"en":"affect","fr":"influencer, avoir un effet sur (verbe)","alt":[],"ex":"Lack of sleep can affect your marks."},{"en":"effect","fr":"effet, résultat (nom)","alt":[],"ex":"The medicine had a quick effect."},{"en":"loose","fr":"lâche, trop grand (pas serré)","alt":[],"ex":"My shoelace is loose."},{"en":"lend","fr":"prêter","alt":[],"ex":"Can you lend me your bike?"},{"en":"borrow","fr":"emprunter","alt":[],"ex":"Can I borrow your ruler?"},{"en":"rise","fr":"monter, se lever (tout seul)","alt":[],"ex":"The sun rises in the east."},{"en":"raise","fr":"lever, augmenter (quelque chose)","alt":[],"ex":"Raise your hand if you know the answer."},{"en":"lie down","fr":"s'allonger, se coucher","alt":[],"ex":"I'm tired; I'm going to lie down."},{"en":"lay","fr":"poser à plat (passé : laid)","alt":[],"ex":"Lay the map flat on the table."},{"en":"fewer","fr":"moins de (avec un pluriel qu'on compte)","alt":[],"ex":"There are fewer cars on Sunday."},{"en":"less","fr":"moins de (avec ce qu'on ne compte pas)","alt":[],"ex":"I have less homework this week."},{"en":"advice","fr":"conseil, des conseils (nom)","alt":[],"ex":"Can you give me some advice?"},{"en":"advise","fr":"conseiller (verbe)","alt":[],"ex":"The doctor advised me to rest."},{"en":"quite","fr":"assez, plutôt","alt":["pretty","rather","fairly"],"ex":"The test was quite easy."},{"en":"quiet","fr":"silencieux, tranquille","alt":[],"ex":"Please be quiet in the library."},{"en":"except","fr":"sauf, à part","alt":[],"ex":"Everyone came except Noah."},{"en":"principal","fr":"directeur, directrice d'école","alt":[],"ex":"The principal visited our class."},{"en":"principle","fr":"principe","alt":[],"ex":"Honesty is an important principle."},{"en":"stationery","fr":"articles de papeterie","alt":[],"ex":"I need new stationery for school."},{"en":"stationary","fr":"immobile, à l'arrêt","alt":[],"ex":"The bus was stationary at the red light."}],"sentences":[{"en":"Can you lend me your charger until tomorrow?","fr":"Peux-tu me prêter ton chargeur jusqu'à demain ?","trap":["borrow","lent"],"alt":[]},{"en":"The cold weather didn't affect our plans at all.","fr":"Le froid n'a pas du tout influencé nos plans.","trap":["effect","affected"],"alt":[]},{"en":"There are fewer students in the class than last year.","fr":"Il y a moins d'élèves dans la classe que l'an dernier.","trap":["less","then"],"alt":[]},{"en":"The dog is lying on the couch, and it's wagging its tail.","fr":"Le chien est couché sur le divan et il remue la queue.","trap":["laying","their"],"alt":[]},{"en":"I laid my backpack on the floor and lay down on the bed.","fr":"J'ai posé mon sac à dos par terre et je me suis allongé sur le lit.","trap":["layed","lied"],"alt":[]},{"en":"My grandma gave me some great advice about saving money.","fr":"Ma grand-mère m'a donné de super conseils pour économiser.","trap":["advices","advise"],"alt":[]},{"en":"The library was so quiet that I could hear the clock.","fr":"La bibliothèque était si silencieuse que j'entendais l'horloge.","trap":["quite","than"],"alt":[]},{"en":"Everyone was invited except Liam, who was sick.","fr":"Tout le monde était invité sauf Liam, qui était malade.","trap":["accept","which"],"alt":["Everyone except Liam, who was sick, was invited."]},{"en":"Our principal has one simple principle: respect everyone.","fr":"Notre directrice a un principe tout simple : respecter tout le monde.","trap":["principals","respects"],"alt":[]},{"en":"Who's coming to the party, and whose jacket is this?","fr":"Qui vient à la fête, et à qui est ce manteau ?","trap":["who","whom"],"alt":["Whose jacket is this, and who's coming to the party?"]},{"en":"They're leaving their bikes over there by the fence.","fr":"Ils laissent leurs vélos là-bas, près de la clôture.","trap":["there's","theirs"],"alt":["They're leaving their bikes by the fence over there."]},{"en":"The price of bus tickets will rise again in January.","fr":"Le prix des billets d'autobus va encore augmenter en janvier.","trap":["raise","rises"],"alt":["In January the price of bus tickets will rise again."]}],"grammar":[{"type":"mcq","q":"I have hockey ___ tonight.","choices":["practise","practice","practising","practised"],"answer":1,"explain":"Ici c'est un nom (l'entraînement) : practice avec un c. Au Canada, practise avec un s, c'est le verbe."},{"type":"mcq","q":"The new rule will ___ everyone in the school.","choices":["affect","effect","effects","affection"],"answer":0,"explain":"Il faut un verbe (influencer) : affect. effect est le nom."},{"type":"mcq","q":"My jeans are too ___; I need a belt.","choices":["lose","lost","loose","loosen"],"answer":2,"explain":"loose = lâche, trop grand. lose = perdre."},{"type":"mcq","q":"There were ___ people at the game than last week.","choices":["less","lesser","few","fewer"],"answer":3,"explain":"people se compte (un pluriel) : fewer."},{"type":"mcq","q":"When the teacher came in, everyone ___ from their seats.","choices":["raised","rose","rised","raise"],"answer":1,"explain":"On se lève tout seul : rise, rose, risen. raise a besoin d'un objet (raise your hand)."},{"type":"mcq","q":"Yesterday I was so tired that I ___ on the couch all afternoon.","choices":["laid","lied","lay","layed"],"answer":2,"explain":"S'allonger = lie, et son passé est lay. laid est le passé de lay (poser quelque chose)."},{"type":"fill","q":"My parents ___ me to study harder.","hint":"conseiller (passé)","answer":["advised"],"explain":"Le verbe s'écrit avec un s : advise → advised. advice (avec un c) est le nom."},{"type":"fill","q":"Please ___ your hand if you know the answer.","hint":"lever","answer":["raise","put up"],"explain":"On lève quelque chose (la main) : raise."},{"type":"fill","q":"This sandwich costs ___ than the pizza.","hint":"moins","answer":["less"],"explain":"costs less = coûte moins cher. fewer va seulement devant un nom pluriel qu'on peut compter."},{"type":"fill","q":"___ backpack is this? It's on my chair.","hint":"à qui (whose ou who's ?)","answer":["Whose"],"explain":"À qui = whose. who's = who is."},{"type":"fill","q":"My brother is taller ___ me.","hint":"que (then ou than ?)","answer":["than"],"explain":"Pour comparer : than. then veut dire ensuite."},{"type":"fill","q":"The students forgot ___ notebooks at home.","hint":"leurs (their, there ou they're ?)","answer":["their"],"explain":"Possessif (leurs) : their."},{"type":"error","q":"Can you borrow me your eraser, please?","wrong":2,"fix":["lend"],"explain":"Prêter = lend. borrow veut dire emprunter."},{"type":"error","q":"The dog wagged it's tail happily.","wrong":3,"fix":["its"],"explain":"Possessif (sa queue) : its, sans apostrophe. it's = it is."},{"type":"error","q":"There were less cars on the road this morning.","wrong":2,"fix":["fewer"],"explain":"cars se compte : fewer cars."},{"type":"error","q":"I need your advise on my essay.","wrong":3,"fix":["advice"],"explain":"Ici c'est le nom (ton conseil) : advice, avec un c."},{"type":"error","q":"Please be quite during the test.","wrong":2,"fix":["quiet"],"explain":"Silencieux = quiet. quite veut dire assez."},{"type":"error","q":"She said me the truth.","wrong":1,"fix":["told"],"explain":"tell + personne : She told me the truth. (say ne prend pas la personne directement.)"}],"reading":{"title":"Ask Priya, the Word Detective","text":"Every week, our school newspaper receives letters from students who are confused about English words. This week, Priya answers two of them.\n\nDear Priya,\nMy older brother says I should never borrow his headphones without asking. So last week, I asked him, “Can you borrow me your headphones?” He laughed so hard that he couldn't answer. What did I do wrong?\nEmbarrassed in Orleans\n\nDear Embarrassed,\nDon't worry, it's a very common mistake for French speakers! You borrow something from someone, but someone lends something to you. So next time, try: “Can you lend me your headphones?” or “Can I borrow your headphones?” Your brother will have fewer reasons to laugh, and you'll have more music.\n\nDear Priya,\nMy teacher circled “its” and “it's” in red on my essay about my dog. I thought they were the same word! She also says that “I laid down after the walk” is wrong. My dog lies down all the time. Why can't I?\nConfused in Kanata\n\nDear Confused,\nYou can, of course! But the verb is tricky. When you rest your body, you lie down, and in the past, you lay down. When you put an object somewhere, you lay it down, and in the past, you laid it. So: “I lay down after the walk,” but “I laid my keys on the table.”\n\nAs for its and it's, here is my secret: if you can say “it is” or “it has,” use the apostrophe. “It's a sunny day.” If not, it shows possession: “My dog loves its blanket.”\n\nRemember, these mistakes don't affect how smart you are. Even adults make them! But fixing them will have a great effect on your writing.\n\nKeep the letters coming!\nPriya","questions":[{"q":"Why did the brother laugh so hard?","choices":["His headphones were broken.","The writer used “borrow” where “lend” was needed.","He didn't want to share his headphones.","He was listening to a funny podcast."],"answer":1},{"q":"According to Priya, what is the simple past of “lie” when you rest your body?","choices":["lied","laid","lain","lay"],"answer":3},{"q":"Which sentence follows Priya's advice?","choices":["It's raining again.","The bird hurt it's wing.","The team lost it's first game.","Its a great idea."],"answer":0},{"q":"What does Priya mean when she says the brother “will have fewer reasons to laugh”?","choices":["The brother will stop telling jokes.","The brother is sad.","If the writer uses the right word, there will be no mistake to laugh at.","The headphones will be returned."],"answer":2},{"q":"What is Priya's attitude toward the students who write to her?","choices":["She makes fun of their mistakes.","She is kind and encouraging.","She is annoyed by their questions.","She thinks their teachers are wrong."],"answer":1},{"q":"Why does Priya say that even adults make these mistakes?","choices":["To criticize adults","To prove that English is impossible","To explain why the teacher is wrong","To show that the mistakes are normal and not a sign of being less smart"],"answer":3}]},"pron":{"focus":"Homophones et presque-homophones","ipa":"","explain":"Des **homophones**, ce sont des mots qui se prononcent exactement pareil mais s'écrivent différemment : [[their]], [[there]] et [[they're]] ; [[its]] et [[it's]] ; [[whose]] et [[who's]] ; [[to]], [[too]] et [[two]] (et pour beaucoup de gens, [[your]] et [[you're]]). À l'oral, aucun problème… c'est à l'écrit qu'il faut réfléchir ! Par contre, d'autres paires se ressemblent sans être pareilles : [[lose]] (z) et [[loose]] (s), [[advise]] (z) et [[advice]] (s), [[quiet]] (deux syllabes) et [[quite]] (une seule), [[dessert]] (accent à la fin) et [[desert]] (accent au début). Celles-là, ton oreille doit les séparer ! Même chose pour [[accept]] (« ak ») et [[except]] (« ik »), même si beaucoup de gens les disent presque pareil.","words":[{"en":"their","fr":"leur, leurs","hint":"« thèr » : th doux ; se prononce comme [[there]] et [[they're]]"},{"en":"there","fr":"là, là-bas (et there is, il y a)","hint":"« thèr » : identique à [[their]] et [[they're]]"},{"en":"they're","fr":"ils sont, elles sont (they are)","hint":"« thèr » : identique à [[their]] et [[there]]"},{"en":"its","fr":"son, sa, ses (pour une chose ou un animal)","hint":"« its » : identique à [[it's]] ; pas d'apostrophe pour la possession !"},{"en":"it's","fr":"c'est, il est (it is, it has)","hint":"« its » : identique à [[its]]"},{"en":"whose","fr":"à qui ? dont","hint":"« houz » : identique à [[who's]]"},{"en":"who's","fr":"qui est, qui a (who is, who has)","hint":"« houz » : identique à [[whose]]"},{"en":"to","fr":"à, vers (et to + verbe)","hint":"« tou » seul ; dans une phrase, souvent un petit « teu »"},{"en":"too","fr":"aussi, trop","hint":"« TOU » : identique à [[two]], mais toujours fort"},{"en":"two","fr":"deux","hint":"« TOU » : identique à [[too]] ; le w est muet"}],"pairs":[["lose","loose"],["advise","advice"],["quiet","quite"],["dessert","desert"]],"practice":["They're over there with their new puppy.","Whose jacket is this, and who's ready to go?","It's quite quiet in the desert, but there's no dessert."]},"mission":{"type":"ecrit","prompt":"Tu organises une sortie de patin sur le canal Rideau avec ta gang. Écris un message de groupe de cinq à sept phrases, sans fautes, avec au moins six mots-pièges de l'unité ([[their/there/they're]], [[its/it's]], [[your/you're]], [[whose/who's]], [[to/too/two]], [[lose/loose]]…).","model":"Hi everyone! The twins said they're coming to the skating party, and their mom will drive us there. It's on the Rideau Canal, so bring your skates, and please don't lose your mittens again, Félix! Whose turn is it to bring hot chocolate? Who's free at two o'clock? You're going to love it: the canal is famous for its long skating trail. It'll be quite cold, so wear a warm toque, too!","checklist":["J'ai bien choisi entre [[their]], [[there]] et [[they're]]","J'ai écrit [[its]] sans apostrophe pour la possession, et [[it's]] pour [[it is]]","J'ai bien choisi entre [[whose]] et [[who's]], [[your]] et [[you're]]","J'ai utilisé [[lose]] (perdre), pas [[loose]] (lâche, trop grand)","J'ai relu mon message une fois juste pour les homophones"]}}]},{"id":12,"cefr":"C2","title":"Bilingue","titleEn":"Fully Bilingual","intro":"Le dernier sommet : grammaire de haut vol, nuances fines, proverbes et prononciation sans faute. Au bout du chemin, tu seras vraiment bilingue.","boss":{"name":"L'Ultime Bilingue","taunt":"Tu te crois bilingue ? It's high time you proved it. Je connais tous les pièges des deux langues… et je ne prononce jamais le k de knife.","defeat":"Impossible… Tu es vraiment bilingue ! Bon, every cloud has a silver lining : j'ai enfin trouvé un adversaire à ma hauteur."},"units":[{"id":"12.1","title":"Grammaire de haut vol","titleEn":"It's High Time","goal":"Maîtriser les structures avancées : it's time + passé, would rather, had better, as if, should inversé et le subjonctif anglais.","lesson":[{"type":"p","text":"Tu connais déjà [[If I were you]] : un verbe au **passé** qui ne parle pas du passé, mais d'une situation **imaginaire** ou **souhaitée**. Les anglophones adorent ce truc ! Voici les structures qui font sonner ton anglais comme celui d'un pro."},{"type":"rule","title":"It's (high) time + passé","text":"Pour dire « il est (grand) temps que… », on met un **sujet + verbe au passé**, même si on parle de maintenant : [[It's time we left.]] [[It's high time you cleaned your room!]] Jamais ~~It's time we go~~. Sans sujet, on garde l'infinitif : [[It's time to leave.]]"},{"type":"rule","title":"would rather et had better","text":"[[would rather]] (aimer mieux) : avec le **même sujet**, verbe à la base : [[I'd rather stay home.]] [[I would rather walk than take the bus.]] Avec un **autre sujet**, verbe au **passé** : [[I'd rather you didn't tell anyone.]] [[had better]] (ferais mieux de, conseil fort ou avertissement) + base verbale, **sans to** : [[You'd better hurry.]] Ici, le 'd veut dire **had**."},{"type":"table","head":["Structure","Sens","Exemple"],"rows":[["as if / as though + passé","comme si (irréel)","[[She talks as if she knew everything.]]"],["If + sujet + were to + base","si jamais (hypothèse peu probable)","[[If we were to lose, we would be out.]]"],["Should + sujet + base","si jamais (très poli, formel)","[[Should you need help, call me.]]"],["provided that + présent","à condition que","[[You can go, provided that you are home by ten.]]"],["in case + présent","au cas où","[[Take a sweater in case it gets cold.]]"],["insist / suggest / recommend that + base","subjonctif anglais","[[The coach insisted that he be on time.]]"],["It is essential / important that + base","subjonctif anglais","[[It is essential that she arrive early.]]"]]},{"type":"rule","title":"Le subjonctif anglais","text":"Oui, l'anglais a un subjonctif ! Après [[insist that]], [[suggest that]], [[recommend that]], [[It is essential that]]… on met le verbe à la **base** pour tout le monde : pas de -s, et [[be]] pour tous les sujets. [[The doctor recommended that he drink more water.]] [[Mom insisted that everyone be ready by seven.]] On entend aussi [[should]] + base : [[that he should drink]]."},{"type":"examples","items":[{"en":"It's high time we went home.","fr":"Il est grand temps qu'on rentre."},{"en":"I'd rather you didn't use my phone.","fr":"J'aimerais mieux que tu n'utilises pas mon téléphone."},{"en":"You'd better apologize to your sister.","fr":"Tu ferais mieux de t'excuser auprès de ta sœur."},{"en":"Should you have any questions, please ask.","fr":"Si jamais vous avez des questions, n'hésitez pas."},{"en":"Bring a snack in case you get hungry.","fr":"Apporte une collation au cas où tu aurais faim."}]},{"type":"tip","text":"Pièges de francophone : ~~It's time we go~~ → [[It's time we went]]. ~~I'd rather you don't~~ → [[I'd rather you didn't]]. ~~You'd better to go~~ → [[You'd better go]]. ~~in case it will rain~~ → [[in case it rains]] (jamais will après in case, comme après if). Et attention : [[in case]] (au cas où, par précaution) n'est pas [[if]] (si) !"},{"type":"dialogue","title":"Le grand ménage","lines":[{"who":"Mom","en":"Jaden, it's high time you tidied up your room.","fr":"Jaden, il est grand temps que tu ranges ta chambre."},{"who":"Jaden","en":"I'd rather do it tomorrow, if that's okay.","fr":"J'aimerais mieux le faire demain, si ça te va."},{"who":"Mom","en":"I'd rather you did it now. Grandma is coming tonight.","fr":"J'aimerais mieux que tu le fasses maintenant. Grand-maman arrive ce soir."},{"who":"Jaden","en":"You talk as if she were going to inspect my closet!","fr":"Tu parles comme si elle allait inspecter mon placard !"},{"who":"Mom","en":"Knowing her, she might. And you'd better hide those dirty socks.","fr":"La connaissant, c'est possible. Et tu ferais mieux de cacher ces bas sales."},{"who":"Jaden","en":"Fine. But should she ask, tell her it's always this clean.","fr":"D'accord. Mais si jamais elle demande, dis-lui que c'est toujours aussi propre."},{"who":"Mom","en":"Only if you keep it this clean all week!","fr":"Seulement si tu la gardes aussi propre toute la semaine !"}]}],"vocab":[{"en":"it's high time","fr":"il est grand temps (que)","alt":[],"ex":"It's high time we left."},{"en":"would rather","fr":"aimer mieux, préférer (+ base verbale)","alt":[],"ex":"I would rather read than watch TV."},{"en":"had better","fr":"faire mieux de (conseil ou avertissement)","alt":[],"ex":"You had better wear a helmet."},{"en":"as if","fr":"comme si","alt":["as though"],"ex":"He acts as if he were the boss."},{"en":"provided that","fr":"à condition que","alt":["providing that","provided","as long as"],"ex":"You can play outside, provided that you finish your homework."},{"en":"in case","fr":"au cas où","alt":[],"ex":"Take an umbrella in case it rains."},{"en":"insist","fr":"insister","alt":[],"ex":"My mom insisted that I wear a helmet."},{"en":"essential","fr":"essentiel, indispensable","alt":["vital"],"ex":"It is essential that you drink water during the hike."},{"en":"suggest","fr":"suggérer, proposer","alt":[],"ex":"I suggest that we leave early."},{"en":"recommend","fr":"recommander","alt":[],"ex":"The dentist recommended that I floss every day."},{"en":"otherwise","fr":"sinon, autrement","alt":[],"ex":"Hurry up; otherwise we'll miss the bus."},{"en":"supposing","fr":"en supposant que, et si…","alt":["suppose"],"ex":"Supposing it snows, will the game be cancelled?"},{"en":"curfew","fr":"heure de rentrée (couvre-feu)","alt":[],"ex":"My curfew is nine o'clock on school nights."},{"en":"chores","fr":"tâches ménagères","alt":["housework"],"ex":"I do my chores every Saturday morning."},{"en":"tidy up","fr":"ranger","alt":["clean up"],"ex":"Please tidy up your room before dinner."},{"en":"allowance","fr":"argent de poche","alt":["pocket money"],"ex":"I save half of my allowance every week."},{"en":"mandatory","fr":"obligatoire","alt":["compulsory"],"ex":"Wearing a helmet is mandatory at the skate park."},{"en":"on time","fr":"à l'heure","alt":[],"ex":"Please be on time for the bus."}],"sentences":[{"en":"It's high time you cleaned your room, Jaden.","fr":"Il est grand temps que tu nettoies ta chambre, Jaden.","trap":["clean","cleaning"],"alt":["Jaden, it's high time you cleaned your room."]},{"en":"I'd rather you didn't tell anyone about the surprise.","fr":"J'aimerais mieux que tu ne parles de la surprise à personne.","trap":["don't","to"],"alt":[]},{"en":"You'd better leave now, or you'll miss the bus.","fr":"Tu ferais mieux de partir maintenant, sinon tu vas rater l'autobus.","trap":["to","left"],"alt":[]},{"en":"She talks as if she knew everything about hockey.","fr":"Elle parle comme si elle savait tout sur le hockey.","trap":["know","does"],"alt":[]},{"en":"Should you need any help, please call me.","fr":"Si jamais tu as besoin d'aide, appelle-moi.","trap":["needs","will"],"alt":["Please call me should you need any help."]},{"en":"The coach insisted that every player be on time.","fr":"L'entraîneur a exigé que chaque joueur soit à l'heure.","trap":["are","to"],"alt":[]},{"en":"Take your toque in case it gets cold tonight.","fr":"Prends ta tuque au cas où il ferait froid ce soir.","trap":["will","getting"],"alt":["Take your toque tonight in case it gets cold."]},{"en":"You can go to the party provided that you are home by ten.","fr":"Tu peux aller à la fête à condition d'être à la maison avant dix heures.","trap":["will","were"],"alt":["Provided that you are home by ten, you can go to the party."]},{"en":"If we were to lose this game, we would be out of the tournament.","fr":"Si jamais on perdait ce match, on serait éliminés du tournoi.","trap":["will","lost"],"alt":["We would be out of the tournament if we were to lose this game."]},{"en":"It is essential that she arrive before the doors close.","fr":"Il est essentiel qu'elle arrive avant la fermeture des portes.","trap":["arriving","to"],"alt":[]},{"en":"I would rather walk than take the bus today.","fr":"Aujourd'hui, j'aimerais mieux marcher que prendre l'autobus.","trap":["to","taking"],"alt":["Today I would rather walk than take the bus."]}],"grammar":[{"type":"mcq","q":"It's getting late. It's time we ___ home.","choices":["go","going","went","will go"],"answer":2,"explain":"It's time + sujet + verbe au passé : It's time we went."},{"type":"mcq","q":"I'd rather you ___ my diary.","choices":["didn't read","don't read","not read","won't read"],"answer":0,"explain":"would rather + autre sujet → verbe au passé : I'd rather you didn't read."},{"type":"mcq","q":"It's freezing! You'd better ___ your coat.","choices":["to take","taking","took","take"],"answer":3,"explain":"had better + base verbale, sans to : You'd better take."},{"type":"mcq","q":"It is essential that every student ___ a helmet.","choices":["wear","wearing","wore","to wear"],"answer":0,"explain":"Après It is essential that : subjonctif anglais = verbe à la base, sans -s."},{"type":"mcq","q":"___ you need anything, just ask.","choices":["Would","Should","Unless","Had"],"answer":1,"explain":"Should + sujet + base = If you need… (version polie et formelle)."},{"type":"mcq","q":"Take some snacks ___ you get hungry on the trip.","choices":["unless","as if","in case","provided that"],"answer":2,"explain":"in case = au cas où, par précaution."},{"type":"fill","q":"It's high time you ___ to bed.","hint":"go","answer":["went"],"explain":"It's high time + sujet + passé : you went."},{"type":"fill","q":"I'd rather you ___ me the truth.","hint":"tell","answer":["told"],"explain":"would rather + autre sujet → passé : you told."},{"type":"fill","q":"We'd ___ hurry, or we'll miss the start of the movie.","hint":"ferions mieux de","answer":["better"],"explain":"We'd better = We had better : nous ferions mieux de."},{"type":"fill","q":"The doctor recommended that he ___ more water.","hint":"drink (subjonctif)","answer":["drink","should drink"],"explain":"recommend that + base (subjonctif) : that he drink, sans -s."},{"type":"fill","q":"You can borrow my bike, ___ that you bring it back tonight.","hint":"à condition","answer":["provided","providing"],"explain":"provided that = à condition que."},{"type":"fill","q":"If you ___ to move to Vancouver, would you miss Ottawa?","hint":"be (hypothèse : were to)","answer":["were"],"explain":"If + sujet + were to + base = si jamais (hypothèse peu probable)."},{"type":"fill","q":"___ you have any questions, please contact the office.","hint":"if (version formelle inversée)","answer":["Should"],"explain":"Should you have… = If you have… en version formelle."},{"type":"error","q":"It's time we go to bed.","wrong":3,"fix":["went"],"explain":"It's time + sujet + passé : It's time we went to bed."},{"type":"error","q":"I'd rather you don't eat in my room.","wrong":3,"fix":["didn't"],"explain":"would rather + autre sujet → passé : I'd rather you didn't eat."},{"type":"error","q":"You'd better apologizing to your sister.","wrong":2,"fix":["apologize"],"explain":"had better + base verbale : You'd better apologize."},{"type":"error","q":"Should you needed help, call me.","wrong":2,"fix":["need"],"explain":"Should + sujet + verbe à la base : Should you need."},{"type":"error","q":"If I were to won the contest, I would buy a guitar.","wrong":4,"fix":["win"],"explain":"were to + verbe à la base : were to win."}],"reading":{"title":"The Great Family Meeting","text":"Every year, before the family camping trip to Algonquin Park, Olivia's mother calls what she proudly names the Great Family Meeting. This year was no different.\n\n“It's high time we talked about the rules,” she announced, sitting at the kitchen table with a notebook. Olivia's little brother, Félix, groaned as if he had been asked to climb a mountain.\n\nThe first rule was simple. Mom insisted that everyone be ready by seven in the morning on Saturday. “Should anyone oversleep,” she added, “they will carry the heaviest backpack.” Félix suddenly looked very awake.\n\nThe second rule was about screens. “I'd rather you didn't bring your tablets,” Dad said. “We're going camping, not to an arcade.” Olivia wanted to argue, but she knew she had better choose her battles. Instead, she asked if she could bring her camera. Dad agreed, provided that she shared the photos with Grandma.\n\nThen came the food. Félix suggested that they eat only marshmallows for the whole weekend. Everyone laughed except Mom, who wrote down a long list of vegetables. “Bring extra socks too,” she said, “in case it rains. And it always rains.”\n\nFinally, Olivia raised her hand. “I have a rule too. If we were to see a moose, I would be the one who takes the picture.” Félix protested, but the family voted, and Olivia won.\n\nThat night, Olivia lay in bed and smiled. She would never admit it, but she secretly loved the Great Family Meeting. For her, it was the moment when summer really began.","questions":[{"q":"Why did Félix suddenly look very awake?","choices":["He had just drunk a hot chocolate.","He didn't want to carry the heaviest backpack.","He was excited about seeing a moose.","His mother turned on all the lights."],"answer":1},{"q":"Under what condition could Olivia bring her camera?","choices":["If she left her tablet at home","If she carried Félix's backpack","If she shared the photos with her grandmother","If she woke up first"],"answer":2},{"q":"Why does Mom want everyone to bring extra socks?","choices":["In case it rains","Because the tent is cold","Because Félix always loses his","Because they will go swimming"],"answer":0},{"q":"What does Mom's comment “And it always rains” suggest?","choices":["She has never been camping before.","She hopes it will rain this year.","The forecast promises sunshine.","It has rained on many of their past camping trips."],"answer":3},{"q":"What does “she had better choose her battles” mean here?","choices":["She decided not to argue about everything.","She wanted to fight with her brother.","She chose to play a video game instead.","She refused to go camping."],"answer":0},{"q":"How does Olivia really feel about the family meeting?","choices":["She finds it boring and useless.","She is afraid of her parents' rules.","She wants to cancel it next year.","She enjoys it, even if she doesn't say so."],"answer":3}]},"pron":{"focus":"Le rythme de l'anglais soutenu","ipa":"","explain":"Le français est une mitraillette : chaque syllabe a la même force. L'anglais, lui, est un tambour : les **mots pleins** (noms, verbes, adjectifs) frappent fort, et les **mots outils** ([[a]], [[the]], [[to]], [[that]], [[you]], [[were]], [[as]]) se glissent entre les coups, tout petits. Même dans une phrase très soutenue comme [[Should you need help]], on n'articule pas tout pareil : « cheud-yeu-NIID-HÈLP ». Le piège des francophones : croire que « formel » veut dire « chaque mot détaché »… et sonner comme un robot ! Truc : tape le rythme sur la table, un coup par mot plein seulement.","words":[{"en":"it's high time we left","fr":"il est grand temps qu'on parte","hint":"« its-HAÏ-TAÏM-wi-LÈFT » : [[we]] tout petit entre deux coups forts"},{"en":"I'd rather you didn't","fr":"je préférerais que tu ne le fasses pas","hint":"« aïd-RA-theur-yeu-DI-deunt » : [[you]] devient « yeu »"},{"en":"you'd better hurry","fr":"tu ferais mieux de te dépêcher","hint":"« youd-BÈ-deur-HEU-ri » : le d de [[you'd]] est minuscule, mais il est là"},{"en":"as if it were a game","fr":"comme si c'était un jeu","hint":"« eu-ZI-fit-weur-eu-GUÉIM » : tout glisse jusqu'à [[game]]"},{"en":"should you need help","fr":"si jamais tu as besoin d'aide","hint":"« cheud-yeu-NIID-HÈLP » : [[should]] et [[you]] restent légers"},{"en":"were I to win","fr":"si je devais gagner","hint":"« weur-aï-teu-WIN » : seul [[win]] frappe fort"},{"en":"provided that you're on time","fr":"à condition que tu sois à l'heure","hint":"« preu-VAÏ-did-theut-yeur-ân-TAÏM » : [[that]] devient « theut »"},{"en":"in case it rains","fr":"au cas où il pleuvrait","hint":"« in-KÉIS-it-RÉINZ » : deux coups forts, [[in]] et [[it]] avalés"},{"en":"we insist that he be there","fr":"nous exigeons qu'il soit là","hint":"« wi-in-SIST-theut-hi-BII-THÈR » : [[be]] reste fort, c'est le cœur de la demande"},{"en":"as though nothing had happened","fr":"comme si de rien n'était","hint":"« eu-THÔ-NEU-thing-eud-HA-peund » : [[had]] devient un petit « eud »"}],"pairs":[],"practice":["Should you need any help, please do not hesitate to contact us.","It's high time we started, provided that everyone is here.","I'd rather you called me, in case the message gets lost."]},"mission":{"type":"ecrit","prompt":"Tu es président ou présidente du club de robotique de ton école. Écris l'annonce officielle de cinq à huit phrases pour préparer la grande compétition, avec au moins cinq structures de l'unité ([[it's high time]], [[had better]], [[should you need]], [[provided that]], [[in case]], [[insist that]]…).","model":"Dear members, it's high time we got ready for the regional robotics competition. Our coach insists that every member be present on Thursday at four o'clock. Should you need a ride, please contact me before Wednesday. You had better bring your laptop, in case the school computers are all busy. Provided that everyone does their part, we have a real chance of winning. Personally, I would rather we started early than finished in a panic. Thank you, and see you on Thursday! Priya, club president","checklist":["Après [[it's high time]] et [[I would rather]] + autre personne, j'ai mis le passé ([[we got]], [[we started]])","Après [[insist that]], j'ai mis le verbe de base, même avec he/she : [[that every member be]]","J'ai écrit [[Should you need]] sans [[if]], avec l'inversion","J'ai écrit [[had better]] + verbe de base, sans [[to]]","En relisant à voix haute, j'ai gardé les petits mots légers"]}},{"id":"12.2","title":"Nuances et connotations","titleEn":"Shades of Meaning","goal":"Choisir le mot juste selon sa connotation : positive, neutre ou négative.","lesson":[{"type":"p","text":"Deux mots peuvent avoir le même sens de base, mais pas la même « couleur ». Dire de quelqu'un qu'il est [[slim]], c'est un compliment. [[thin]], c'est neutre. [[skinny]], c'est souvent négatif (trop maigre). C'est ce qu'on appelle la **connotation**. Un mot mal choisi, et ton compliment devient une insulte !"},{"type":"table","head":["Positif","Neutre","Négatif"],"rows":[["[[slim]] (mince)","[[thin]]","[[skinny]] (maigre)"],["[[determined]] (déterminé)","—","[[stubborn]] (têtu)"],["[[inexpensive]] (abordable)","—","[[cheap]] (bon marché, de mauvaise qualité)"],["[[curious]] (curieux)","—","[[nosy]] (fouineux)"],["[[confident]] (sûr de soi)","—","[[arrogant]] (arrogant)"],["[[thrifty]] (économe)","—","[[stingy]] (radin)"],["[[scent]] (parfum)","[[smell]]","[[stink]] (puanteur)"],["[[famous]] (célèbre)","[[well-known]]","[[notorious]] (tristement célèbre)"],["[[childlike]] (émerveillé comme un enfant)","—","[[childish]] (puéril, bébé)"]]},{"type":"rule","title":"Des verbes pleins de nuances","text":"**Regarder** : [[glance]] (jeter un coup d'œil rapide), [[peek]] (regarder en cachette), [[stare]] (fixer longtemps), [[glare]] (fusiller du regard, en colère). **Parler** : [[whisper]] (chuchoter), [[mutter]] (marmonner, souvent mécontent), [[yell]] (crier). **Rire** : [[giggle]] (petit rire aigu, nerveux), [[chuckle]] (petit rire discret, dans sa barbe). **Marcher** : [[stroll]] (flâner), [[stride]] (marcher à grands pas, sûr de soi), [[stumble]] (trébucher)."},{"type":"rule","title":"Comment choisir ?","text":"Demande-toi : est-ce que je veux **complimenter**, **décrire** ou **critiquer** ? Pour une grand-mère qui économise intelligemment : [[thrifty]]. Pour quelqu'un qui refuse de partager une seule chip : [[stingy]]. Le contexte décide toujours !"},{"type":"examples","items":[{"en":"You look so slim in that jacket!","fr":"Tu as l'air tellement mince dans ce manteau !"},{"en":"Stop being so nosy; it's my diary!","fr":"Arrête de fouiner comme ça, c'est mon journal intime !"},{"en":"The teacher glared at us when we laughed.","fr":"Le prof nous a fusillés du regard quand on a ri."},{"en":"My grandpa looks at the stars with childlike wonder.","fr":"Mon grand-père regarde les étoiles avec un émerveillement d'enfant."},{"en":"We strolled along the river after supper.","fr":"On a flâné le long de la rivière après le souper."}]},{"type":"tip","text":"Pièges de francophone : [[notorious]] ne veut **pas** dire « notoire » au sens neutre : c'est **célèbre pour quelque chose de mal** ! Et [[cheap]] peut vouloir dire « pas cher »… mais aussi « de mauvaise qualité » ou « radin ». Pour un compliment, dis plutôt [[inexpensive]] ou [[affordable]]."},{"type":"dialogue","title":"La nouvelle boulangerie","lines":[{"who":"Maya","en":"Have you tried the new bakery on Elgin Street? It's so inexpensive!","fr":"As-tu essayé la nouvelle boulangerie de la rue Elgin ? Elle est tellement abordable !"},{"who":"Amir","en":"Inexpensive? I'd say cheap. My croissant was dry.","fr":"Abordable ? Moi, je dirais bon marché. Mon croissant était sec."},{"who":"Maya","en":"Don't be so negative. The owner is really determined; she's there every morning at five.","fr":"Ne sois pas si négatif. La propriétaire est vraiment déterminée : elle est là tous les matins à cinq heures."},{"who":"Amir","en":"Determined? She glared at me when I asked for a refund.","fr":"Déterminée ? Elle m'a fusillé du regard quand j'ai demandé un remboursement."},{"who":"Maya","en":"Maybe you stared at her kitchen too long. You can be a bit nosy, you know.","fr":"Peut-être que tu as fixé sa cuisine trop longtemps. Tu peux être un peu fouineux, tu sais."},{"who":"Amir","en":"I'm not nosy, I'm curious! There's a difference.","fr":"Je ne suis pas fouineux, je suis curieux ! Il y a une différence."},{"who":"Maya","en":"Sure. And I'm not stubborn, I'm determined.","fr":"Bien sûr. Et moi, je ne suis pas têtue, je suis déterminée."}]}],"vocab":[{"en":"slim","fr":"mince (compliment)","alt":["slender"],"ex":"She looks slim and healthy."},{"en":"skinny","fr":"maigre (souvent négatif)","alt":[],"ex":"That stray cat is so skinny."},{"en":"determined","fr":"déterminé (positif)","alt":[],"ex":"Liam is determined to make the team."},{"en":"stubborn","fr":"têtu","alt":[],"ex":"My little brother is as stubborn as a mule."},{"en":"inexpensive","fr":"pas cher, abordable (positif)","alt":["affordable"],"ex":"This is an inexpensive but delicious restaurant."},{"en":"cheap","fr":"bon marché… ou de mauvaise qualité","alt":[],"ex":"These cheap sunglasses broke after one day."},{"en":"nosy","fr":"fouineux, trop curieux","alt":["nosey"],"ex":"Our nosy neighbour always watches us from her window."},{"en":"thrifty","fr":"économe (positif)","alt":[],"ex":"My thrifty grandma never wastes food."},{"en":"stingy","fr":"radin","alt":["cheap"],"ex":"Don't be stingy; share your chips!"},{"en":"scent","fr":"parfum, odeur agréable","alt":["fragrance"],"ex":"I love the scent of fresh bread."},{"en":"stink","fr":"puanteur, puer","alt":["stench"],"ex":"What is that stink in the garage?"},{"en":"notorious","fr":"tristement célèbre","alt":["infamous"],"ex":"This corner is notorious for accidents."},{"en":"childish","fr":"puéril, bébé (négatif)","alt":["immature"],"ex":"Stop being so childish!"},{"en":"childlike","fr":"plein d'émerveillement, comme un enfant (positif)","alt":[],"ex":"The old artist had a childlike joy in his eyes."},{"en":"giggle","fr":"rire nerveusement (petit rire aigu)","alt":[],"ex":"The kids giggled when the puppy licked their faces."},{"en":"glance","fr":"jeter un coup d'œil","alt":[],"ex":"She glanced at the clock."},{"en":"stare","fr":"fixer (du regard), longtemps","alt":[],"ex":"It's rude to stare at people."},{"en":"glare","fr":"lancer un regard furieux","alt":[],"ex":"The goalie glared at the referee."},{"en":"mutter","fr":"marmonner","alt":["mumble"],"ex":"He muttered something and left."},{"en":"stroll","fr":"flâner, se balader","alt":[],"ex":"We strolled through the market on Sunday."}],"sentences":[{"en":"My grandpa is thrifty, but he is never stingy with his time.","fr":"Mon grand-père est économe, mais il n'est jamais avare de son temps.","trap":["thrift","stinky"],"alt":[]},{"en":"She glanced at her phone and then stared out the window.","fr":"Elle a jeté un coup d'œil à son téléphone, puis a fixé la fenêtre.","trap":["glance","stares"],"alt":[]},{"en":"The teacher glared at the students who were giggling in the back.","fr":"Le prof a fusillé du regard les élèves qui ricanaient au fond.","trap":["glaring","giggle"],"alt":[]},{"en":"Don't be so nosy; it's none of your business.","fr":"Ne sois pas si fouineux : ce ne sont pas tes affaires.","trap":["its","nose"],"alt":[]},{"en":"We strolled along the Rideau Canal on a warm summer evening.","fr":"Nous avons flâné le long du canal Rideau par une chaude soirée d'été.","trap":["strolling","walk"],"alt":["On a warm summer evening we strolled along the Rideau Canal."]},{"en":"This candle has a lovely scent of maple and cinnamon.","fr":"Cette bougie a un joli parfum d'érable et de cannelle.","trap":["stink","scented"],"alt":["This candle has a lovely scent of cinnamon and maple."]},{"en":"The town was notorious for its terrible traffic jams.","fr":"La ville était tristement célèbre pour ses terribles embouteillages.","trap":["notoriously","it's"],"alt":[]},{"en":"My little brother is so childish when he loses a game.","fr":"Mon petit frère est tellement bébé quand il perd une partie.","trap":["childishly","lose"],"alt":["When he loses a game, my little brother is so childish."]},{"en":"It's an inexpensive phone, but it doesn't look cheap at all.","fr":"C'est un téléphone abordable, mais il n'a pas du tout l'air bas de gamme.","trap":["looks","cheaply"],"alt":[]},{"en":"Being determined is great, but being stubborn can be a problem.","fr":"Être déterminé, c'est super, mais être têtu peut être un problème.","trap":["determinate","stubbornly"],"alt":[]},{"en":"Mei muttered something under her breath and left the room.","fr":"Mei a marmonné quelque chose entre ses dents et a quitté la pièce.","trap":["mutters","leaved"],"alt":[]}],"grammar":[{"type":"mcq","q":"Tu veux faire un compliment à ta tante sur sa nouvelle silhouette : « You look so ___! »","choices":["skinny","stingy","slim","notorious"],"answer":2,"explain":"slim = mince, c'est un compliment. skinny (maigre) est souvent négatif."},{"type":"mcq","q":"Your friend never gives up and trains every single day. You admire her. She is ___.","choices":["determined","stubborn","nosy","childish"],"answer":0,"explain":"Tu l'admires : il faut le mot positif, determined. stubborn (têtu) est négatif."},{"type":"mcq","q":"The neighbour always reads other people's mail. Which word best describes him?","choices":["curious","thrifty","determined","nosy"],"answer":3,"explain":"Lire le courrier des autres, c'est fouiner : nosy (négatif). curious est neutre ou positif."},{"type":"mcq","q":"Ana wouldn't even share one chip with her best friend. She's so ___!","choices":["thrifty","stingy","inexpensive","slim"],"answer":1,"explain":"Refuser de partager, c'est être radin : stingy. thrifty (économe) est un compliment."},{"type":"mcq","q":"Everyone on our street complains about Rex, the dog who digs up gardens. He is ___ in the neighbourhood.","choices":["famous","childlike","notorious","determined"],"answer":2,"explain":"Tout le monde se plaint : il est célèbre pour quelque chose de mal → notorious."},{"type":"mcq","q":"Jaden ___ at the answers when the teacher wasn't looking.","choices":["peeked","glared","strolled","giggled"],"answer":0,"explain":"peek = regarder en cachette. Parfait quand le prof ne regarde pas !"},{"type":"fill","q":"The teacher ___ at us when we talked during the test.","hint":"lancer un regard furieux (passé)","answer":["glared"],"explain":"glare = fusiller du regard, en colère. Au passé : glared."},{"type":"fill","q":"This soap has a lovely ___ of lavender.","hint":"parfum, odeur agréable","answer":["scent","fragrance"],"explain":"Une odeur agréable : scent. (stink, c'est une odeur horrible !)"},{"type":"fill","q":"We ___ through the market, looking at everything.","hint":"flâner (passé)","answer":["strolled","wandered"],"explain":"stroll = flâner, marcher sans se presser. Au passé : strolled."},{"type":"fill","q":"Stop being so ___; it's just a board game!","hint":"puéril (négatif)","answer":["childish","immature"],"explain":"childish = puéril, négatif. childlike (émerveillé) est positif."},{"type":"fill","q":"He ___ at his watch and ran to the bus.","hint":"jeter un coup d'œil (passé)","answer":["glanced"],"explain":"glance = regarder très vite. Au passé : glanced."},{"type":"fill","q":"This bike is ___ but solid: a great deal!","hint":"pas cher (positif)","answer":["inexpensive","affordable"],"explain":"C'est un compliment : inexpensive (ou affordable). cheap ferait penser à de la mauvaise qualité."},{"type":"error","q":"My grandma saves money and never wastes anything; she is so stingy and smart.","wrong":11,"fix":["thrifty"],"explain":"C'est un compliment (smart) : il faut le mot positif thrifty (économe). stingy veut dire radin."},{"type":"error","q":"My grandpa looked at the first snow with childish wonder.","wrong":8,"fix":["childlike"],"explain":"L'émerveillement d'enfant, c'est positif : childlike. childish veut dire puéril."},{"type":"error","q":"This garbage bin has a horrible scent.","wrong":6,"fix":["stink","smell","stench","odour","odor"],"explain":"scent est une odeur agréable. Pour une poubelle : stink (ou smell)."},{"type":"error","q":"He glanced at me for ten whole minutes without saying a word.","wrong":1,"fix":["stared"],"explain":"glance = un coup d'œil rapide. Pendant dix minutes, on fixe : stared."}
