 ([[pick it up]], [[turn it off]]…).","model":"Hi Malik, thanks for looking after Pixel while I'm away! The mail arrives every day: please pick it up and put it on the kitchen table. Pixel's food is in the cupboard; if it runs out, there's another bag in the garage. You can turn on the lamp in the living room, but please turn it off before you leave. Don't give up if Pixel hides: he always comes back for his treats. I'll come back on Sunday afternoon!","checklist":["J'ai utilisé au moins quatre phrasal verbs ([[look after]], [[pick up]], [[run out]], [[turn off]]…)","Avec un pronom, je l'ai mis au milieu : [[turn it off]], jamais [[turn off it]]","Avec [[look after]], le complément va après : [[look after him]]","J'ai donné des consignes claires et polies ([[please]], [[don't]]…)"]}}]},{"id":9,"cefr":"B2","title":"Argumenter","titleEn":"Make Your Case","intro":"Raconte des enquêtes au passé, rapporte ce que les autres ont dit, défends tes idées avec les bons connecteurs et parle comme un vrai anglophone avec make, do et compagnie.","boss":{"name":"Le Reporter","taunt":"Une seule question : sauras-tu rapporter mes paroles sans la moindre erreur ? J'en doute… et je vais l'écrire en première page !","defeat":"Arrêtez les presses ! Gros titre de demain : « Le Reporter battu à plate couture »."},"units":[{"id":"9.1","title":"Le passé du passé","titleEn":"The Plot Thickens","goal":"Raconter une histoire au passé en montrant ce qui était arrivé avant, avec le past perfect.","lesson":[{"type":"p","text":"Dans une histoire au passé, tu dois parfois remonter **encore plus loin** : ce qui s'était passé AVANT. Pour ça, l'anglais utilise le **past perfect**, l'équivalent de notre plus-que-parfait (« j'avais mangé », « elle était partie »)."},{"type":"rule","title":"Le past perfect","text":"[[had]] + participe passé, **pareil pour toutes les personnes** : [[I had finished]], [[she had left]], [[they had gone]]. Négation : [[hadn't]]. Question : [[Had you seen him before?]] Contraction : [[I'd]], [[she'd]]… mais attention, [['d]] peut aussi vouloir dire [[would]] ! Révise les participes : [[steal]] → [[stole]] → [[stolen]], [[hide]] → [[hid]] → [[hidden]], [[run]] → [[ran]] → [[run]]."},{"type":"table","head":["Phrase","Ce qui s'est passé"],"rows":[["[[When I arrived, the bus left.]]","J'arrive, **puis** le bus part : je le vois partir."],["[[When I arrived, the bus had left.]]","Le bus part **d'abord** : quand j'arrive, il n'est plus là."],["[[By the time we got there, the cake had disappeared.]]","Le gâteau disparaît **avant** notre arrivée."],["[[It was the first time I had seen a moose.]]","Après [[It was the first time]], on met le past perfect."]]},{"type":"rule","title":"Le past perfect continuous","text":"[[had been]] + verbe en **-ing** : une action qui **durait** jusqu'à un moment du passé. [[She had been waiting for an hour when the bus finally came.]] = Elle attendait **depuis** une heure quand l'autobus est enfin arrivé. Avec les verbes d'état ([[know]], [[like]], [[want]]…), pas de -ing : [[We had known each other for years.]]"},{"type":"examples","items":[{"en":"By the time the police arrived, the thief had already left.","fr":"Le temps que la police arrive, le voleur était déjà parti."},{"en":"I realized that I had left my keys at school.","fr":"Je me suis rendu compte que j'avais oublié mes clés à l'école."},{"en":"Had you ever seen the suspect before that night?","fr":"Avais-tu déjà vu le suspect avant cette nuit-là ?"},{"en":"They had been investigating the case for months.","fr":"Ils enquêtaient sur l'affaire depuis des mois."},{"en":"The ground was wet because it had been raining all night.","fr":"Le sol était mouillé parce qu'il avait plu toute la nuit."}]},{"type":"tip","text":"Piège de francophone : « Il attendait **depuis** deux heures » ne se dit **jamais** [[He was waiting since two hours]]. On dit [[He had been waiting for two hours]]. Durée → [[for]] ; point de départ → [[since]] ([[since noon]])."},{"type":"tip","text":"Ne mets pas le past perfect partout ! Si tu racontes les actions **dans l'ordre**, le past simple suffit : [[I opened the door and saw a footprint.]] Le past perfect sert à **revenir en arrière**."},{"type":"dialogue","title":"L'affaire du gâteau disparu","lines":[{"who":"Priya","en":"Ethan, you were the first person in the gym this morning, right?","fr":"Ethan, tu étais la première personne dans le gymnase ce matin, c'est ça ?"},{"who":"Ethan","en":"Yes, but when I got there, someone had already taken the cake.","fr":"Oui, mais quand je suis arrivé, quelqu'un avait déjà pris le gâteau."},{"who":"Priya","en":"Had you noticed anything strange before that?","fr":"Avais-tu remarqué quelque chose de bizarre avant ça ?"},{"who":"Ethan","en":"Well, the back door had been unlocked all night.","fr":"Eh bien, la porte arrière était restée déverrouillée toute la nuit."},{"who":"Priya","en":"Interesting. Did you find any other clues?","fr":"Intéressant. As-tu trouvé d'autres indices ?"},{"who":"Ethan","en":"Small footprints with chocolate on them. Someone had been eating the cake on the stairs!","fr":"Des petites empreintes de pas pleines de chocolat. Quelqu'un avait mangé le gâteau dans l'escalier !"},{"who":"Priya","en":"Chocolate footprints? That's our best clue. Let's follow them!","fr":"Des empreintes au chocolat ? C'est notre meilleur indice. Suivons-les !"}]},{"type":"fun","text":"Le sais-tu ? Sherlock Holmes, le détective le plus célèbre du monde, a été inventé par l'écrivain écossais Arthur Conan Doyle à la fin du dix-neuvième siècle."}],"vocab":[{"en":"witness","fr":"témoin","alt":[],"ex":"The only witness was a little boy with a dog."},{"en":"clue","fr":"indice","alt":[],"ex":"The detective found an important clue under the sofa."},{"en":"suspect","fr":"suspect, suspecte (personne soupçonnée)","alt":[],"ex":"The police questioned the main suspect."},{"en":"evidence","fr":"preuves (dans une enquête)","alt":["proof"],"ex":"They didn't have any evidence against him."},{"en":"case","fr":"affaire (enquête)","alt":[],"ex":"The detective solved the case in two days."},{"en":"footprint","fr":"empreinte de pas","alt":[],"ex":"There was a footprint in the snow near the window."},{"en":"fingerprint","fr":"empreinte digitale","alt":[],"ex":"They found the thief's fingerprints on the glass."},{"en":"footsteps","fr":"bruits de pas","alt":[],"ex":"I heard footsteps in the hallway."},{"en":"thief","fr":"voleur, voleuse","alt":[],"ex":"The thief had escaped through the window."},{"en":"steal","fr":"voler (dérober quelque chose)","alt":[],"ex":"Someone had stolen my bike."},{"en":"hide","fr":"cacher","alt":[],"ex":"Where had she hidden the key?"},{"en":"solve","fr":"résoudre (un mystère, un problème)","alt":[],"ex":"She solved the mystery in one afternoon."},{"en":"investigate","fr":"enquêter","alt":[],"ex":"Two detectives are investigating the theft."},{"en":"guilty","fr":"coupable","alt":[],"ex":"Everyone thought he was guilty, but he wasn't."},{"en":"notice","fr":"remarquer","alt":[],"ex":"Did you notice anything strange?"},{"en":"realize","fr":"se rendre compte","alt":[],"ex":"I realized that I had forgotten my lunch."},{"en":"missing","fr":"disparu, manquant","alt":[],"ex":"My grandma's ring was missing."},{"en":"unlocked","fr":"déverrouillé (pas barré à clé)","alt":[],"ex":"The back door had been unlocked all night."},{"en":"torn","fr":"déchiré","alt":["ripped"],"ex":"The old map was torn in half."},{"en":"by the time","fr":"le temps que, au moment où (déjà)","alt":[],"ex":"By the time we arrived, the cake had disappeared."}],"sentences":[{"en":"I realized that I had left my backpack on the bus.","fr":"Je me suis rendu compte que j'avais oublié mon sac à dos dans l'autobus.","trap":["has","leaved"],"alt":[]},{"en":"By the time we got to the party, the cake had disappeared.","fr":"Le temps qu'on arrive à la fête, le gâteau avait disparu.","trap":["has","was"],"alt":["The cake had disappeared by the time we got to the party."]},{"en":"Had you ever seen the suspect before that night?","fr":"Avais-tu déjà vu le suspect avant cette nuit-là ?","trap":["Have","Did"],"alt":[]},{"en":"She had been waiting for an hour when the bus finally came.","fr":"Elle attendait depuis une heure quand l'autobus est enfin arrivé.","trap":["since","was"],"alt":[]},{"en":"The witness hadn't noticed anything strange that evening.","fr":"Le témoin n'avait rien remarqué de bizarre ce soir-là.","trap":["didn't","haven't"],"alt":[]},{"en":"When I came out of the library, someone had stolen my bike.","fr":"Quand je suis sorti de la bibliothèque, quelqu'un avait volé mon vélo.","trap":["has","stealed"],"alt":[]},{"en":"The detective found a footprint that the thief had left near the window.","fr":"La détective a trouvé une empreinte de pas que le voleur avait laissée près de la fenêtre.","trap":["has","leaved"],"alt":[]},{"en":"Nobody knew who had taken the last piece of cake.","fr":"Personne ne savait qui avait pris le dernier morceau de gâteau.","trap":["has","taked"],"alt":[]},{"en":"They had been investigating the case for months before they found a clue.","fr":"Ils enquêtaient sur l'affaire depuis des mois avant de trouver un indice.","trap":["since","were"],"alt":[]},{"en":"After the guests had gone home, Mom noticed that her ring was missing.","fr":"Après le départ des invités, maman a remarqué que sa bague avait disparu.","trap":["have","is"],"alt":["Mom noticed that her ring was missing after the guests had gone home."]},{"en":"I hadn't finished my homework, so I couldn't go skating.","fr":"Je n'avais pas fini mes devoirs, alors je ne pouvais pas aller patiner.","trap":["didn't","haven't"],"alt":[]},{"en":"Why had the back door been unlocked all night?","fr":"Pourquoi la porte arrière était-elle restée déverrouillée toute la nuit ?","trap":["has","did"],"alt":[]}],"grammar":[{"type":"mcq","q":"When we got to the theatre, the movie ___, so we missed the beginning.","choices":["had already started","has already started","already starts","was already start"],"answer":0,"explain":"Le film a commencé AVANT notre arrivée : past perfect, had + participe passé."},{"type":"mcq","q":"She ___ for two hours when her mom finally called.","choices":["was waiting","waited since","had been waiting","has been waiting"],"answer":2,"explain":"« Elle attendait depuis deux heures » à un moment du passé : had been + -ing, avec for."},{"type":"mcq","q":"By the time I woke up, my brother ___ all the pancakes.","choices":["ate","has eaten","eats","had eaten"],"answer":3,"explain":"By the time + passé → l'autre action était déjà finie : had eaten."},{"type":"mcq","q":"Quelle phrase veut dire que le bus était déjà parti quand je suis arrivé ?","choices":["When I arrived, the bus left.","When I arrived, the bus had left.","When I arrived, the bus was leaving.","When I arrived, the bus leaves."],"answer":1,"explain":"Had left = le bus est parti avant mon arrivée. Left tout seul = il part juste après."},{"type":"mcq","q":"___ you ever met her before the party?","choices":["Had","Have","Did","Were"],"answer":0,"explain":"« Avant la fête » est un moment passé : on remonte plus loin avec had + participe (met)."},{"type":"mcq","q":"Quel est le participe passé de steal ?","choices":["stealed","stole","stolen","stealen"],"answer":2,"explain":"steal → stole → stolen : Someone had stolen my bike."},{"type":"fill","q":"By the time we reached the station, the train ___.","hint":"leave","answer":["had left","had already left"],"explain":"Le train est parti avant notre arrivée : had left."},{"type":"fill","q":"Liam was exhausted because he ___ all afternoon.","hint":"run, forme continue","answer":["had been running"],"explain":"Une action qui a duré avant un moment du passé : had been + -ing."},{"type":"fill","q":"It was the first time I ___ a real moose.","hint":"see","answer":["had seen","had ever seen"],"explain":"Après It was the first time, on utilise le past perfect : had seen."},{"type":"fill","q":"___ she already gone home when you called?","hint":"have","answer":["Had"],"explain":"Question au past perfect : Had + sujet + participe passé."},{"type":"fill","q":"By the time she was ten, Maya ___ in four different cities.","hint":"live","answer":["had lived"],"explain":"Avant ses dix ans, c'était déjà fait : had lived."},{"type":"fill","q":"When I opened the fridge, I realized that someone ___ my sandwich.","hint":"eat","answer":["had eaten","had already eaten"],"explain":"Quelqu'un l'a mangé AVANT que j'ouvre le frigo : had eaten."},{"type":"fill","q":"The ground was wet because it ___ all night.","hint":"rain, forme continue","answer":["had been raining"],"explain":"La pluie a duré toute la nuit avant ce moment : had been raining."},{"type":"error","q":"When I got home, my sister has already eaten dinner.","wrong":6,"fix":["had"],"explain":"L'histoire est au passé (got) : on remonte avec had, pas has."},{"type":"error","q":"They had been waiting since two hours when the door finally opened.","wrong":4,"fix":["for"],"explain":"Une durée (two hours) → for. Since s'emploie avec un point de départ."},{"type":"error","q":"I had never saw such a strange footprint before.","wrong":3,"fix":["seen"],"explain":"Après had, il faut le participe passé : seen, pas saw."},{"type":"error","q":"By the time the police arrived, the thief had already ran away.","wrong":10,"fix":["run"],"explain":"run → ran → run : après had, c'est le participe run."},{"type":"error","q":"Had you finish your homework before the movie started?","wrong":2,"fix":["finished"],"explain":"Had + participe passé : finished."}],"reading":{"title":"The Case of the Missing Medal","text":"On the morning of the big swim meet, Malik opened his locker and froze. His gold medal was missing. He had brought it to the pool the day before to show his teammates, and he was sure that he had locked the door before he left.\n\nMalik decided to investigate. He looked for clues and soon noticed a small wet footprint near the lockers. It was much too small to be his. Then he spoke to the only witness, the caretaker, Gilles. Gilles had been cleaning the hallway all evening, and he hadn't seen any suspects. However, he remembered hearing quick footsteps and a little laugh just before closing time.\n\nMalik thought about it. Who had small feet, had been at the pool that evening, and loved to laugh? Suddenly, he realized what had happened. His little sister, Zoé, had come with their dad to pick him up after practice. While Malik was in the shower, she had found the locker key in his jacket.\n\nMalik called home right away. His dad answered and started to laugh. Zoé had been wearing the medal since breakfast and pretending to be an Olympic champion. She wasn't really guilty of anything bad. She had only wanted to feel like her big brother for a day.\n\nThat afternoon, Malik swam faster than ever and won a second medal. When he got home, he gave it to Zoé. The case was solved, and everybody was happy.","questions":[{"q":"Why did Malik think that the footprint wasn't his?","choices":["It was wet.","It was too small.","It was near the door.","It was full of chocolate."],"answer":1},{"q":"What had Gilles been doing all evening?","choices":["Swimming in the pool","Looking for the medal","Cleaning the hallway","Talking to Malik's dad"],"answer":2},{"q":"How had Zoé opened the locker?","choices":["She had broken the door.","She had asked Gilles for help.","The locker had been unlocked all night.","She had used the key from Malik's jacket."],"answer":3},{"q":"Why did Malik suspect his sister?","choices":["Gilles had seen her take the medal.","The clues matched her: small feet, a laugh, and being at the pool.","She had told him about her plan.","She had won a medal the year before."],"answer":1},{"q":"What kind of person is Zoé, probably?","choices":["A dangerous thief","A swimmer on Malik's team","A playful little sister who admires her brother","A shy girl who never laughs"],"answer":2},{"q":"How did the story end?","choices":["Malik won another medal and gave it to his sister.","Malik was angry at Zoé.","Zoé gave the medal to Gilles.","The family called the police."],"answer":0}]},"pron":{"focus":"Le petit 'd qui veut dire had","ipa":"/əd/ – /d/","explain":"Au plus-que-parfait, [[had]] se fait minuscule : après un pronom, il devient un simple « d » collé ([[I'd left]], [[she'd gone]]), et après un nom, un petit « eud » rapide ([[the thief had escaped]]). Mais attention : [[I'd]] peut aussi vouloir dire [[I would]] ! Le truc de détective : regarde le verbe qui suit ; un participe passé ([[left]], [[gone]], [[been]]), c'est **had**, un verbe de base ([[leave]], [[go]]), c'est **would**. Le piège des francophones : avaler ce petit « d »… et ton histoire passe au simple passé sans que personne le remarque !","words":[{"en":"I'd left","fr":"j'étais parti, j'étais partie","hint":"« aïd-LÈFT » : le d est minuscule, mais il dit « avant ça »"},{"en":"I'd leave","fr":"je partirais","hint":"« aïd-LIIV » : même « aïd », mais verbe de base, donc c'est would"},{"en":"she'd already gone","fr":"elle était déjà partie","hint":"« chid-âl-RÈ-di-GÂN » : « chid » très court, deux coups forts ensuite"},{"en":"they'd been waiting","fr":"ils attendaient depuis un moment","hint":"« théid-bin-OUÉI-ting » : th doux de mother ; [[been]] se dit « bin », tout petit"},{"en":"the thief had escaped","fr":"le voleur s'était échappé","hint":"« theu-THIIF-eud-is-KÉIPT » : après un nom, had devient un « eud » rapide"},{"en":"had had","fr":"avait eu (plus-que-parfait de have)","hint":"« heud-HAD » : le premier tout faible, le deuxième bien fort"},{"en":"hadn't","fr":"n'avait pas, n'avaient pas","hint":"« HA-deunt » : la négation reste forte, et le h s'entend"},{"en":"by the time we arrived","fr":"au moment où nous sommes arrivés","hint":"« baï-theu-TAÏM-wi-eu-RAÏVD » : accent sur « taïm » et « raïvd »"},{"en":"the witness had seen him","fr":"le témoin l'avait vu","hint":"« theu-OUIT-neus-eud-SIIN-im » : « eud » tout petit ; le h de him disparaît"}],"pairs":[],"practice":["By the time we arrived, the thief had already escaped.","She'd been waiting for an hour when the police finally came.","I'd had a long day, so I'd left the party early."]},"mission":{"type":"ecrit","prompt":"Écris le début d'une histoire mystère : le gâteau d'anniversaire a disparu ! En six à huit phrases, raconte ce que tu as découvert, avec des indices, un témoin et un suspect. Utilise le plus-que-parfait pour ce qui s'était passé **avant**.","model":"By the time I got home on Friday, something strange had happened. The chocolate cake that my dad had baked for my sister's birthday had disappeared! Only a few crumbs were left on the plate. My little brother said he had been playing outside all afternoon, but his hands were sticky. The only witness was our neighbour, who had seen someone near the kitchen window. Then I found the best clue: chocolate paw prints that led straight to the dog's bed. Our dog Biscuit had been sleeping there the whole time, or so we thought. Mystery solved!","checklist":["J'ai utilisé [[had]] + participe passé pour ce qui s'était passé avant ([[had disappeared]])","J'ai utilisé au moins une fois [[had been]] + verbe en -ing ([[had been playing]])","J'ai écrit [[by the time]], [[already]] ou [[before]] pour ordonner les événements","J'ai placé au moins un mot de détective : [[clue]], [[witness]], [[suspect]]","Mon histoire a un début, un indice et une fin"]}},{"id":"9.2","title":"Il a dit que…","titleEn":"He Said, She Said","goal":"Rapporter ce que quelqu'un a dit, demandé ou ordonné, avec les bons temps et les bons verbes.","lesson":[{"type":"p","text":"Pour rapporter les paroles de quelqu'un, on utilise le **discours indirect** (reported speech). Quand le verbe d'introduction est au passé ([[said]], [[told]], [[asked]]), on fait souvent **reculer les temps d'un cran** : c'est le **backshift**."},{"type":"table","head":["Paroles exactes","Discours rapporté"],"rows":[["[[I am tired.]]","[[She said she was tired.]]"],["[[I'm playing.]]","[[He said he was playing.]]"],["[[I lost my phone.]]","[[She said she had lost her phone.]]"],["[[I have finished.]]","[[He said he had finished.]]"],["[[I will help you.]]","[[She said she would help me.]]"],["[[I can swim.]]","[[He said he could swim.]]"],["[[I must go.]]","[[She said she had to go.]]"]]},{"type":"rule","title":"Say ou tell ?","text":"[[say]] + ce qui est dit : [[She said that she was hungry.]] [[tell]] + **la personne** : [[She told me that she was hungry.]] On ne dit **jamais** [[He said me]] ! ([[He said to me]] est possible, mais plus rare.) Le [[that]] est facultatif : [[She told me she was hungry.]]"},{"type":"rule","title":"Les questions rapportées","text":"Dans une question rapportée, **plus d'inversion**, plus de [[do]]/[[did]], plus de point d'interrogation : sujet + verbe. [[Where do you live?]] → [[She asked me where I lived.]] Question oui/non → [[if]] ou [[whether]] : [[Are you ready?]] → [[He asked if I was ready.]]"},{"type":"rule","title":"Ordres, demandes et verbes rapporteurs","text":"Ordre : [[told me to]] + verbe ; interdiction : [[told me not to]] + verbe ; demande : [[asked me to]]. Autres verbes : [[admit]] et [[deny]] + -ing ([[He denied breaking the vase.]]) ; [[warn someone not to]] ; [[remind someone to]] ; [[refuse to]] ; [[insist on]] + -ing ; [[apologize for]] + -ing ; [[complain that]] ; [[suggest]] + -ing ([[She suggested going to the park.]]) — jamais [[suggest me to]] !"},{"type":"table","head":["Dans les paroles","Dans le récit"],"rows":[["now","then"],["today / tonight","that day / that night"],["tomorrow","[[the next day]] / [[the following day]]"],["yesterday","[[the day before]] / [[the previous day]]"],["last week","the week before / the previous week"],["here / this","there / that"]]},{"type":"examples","items":[{"en":"The coach told us not to skate near the river.","fr":"L'entraîneur nous a dit de ne pas patiner près de la rivière."},{"en":"My mom asked me where I had put her keys.","fr":"Ma mère m'a demandé où j'avais mis ses clés."},{"en":"Amir admitted that he had eaten the last cookie.","fr":"Amir a avoué qu'il avait mangé le dernier biscuit."},{"en":"She asked me whether I was coming to the game.","fr":"Elle m'a demandé si je venais au match."}]},{"type":"tip","text":"Piège n° 1 : [[She asked me where did I live]] ✗ → [[She asked me where I lived]] ✓. Piège n° 2 : le backshift n'est **pas obligatoire** si c'est encore vrai ([[He said Ottawa is the capital of Canada]]) ou si le verbe d'introduction est au présent ([[She says she is tired]]). Dans les exercices, quand l'histoire est finie (« hier », « le mois dernier », « ce soir-là »), on recule les temps."},{"type":"dialogue","title":"La réunion manquée","lines":[{"who":"Zoé","en":"What did the coach say? I missed the meeting.","fr":"Qu'est-ce que l'entraîneuse a dit ? J'ai manqué la réunion."},{"who":"Liam","en":"She told us that the game had been moved to Saturday.","fr":"Elle nous a dit que le match avait été déplacé à samedi."},{"who":"Zoé","en":"Seriously? Did she say why?","fr":"Sérieux ? A-t-elle dit pourquoi ?"},{"who":"Liam","en":"She explained that the other team's bus had broken down.","fr":"Elle a expliqué que l'autobus de l'autre équipe était tombé en panne."},{"who":"Zoé","en":"Oh no! Did anyone complain?","fr":"Oh non ! Quelqu'un s'est plaint ?"},{"who":"Liam","en":"Malik did, of course. And she reminded us not to forget our water bottles this time.","fr":"Malik, évidemment. Et elle nous a rappelé de ne pas oublier nos gourdes cette fois."},{"who":"Zoé","en":"Did she ask about me?","fr":"Est-ce qu'elle a demandé de mes nouvelles ?"},{"who":"Liam","en":"Yes, she asked if you were feeling better.","fr":"Oui, elle a demandé si tu allais mieux."}]}],"vocab":[{"en":"admit","fr":"avouer, admettre","alt":[],"ex":"Félix admitted that he had eaten the last cookie."},{"en":"deny","fr":"nier","alt":[],"ex":"She denied taking my charger."},{"en":"warn","fr":"avertir, mettre en garde","alt":[],"ex":"The coach warned us not to skate on the thin ice."},{"en":"suggest","fr":"suggérer, proposer","alt":[],"ex":"Mei suggested going to the beach."},{"en":"complain","fr":"se plaindre","alt":[],"ex":"My brother always complains about his homework."},{"en":"refuse","fr":"refuser","alt":[],"ex":"The cat refused to come down from the tree."},{"en":"remind","fr":"rappeler (à quelqu'un de faire quelque chose)","alt":[],"ex":"Remind me to call Grandma tonight."},{"en":"insist","fr":"insister","alt":[],"ex":"He insisted on paying for my ice cream."},{"en":"apologize","fr":"s'excuser","alt":[],"ex":"Noah apologized for being late."},{"en":"whether","fr":"si (entre deux possibilités)","alt":["if"],"ex":"She asked me whether I was coming."},{"en":"wonder","fr":"se demander","alt":[],"ex":"I wonder where my keys are."},{"en":"reply","fr":"répondre (à un message, à une question)","alt":["answer","respond"],"ex":"He didn't reply to my text."},{"en":"claim","fr":"affirmer (sans preuve)","alt":[],"ex":"Jaden claims that he saw a bear in his backyard."},{"en":"point out","fr":"faire remarquer, souligner","alt":[],"ex":"Sofia pointed out that the store was closed."},{"en":"boast","fr":"se vanter","alt":["brag"],"ex":"He boasted that he had scored three goals."},{"en":"gossip","fr":"potins, commérages","alt":[],"ex":"Don't believe all the gossip you hear."},{"en":"the day before","fr":"la veille","alt":["the previous day"],"ex":"She said that she had seen him the day before."},{"en":"the next day","fr":"le lendemain","alt":["the following day"],"ex":"He promised that he would call the next day."}],"sentences":[{"en":"She told me that she was too tired to go out.","fr":"Elle m'a dit qu'elle était trop fatiguée pour sortir.","trap":["said","says"],"alt":[]},{"en":"My mom asked me where I had put her keys.","fr":"Ma mère m'a demandé où j'avais mis ses clés.","trap":["did","said"],"alt":[]},{"en":"The coach told us not to skate near the river.","fr":"L'entraîneur nous a dit de ne pas patiner près de la rivière.","trap":["don't","said"],"alt":[]},{"en":"He asked me if I wanted to come to his party.","fr":"Il m'a demandé si je voulais venir à sa fête.","trap":["do","did"],"alt":[]},{"en":"Amir admitted that he had eaten the last cookie.","fr":"Amir a avoué qu'il avait mangé le dernier biscuit.","trap":["has","eat"],"alt":[]},{"en":"Maya suggested going to the museum on Saturday.","fr":"Maya a proposé d'aller au musée samedi.","trap":["go","me"],"alt":[]},{"en":"The teacher reminded us to bring our permission forms.","fr":"L'enseignante nous a rappelé d'apporter nos formulaires d'autorisation.","trap":["remembered","bringing"],"alt":[]},{"en":"Karim denied breaking the vase, but nobody believed him.","fr":"Karim a nié avoir cassé le vase, mais personne ne l'a cru.","trap":["to","broke"],"alt":[]},{"en":"She said that she would call me the next day.","fr":"Elle a dit qu'elle m'appellerait le lendemain.","trap":["will","told"],"alt":[]},{"en":"Olivia wanted to know whether the library was open on Sunday.","fr":"Olivia voulait savoir si la bibliothèque était ouverte le dimanche.","trap":["does","did"],"alt":[]},{"en":"He apologized for being late and promised it wouldn't happen again.","fr":"Il s'est excusé d'être en retard et a promis que ça n'arriverait plus.","trap":["to","of"],"alt":[]},{"en":"My little brother complained that nobody ever listened to him.","fr":"Mon petit frère s'est plaint que personne ne l'écoutait jamais.","trap":["listen","about"],"alt":[]}],"grammar":[{"type":"mcq","q":"Emma ___ me that she had lost her phone.","choices":["said","told","told to","said me"],"answer":1,"explain":"Avec la personne (me) juste après, on utilise tell : She told me…"},{"type":"mcq","q":"He asked me where ___.","choices":["did I live","do I live","I lived","lived I"],"answer":2,"explain":"Question rapportée : pas d'inversion, pas de did. Sujet + verbe : where I lived."},{"type":"mcq","q":"Last month, Lucas said: \"I will help you tomorrow.\" → Last month, Lucas said that he would help me ___.","choices":["tomorrow","the day before","yesterday","the next day"],"answer":3,"explain":"La scène est passée depuis longtemps : tomorrow devient the next day (ou the following day)."},{"type":"mcq","q":"Mei suggested ___ a movie after school.","choices":["watching","to watch","us to watch","watch"],"answer":0,"explain":"Suggest + -ing. Jamais suggest to ni suggest someone to."},{"type":"mcq","q":"She asked me ___ I could help her with her project.","choices":["that","whether","what","did"],"answer":1,"explain":"Question oui/non rapportée → whether (ou if)."},{"type":"mcq","q":"Félix warned us ___ the dog.","choices":["to not touching","don't touch","not to touch","to don't touch"],"answer":2,"explain":"Warn someone not to + verbe : not se place avant to."},{"type":"fill","q":"The coach asked us if we ___ ready, and we all shouted yes.","hint":"be","answer":["were"],"explain":"Après asked, on recule le temps : are → were."},{"type":"fill","q":"Last week, Ana said that she ___ come to my party that night.","hint":"can't","answer":["couldn't"],"explain":"La soirée est passée : can't recule en couldn't."},{"type":"fill","q":"Last Monday, Noah said: \"I have finished my project.\" → Noah told me that he ___ his project.","hint":"finish","answer":["had finished","had already finished"],"explain":"« I have finished » rapporté au passé devient had finished."},{"type":"fill","q":"My parents told me ___ my phone at the dinner table.","hint":"not / use","answer":["not to use"],"explain":"Interdiction rapportée : told me not to + verbe."},{"type":"fill","q":"Sofia said that she had seen the movie ___.","hint":"la veille","answer":["the day before","the previous day"],"explain":"Yesterday devient the day before (ou the previous day) dans un récit."},{"type":"fill","q":"He refused ___ me his password.","hint":"tell","answer":["to tell"],"explain":"Refuse + to + verbe."},{"type":"fill","q":"Jaden insisted ___ for everyone's pizza.","hint":"pay","answer":["on paying"],"explain":"Insist on + -ing."},{"type":"error","q":"He said me that he was hungry.","wrong":1,"fix":["told","said to"],"explain":"On ne dit jamais said me : He told me (ou He said to me)."},{"type":"error","q":"She asked me that I was ready.","wrong":3,"fix":["if","whether"],"explain":"Pour une question oui/non rapportée : if ou whether, pas that."},{"type":"error","q":"The teacher told us don't run in the hallway.","wrong":4,"fix":["not to"],"explain":"Ordre négatif rapporté : told us not to run."},{"type":"error","q":"Last year, Priya told me she will move to Vancouver the next month.","wrong":6,"fix":["would"],"explain":"Dans un récit passé (the next month), will recule en would."},{"type":"error","q":"Mom reminded me to taking out the garbage.","wrong":4,"fix":["take"],"explain":"Remind someone to + verbe de base : to take."}],"reading":{"title":"Interview with a Legend","text":"Last week, Léa interviewed Madame Gagnon, the oldest teacher at her school, for the student newspaper. Madame Gagnon was going to retire at the end of the year, and everybody wanted to know her secrets.\n\nFirst, Léa asked her how she had become a teacher. Madame Gagnon replied that she had started her career in a tiny village school before she moved to Ottawa. She admitted that she had been terrified on her first day. In fact, she had forgotten all her students' names by lunchtime!\n\nThen Léa asked whether teaching had changed a lot. The teacher pointed out that her students now used tablets instead of chalkboards, but she insisted that kids hadn't really changed. They still laughed at the same jokes, she said, and they still complained about homework.\n\nLéa wondered what her favourite memory was. Madame Gagnon smiled and explained that one winter, her whole class had built a giant snow castle in the schoolyard. The principal had warned them not to make it too high, but they had refused to stop. It had become so big that the town newspaper had published a picture of it.\n\nAt the end, Madame Gagnon reminded Léa to study hard, and she suggested that every student should read at least one book a month. She told her that a good book was the best friend you could have.\n\nThe next day, Léa wrote her article. It became the most popular article of the year.","questions":[{"q":"What did Madame Gagnon admit about her first day?","choices":["She had been late.","She had been very scared.","She had lost her keys.","She had taught in Ottawa."],"answer":1},{"q":"According to Madame Gagnon, what hasn't really changed?","choices":["The tablets","The chalkboards","The principal","The kids"],"answer":3},{"q":"What had the principal told the class?","choices":["To build the castle higher","Not to make the castle too high","To send a picture to the newspaper","Not to play in the snow"],"answer":1},{"q":"What did Madame Gagnon suggest?","choices":["That every student should read a book a month","That students should write for the newspaper","That kids should use more tablets","That Léa should become a teacher"],"answer":0},{"q":"What does the snow castle story show about Madame Gagnon's class?","choices":["They were afraid of the principal.","They didn't like winter.","They were determined and worked well together.","They were very lazy."],"answer":2},{"q":"Why was the article probably so popular?","choices":["Because it was very short","Because many students knew and liked Madame Gagnon","Because it had a picture of the principal","Because Léa was the principal's daughter"],"answer":1}]},"pron":{"focus":"Les verbes de discours : accent sur la 2e syllabe","ipa":"/ɪd/","explain":"Presque tous les verbes pour rapporter des paroles mettent l'accent sur leur **deuxième** syllabe : [[admit]] (« eud-MIT »), [[deny]], [[complain]], [[insist]], [[remind]], [[suggest]], [[explain]]. La première syllabe devient un petit « eu » ou « i » très rapide. Au passé, après un t ou un d, on ajoute une vraie syllabe « id » : [[admitted]], [[insisted]], [[reminded]]. Mais ailleurs, pas de syllabe en plus : [[complained]] a deux syllabes, pas trois ! Bonus : le verbe [[refuse]] (« ri-FIOUZ ») n'a pas le même accent que le nom [[refuse]] (« RÈ-fious »), un mot soutenu pour… les déchets !","words":[{"en":"admit","fr":"admettre, avouer","hint":"« eud-MIT » : le « ad » devient un petit « eud »"},{"en":"admitted","fr":"a admis, a avoué","hint":"« eud-MI-tid » : t + ed, donc une syllabe de plus"},{"en":"deny","fr":"nier","hint":"« di-NAÏ » : accent sur « naï » ; rien à voir avec « dénier »"},{"en":"complain","fr":"se plaindre","hint":"« keum-PLÉIN » : « pléin » comme dans « pleine »"},{"en":"complained","fr":"s'est plaint","hint":"« keum-PLÉIND » : deux syllabes seulement, jamais « com-plai-ned »"},{"en":"insist","fr":"insister","hint":"« in-SIST » : « in » comme dans « inutile », sans son nasal"},{"en":"insisted","fr":"a insisté","hint":"« in-SIS-tid » : t + ed, donc « tid » à la fin"},{"en":"remind","fr":"rappeler (à quelqu'un)","hint":"« ri-MAÏND » : accent sur « maïnd », comme [[mind]]"},{"en":"suggest","fr":"suggérer, proposer","hint":"« seu-DJÈST » : « dj » comme dans [[juice]], jamais « sug-jé »"},{"en":"refuse","fr":"refuser","hint":"« ri-FIOUZ » : accent à la fin et un z sonore"}],"pairs":[],"practice":["She admitted that she had taken my pen, but she denied breaking it.","My coach insisted on practising, and he refused to cancel the game.","Mom reminded me to call Grandma, so I complained a little."]},"mission":{"type":"oral","prompt":"Ton ami Karim a manqué la réunion de l'équipe de soccer hier. Rapporte-lui à voix haute, en cinq à sept phrases, ce que la coach et les joueurs ont dit, sans jamais citer leurs paroles directement.","model":"Coach Sofia said that the tournament would start on Saturday morning. She told us to be at the field by eight o'clock, and she warned us not to forget our water bottles. Ethan asked if he could bring his little brother, and she said he could. She also reminded everyone that she had booked the bus the day before. Maya complained that the practices were too long, but the coach refused to change them. Finally, she asked whether you were feeling better!","checklist":["J'ai fait reculer les temps : [[will]] → [[would]], passé → [[had]] + participe","J'ai utilisé [[told us to]] ou [[warned us not to]] pour une consigne","Mes questions rapportées n'ont pas d'inversion : [[asked if he could]], pas [[asked if could he]]","J'ai changé les mots de temps : [[yesterday]] → [[the day before]]","J'ai mis l'accent sur la 2e syllabe : [[complained]], [[reminded]], [[refused]]"]}},{"id":"9.3","title":"Les connecteurs","titleEn":"Link Your Ideas","goal":"Relier tes idées pour argumenter : opposer, ajouter, donner une conséquence ou un but.","lesson":[{"type":"p","text":"Pour gagner un débat, il ne suffit pas d'avoir de bonnes idées : il faut les **relier**. Les connecteurs servent à opposer ([[although]], [[however]]), à ajouter ([[moreover]]), à donner une conséquence ([[therefore]]) ou un but ([[in order to]], [[so that]])."},{"type":"rule","title":"Although ou despite ?","text":"[[although]] et [[even though]] + **phrase complète** (sujet + verbe) : [[Although it was raining, we played outside.]] [[despite]] et [[in spite of]] + **nom** ou **-ing** : [[Despite the rain, we played outside.]] [[In spite of being tired, he finished.]] On ne dit **jamais** [[despite of]] !"},{"type":"table","head":["Connecteur","Sens","Suivi de…"],"rows":[["[[although]] / [[even though]]","bien que / même si (c'est vrai)","sujet + verbe"],["[[despite]] / [[in spite of]]","malgré","nom ou -ing"],["[[however]]","cependant","nouvelle phrase + virgule"],["[[whereas]]","alors que (contraste)","sujet + verbe"],["[[on the other hand]]","d'un autre côté","nouvelle phrase + virgule"],["[[moreover]]","de plus","nouvelle phrase + virgule"],["[[therefore]] / [[as a result]]","par conséquent","nouvelle phrase + virgule"],["[[unless]]","à moins que (= if… not)","sujet + verbe au présent"],["[[in order to]]","afin de","verbe de base"],["[[so that]]","pour que","sujet + can / could / would"]]},{"type":"rule","title":"However, la virgule et le but","text":"[[However]] commence souvent une nouvelle phrase, suivi d'une virgule : [[It was a great movie. However, the ending was sad.]] Pour un but : [[in order to]] + verbe ([[We left early in order to catch the bus.]]) ; [[so that]] + sujet + modal ([[I whispered so that the baby wouldn't wake up.]]). Après un verbe au passé, [[so that]] + [[could]] / [[would]]."},{"type":"examples","items":[{"en":"Despite the cold weather, hundreds of people skated on the canal.","fr":"Malgré le froid, des centaines de personnes ont patiné sur le canal."},{"en":"My sister loves winter, whereas I prefer summer.","fr":"Ma sœur adore l'hiver, alors que moi, je préfère l'été."},{"en":"You won't get into the game unless you buy a ticket.","fr":"Tu n'entreras pas au match à moins d'acheter un billet."},{"en":"The roads were icy. As a result, all the buses were cancelled.","fr":"Les routes étaient glacées. Résultat : tous les autobus ont été annulés."}]},{"type":"tip","text":"Pièges de francophone : « même si » a deux traductions ! [[even though]] = c'est **vrai** ([[Even though I was tired, I stayed up.]]) ; [[even if]] = c'est une **hypothèse** ([[Even if it rains tomorrow, we'll go.]]). Et [[unless]] contient déjà la négation : [[unless you don't hurry]] ✗ → [[unless you hurry]] ✓."},{"type":"dialogue","title":"Pratique de débat","lines":[{"who":"Maya","en":"I think we should ban phones at school. They're a huge distraction.","fr":"Je pense qu'on devrait interdire les téléphones à l'école. Ils nous distraient énormément."},{"who":"Karim","en":"I see your point. However, phones can be useful for research.","fr":"Je comprends ton point de vue. Cependant, les téléphones peuvent être utiles pour faire de la recherche."},{"who":"Maya","en":"True, but students often play games in class even though it's against the rules.","fr":"C'est vrai, mais les élèves jouent souvent à des jeux en classe, même si c'est interdit."},{"who":"Karim","en":"On the other hand, some students need their phones in order to contact their parents.","fr":"D'un autre côté, certains élèves ont besoin de leur téléphone afin de joindre leurs parents."},{"who":"Maya","en":"Okay, phones could stay in lockers so that students can use them at lunch.","fr":"D'accord, les téléphones pourraient rester dans les casiers pour que les élèves puissent s'en servir au dîner."},{"who":"Karim","en":"That sounds fair. Despite our different points of view, I think we've found a solution!","fr":"Ça me semble juste. Malgré nos points de vue différents, je pense qu'on a trouvé une solution !"}]}],"vocab":[{"en":"however","fr":"cependant, toutefois","alt":["nevertheless"],"ex":"It was cold. However, we went outside."},{"en":"although","fr":"bien que","alt":["though"],"ex":"Although she was sick, she came to the show."},{"en":"even though","fr":"même si (et c'est vrai)","alt":[],"ex":"He kept playing even though his ankle hurt."},{"en":"despite","fr":"malgré","alt":["in spite of"],"ex":"Despite the rain, the game continued."},{"en":"whereas","fr":"alors que (pour opposer deux choses)","alt":["while"],"ex":"I love math, whereas my brother hates it."},{"en":"on the other hand","fr":"d'un autre côté, par contre","alt":[],"ex":"On the other hand, the tickets are expensive."},{"en":"moreover","fr":"de plus, en outre","alt":["furthermore","in addition","what's more"],"ex":"The park is beautiful. Moreover, it's free."},{"en":"therefore","fr":"par conséquent, donc","alt":["consequently"],"ex":"He was sick and therefore missed the game."},{"en":"as a result","fr":"résultat : (à cause de ça)","alt":[],"ex":"It snowed all night. As a result, school was closed."},{"en":"unless","fr":"à moins que","alt":[],"ex":"We'll go skating unless it's too cold."},{"en":"in order to","fr":"afin de","alt":["so as to"],"ex":"She left early in order to catch the bus."},{"en":"so that","fr":"pour que, afin que","alt":[],"ex":"Speak louder so that everyone can hear you."},{"en":"point of view","fr":"point de vue","alt":["viewpoint"],"ex":"I understand your point of view."},{"en":"drawback","fr":"inconvénient","alt":["disadvantage","downside"],"ex":"The only drawback is the price."},{"en":"convince","fr":"convaincre","alt":["persuade"],"ex":"She convinced me to join the team."},{"en":"fair","fr":"juste, équitable","alt":[],"ex":"It's not fair! I always do the dishes."},{"en":"debate","fr":"débat","alt":[],"ex":"Our class held a debate about homework."},{"en":"disagree","fr":"ne pas être d'accord","alt":[],"ex":"I'm sorry, but I disagree with you."}],"sentences":[{"en":"Although it was raining, we decided to play soccer outside.","fr":"Bien qu'il pleuve, on a décidé de jouer au soccer dehors.","trap":["Despite","of"],"alt":["We decided to play soccer outside although it was raining."]},{"en":"Despite the cold weather, hundreds of people skated on the canal.","fr":"Malgré le froid, des centaines de personnes ont patiné sur le canal.","trap":["Although","spite"],"alt":["Hundreds of people skated on the canal despite the cold weather."]},{"en":"She kept playing even though her ankle hurt.","fr":"Elle a continué de jouer même si elle avait mal à la cheville.","trap":["despite","of"],"alt":["Even though her ankle hurt she kept playing."]},{"en":"You won't get into the game unless you buy a ticket.","fr":"Tu n'entreras pas au match à moins d'acheter un billet.","trap":["don't","will"],"alt":["Unless you buy a ticket you won't get into the game."]},{"en":"We left early in order to catch the first bus.","fr":"On est partis tôt afin de prendre le premier autobus.","trap":["for","that"],"alt":["In order to catch the first bus we left early."]},{"en":"I'm saving my money so that I can buy a new bike.","fr":"J'économise mon argent pour pouvoir m'acheter un nouveau vélo.","trap":["for","to"],"alt":[]},{"en":"My sister loves winter, whereas I prefer summer.","fr":"Ma sœur adore l'hiver, alors que moi, je préfère l'été.","trap":["despite","spite"],"alt":["Whereas I prefer summer, my sister loves winter."]},{"en":"The roads were icy, and as a result, all the buses were cancelled.","fr":"Les routes étaient glacées et, par conséquent, tous les autobus ont été annulés.","trap":["despite","however"],"alt":[]},{"en":"Moreover, the new park would give kids a safe place to play.","fr":"De plus, le nouveau parc donnerait aux enfants un endroit sécuritaire pour jouer.","trap":["Despite","Although"],"alt":[]},{"en":"In spite of being tired, Ethan finished his science project.","fr":"Malgré sa fatigue, Ethan a terminé son projet de sciences.","trap":["was","though"],"alt":["Ethan finished his science project in spite of being tired."]},{"en":"On the other hand, a later start would make mornings less stressful.","fr":"D'un autre côté, si l'école commençait plus tard, les matins seraient moins stressants.","trap":["Despite","making"],"alt":[]}],"grammar":[{"type":"mcq","q":"___ the rain, the game wasn't cancelled.","choices":["Although","Despite","Despite of","Even though"],"answer":1,"explain":"Devant un nom (the rain) : despite, sans of. Although veut une phrase complète."},{"type":"mcq","q":"I'll go to the party ___ I have too much homework.","choices":["whereas","despite","therefore","unless"],"answer":3,"explain":"Unless = à moins que : j'irai, sauf si j'ai trop de devoirs."},{"type":"mcq","q":"We whispered ___ we wouldn't wake the baby.","choices":["so that","in order to","despite","whereas"],"answer":0,"explain":"Un but suivi d'un sujet + would : so that. In order to est suivi d'un verbe."},{"type":"mcq","q":"Hockey is very popular in Canada, ___ soccer is the favourite sport in Brazil.","choices":["therefore","whereas","in order to","despite"],"answer":1,"explain":"Whereas oppose deux faits : ici le Canada et le Brésil."},{"type":"mcq","q":"Laquelle de ces phrases est correcte ?","choices":["Despite of the snow, we went out.","Despite it snowed, we went out.","Although the snow, we went out.","In spite of the snow, we went out."],"answer":3,"explain":"In spite of + nom. Despite of n'existe pas, et although veut un sujet + verbe."},{"type":"mcq","q":"C'est vrai que j'étais fatigué : « ___ I was really tired, I stayed up to watch the end of the game. »","choices":["Even if","Even though","Despite","Unless"],"answer":1,"explain":"Fait réel → even though. Even if sert pour une hypothèse."},{"type":"fill","q":"___ the traffic, we arrived on time.","hint":"malgré","answer":["Despite","In spite of"],"explain":"Malgré + nom : despite ou in spite of."},{"type":"fill","q":"She took the bus ___ save time.","hint":"afin de","answer":["in order to","so as to","to"],"explain":"But + verbe de base : in order to save time."},{"type":"fill","q":"You can't join the team ___ you come to every practice.","hint":"à moins que","answer":["unless"],"explain":"Unless = if… not : tu ne peux pas entrer dans l'équipe si tu ne viens pas à chaque pratique."},{"type":"fill","q":"The museum was closed. ___, we went to the park instead.","hint":"par conséquent","answer":["Therefore","As a result","Consequently"],"explain":"Une conséquence en début de phrase : Therefore, (ou As a result,)."},{"type":"fill","q":"It was a great movie. ___, the ending was a bit sad.","hint":"cependant","answer":["However","Nevertheless"],"explain":"Une opposition en début de phrase, avec une virgule : However,"},{"type":"fill","q":"___ he had practised for weeks, he forgot his lines on stage.","hint":"même si (c'est vrai)","answer":["Even though","Although","Though"],"explain":"Fait réel + phrase complète : even though (ou although)."},{"type":"fill","q":"I'll lend you my bike ___ you can get to school faster.","hint":"pour que","answer":["so that","so"],"explain":"But + sujet + can : so that."},{"type":"error","q":"Although the cold, we went skating on the canal.","wrong":0,"fix":["Despite","In spite of"],"explain":"Devant un nom (the cold), il faut despite ou in spite of."},{"type":"error","q":"However it was late, we kept talking.","wrong":0,"fix":["Although","Even though","Though"],"explain":"Pour relier deux idées dans une même phrase : although, pas however."},{"type":"error","q":"I wore a warm hat so that I don't get cold.","wrong":8,"fix":["wouldn't","didn't"],"explain":"Après un verbe au passé (wore), so that + wouldn't."},{"type":"error","q":"She went to the library in order to finding a book about whales.","wrong":8,"fix":["find"],"explain":"In order to + verbe de base : to find."},{"type":"error","q":"Despite he trained every day, he lost the race.","wrong":0,"fix":["Although","Even though","Though"],"explain":"Devant sujet + verbe (he trained) : although ou even though, pas despite."}],"reading":{"title":"Should School Start Later?","text":"Should our school day start an hour later? Last week, our class held a debate on this question, and the room was divided.\n\nPriya's team argued in favour of a later start. Although most students go to bed at a reasonable time, many of them still feel exhausted in the morning. Teenagers' bodies naturally want to fall asleep later than adults' bodies, so getting up at six o'clock is a real struggle. Moreover, tired students find it hard to pay attention. As a result, the first class of the day is often the least productive. A later start would therefore help everyone learn better.\n\nSamuel's team disagreed. They pointed out that a later start would also mean a later finish. Students who play sports or take music lessons would have less time in the afternoon. Some parents, on the other hand, drop their kids off on their way to work, and a later start might cause them serious problems. Samuel also argued that, unless students put their phones away at night, an extra hour of sleep would change nothing.\n\nIn the end, the class voted. Despite Samuel's strong arguments, Priya's team won by just a few votes. However, everyone agreed on one thing: both sides had made fair points. Our teacher suggested writing a letter to the principal in order to share our ideas, so that the whole school could discuss them.\n\nWhether the school will change its schedule is still a mystery. But one thing is sure: we have never disagreed so politely!","questions":[{"q":"What was the debate about?","choices":["Banning phones at school","Starting the school day later","Adding more sports","Writing letters to the principal"],"answer":1},{"q":"According to Priya's team, why is the first class often the least productive?","choices":["The teacher is often late.","The classroom is too cold.","Students are tired and find it hard to concentrate.","Students are on their phones."],"answer":2},{"q":"What problem did Samuel's team mention?","choices":["Students would have less time after school.","Buses would cost more.","Teachers would need more sleep.","Students would forget their homework."],"answer":0},{"q":"What did Samuel say about phones?","choices":["Phones should be allowed in class.","Phones help students wake up.","Parents should take their kids' phones.","An extra hour would be useless unless students stopped using phones at night."],"answer":3},{"q":"Which statement best describes the result of the vote?","choices":["Priya's team won easily.","The vote was very close.","Nobody voted.","Samuel's team won."],"answer":1},{"q":"How does the writer feel about the debate?","choices":["Bored","Proud of how respectful it was","Angry at Samuel","Disappointed with the result"],"answer":1}]},"pron":{"focus":"Les connecteurs en « th » et en « ough »","ipa":"/ð/ – /θ/","explain":"Beaucoup de connecteurs commencent par un « th », et il y en a deux sortes ! Le **th doux** (langue entre les dents, la gorge vibre, comme dans [[mother]]) : [[though]], [[although]], [[therefore]], [[whether]], [[furthermore]]. Le **th soufflé** (langue entre les dents, juste de l'air, comme dans [[three]]) : [[through]], [[thought]], [[thorough]]. Le piège des francophones : remplacer le th par « d », « z » ou « t »… et [[though]] devient [[dough]] (de la pâte), [[through]] devient [[true]] ! Et ne te fie jamais à « ough » : il se dit « ô » dans [[though]], « ou » dans [[through]] et « â » dans [[thought]].","words":[{"en":"though","fr":"pourtant, quand même (en fin de phrase)","hint":"« thô » : th doux, la gorge vibre ; jamais « dô »"},{"en":"although","fr":"bien que, même si","hint":"« âl-THÔ » : accent sur la 2e syllabe, th doux"},{"en":"even though","fr":"même si (plus fort)","hint":"« II-veun-THÔ » : deux accents, le th reste doux"},{"en":"through","fr":"à travers, par","hint":"« throu » : th soufflé, puis r anglais ; jamais « trou »"},{"en":"thought","fr":"pensé, a pensé (passé de think)","hint":"« THÂT » : th soufflé ; le « gh » est muet"},{"en":"thorough","fr":"minutieux, approfondi","hint":"« THEU-rô » : accent au début ; à ne pas confondre avec [[through]]"},{"en":"therefore","fr":"par conséquent, donc","hint":"« THÈR-for » : th doux, accent au début"},{"en":"furthermore","fr":"de plus, en outre","hint":"« FEUR-theur-mor » : accent au début, th doux au milieu"},{"en":"whether","fr":"si (entre deux choix)","hint":"« OUÈ-theur » : se prononce comme [[weather]] (la météo)"}],"pairs":[["though","dough"],["through","true"],["thought","taught"]],"practice":["Although it was raining, we walked through the park anyway.","I thought it through, therefore I know whether it will work.","Even though the test was long, it was thorough and fair."]},"mission":{"type":"ecrit","prompt":"Le conseil des élèves se demande s'il faut interdire les devoirs la fin de semaine. Écris un paragraphe argumenté de six à huit phrases : donne ton opinion, un argument de l'autre camp, puis ta conclusion.","model":"Should students have homework on weekends? In my opinion, weekends should be homework-free. Although homework helps us practise, students also need time to rest, play sports and see their families. Moreover, many teenagers already work hard from Monday to Friday; as a result, they feel exhausted by Saturday. On the other hand, some parents think that free weekends will make students lazy. However, I believe that rested students learn better and pay more attention in class. Therefore, teachers should give homework during the week so that our weekends stay free.","checklist":["J'ai donné mon opinion clairement dès le début ([[In my opinion]])","J'ai présenté un argument de l'autre camp avec [[On the other hand]] ou [[However]]","J'ai utilisé au moins quatre connecteurs différents ([[although]], [[moreover]], [[therefore]], [[so that]]…)","Après [[despite]] ou [[in spite of]], j'ai mis un nom ou un verbe en -ing, jamais une phrase complète","J'ai prononcé le th doux de [[although]] et [[therefore]]"]}},{"id":"9.4","title":"Make, do et compagnie","titleEn":"Make or Do?","goal":"Utiliser les bonnes associations de mots avec make, do, take, have, pay, keep, catch, break, save et waste.","lesson":[{"type":"p","text":"En anglais, certains verbes « vont » avec certains noms : ce sont des **collocations**. Le piège : traduire mot à mot. « Faire une erreur » = [[make a mistake]], mais « faire attention » = [[pay attention]] ! La solution : apprendre ces expressions **en bloc**."},{"type":"rule","title":"Make ou do ?","text":"[[make]] = **créer, fabriquer, produire un résultat** : [[make a cake]], [[make a mistake]], [[make a decision]], [[make noise]], [[make friends]], [[make money]], [[make an effort]], [[make progress]], [[make your bed]]. [[do]] = **activités, tâches, travail** : [[do homework]], [[do the dishes]], [[do the laundry]], [[do research]], [[do your best]], [[do someone a favour]], [[do well]]."},{"type":"table","head":["Verbe","Collocations"],"rows":[["[[take]]","a picture, a break, a test, your time, a shower, notes"],["[[have]]","fun, a party, a good time, lunch, a test"],["[[pay]]","attention, a visit, a compliment"],["[[keep]]","a secret, a promise, calm, in touch"],["[[catch]]","a cold, the bus, a ball"],["[[break]]","a promise, a record, the rules"],["[[save]]","time, money, energy"],["[[waste]]","time, money, energy"]]},{"type":"tip","text":"Pièges de francophone : « faire une photo » → [[take a picture]] ; « faire attention » → [[pay attention]] ; « faire une fête » → [[have a party]] ; « s'amuser » → [[have fun]] ; « faire un effort » → [[make an effort]] ; « battre un record » → [[break a record]] ; « perdre son temps » → [[waste your time]] ; « gagner du temps » → [[save time]]. Et « passer un examen » → [[take a test]] (au Canada, on dit aussi [[write a test]]), car [[pass a test]] veut dire **réussir** l'examen !"},{"type":"rule","title":"Les paires contraires","text":"Certaines collocations vont par deux : [[keep a promise]] (tenir) ↔ [[break a promise]] (ne pas tenir) ; [[save time]] ↔ [[waste time]] ; [[catch the bus]] (attraper) ↔ [[miss the bus]] (rater)."},{"type":"examples","items":[{"en":"Don't worry, everyone makes mistakes.","fr":"Ne t'inquiète pas, tout le monde fait des erreurs."},{"en":"Could you do me a favour?","fr":"Peux-tu me rendre service ?"},{"en":"Please pay attention to the instructions.","fr":"Fais attention aux consignes, s'il te plaît."},{"en":"She broke the school record for the long jump.","fr":"Elle a battu le record de l'école au saut en longueur."},{"en":"We had so much fun at the sugar shack.","fr":"On s'est tellement amusés à la cabane à sucre."}]},{"type":"dialogue","title":"Le samedi chargé","lines":[{"who":"Sofia","en":"Do you want to come to the park? We're going to take pictures of the leaves.","fr":"Veux-tu venir au parc ? On va prendre des photos des feuilles."},{"who":"Félix","en":"I can't. I have to do the dishes and make my bed first.","fr":"Je ne peux pas. Je dois faire la vaisselle et faire mon lit d'abord."},{"who":"Sofia","en":"Come on, it'll only take ten minutes. I'll wait for you.","fr":"Allez, ça va seulement prendre dix minutes. Je vais t'attendre."},{"who":"Félix","en":"Okay, but I need to take a break at three. I have a test on Monday.","fr":"D'accord, mais je dois prendre une pause à trois heures. J'ai un examen lundi."},{"who":"Sofia","en":"No problem. And bring a jacket so you don't catch a cold!","fr":"Pas de problème. Et apporte une veste pour ne pas attraper un rhume !"},{"who":"Félix","en":"Thanks for the advice! See you soon. Let's have fun!","fr":"Merci du conseil ! À tantôt. On va s'amuser !"}]}],"vocab":[{"en":"make a mistake","fr":"faire une erreur","alt":[],"ex":"Everyone makes mistakes sometimes."},{"en":"make a decision","fr":"prendre une décision","alt":[],"ex":"I need to make a decision before Friday."},{"en":"make an effort","fr":"faire un effort","alt":[],"ex":"Try to make an effort in French class."},{"en":"make noise","fr":"faire du bruit","alt":["make a noise"],"ex":"Please don't make noise; the baby is sleeping."},{"en":"do the dishes","fr":"faire la vaisselle","alt":["wash the dishes"],"ex":"It's your turn to do the dishes."},{"en":"do someone a favour","fr":"rendre service à quelqu'un","alt":["do somebody a favour"],"ex":"Can you do me a favour and feed my cat?"},{"en":"do your best","fr":"faire de ton mieux","alt":[],"ex":"Just do your best on the test."},{"en":"take a picture","fr":"prendre une photo","alt":["take a photo"],"ex":"Let's take a picture in front of the canal."},{"en":"take a break","fr":"prendre une pause","alt":[],"ex":"We worked for two hours, then we took a break."},{"en":"take a test","fr":"passer un examen","alt":["write a test","take an exam","write an exam"],"ex":"We're taking a math test tomorrow."},{"en":"pay attention","fr":"faire attention (écouter)","alt":[],"ex":"Pay attention, because this is important."},{"en":"have fun","fr":"s'amuser","alt":["have a good time"],"ex":"Have fun at the party!"},{"en":"keep a secret","fr":"garder un secret","alt":[],"ex":"Can you keep a secret?"},{"en":"keep a promise","fr":"tenir une promesse","alt":["keep your promise"],"ex":"He always keeps his promises."},{"en":"break a promise","fr":"ne pas tenir une promesse","alt":["break your promise"],"ex":"Never break a promise to a friend."},{"en":"break a record","fr":"battre un record","alt":[],"ex":"She broke the school record."},{"en":"catch a cold","fr":"attraper un rhume","alt":[],"ex":"Wear a toque or you'll catch a cold."},{"en":"save time","fr":"gagner du temps","alt":[],"ex":"Take the highway to save time."},{"en":"waste time","fr":"perdre du temps","alt":[],"ex":"Don't waste time on silly videos."}],"sentences":[{"en":"Don't worry, everyone makes mistakes when they learn a new language.","fr":"Ne t'inquiète pas, tout le monde fait des erreurs en apprenant une nouvelle langue.","trap":["does","do"],"alt":[]},{"en":"Could you do me a favour and feed my cat this weekend?","fr":"Pourrais-tu me rendre service et nourrir mon chat cette fin de semaine ?","trap":["make","for"],"alt":[]},{"en":"Please pay attention, because this will be on the test.","fr":"Faites attention, s'il vous plaît, parce que ce sera dans l'examen.","trap":["make","do"],"alt":["Pay attention please, because this will be on the test."]},{"en":"We had so much fun at the sugar shack last weekend.","fr":"On s'est tellement amusés à la cabane à sucre la fin de semaine dernière.","trap":["made","did"],"alt":["Last weekend we had so much fun at the sugar shack."]},{"en":"My grandpa took a picture of us in front of Parliament Hill.","fr":"Mon grand-père nous a pris en photo devant la colline du Parlement.","trap":["made","did"],"alt":[]},{"en":"I wasted the whole afternoon playing video games.","fr":"J'ai perdu tout l'après-midi à jouer à des jeux vidéo.","trap":["lost","to"],"alt":[]},{"en":"She broke the school record for the long jump.","fr":"Elle a battu le record de l'école au saut en longueur.","trap":["made","won"],"alt":[]},{"en":"If you take the highway, you'll save at least twenty minutes.","fr":"Si tu prends l'autoroute, tu vas gagner au moins vingt minutes.","trap":["win","earn"],"alt":["You'll save at least twenty minutes if you take the highway."]},{"en":"I have to make a decision before the end of the week.","fr":"Je dois prendre une décision avant la fin de la semaine.","trap":["do","did"],"alt":[]},{"en":"Liam caught a terrible cold during the camping trip.","fr":"Liam a attrapé un gros rhume pendant le voyage de camping.","trap":["took","catched"],"alt":[]},{"en":"You promised, so you have to keep your promise.","fr":"Tu as promis, alors tu dois tenir ta promesse.","trap":["hold","do"],"alt":[]},{"en":"Take your time and do your best on the test.","fr":"Prends ton temps et fais de ton mieux à l'examen.","trap":["make","pass"],"alt":["Do your best on the test and take your time."]}],"grammar":[{"type":"mcq","q":"I'm sorry, I ___ a big mistake.","choices":["did","made","took","had"],"answer":1,"explain":"Une erreur, on la « fabrique » : make a mistake."},{"type":"mcq","q":"Quelle est la bonne traduction de « Fais attention ! » ?","choices":["Make attention!","Do attention!","Take attention!","Pay attention!"],"answer":3,"explain":"En anglais, on « paie » son attention : pay attention."},{"type":"mcq","q":"We ___ a party for Mei's birthday last Saturday.","choices":["had","made","did","took"],"answer":0,"explain":"Faire une fête = have a party."},{"type":"mcq","q":"The bus is leaving! Run, or you won't ___ it!","choices":["keep","save","catch","pay"],"answer":2,"explain":"Attraper l'autobus = catch the bus."},{"type":"mcq","q":"Taking the shortcut ___ us ten minutes.","choices":["won","saved","gained","kept"],"answer":1,"explain":"Gagner du temps = save time."},{"type":"mcq","q":"Can you keep a ___? Don't tell anyone!","choices":["promise","record","secret","noise"],"answer":2,"explain":"Ne le dire à personne = keep a secret."},{"type":"fill","q":"Stop ___ noise! The baby is sleeping.","hint":"make","answer":["making"],"explain":"Faire du bruit = make noise ; après stop, on met -ing."},{"type":"fill","q":"It's your turn to ___ the dishes tonight.","hint":"faire","answer":["do","wash"],"explain":"Faire la vaisselle = do the dishes (une tâche → do)."},{"type":"fill","q":"My cousin ___ a lot of money selling lemonade last summer.","hint":"gagner (de l'argent), au passé","answer":["made","earned"],"explain":"Gagner de l'argent = make money (ou earn money)."},{"type":"fill","q":"Don't ___ your time on that boring video.","hint":"perdre","answer":["waste"],"explain":"Perdre son temps = waste your time, jamais lose."},{"type":"fill","q":"He ___ his promise and never came to my game.","hint":"ne pas tenir, au passé","answer":["broke"],"explain":"Ne pas tenir une promesse = break a promise → broke."},{"type":"fill","q":"I'm nervous because I have to ___ a big math test tomorrow.","hint":"passer (un examen)","answer":["take","write","do"],"explain":"Passer un examen = take (ou write) a test. Pass veut dire réussir !"},{"type":"error","q":"Can you make a photo of us?","wrong":2,"fix":["take"],"explain":"Une photo, on la « prend » : take a photo."},{"type":"error","q":"I always do my bed before breakfast.","wrong":2,"fix":["make"],"explain":"Faire son lit = make your bed."},{"type":"error","q":"We made a lot of fun at the water park.","wrong":1,"fix":["had"],"explain":"S'amuser = have fun → had a lot of fun."},{"type":"error","q":"Please make attention to the instructions.","wrong":1,"fix":["pay"],"explain":"Faire attention = pay attention."},{"type":"error","q":"Mom asked me to make the laundry.","wrong":4,"fix":["do"],"explain":"Une tâche ménagère → do : do the laundry."},{"type":"error","q":"Don't lose your time on things you can't change.","wrong":1,"fix":["waste"],"explain":"Perdre son temps = waste your time."}],"reading":{"title":"Félix's Busy Saturday","text":"On Friday night, Félix made a big decision: this Saturday, he wouldn't waste a single minute. He wrote a long list of things to do, and he promised himself that he would do his best.\n\nFirst, he made his bed and did the dishes before his parents even woke up. Then he got ready to go to the arena, where he had to take a skating test at nine o'clock. Unfortunately, he hadn't paid attention to the time, and he missed his bus. He ran to the next stop and caught another one just in time. Although he was nervous, he passed the test easily.\n\nIn the afternoon, his best friend Amir asked him to do him a favour. Amir's family was having a garage sale and needed help. The two boys made signs, carried boxes and talked to customers. They made a lot of money for the family, had a lot of fun, and took dozens of funny pictures.\n\nBy the evening, Félix was exhausted. He had caught a cold in the rain that morning, and his nose was running. Earlier that week, he had promised to play a board game with his little sister, and he didn't want to break his promise. So he made an effort, played two games with her, and even let her win.\n\nBefore he fell asleep, Félix looked at his list. Every item had a check mark next to it. \"What a waste of a Saturday,\" he joked to his mom. She laughed. \"You didn't waste a second!\"","questions":[{"q":"What had Félix decided on Friday night?","choices":["To sleep all day on Saturday","Not to waste any time on Saturday","To break a skating record","To have a party"],"answer":1},{"q":"Why did Félix miss his bus?","choices":["He had a cold.","He was helping Amir.","He hadn't paid attention to the time.","He had forgotten his skates."],"answer":2},{"q":"How did Félix help Amir?","choices":["He did his homework.","He helped at his family's garage sale.","He took his dog for a walk.","He made a cake."],"answer":1},{"q":"Why did Félix play with his sister even though he was tired?","choices":["He had promised her, and he didn't want to break his promise.","He wanted to win.","His mom told him to.","He was bored."],"answer":0},{"q":"When Félix says \"What a waste of a Saturday,\" what does he really mean?","choices":["He is serious: he did nothing all day.","He is angry at his sister.","He is sad about his skating test.","He is joking: he did a lot that day."],"answer":3}]},"pron":{"focus":"Le rythme des collocations","ipa":"/ə/","explain":"Dans [[make a mistake]] ou [[take a break]], les mots importants ([[make]], [[mistake]], [[break]]) sont forts, et les petits mots ([[a]], [[your]], [[of]], [[the]]) deviennent un « eu » minuscule, collé au mot d'avant. Résultat : [[take a break]] sonne comme un seul mot, « téi-keu-BRÉIK ». Le piège des francophones : prononcer chaque mot avec la même force, comme en français… et ça sonne robotique ! Truc : tape dans tes mains seulement sur les syllabes fortes, et laisse les petits mots se faufiler entre les coups.","words":[{"en":"make a mistake","fr":"faire une erreur","hint":"« méi-keu-mi-STÉIK » : [[a]] devient un « eu » collé ; accent sur « stéik »"},{"en":"do your homework","fr":"faire tes devoirs","hint":"« dou-yeur-HÔM-weurk » : [[your]] se réduit à « yeur »"},{"en":"take a break","fr":"prendre une pause","hint":"« téi-keu-BRÉIK » : trois mots, un seul souffle"},{"en":"have a look","fr":"jeter un coup d'œil","hint":"« ha-veu-LOUK » : le v glisse sur le [[a]]"},{"en":"pay attention","fr":"faire attention, être attentif","hint":"« péi-eu-TÈN-cheun » : accent sur « tèn »"},{"en":"catch the bus","fr":"attraper l'autobus","hint":"« katch-theu-BEUS » : [[the]] tout petit, « theu »"},{"en":"waste time","fr":"perdre son temps","hint":"« wéis-TAÏM » : le t de [[waste]] se fond dans [[time]]"},{"en":"keep a secret","fr":"garder un secret","hint":"« kii-peu-SII-krit » : accent sur « sii »"},{"en":"break a promise","fr":"ne pas tenir une promesse","hint":"« bréi-keu-PRÂ-mis » : accent au début de [[promise]]"},{"en":"save money","fr":"économiser de l'argent","hint":"« séiv-MEU-ni » : « meu », jamais « mo-né »"}],"pairs":[],"practice":["Take a break, have a look at your notes, then do your homework.","Pay attention, or you'll make a mistake!","Don't waste time: catch the bus and save money."]},"mission":{"type":"oral","prompt":"Ta cousine Chloé entre au secondaire en septembre et elle est nerveuse. Donne-lui à voix haute six à huit conseils avec des collocations ([[make]], [[do]], [[take]], [[pay]], [[keep]], [[waste]], [[catch]]…).","model":"Welcome to high school, Chloé! First, make friends early: join a club or a team. Always do your homework the same day, so you don't waste time on the weekend. Pay attention in class and take notes, because tests come fast. If you make a mistake, don't panic: everybody does. Take a break when you feel tired, and never miss the bus: catch it on time! Finally, keep your promises, and you'll make a great impression.","checklist":["J'ai utilisé au moins six collocations différentes","J'ai dit [[make a mistake]] et [[do my homework]], pas l'inverse","J'ai dit [[take a break]] et [[pay attention]], jamais [[make a pause]] ni [[do attention]]","J'ai rendu les petits mots ([[a]], [[your]], [[the]]) tout légers"]}}]},{"id":10,"cefr":"C1","title":"Précision","titleEn":"Precision","intro":"Imagine un passé différent, fais des déductions comme un détective, parle avec de vraies expressions idiomatiques et fabrique tes propres mots.","boss":{"name":"L'Idiome Masqué","taunt":"Tu crois que mon examen, c'est un jeu d'enfant ? Ha ! Tu vas avoir la frousse au dernier moment, je te le garantis.","defeat":"Bon… c'est la goutte qui fait déborder le vase. Je m'arrête là pour aujourd'hui !"},"units":[{"id":"10.1","title":"Si seulement…","titleEn":"If Only…","goal":"Imaginer un passé différent avec le troisième conditionnel, les conditionnels mixtes et wish / if only.","lesson":[{"type":"p","text":"Tu connais déjà le conditionnel réel ([[If it rains, we'll stay home.]]) et le conditionnel imaginaire au présent ([[If I had a dog, I'd walk it every day.]]). Maintenant, on **réécrit le passé** : ce qui aurait pu arriver… mais qui n'est pas arrivé. Parfait pour les regrets !"},{"type":"rule","title":"Le troisième conditionnel","text":"[[If]] + **past perfect**, [[would have]] + **participe passé**. [[If I had known, I would have come.]] = Si j'avais su, je serais venu. Tu peux aussi utiliser [[could have]] (aurait pu) ou [[might have]] (aurait peut-être) : [[If we had run, we could have caught the bus.]] Les deux parties peuvent s'inverser : [[I would have come if I had known.]]"},{"type":"table","head":["Type","Structure","Exemple"],"rows":[["Réel","If + présent, will","[[If it rains, we'll stay home.]]"],["Imaginaire (présent)","If + passé, would + verbe","[[If I had a dog, I'd walk it every day.]]"],["Imaginaire (passé)","If + had + participe, would have + participe","[[If you had called, I would have answered.]]"],["Mixte : passé → présent","If + had + participe, would + verbe","[[If I had slept more, I wouldn't be so tired now.]]"],["Mixte : présent → passé","If + passé, would have + participe","[[If I were braver, I would have said something.]]"]]},{"type":"tip","text":"Piège n° 1 : **jamais de would après if** ! [[If I would have known]] ✗ → [[If I had known]] ✓. C'est comme en français : « Si j'aurais su » est une faute. Piège n° 2 : dans [[If I'd known, I'd have come]], le premier [['d]] = [[had]], le deuxième = [[would]]."},{"type":"rule","title":"Wish et if only + past perfect","text":"Pour regretter le passé : [[wish]] / [[if only]] + **past perfect**. [[I wish I had studied more.]] = J'aurais aimé étudier plus. [[If only I hadn't said that!]] = Si seulement je n'avais pas dit ça ! Rappel : pour le présent, c'est [[wish]] + passé : [[I wish I were taller.]]"},{"type":"examples","items":[{"en":"If we had left earlier, we wouldn't have missed the bus.","fr":"Si on était partis plus tôt, on n'aurait pas raté l'autobus."},{"en":"If she hadn't overslept, she would be here now.","fr":"Si elle ne s'était pas réveillée en retard, elle serait ici maintenant."},{"en":"I wish I hadn't eaten so much poutine.","fr":"J'aurais dû manger moins de poutine. (Je regrette d'en avoir mangé autant.)"},{"en":"Luckily, Mei had a map; otherwise, we would have gotten lost.","fr":"Heureusement, Mei avait une carte ; sinon, on se serait perdus."}]},{"type":"dialogue","title":"Le concert raté","lines":[{"who":"Emma","en":"How was the concert last night?","fr":"Comment était le concert hier soir ?"},{"who":"Lucas","en":"I didn't go. I missed the bus by thirty seconds!","fr":"Je n'y suis pas allé. J'ai raté l'autobus de trente secondes !"},{"who":"Emma","en":"Oh no! If you had left a bit earlier, you would have caught it.","fr":"Oh non ! Si tu étais parti un peu plus tôt, tu l'aurais attrapé."},{"who":"Lucas","en":"I know. If only I hadn't stopped to look for my headphones!","fr":"Je sais. Si seulement je ne m'étais pas arrêté pour chercher mes écouteurs !"},{"who":"Emma","en":"If you had called me, my mom would have driven you.","fr":"Si tu m'avais appelée, ma mère t'aurait conduit."},{"who":"Lucas","en":"Really? I wish I had known that! Next time, I'll call you.","fr":"Vraiment ? J'aurais aimé le savoir ! La prochaine fois, je t'appelle."}]}],"vocab":[{"en":"regret","fr":"regretter","alt":[],"ex":"I regret not going to the party."},{"en":"if only","fr":"si seulement","alt":[],"ex":"If only I had listened to you!"},{"en":"opportunity","fr":"occasion (à saisir)","alt":["chance"],"ex":"Don't miss this opportunity to travel."},{"en":"miss","fr":"rater, manquer (un autobus, une occasion)","alt":[],"ex":"Hurry up, or we'll miss the bus!"},{"en":"on time","fr":"à l'heure (pile)","alt":[],"ex":"The train left exactly on time."},{"en":"in time","fr":"à temps (assez tôt)","alt":[],"ex":"We got to the station just in time."},{"en":"oversleep","fr":"dormir trop longtemps (ne pas se réveiller à temps)","alt":[],"ex":"I overslept and missed my first class."},{"en":"alarm clock","fr":"réveille-matin","alt":["alarm"],"ex":"My alarm clock didn't ring this morning."},{"en":"spill","fr":"renverser (un liquide)","alt":[],"ex":"Be careful not to spill your juice."},{"en":"trip","fr":"trébucher","alt":["stumble"],"ex":"Noah tripped on a rock and fell."},{"en":"drop","fr":"échapper (laisser tomber par accident)","alt":[],"ex":"I dropped my phone in the snow."},{"en":"puddle","fr":"flaque d'eau","alt":[],"ex":"The little boy jumped into every puddle."},{"en":"get lost","fr":"se perdre","alt":[],"ex":"We got lost in the forest."},{"en":"weather forecast","fr":"prévisions météo","alt":["forecast"],"ex":"Did you check the weather forecast?"},{"en":"otherwise","fr":"sinon (autrement)","alt":["or else"],"ex":"Leave now; otherwise, you'll be late."},{"en":"luckily","fr":"heureusement, par chance","alt":["fortunately"],"ex":"Luckily, nobody was hurt."},{"en":"ruin","fr":"gâcher, ruiner","alt":["spoil"],"ex":"The rain ruined our picnic."},{"en":"in hindsight","fr":"avec le recul","alt":["with hindsight"],"ex":"In hindsight, I should have stayed home."}],"sentences":[{"en":"If I had known about the party, I would have come.","fr":"Si j'avais su pour la fête, je serais venu.","trap":["will","has"],"alt":["I would have come if I had known about the party."]},{"en":"If we had left earlier, we wouldn't have missed the bus.","fr":"Si on était partis plus tôt, on n'aurait pas raté l'autobus.","trap":["would","didn't"],"alt":["We wouldn't have missed the bus if we had left earlier."]},{"en":"I wish I hadn't eaten so much poutine.","fr":"Je regrette d'avoir mangé autant de poutine.","trap":["wouldn't","haven't"],"alt":[]},{"en":"If only I had brought my umbrella this morning!","fr":"Si seulement j'avais apporté mon parapluie ce matin !","trap":["would","bring"],"alt":[]},{"en":"If she hadn't overslept, she would be here now.","fr":"Si elle ne s'était pas réveillée en retard, elle serait ici maintenant.","trap":["have","didn't"],"alt":["She would be here now if she hadn't overslept."]},{"en":"We could have won the game if Noah hadn't tripped.","fr":"On aurait pu gagner le match si Noah n'avait pas trébuché.","trap":["can","didn't"],"alt":["If Noah hadn't tripped, we could have won the game."]},{"en":"If I were more organized, I wouldn't have forgotten my lunch.","fr":"Si j'étais plus organisé, je n'aurais pas oublié mon dîner.","trap":["forgot","will"],"alt":["I wouldn't have forgotten my lunch if I were more organized."]},{"en":"Otherwise, we would have walked in the wrong direction for hours.","fr":"Sinon, on aurait marché dans la mauvaise direction pendant des heures.","trap":["will","walk"],"alt":[]},{"en":"Would you have helped me if I had asked you?","fr":"M'aurais-tu aidé si je te l'avais demandé ?","trap":["Will","did"],"alt":["If I had asked you, would you have helped me?"]},{"en":"If only I hadn't dropped my phone in the lake!","fr":"Si seulement je n'avais pas échappé mon téléphone dans le lac !","trap":["didn't","wouldn't"],"alt":[]},{"en":"In hindsight, taking the bus would have been faster.","fr":"Avec le recul, prendre l'autobus aurait été plus rapide.","trap":["will","was"],"alt":["Taking the bus would have been faster in hindsight."]}],"grammar":[{"type":"mcq","q":"If I ___ about the test, I would have studied.","choices":["knew","would know","had known","have known"],"answer":2,"explain":"Troisième conditionnel : if + past perfect (had known)."},{"type":"mcq","q":"If you had asked me, I ___ you.","choices":["would have helped","would help","had helped","will help"],"answer":0,"explain":"Passé imaginaire : would have + participe passé."},{"type":"mcq","q":"If I hadn't stayed up so late, I ___ so tired now.","choices":["wouldn't have been","won't be","wouldn't be","hadn't been"],"answer":2,"explain":"Conditionnel mixte : cause passée (hadn't stayed up), résultat présent (now) → wouldn't be."},{"type":"mcq","q":"I wish I ___ that mean comment yesterday.","choices":["didn't make","hadn't made","wouldn't make","don't make"],"answer":1,"explain":"Regret sur le passé : wish + past perfect."},{"type":"mcq","q":"Laquelle de ces phrases est correcte ?","choices":["If I would have known, I would have helped.","If I knew, I would have helped yes
